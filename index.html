uter erster Schritt?", "options": ["Auswirkungen auf Umfang, Risiken, Termine und Tests prüfen", "Die Änderung ohne Abstimmung ignorieren", "Die Änderung sofort ungeprüft ausrollen", "Alle bisherigen Anforderungen löschen"], "correct": 0, "explanation": "Change-Management prüft Konsequenzen, bevor Umfang und Freigabe verändert werden.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q073", "chapter": 19, "question": "In einem Netzwerk steht 192.168.1.100:443. Was bezeichnet 443?", "options": ["Die Version des Betriebssystems", "Den angesprochenen Port des Dienstes", "Die interne Maschinen-ID", "Die IPv4-Adresse"], "correct": 1, "explanation": "Ein Port adressiert einen Dienstendpunkt auf einem Gerät.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q074", "chapter": 19, "question": "Ein Auftrag verweist auf Maschine 101. Was muss für referenzielle Integrität üblicherweise gelten?", "options": ["Die Datenbank hat nur eine Tabelle", "Die referenzierte Maschine existiert, sofern der Fremdschlüssel nicht null ist", "Alle Maschinen haben denselben Namen", "Jeder Auftrag muss zwei Mitarbeiter haben"], "correct": 1, "explanation": "Fremdschlüsselbedingungen verhindern ungültige Verweise.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q075", "chapter": 19, "question": "Ein Administrator möchte nur den Status eines Auftrags ändern. Welche HTTP-Methode wird dafür oft verwendet?", "options": ["PATCH", "TRACE", "GET", "HEAD"], "correct": 0, "explanation": "PATCH ist für partielle Änderungen einer Ressource gedacht; die API-Dokumentation ist maßgeblich.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q076", "chapter": 19, "question": "Welche ACID-Eigenschaft schützt bestätigte Transaktionen bei vorgesehenen Serverausfällen?", "options": ["Isolation", "Consistency", "Atomicity", "Durability"], "correct": 3, "explanation": "Durability steht für Dauerhaftigkeit erfolgreich bestätigter Änderungen.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q077", "chapter": 20, "question": "Bei einer Releaseprüfung sind Restore und DB-Kompatibilität nicht getestet. Welche Empfehlung ist am besten?", "options": ["Datenbank ohne Backup löschen", "Nur das Firmenlogo überprüfen", "Freigeben, weil die Präsentation fertig ist", "Freigabe aussetzen, Risiken prüfen und anhand belegter Kriterien neu entscheiden"], "correct": 3, "explanation": "Kritische Freigaberisiken verlangen überprüfte Maßnahmen, bevor ein sicherer Betrieb zugesichert wird.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q078", "chapter": 20, "question": "Die Maschinen-ID wird gelegentlich falsch zugeordnet. Was priorisierst du?", "options": ["Zuerst die Schriftart anpassen", "Ursache beheben und Zuordnungen gezielt prüfen", "Nur die PDFs anders benennen", "Den Fehler unkommentiert archivieren"], "correct": 1, "explanation": "Falsche Zuordnungen gefährden Datenintegrität und Wartungsprozesse.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q079", "chapter": 20, "question": "Zwei Vorschläge sind technisch möglich. Was macht eine starke Fallstudienantwort aus?", "options": ["Eine Liste ohne Empfehlung", "Kriterien, Alternativen, Risiken, Entscheidung und Nachweisplan", "Nur die Antwort mit den meisten Fremdwörtern", "Ausschließlich das eigene Bauchgefühl"], "correct": 1, "explanation": "Situationsaufgaben verlangen argumentierte Handlungsvorschläge und Überprüfung.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q080", "chapter": 20, "question": "Nach einem Update ist das System für alle Nutzer nicht verfügbar. Was ist zuerst relevant?", "options": ["Neue Farbe für den Startbildschirm wählen", "Alle automatisierten Tests dauerhaft abschalten", "Den Vorfall nicht dokumentieren", "Betriebsfähigkeit nach Notfallplan wiederherstellen und Ursache untersuchen"], "correct": 3, "explanation": "Bei einem kritischen Incident zählen Schadensbegrenzung, Wiederherstellung und saubere Dokumentation.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q081", "chapter": 21, "question": "Was macht eine prüfungsreife Musterantwort besser als eine bloße Ein-Wort-Antwort?", "options": ["Sie nennt keine überprüfbaren Kriterien", "Sie vermeidet alle Fachbegriffe", "Sie besteht nur aus einer Überschrift", "Sie begründet die Entscheidung und nennt Risiken sowie konkrete Maßnahmen"], "correct": 3, "explanation": "Fachliche Richtigkeit plus strukturierte Begründung zeigen Handlungskompetenz.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q082", "chapter": 21, "question": "Welche Aussage ist bei einer Migration am überzeugendsten?", "options": ["Alte und neue Version auf Schema-Kompatibilität prüfen und Restore testen", "Neue Version ist immer rückwärtskompatibel", "Vor Produktivsetzung sind Tests überflüssig", "Datenbankänderungen berühren nie ein Rollback"], "correct": 0, "explanation": "Eine Migrationsentscheidung muss Auswirkungen auf Daten und Rückfallmöglichkeiten abdecken.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q083", "chapter": 21, "question": "Welche Maßnahme ergänzt eine Fehlerbehebung fachlich sinnvoll?", "options": ["Ausschließlich eine neue Lizenz kaufen", "Gezielter Retest und Regressionstests", "Nur den Bug-Titel ändern", "Auf Testergebnisse verzichten"], "correct": 1, "explanation": "Fehlernachtest bestätigt die Korrektur; Regressionstests untersuchen mögliche Nebenwirkungen.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q084", "chapter": 21, "question": "Welcher Satz ist als Empfehlung an die Projektleitung am besten?", "options": ["Die Risiken sind egal, weil der Termin feststeht.", "Ich nehme ohne Angaben automatisch GO an.", "Ich glaube, die Technik wird schon funktionieren.", "Ich empfehle ein NO-GO bis Restore-Test und Datenbankkompatibilität nachgewiesen sind."], "correct": 3, "explanation": "Die stärkere Antwort verbindet Entscheidung, Begründung und überprüfbare Freigabebedingungen.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q085", "chapter": 22, "question": "Welche Angabe gehört in einen nachvollziehbaren Testfall?", "options": ["Nur eine zufällige Testnummer", "Nur eine Bildschirmfarbe", "Nur der Testername ohne Inhalt", "Voraussetzungen, Schritte sowie Soll- und Ist-Ergebnis"], "correct": 3, "explanation": "Testfälle müssen reproduzierbar und überprüfbar sein.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q086", "chapter": 22, "question": "Was sollte eine Entscheidungsvorlage enthalten?", "options": ["Optionen, Bewertungskriterien, Risiken und Empfehlung", "Nur das finale Logo", "Ausschließlich den Projektnamen", "Nur die Uhrzeit der Sitzung"], "correct": 0, "explanation": "Entscheidungsvorlagen machen den Vergleich transparent.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q087", "chapter": 22, "question": "Warum ist ein Risikoregister hilfreich?", "options": ["Es dokumentiert Risiken, Bewertung, Maßnahmen und Verantwortliche", "Es speichert die Passwörter aller Benutzer", "Es ersetzt sämtliche Tests", "Es legt automatisch den Gesetzestext fest"], "correct": 0, "explanation": "Ein Risikoregister macht Behandlung und Nachverfolgung organisatorisch möglich.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q088", "chapter": 22, "question": "Was sollte im Übergabeprotokoll besonders dokumentiert sein?", "options": ["Übergebener Stand, offene Punkte, Verantwortliche und Abnahme", "Nur die Farbe der Präsentationsfolien", "Nur der Hersteller des Druckers", "Alle Pausen des Entwicklungsteams"], "correct": 0, "explanation": "Eine Übergabe muss Zustand und verbleibende Aufgaben nachvollziehbar festhalten.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q089", "chapter": 23, "question": "Du erhältst eine offene Situationsaufgabe. Wie startest du sinnvoll?", "options": ["Die Fragestellung nicht vollständig lesen", "Anforderungen, Randbedingungen und Risiken markieren", "Sofort die längste Antwort abschreiben", "Nur Schlagwörter ohne Bezug sammeln"], "correct": 1, "explanation": "Die Analyse der Situation ist Grundlage für tragfähige Maßnahmen.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q090", "chapter": 23, "question": "Was ist in einer Fachpräsentation besonders wichtig?", "options": ["Nur alle Literaturtitel vorlesen", "Möglichst viele unlesbare Textfolien", "Den Auftraggeber grundsätzlich kritisieren", "Klare Ausgangslage, Vorgehen, Entscheidung und Ergebnisse"], "correct": 3, "explanation": "Die Präsentation sollte den beruflichen Handlungsweg nachvollziehbar vermitteln.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q091", "chapter": 23, "question": "Im Fachgespräch fragt der Prüfungsausschuss nach einem Risiko. Wie antwortest du am besten?", "options": ["Immer behaupten, dass es keine Risiken gibt", "Risiko erklären, Auswirkung benennen und geeignete Gegenmaßnahme begründen", "Nur „Keine Ahnung“ ohne Nachdenken sagen", "Ungefragt ausschließlich Code schreiben"], "correct": 1, "explanation": "Das Fachgespräch prüft fachliche Argumentation und Reflexion.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q092", "chapter": 23, "question": "Warum sind eigene kleine Fallbeispiele beim Lernen nützlich?", "options": ["Sie trainieren den Transfer von Begriffen auf reale Entscheidungen", "Sie machen jede Prüfung identisch", "Sie ersetzen alle offiziellen Unterlagen", "Sie verhindern jede Rückfrage im Fachgespräch"], "correct": 0, "explanation": "Transferfähigkeit hilft besonders bei wechselnden beruflichen Situationen.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q093", "chapter": 24, "question": "Was bedeutet API?", "options": ["Ein ausschließlich physischer Netzwerkport", "Definierte Schnittstelle zur Interaktion zwischen Softwarekomponenten", "Ein Speicherchip für Bilder", "Ein Gerät zur Stromverteilung"], "correct": 1, "explanation": "Application Programming Interface definiert, wie Software andere Softwarefunktionen nutzt.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q094", "chapter": 24, "question": "Was ist ein Primärschlüssel in einer relationalen Tabelle?", "options": ["Ein Attribut oder Attributsatz zur eindeutigen Identifikation jeder Zeile", "Eine zufällige Sortierfolge ohne Eindeutigkeit", "Der zuletzt verwendete Port", "Der Vorname des Administrators"], "correct": 0, "explanation": "Primärschlüssel identifizieren Datensätze eindeutig und dürfen nicht null sein.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q095", "chapter": 24, "question": "Was bedeutet RTO?", "options": ["Maximal tolerierter Datenverlust in Minuten", "Angestrebte maximale Wiederherstellungsdauer nach einer Störung", "Ein Werkzeug für Datenbanknormalisierung", "Ein HTTP-Statuscode"], "correct": 1, "explanation": "Recovery Time Objective bezeichnet die Wiederherstellungszeit als Zielvorgabe.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q096", "chapter": 24, "question": "Was ist ein Rollback?", "options": ["Immer eine Datenbanknormalisierung", "Rückkehr zu einem vorherigen funktionsfähigen Stand", "Automatisches endgültiges Löschen aller Backups", "Der Start eines neuen Sprints"], "correct": 1, "explanation": "Ein Rollback stellt einen früheren Zustand wieder her; Datenbankkompatibilität muss geprüft werden.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q097", "chapter": 25, "question": "Wo findest du die rechtlich verbindlichen Grundlagen der anerkannten Fortbildungsprüfung?", "options": ["In einer beliebigen Werbebroschüre", "In der geltenden Fortbildungsprüfungsverordnung", "Ausschließlich in einem Softwareforum", "Nur im Firmenwiki des Schulungsanbieters"], "correct": 1, "explanation": "Die SEFPrV regelt den formalen Prüfungsrahmen; konkrete Organisation erläutert die IHK.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q098", "chapter": 25, "question": "Welche Primärquelle ist für die Grundprinzipien von Scrum besonders geeignet?", "options": ["Ein zufälliger Blogkommentar ohne Datum", "Eine Netzwerkgeräte-Anleitung", "Der offizielle Scrum Guide", "Eine Produktschachtel"], "correct": 2, "explanation": "Der Scrum Guide beschreibt Verantwortlichkeiten, Events und Artefakte des Rahmenwerks.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q099", "chapter": 25, "question": "Für die technische Absicherung von IT-Notfallmanagement ist welcher Herausgeber einschlägig?", "options": ["BSI mit IT-Grundschutz und Notfallmanagement", "Ein Smartphone-Händler", "Ein reines Grafikportal", "Ein Wetterdienst"], "correct": 0, "explanation": "Das BSI veröffentlicht methodische Grundlagen zu Informationssicherheit und Business Continuity.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}, {"id": "q100", "chapter": 25, "question": "Du willst prüfen, ob ein IT-Rechtstext noch aktuell ist. Was ist die verlässlichste Vorgehensweise?", "options": ["Nur ein altes Lernplakat verwenden", "Die aktuelle amtliche Fassung und zuständige Stellen prüfen", "Den Text aus Erinnerung frei ergänzen", "Einen Forenbeitrag ohne Quelle zitieren"], "correct": 1, "explanation": "Rechtliche und organisatorische Anforderungen können sich ändern und müssen aus verbindlichen Quellen verifiziert werden.", "hint": "Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente."}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('quizdata').textContent),chapters=DATA.chapters,allQ=DATA.questions;
const $=s=>document.querySelector(s), view=$('#view');
let state={page:'home',chapter:1,tab:'learn',set:[],index:0,mode:'chapter',sessionAnswers:[],selected:null,submitted:false,complete:false,started:0,filter:'all',search:''};
let storageOk=true;
function load(){try{return JSON.parse(localStorage.getItem('bssw_quiz_v1'))||{attempts:{},settings:{theme:'dark',font:0},sessions:0}}catch(e){storageOk=false;return {attempts:{},settings:{theme:'dark',font:0},sessions:0}}}
let record=load();
function save(){try{localStorage.setItem('bssw_quiz_v1',JSON.stringify(record))}catch(e){storageOk=false}}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chapterName(i){return chapters.find(c=>c.id===i)?.title||''}
function attemptsFor(ch){return allQ.filter(q=>q.chapter===ch).filter(q=>record.attempts[q.id]).length}
function allAnswered(){return allQ.filter(q=>record.attempts[q.id]).length}
function allCorrect(){return allQ.filter(q=>record.attempts[q.id]?.lastCorrect).length}
function pct(a,b){return b?Math.round(100*a/b):0}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(page){state.page=page;state.submitted=false;window.scrollTo(0,0);render()}
function start(ch,mode='chapter'){
 let pool= mode==='chapter'?allQ.filter(q=>q.chapter===ch):mode==='wrong'?allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect):mode==='new'?allQ.filter(q=>!record.attempts[q.id]):allQ;
 if(mode==='exam')pool=shuffle(pool).slice(0,20);
 else if(mode!=='chapter')pool=shuffle(pool).slice(0,20);
 if(!pool.length){alert('Dafür sind aktuell keine Fragen vorhanden. Starte zunächst ein Kapitelquiz.');return}
 state={...state,page:'quiz',chapter:ch,set:pool,index:0,mode,sessionAnswers:[],selected:null,submitted:false,complete:false,started:Date.now()};render();window.scrollTo(0,0);
}
function render(){
 document.body.classList.toggle('light',record.settings.theme==='light');
 document.body.style.setProperty('--zoom',String(1+(record.settings.font||0)*.12));
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===state.page||(state.page==='lesson'&&e.dataset.nav==='chapters')||(state.page==='quiz'&&e.dataset.nav==='practice')));
 if(state.page==='home')home();if(state.page==='chapters')chapterList();if(state.page==='lesson')lesson();if(state.page==='practice')practice();if(state.page==='quiz')quiz();if(state.page==='result')result();if(state.page==='progress')progress();
}
function home(){
 const done=allAnswered(),correct=allCorrect();let next=chapters.find(c=>attemptsFor(c.id)<4)||chapters[0];
 view.innerHTML=`<section class="hero"><div class="eyebrow">DEIN DIGITALER LERNBEGLEITER</div><h1>Verstehen. Anwenden. Prüfungssicher werden.</h1><p class="lead">Lerne den Berufsspezialisten Softwareentwicklung in kleinen Einheiten – mit dem vollständigen Lernheft, 100 erklärten Quizfragen und praxisnahen Aufgaben.</p><div class="hero-line"><span class="chip">25 Lernkapitel</span><span class="chip">100 Quizfragen</span><span class="chip">Offline nutzbar</span></div></section><aside class="install-card"><strong>📲 Als App auf deinem iPhone nutzen</strong><p>Du kannst diesen Lerntrainer auf deinem Home-Bildschirm installieren.</p><details><summary>Installationsanleitung anzeigen ▾</summary><ol><li>Öffne diese Seite in <b>Safari</b>.</li><li>Tippe auf <b>Teilen</b> (je nach Safari-Ansicht zunächst auf das Seitenmenü).</li><li>Wähle <b>„Zu Home-Bildschirm hinzufügen“</b>.</li><li>Aktiviere <b>„Als Web-App öffnen“</b> und tippe auf <b>„Hinzufügen“</b>.</li><li>Starte „IT Lernquiz“ über das neue Symbol. Nach dem ersten Laden ist die App auch offline nutzbar.</li></ol></details></aside><section class="stats"><div class="stat"><div class="num">${done}<span class="muted">/100</span></div><small>Fragen bearbeitet</small></div><div class="stat"><div class="num">${pct(correct,done)}%</div><small>Aktuell richtig</small></div><div class="stat"><div class="num">${record.sessions}</div><small>Trainings abgeschlossen</small></div></section><div class="card stack"><div class="eyebrow">DEIN NÄCHSTER SCHRITT</div><h2>${esc(next.title)}</h2><p class="muted" style="margin:0">Kapitel ${String(next.id).padStart(2,'0')} · 4 Fragen und ausführliche Erklärungen</p><div class="progress"><span style="width:${pct(attemptsFor(next.id),4)}%"></span></div><div class="btn-row"><button class="btn" data-action="lesson" data-ch="${next.id}">Kapitel öffnen →</button><button class="btn outline" data-action="quiz-ch" data-ch="${next.id}">Direkt zum Quiz</button></div></div><h2 class="section-title">So lernst du am besten</h2><div class="mode-grid"><div class="card"><h3>📚 Erst verstehen</h3><p>Lies die Erklärungen des Original-Lernhefts zu jedem Kapitel nach.</p><button class="btn soft" data-action="nav" data-page="chapters">Kapitel ansehen</button></div><div class="card"><h3>🧠 Aktiv üben</h3><p>Antworten auswählen, sofortige Erklärung lesen und falsche Fragen wiederholen.</p><button class="btn soft" data-action="nav" data-page="practice">Trainingsmodi öffnen</button></div></div><div class="callout" style="margin-top:17px">💡 Tipp: Erkläre die richtige Antwort nach jeder Frage in eigenen Worten. Gerade bei deiner Weiterbildung zählt später die Begründung einer Entscheidung.</div>`;
}
function chapterList(){
 const fs=['all','unstarted','started','done']; const labels=['Alle','Offen','Begonnen','Erledigt'];
 view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Alle 25 Kapitel</h1><p class="muted">Jedes Kapitel enthält die vollständigen Notizen und vier Quizfragen.</p><input class="search" id="search" placeholder="Kapitel suchen …" value="${esc(state.search)}" aria-label="Kapitel suchen"><div class="filter">${fs.map((x,i)=>`<button data-filter="${x}" class="${state.filter===x?'active':''}">${labels[i]}</button>`).join('')}</div><div id="coursegrid" class="course-grid"></div>`;
 let el=$('#search');el.addEventListener('input',e=>{state.search=e.target.value;drawCourses()});drawCourses();
}
function drawCourses(){let filtered=chapters.filter(c=>c.title.toLowerCase().includes(state.search.toLowerCase())||String(c.id).includes(state.search)).filter(c=>state.filter==='all'||(state.filter==='unstarted'&&attemptsFor(c.id)===0)||(state.filter==='started'&&attemptsFor(c.id)>0&&attemptsFor(c.id)<4)||(state.filter==='done'&&attemptsFor(c.id)===4));
 $('#coursegrid').innerHTML=filtered.length?filtered.map(c=>`<button class="course" data-action="lesson" data-ch="${c.id}"><div class="number">${String(c.id).padStart(2,'0')}</div><div class="ctext"><strong>${esc(c.title)}</strong><p>${attemptsFor(c.id)}/4 bearbeitet · Kapitel öffnen →</p><div class="meter"><i style="width:${pct(attemptsFor(c.id),4)}%"></i></div></div></button>`).join(''):'<div class="callout">Keine passenden Kapitel gefunden.</div>';
}
function lesson(){const c=chapters.find(x=>x.id===state.chapter);view.innerHTML=`<button class="back" data-action="nav" data-page="chapters">← Alle Kapitel</button><div class="eyebrow">KAPITEL ${String(c.id).padStart(2,'0')}</div><h1>${esc(c.title)}</h1><div class="meta"><span class="chip">4 Quizfragen</span><span class="chip">${attemptsFor(c.id)} bearbeitet</span><span class="chip">Ausführlicher Lerntext</span></div><div class="tabs"><button data-tab="learn" class="${state.tab==='learn'?'active':''}">📖 Lernen</button><button data-tab="about" class="${state.tab==='about'?'active':''}">🎯 Quiz</button></div>${state.tab==='learn'?`<div class="card lesson">${c.lesson}</div><div class="card" style="margin-top:14px"><p>Fertig gelesen? Teste dein Wissen zum Thema.</p><button class="btn" data-action="quiz-ch" data-ch="${c.id}">Jetzt 4 Fragen beantworten →</button></div>`:`<div class="card stack"><div class="eyebrow">KAPITELTEST</div><h2>${esc(c.title)}</h2><p class="muted">Vier Fragen, sofortige Rückmeldung und Erklärungen nach jeder Antwort. Du darfst beliebig oft üben.</p><button class="btn" data-action="quiz-ch" data-ch="${c.id}">Kapitelquiz starten →</button><button class="btn outline" data-action="tab" data-tab="learn">Vorher Lerntext lesen</button></div>`}`}
function practice(){const wrong=allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect).length,newQ=allQ.length-allAnswered();view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Dein Training</h1><p class="muted">Wähle den Modus, der zu deiner Lernsituation passt.</p><div class="mode-grid"><div class="card stack"><div class="eyebrow">GRUNDLAGEN</div><h3>Kapitel für Kapitel</h3><p>Lerne systematisch – mit allen Erklärungen aus dem Lernheft.</p><button class="btn" data-action="nav" data-page="chapters">Kapitel wählen</button></div><div class="card stack"><div class="eyebrow">PRÜFUNGSVORBEREITUNG</div><h3>Prüfungssimulation</h3><p>20 gemischte Fragen. Lösungen und Punkte erst zum Schluss.</p><button class="btn" data-action="start" data-mode="exam">Prüfungsmodus starten</button></div><div class="card stack"><div class="eyebrow">WIEDERHOLEN</div><h3>Meine Fehler</h3><p>${wrong} zuletzt falsch beantwortete Fragen üben.</p><button class="btn soft" data-action="start" data-mode="wrong" ${wrong?'':'disabled'}>Fehler wiederholen</button></div><div class="card stack"><div class="eyebrow">ENTDECKEN</div><h3>Neue Fragen</h3><p>${newQ} noch nicht beantwortete Fragen in zufälliger Reihenfolge.</p><button class="btn soft" data-action="start" data-mode="new" ${newQ?'':'disabled'}>Neue Fragen üben</button></div><div class="card stack"><div class="eyebrow">WISSENSMIX</div><h3>Gemischtes Training</h3><p>20 Fragen aus allen 25 Kapiteln, mit direktem Feedback.</p><button class="btn soft" data-action="start" data-mode="mix">Mix starten</button></div></div>`;}
function quiz(){const q=state.set[state.index],isExam=state.mode==='exam',total=state.set.length,p=state.index+1;const title=state.mode==='chapter'?`Kapitel ${String(state.chapter).padStart(2,'0')}`:isExam?'Prüfungssimulation':'Wissentraining';const answer=state.sessionAnswers[state.index];
 view.innerHTML=`<button class="back" data-action="quit">← Training verlassen</button><div class="heading-row"><div><div class="eyebrow">${esc(title)}</div><h1 style="margin:5px 0 13px;font-size:25px">${isExam?'Prüfungsmodus':esc(chapterName(q.chapter))}</h1></div><span class="chip">${p} von ${total}</span></div><div class="progress" aria-label="Fortschritt"><span style="width:${Math.round(100*(state.index+(state.submitted?1:0))/total)}%"></span></div>${isExam?`<div class="exam-banner">⏱ Prüfungsmodus: Rückmeldung erst nach dem letzten Antwortschritt. <span id="clock"></span></div>`:''}<div class="card qcard" style="margin-top:14px"><div class="qtag">FRAGE ${p} · ${esc(chapterName(q.chapter))}</div><div class="question">${esc(q.question)}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer ${state.selected===i?'selected':''} ${state.submitted&&i===q.correct?'correct':''} ${state.submitted&&i===state.selected&&i!==q.correct?'incorrect':''}" data-answer="${i}" ${state.submitted?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${!isExam&&!state.submitted?`<details class="tip"><summary>💡 Hinweis zur Frage anzeigen</summary><p>${esc(q.hint)}</p></details>`:''}${state.submitted&&!isExam?`<div class="feedback ${state.selected===q.correct?'good':'bad'}"><strong>${state.selected===q.correct?'✓ Richtig erkannt!':'↻ Noch nicht ganz.'}</strong><p>${esc(q.explanation)}</p>${state.selected!==q.correct?`<p class="reason">Richtige Antwort: ${esc(q.options[q.correct])}</p>`:''}</div>`:''}<div class="btn-row" style="margin-top:18px">${!state.submitted?`<button class="btn" data-action="check" ${state.selected===null?'disabled':''}>${isExam?(p===total?'Prüfung auswerten':'Antwort speichern →'):'Antwort überprüfen'}</button>`:`<button class="btn" data-action="next">${p===total?'Ergebnis ansehen':'Nächste Frage →'}</button>`}</div></div>`;
 if(isExam){const secs=Math.round((Date.now()-state.started)/1000),m=Math.floor(secs/60),s=secs%60;$('#clock').textContent=`· bisher ${m}:${String(s).padStart(2,'0')} Min.`}
}
function check(){if(state.selected===null)return;const q=state.set[state.index],passed=state.selected===q.correct;state.sessionAnswers[state.index]={q:q.id,correct:passed,picked:state.selected}; if(state.mode==='exam'){saveAttempt(q.id,passed);if(state.index>=state.set.length-1){finish()}else{state.index++;state.selected=null;render();window.scrollTo(0,0)}return};state.submitted=true;saveAttempt(q.id,passed);render()}
function saveAttempt(qid,passed){const old=record.attempts[qid]||{count:0};record.attempts[qid]={count:old.count+1,lastCorrect:passed,everCorrect:old.everCorrect||passed,at:new Date().toISOString()};save()}
function next(){if(state.index>=state.set.length-1){finish();return}state.index++;state.selected=null;state.submitted=false;render();window.scrollTo(0,0)}
function finish(){record.sessions++;save();state.page='result';state.complete=true;render();window.scrollTo(0,0)}
function result(){const total=state.set.length,correct=state.sessionAnswers.filter(a=>a?.correct).length,missed=state.sessionAnswers.filter(a=>!a?.correct);const review=state.set.map((q,i)=>{let a=state.sessionAnswers[i];return `<div class="review-item"><div class="qtag">${esc(chapterName(q.chapter))}</div><strong>${esc(q.question)}</strong><p>${a?.correct?'✅':'❌'} Deine Antwort: ${esc(q.options[a?.picked??0])}</p>${a?.correct?'':`<p>✓ Richtig: <b>${esc(q.options[q.correct])}</b></p>`}<p class="muted">${esc(q.explanation)}</p></div>`}).join('');view.innerHTML=`<button class="back" data-action="nav" data-page="practice">← Training</button><div class="card"><div class="result"><div class="eyebrow">TRAINING ABGESCHLOSSEN</div><div class="score">${correct}/${total}</div><h1 style="margin:10px 0">${pct(correct,total)} % richtig</h1><p class="muted">${correct===total?'Stark! Du hast alle Fragen korrekt gelöst.':correct>=total*.7?'Guter Stand – mit Wiederholungen wird es noch sicherer.':'Schau dir die Erklärungen an und übe die offenen Themen gezielt.'}</p><div class="btn-row"><button class="btn" data-action="nav" data-page="chapters">Kapitel ansehen</button><button class="btn outline" data-action="start" data-mode="wrong" ${allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect).length?'':'disabled'}>Fehler wiederholen</button></div></div><details><summary style="cursor:pointer;font-weight:800;margin:10px 0">Alle Antworten und Erklärungen anzeigen</summary>${review}</details></div>`}
function progress(){const total=allAnswered(),right=allCorrect(),wrong=total-right;view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Dein Lernfortschritt</h1><p class="muted">Du siehst hier, welche Themen du schon bearbeitet hast und wo Wiederholungen sinnvoll sind.</p><div class="stats"><div class="stat"><div class="num">${total}</div><small>Fragen bearbeitet</small></div><div class="stat"><div class="num">${right}</div><small>Zuletzt richtig</small></div><div class="stat"><div class="num">${wrong}</div><small>Wiederholen</small></div></div><div class="card stack"><div class="heading-row"><b>Gesamtfortschritt</b><span>${pct(total,100)} %</span></div><div class="progress"><span style="width:${total}%"></span></div><p class="mini">Fortschritt basiert auf Fragen, die du mindestens einmal beantwortet hast. „Zuletzt richtig“ kann sich beim Wiederholen verändern.</p></div><h2 class="section-title">Deine Kapitel</h2><div class="stack">${chapters.map(c=>`<button class="course" data-action="lesson" data-ch="${c.id}" style="min-height:auto"><div class="number">${String(c.id).padStart(2,'0')}</div><div class="ctext"><strong>${esc(c.title)}</strong><p>${attemptsFor(c.id)} von 4 bearbeitet</p><div class="meter"><i style="width:${pct(attemptsFor(c.id),4)}%"></i></div></div></button>`).join('')}</div><div class="card stack" style="margin-top:20px"><h3>Fortschritt verwalten</h3><p class="muted">Du kannst deinen Lernstand als JSON-Datei exportieren und später wieder importieren. Die Daten bleiben auf deinem Gerät.</p><div class="btn-row"><button class="btn soft" data-action="export">Fortschritt sichern</button><label class="btn outline" style="cursor:pointer">Fortschritt importieren<input id="import" type="file" accept="application/json" hidden></label></div><button class="btn outline" data-action="reset">Gespeicherten Fortschritt zurücksetzen</button>${!storageOk?'<div class="callout">Dein Browser blockiert die lokale Speicherung. Der Fortschritt bleibt dann nur bis zum Schließen erhalten.</div>':''}</div>`;$('#import').onchange=importData}
function exportData(){let blob=new Blob([JSON.stringify({app:'Berufsspezialist Quiz',version:1,record},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Berufsspezialist_Lernfortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result);if(v.version!==1||!v.record?.attempts)throw new Error('Format');if(!confirm('Vorhandenen Lernfortschritt durch den importierten Stand ersetzen?'))return;record=v.record;save();render()}catch(err){alert('Die Datei hat kein gültiges Lernstand-Format.')}};rd.readAsText(f)}
function reset(){if(confirm('Gesamten Lernfortschritt auf diesem Gerät wirklich löschen?')){record.attempts={};record.sessions=0;save();render()}}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action],[data-nav],[data-answer],[data-tab],[data-filter]');if(!a)return;
 if(a.dataset.nav){nav(a.dataset.nav);return}if(a.dataset.answer!==undefined){if(state.submitted)return;state.selected=Number(a.dataset.answer);render();return}if(a.dataset.filter){state.filter=a.dataset.filter;chapterList();return}if(a.dataset.tab){state.tab=a.dataset.tab;lesson();return}
 let act=a.dataset.action;
 if(act==='nav')nav(a.dataset.page);else if(act==='lesson'){state.chapter=Number(a.dataset.ch);state.tab='learn';nav('lesson')}else if(act==='quiz-ch')start(Number(a.dataset.ch),'chapter');else if(act==='start')start(state.chapter,a.dataset.mode);else if(act==='check')check();else if(act==='next')next();else if(act==='quit'){if(confirm('Training verlassen? Bereits geprüfte Antworten bleiben im Lernfortschritt gespeichert.'))nav(state.mode==='chapter'?'chapters':'practice')}else if(act==='export')exportData();else if(act==='reset')reset();
});
$('#theme').addEventListener('click',()=>{record.settings.theme=record.settings.theme==='light'?'dark':'light';save();render()});
$('#font').addEventListener('click',()=>{record.settings.font=((record.settings.font||0)+1)%4;save();render()});
render();
</script><script>

 });
