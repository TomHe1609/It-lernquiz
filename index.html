ele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Planung und Arbeitspakete<\/h3><p>Zerlege den Umfang in nachvollziehbare Ergebnisse. Ein Projektstrukturplan zeigt Arbeitspakete; ein Terminplan zeigt Dauer und Abhängigkeiten. Meilensteine markieren überprüfbare Zwischenzustände. Der kritische Pfad bestimmt in der üblichen Netzplanbetrachtung die Mindestdauer der abhängigen Kette.<\/p><h3>Aufwand, Dauer und Kosten<\/h3><p>Aufwand sind Personenstunden, Dauer die verstrichene Zeit. Mehr Personal verkürzt nicht jede Aufgabe proportional, weil Abstimmung und Abhängigkeiten bleiben. Kalkuliere Entwicklung, Einführung, Betrieb und Wartung. Schätzungen benötigen Annahmen und Bandbreiten.<\/p><h3>Steuerung und Kommunikation<\/h3><p>Statusberichte nennen Stand, Abweichungen, Risiken und benötigte Entscheidungen. Ein Risikoregister enthält Ursache, Folgen, Bewertung, Maßnahmen und Zuständigkeit. Änderungen werden auf Umfang, Termine, Kosten und Qualität geprüft. Berate Kunden verständlich zu Konsequenzen.<\/p><h3>Vorgehen und Schulung<\/h3><p>Klassische Planung, Scrum und Kanban haben unterschiedliche Mechanismen. In Scrum ordnet der Product Owner das Product Backlog; die Developers planen ihre Arbeit. Plane auch Schulung, Support und Einführung als Arbeit, nicht als unsichtbare Restaufgabe.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Das Portal-Teilprojekt plant Anforderungsfreigabe, Integrationsprobe, Pilot und Übergabe als Meilensteine. Ein Statusbericht meldet die verzögerte Schnittstellenfreigabe mit Auswirkung und Entscheidungsbedarf.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>24 Personenstunden sind geschätzt. Zwei Personen haben jeweils sechs produktive Stunden täglich. Welche Aussage ist angemessen?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Ideal ohne Abhängigkeiten wären zwei Arbeitstage möglich. Reale Dauer kann durch Abstimmung, Verfügbarkeit und blockierende Vorleistungen höher sein. Die Voraussetzungen gehören in die Planung.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Gute Projektunterstützung macht Fortschritt, Unsicherheit und nötige Entscheidungen sichtbar.<\/strong><\/p>","referenceIds":[15,22]}],"questions":[{"id":"q001","chapter":1,"question":"Welches Verhalten passt am besten zur Rolle eines Berufsspezialisten bei einer Releasefreigabe?","options":["Risiken benennen, Optionen abwägen und eine begründete Empfehlung geben","Nur die Bedienoberfläche betrachten","Ausschließlich den Quellcode auswendig kennen","Alle Entscheidungen ohne Rücksprache treffen"],"correct":0,"explanation":"Prüfungsnahe Handlungskompetenz umfasst die Bewertung von Anforderungen, Risiken und Maßnahmen.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":1},{"id":"q002","chapter":1,"question":"Ein Szenario enthält einen kritischen Datenbankwechsel. Wie strukturierst du deine schriftliche Fachantwort sinnvoll?","options":["Sofort ohne Begründung GO freigeben","Eine Liste möglichst vieler Fachwörter","Sachlage, Risiko, Optionen, Entscheidung, Prüfmaßnahmen","Nur das gewünschte Endergebnis nennen"],"correct":2,"explanation":"Eine nachvollziehbare Entscheidung leitet sich aus Fakten, Risiken und überprüfbaren Maßnahmen ab.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":1},{"id":"q003","chapter":4,"question":"Welche Übung fördert eine situationsbezogene Prüfung am stärksten?","options":["Ein Glossar einmal flüchtig lesen","Einen Praxisfall analysieren und die Entscheidung schriftlich begründen","Begriffe ausschließlich alphabetisch auswendig lernen","Nur mehrere Stunden Videos ohne Notizen schauen"],"correct":1,"explanation":"Die Prüfung verlangt Anwendung, strukturierte Argumentation und fachlich begründete Vorschläge.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":1},{"id":"q004","chapter":1,"question":"Die Vorbereitung orientiert sich an offiziellen Anforderungen. Was ist bei Fristen und Details maßgeblich?","options":["Eine beliebige ältere Internetzusammenfassung","Aktuelle Informationen der zuständigen IHK und die geltende Verordnung","Der Termin einer fremden Weiterbildung","Eine nicht überprüfte Aussage aus einem Forum"],"correct":1,"explanation":"Prüfungsorganisation und Einreichungsfristen müssen anhand der zuständigen Stelle geprüft werden.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":1},{"id":"q005","chapter":27,"question":"Wo liegen aktuell benötigte Programmdaten typischerweise während der Ausführung?","options":["Nur im BIOS","Ausschließlich im Bildschirm","Im Arbeitsspeicher (RAM)","In einem Druckertreiber"],"correct":2,"explanation":"RAM hält laufzeitrelevante Daten meist flüchtig; SSDs dienen typischerweise dauerhafter Speicherung.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":2},{"id":"q006","chapter":27,"question":"Ein System startet Dienste automatisch im Hintergrund. Was ist ein Dienst?","options":["Ein Prozess, der Funktionen für andere Programme bereitstellt","Ein Dateiformat für Bilder","Eine Bauform für Netzwerkkabel","Ein ausschließlich visueller Knopf"],"correct":0,"explanation":"Dienste stellen im Hintergrund z. B. Web- oder Datenbankfunktionen bereit.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":2},{"id":"q007","chapter":27,"question":"Was unterscheidet Container und virtuelle Maschinen häufig?","options":["Virtuelle Maschinen enthalten nie Betriebssysteme","Container teilen typischerweise den Host-Kernel; VMs haben eigene Gastbetriebssysteme","Container benötigen grundsätzlich keine Ressourcen","Container sind immer physische Server"],"correct":1,"explanation":"Die Form der Isolation und Laufzeitumgebung unterscheidet sich; beide benötigen Sicherheits- und Ressourcenplanung.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":2},{"id":"q008","chapter":27,"question":"Die Anwendung stürzt häufig ab. Welche Aussage ist fachlich am besten?","options":["Das zeigt lediglich eine hohe Verfügbarkeit","Das beweist, dass die CPU fehlt","Das deutet auf ein Zuverlässigkeitsproblem hin","Das belegt automatisch eine falsche IP-Adresse"],"correct":2,"explanation":"Zuverlässigkeit betrifft die korrekte, störungsarme Leistung einer Software unter definierten Bedingungen.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":2},{"id":"q009","chapter":18,"question":"Was ist die Aufgabe eines DNS-Dienstes?","options":["Domainnamen in passende IP-Adressen auflösen","Primärschlüssel vergeben","Anwendungscode kompilieren","Fehlerberichte priorisieren"],"correct":0,"explanation":"DNS ermöglicht die Zuordnung lesbarer Namen zu Netzwerkadressen.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":3},{"id":"q010","chapter":19,"question":"Ein angemeldeter Benutzer darf eine Administratorfunktion nicht aufrufen. Welcher HTTP-Code ist typisch?","options":["403 Forbidden","404 Not Found","500 Internal Server Error","201 Created"],"correct":0,"explanation":"403 bezeichnet eine verweigerte Berechtigung; 401 betrifft fehlende oder ungültige Authentifizierung.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":3},{"id":"q011","chapter":18,"question":"Eine API gibt mehrere Maschinen als JSON zurück. Welche äußere Struktur ist typisch?","options":["Ein TCP-Port ohne Nutzdaten","Nur ein einzelner boolescher Wert","Eine Bilddatei ohne Datenfelder","Ein Array mit mehreren Objekten"],"correct":3,"explanation":"JSON-Arrays können mehrere Maschinenobjekte in einer Antwort enthalten.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":3},{"id":"q012","chapter":19,"question":"Warum ist bei wiederholten Netzwerk-Anfragen Idempotenz hilfreich?","options":["Die Datenbank braucht keinen Schlüssel","Derselbe Auftrag wird nicht unbeabsichtigt mehrfach wirksam","Jede Anfrage wird automatisch verschlüsselt","Es werden keine Server mehr benötigt"],"correct":1,"explanation":"Idempotente Verarbeitung hilft, dass Wiederholungen nach Timeouts keine ungewollten Doppeländerungen erzeugen.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":3},{"id":"q013","chapter":22,"question":"Was beschreibt ein Algorithmus?","options":["Einen Nutzungsvertrag","Nur ein bestimmtes Computergehäuse","Ein beliebiges Bildschirmdesign","Eine nachvollziehbare Folge von Schritten zur Problemlösung"],"correct":3,"explanation":"Ein Algorithmus beschreibt die Logik eines Lösungswegs unabhängig von einer bestimmten Programmiersprache.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":4},{"id":"q014","chapter":22,"question":"Wozu dienen Datentypen?","options":["Sie definieren die Art und zulässige Verarbeitung von Werten","Sie legen die Farbe einer Datenbank fest","Sie bestimmen automatisch den Projektpreis","Sie ersetzen jedes Sicherheitskonzept"],"correct":0,"explanation":"Ein Datentyp kann etwa Zahl, Text, Datum oder Wahrheitswert beschreiben.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":4},{"id":"q015","chapter":26,"question":"Eine Anwendung übernimmt unbereinigte Eingaben in einen Datenbankbefehl. Welches Risiko besteht?","options":["SQL-Injection durch unsichere Verarbeitung","Automatische Datensicherung","Ein schnellerer DNS-Eintrag","Bessere Datenbanknormalisierung"],"correct":0,"explanation":"Datenbankabfragen müssen sicher parametrisiert werden; reine Frontend-Prüfungen reichen nicht.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":4},{"id":"q016","chapter":13,"question":"Was verbessert eine klar getrennte fachliche Logik gegenüber unstrukturierten Abhängigkeiten?","options":["Garantierte Fehlerfreiheit ohne Tests","Automatisch unbegrenzte Serverkapazität","Wegfall aller Dokumentationspflichten","Wartbarkeit und Prüfbarkeit einzelner Komponenten"],"correct":3,"explanation":"Kapselung und geringe Kopplung erleichtern Änderungen und Tests.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":4},{"id":"q017","chapter":8,"question":"„Aufträge können nach Fälligkeitsdatum sortiert werden.“ Welche Art von Anforderung ist das?","options":["Projektkosten-Nachweis","Ausschließlich Lizenzbedingung","Nichtfunktionale Leistungskennzahl","Funktionale Anforderung"],"correct":3,"explanation":"Die Aussage beschreibt, was das System tun soll.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":5},{"id":"q018","chapter":8,"question":"„Die Liste lädt bei 100 Nutzern in höchstens 2 Sekunden.“ Was zeichnet diese Anforderung aus?","options":["Sie legt die Teamhierarchie fest","Sie ist messbar und überprüfbar","Sie beschreibt ausschließlich ein Datenmodell","Sie ist ohne Testbedingungen immer bewiesen"],"correct":1,"explanation":"Konkrete Last- und Zeitwerte erlauben objektive Prüfungen; weitere Testbedingungen können nötig sein.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":5},{"id":"q019","chapter":8,"question":"Wer beschreibt im klassischen Modell primär den Bedarf im Lastenheft?","options":["Der Compiler","Das Monitoring-System","Der Auftraggeber","Der Webserver"],"correct":2,"explanation":"Das Lastenheft beschreibt typischerweise Anforderungen und Ziele aus Auftraggebersicht.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":5},{"id":"q020","chapter":9,"question":"Eine Anforderung ist für die erste Lieferung unverzichtbar. Welche MoSCoW-Kategorie passt?","options":["Could have","Must have","Should have","Won’t have"],"correct":1,"explanation":"Must have bezeichnet die zwingend benötigten Anforderungen im vereinbarten Umfang.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":5},{"id":"q021","chapter":13,"question":"Was ist ein Vorteil geringer Kopplung zwischen Frontend und Backend?","options":["Kommunikation ist ohne Schnittstellen unmöglich","Interne Änderungen wirken sich seltener auf andere Komponenten aus","Alle Fehler verschwinden ohne Test","Die Datenbank kann nur noch lokal betrieben werden"],"correct":1,"explanation":"Klar definierte Schnittstellen reduzieren unnötige Abhängigkeiten.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":6},{"id":"q022","chapter":11,"question":"Welches Diagramm hilft besonders, beteiligte Komponenten und ihre Verbindungen darzustellen?","options":["Gantt-Diagramm für Urlaub","Ein reines Tortendiagramm","UML-Komponentendiagramm","Eine Inventurliste"],"correct":2,"explanation":"Das UML-Komponentendiagramm zeigt Softwarebausteine und ihre Schnittstellen bzw. Abhängigkeiten.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":6},{"id":"q023","chapter":13,"question":"Welche Herausforderung kann bei Microservices stärker auftreten als bei einem Monolithen?","options":["Unmöglichkeit von unabhängigen Releases","Verteilte Kommunikation und Betriebskomplexität","Wegfall sämtlicher Netzwerkschnittstellen","Zwang, nur eine Datenbanktabelle zu nutzen"],"correct":1,"explanation":"Verteilte Systeme erhöhen häufig Aufwände für Netzwerkfehler, Observability und Deployment.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":6},{"id":"q024","chapter":11,"question":"Was sollte ein Architecture Decision Record (ADR) festhalten?","options":["Ausschließlich den Produktpreis","Eine Architekturentscheidung samt Kontext und Konsequenzen","Die letzte Urlaubsplanung","Nur Passwörter aller Entwickler"],"correct":1,"explanation":"ADRs dokumentieren, warum eine technische Entscheidung getroffen wurde, und machen Alternativen nachvollziehbar.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":6},{"id":"q025","chapter":14,"question":"Ein Wartungsauftrag verweist auf eine Maschine. Welche Spalte fungiert dort als Fremdschlüssel?","options":["Die MaschinenID im Wartungsauftrag","Die aktuelle Uhrzeit des Clients","Die Bildschirmauflösung","Der Name des Testers"],"correct":0,"explanation":"Ein Fremdschlüssel verweist auf den Schlüssel eines zugeordneten Datensatzes.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":7},{"id":"q026","chapter":14,"question":"Welche Normalform wird verletzt, wenn in einer Tabellenzelle mehrere Telefonnummern als Liste gespeichert werden?","options":["Erste Normalform","Dritte Normalform ausschließlich","Keine Normalform","Zweite Normalform ausschließlich"],"correct":0,"explanation":"Die 1NF fordert atomare Spaltenwerte im vorgesehenen relationalen Modell.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":7},{"id":"q027","chapter":21,"question":"Eine Transaktion bucht Geld ab, die Gutschrift scheitert und die Abbuchung wird zurückgesetzt. Welches ACID-Prinzip?","options":["Isolation","Durability","Consistency","Atomicity"],"correct":3,"explanation":"Atomicity sorgt dafür, dass zusammengehörige Änderungen ganz oder gar nicht wirksam werden.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":7},{"id":"q028","chapter":15,"question":"Welche Migrationsstrategie hilft, alte und neue App-Version während eines Übergangs zu unterstützen?","options ent kann Änderungen automatisch bis in Produktion veröffentlichen; Delivery bereitet sie veröffentlichbar vor","Beide Begriffe beschreiben nur die Testumgebung","Deployment erfordert immer manuelle Freigabe","Delivery verwendet grundsätzlich keine Versionsverwaltung"],"correct":0,"explanation":"Bei Continuous Delivery kann die Produktivfreigabe separat erfolgen; bei Continuous Deployment erfolgt sie automatisiert.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":8},{"id":"q033","chapter":29,"question":"Frontend und Backend funktionieren einzeln, Daten kommen aber falsch über die Schnittstelle. Welcher Test passt gezielt?","options":["Integrationstest","Ausschließlich ein Unit-Test der Anzeige","Ein Marketingtest","Nur ein Drucktest"],"correct":0,"explanation":"Integrationstests prüfen die Zusammenarbeit von Komponenten.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":9},{"id":"q034","chapter":29,"question":"Ein Fehler wird korrigiert und der Tester prüft gezielt, ob er nicht mehr auftritt. Wie heißt das?","options":["Lasttest","Usability-Test","Recovery-Test","Retest"],"correct":3,"explanation":"Ein Retest überprüft die konkrete Fehlerbehebung.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":9},{"id":"q035","chapter":29,"question":"Eine Änderung behebt einen Fehler; vorhandene Funktionen sollen weiterhin arbeiten. Welcher Test?","options":["Nur Quellcodeformatierung","Nur Abnahmetest des Kunden","Regressionstest","Reiner Retest ohne weitere Fälle"],"correct":2,"explanation":"Regressionstests prüfen unbeabsichtigte Nebenwirkungen von Änderungen.","hint":"Denk an die praktische Situation und die Aufgabe der jeweiligen Komponente.","originalChapter":9},{"id":"q036","chapter":29,"question":"Ein Tester gibt bewusst eine ungültige Maschinen-ID ein und erwartet eine Ablehnung. Welcher Testfall?","options":["P
