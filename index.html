mmelt Wissen und klärt Konflikte. Ergebnisse und offene Punkte müssen nachverfolgbar bleiben.","hint":"Ergebnisse und offene Punkte müssen nachverfolgbar bleiben.","originalChapter":18},{"id":"ch18-extra-04","chapter":12,"question":"Ein Prototyp gefällt Nutzern, wurde aber nicht technisch geprüft. Was folgt daraus?","options":["Er beweist automatisch Sicherheit","Alle Qualitätsprüfungen sind erledigt","Er belegt Interesse beziehungsweise Bedienbarkeit, aber keine Produktionsreife","Er ersetzt die Architekturentscheidung"],"correct":2,"explanation":"Prototypen prüfen ausgewählte Annahmen. Ihr Erfolg darf nicht auf ungeprüfte Eigenschaften wie Skalierbarkeit übertragen werden.","hint":"Ihr Erfolg darf nicht auf ungeprüfte Eigenschaften wie Skalierbarkeit übertragen werden.","originalChapter":18},{"id":"ch18-extra-05","chapter":11,"question":"Warum sollten Entscheidungsgründe dokumentiert werden?","options":["Damit Entscheidungen niemals überprüft werden dürfen","Damit Meetings grundsätzlich entfallen","Damit nur die Gewinner eines Streits sichtbar sind","Damit spätere Teams den Kontext und die damaligen Abwägungen verstehen"],"correct":3,"explanation":"Dokumentierter Kontext hilft, Entscheidungen bei neuen Bedingungen neu zu bewerten. Ohne Gründe werden alte Annahmen leicht als ewige Regeln behandelt.","hint":"Ohne Gründe werden alte Annahmen leicht als ewige Regeln behandelt.","originalChapter":18},{"id":"ch18-extra-06","chapter":8,"question":"Was hilft bei missverständlichen Übergaben zwischen Teams?","options":["Gemeinsame Definitionen und konkrete überprüfbare Übergabekriterien","Nur längere E-Mails ohne Struktur","Nur mehr Fachabkürzungen","Verantwortlichkeiten absichtlich offenlassen"],"correct":0,"explanation":"Ein gemeinsames Verständnis verhindert, dass Fertigstellung verschieden interpretiert wird. Prüfkriterien machen die Übergabe nachvollziehbar.","hint":"Prüfkriterien machen die Übergabe nachvollziehbar.","originalChapter":18},{"id":"ch18-extra-07","chapter":9,"question":"Eine Änderung betrifft nur einen Buttontext. Was sollte trotzdem kurz geprüft werden?","options":["Grundsätzlich die gesamte Architektur neu bauen","Ob Bedeutung, Anleitung oder automatisierte Prüfungen betroffen sind","Jede Prüfung ohne Betrachtung ausschließen","Alle bestehenden Nutzerkonten löschen"],"correct":1,"explanation":"Auch kleine Änderungen können fachliche Bedeutung oder Erwartungen verändern. Der Prüfumfang soll dem tatsächlichen Risiko entsprechen.","hint":"Der Prüfumfang soll dem tatsächlichen Risiko entsprechen.","originalChapter":18},{"id":"ch18-extra-08","chapter":34,"question":"Wie wird eine unklare Zuständigkeit am besten gelöst?","options":["Auf die nächste Störung warten","Alle gleichzeitig verantwortlich nennen ohne Befugnisse","Verantwortung und Entscheidungsbefugnis ausdrücklich vereinbaren","Die Aufgabe stillschweigend streichen"],"correct":2,"explanation":"Klare Verantwortung verhindert Lücken und doppelte Arbeit. Eine Rollenmatrix kann dabei unterstützen.","hint":"Eine Rollenmatrix kann dabei unterstützen.","originalChapter":18},{"id":"ch18-extra-09","chapter":9,"question":"Warum sollte eine Rückmeldung zum Entwurf konkrete Beispiele enthalten?","options":["Damit Kritik persönlicher wirkt","Damit jede Diskussion beendet wird","Damit Messungen generell ausgeschlossen sind","Damit das Problem nachvollziehbar und lösbar wird"],"correct":3,"explanation":"Beispiele zeigen, in welchem Fall der Entwurf nicht passt. Das ermöglicht gezielte Verbesserung statt allgemeiner Werturteile.","hint":"Das ermöglicht gezielte Verbesserung statt allgemeiner Werturteile.","originalChapter":18},{"id":"ch18-extra-10","chapter":9,"question":"Was gehört zur Konfliktlösung bei „mehr Sicherheit“ gegen „leichtere Bedienung“?","options":["Risiken und Nutzungssituationen analysieren und angemessene Maßnahmen auswählen","Sicherheit vollständig streichen","Bedienbarkeit vollständig ignorieren","Nur per Münzwurf entscheiden"],"correct":0,"explanation":"Qualitätsziele können konkurrieren. Eine kontextbezogene Abwägung sucht ausreichenden Schutz bei praktikabler Nutzung.","hint":"Eine kontextbezogene Abwägung sucht ausreichenden Schutz bei praktikabler Nutzung.","originalChapter":18},{"id":"ch18-extra-11","chapter":11,"question":"Wie sollte ein Team neue Erkenntnisse nach einer Entscheidung behandeln?","options":["Alle neuen Daten als störend ablehnen","Die zugrunde liegenden Annahmen prüfen und nötigenfalls die Entscheidung anpassen","Dokumentation rückwirkend verfälschen","Jede Entscheidung täglich ohne Anlass ändern"],"correct":1,"explanation":"Entscheidungen gelten unter bestimmten Bedingungen. Neue belastbare Erkenntnisse können eine Änderung rechtfertigen.","hint":"Neue belastbare Erkenntnisse können eine Änderung rechtfertigen.","originalChapter":18},{"id":"ch19-extra-01","chapter":29,"question":"Eine Menge muss zwischen 1 und 100 liegen. Welcher Wert testet direkt die untere ungültige Grenze?","options":["0","50","100","99"],"correct":0,"explanation":"Null liegt unmittelbar unter der erlaubten Untergrenze. Dieser Wert prüft, ob der Vergleich korrekt umgesetzt ist.","hint":"Dieser Wert prüft, ob der Vergleich korrekt umgesetzt ist.","originalChapter":19},{"id":"ch19-extra-02","chapter":31,"question":"Ein Backup läuft um 02:00 Uhr; um 05:00 Uhr fallen alle Daten aus. Wie viel Datenverlust ist ohne weitere Sicherungen möglich?","options":["Genau null Sekunden","Bis zu drei Stunden an Änderungen","Immer fünf Tage","Höchstens eine Minute"],"correct":1,"explanation":"Bei erfolgreicher Sicherung um 02:00 fehlen spätere Änderungen bis 05:00. Zusätzliche Log-Sicherung könnte den Verlust reduzieren.","hint":"Zusätzliche Log-Sicherung könnte den Verlust reduzieren.","originalChapter":19},{"id":"ch19-extra-03","chapter":34,"question":"Wie viel sind 30 Arbeitsstunden bei sechs produktiven Stunden pro Tag für eine Person?","options":["Drei Arbeitstage","Sechs Arbeitswochen","Fünf Arbeitstage","30 Arbeitstage"],"correct":2,"explanation":"Aufwand geteilt durch tägliche Kapazität ergibt rechnerisch fünf Tage. Abhängigkeiten oder Unterbrechungen können die Kalenderdauer erhöhen.","hint":"Abhängigkeiten oder Unterbrechungen können die Kalenderdauer erhöhen.","originalChapter":19},{"id":"ch19-extra-04","chapter":14,"question":"Eine Tabelle speichert Kundenadresse bei jedem Auftrag. Welche Anomalie droht bei Adressänderung?","options":["Automatische Verschlüsselung aller Adressen","Zwingend schnellere Schreibzugriffe","Die Unmöglichkeit jeglicher Suche","Widersprüchliche Adressen bei nur teilweise aktualisierten Zeilen"],"correct":3,"explanation":"Wiederholte Fakten müssen konsistent geändert werden. Eine getrennte Kundenhaltung kann diese Redundanz reduzieren; historische Adressen sind ein bewusst anderer Fachfall.","hint":"Eine getrennte Kundenhaltung kann diese Redundanz reduzieren; historische Adressen sind ein bewusst anderer Fachfall.","originalChapter":19},{"id":"ch19-extra-05","chapter":19,"question":"Was passiert beim HTTP-Status 500 typischerweise?","options":["Der Server meldet einen internen Fehler","Die Ressource wurde sicher erfolgreich erstellt","Der Client ist zwingend nicht angemeldet","Die Daten wurden automatisch archiviert"],"correct":0,"explanation":"500 beschreibt einen serverseitigen Fehler. Die konkrete Ursache muss anhand geeigneter Diagnoseinformationen untersucht werden.","hint":"Die konkrete Ursache muss anhand geeigneter Diagnoseinformationen untersucht werden.","originalChapter":19},{"id":"ch19-extra-06","chapter":18,"question":"Welche Schreibweise ist gültiges JSON?","options":["{'aktiv': True}","{\"aktiv\": true}","{aktiv: ja}","{\"aktiv\": true,}"],"correct":1,"explanation":"JSON verlangt doppelte Anführungszeichen für Objektschlüssel und kennt den booleschen Wert true. Ein abschließendes Komma ist nicht zulässig.","hint":"Ein abschließendes Komma ist nicht zulässig.","originalChapter":19},{"id":"ch19-extra-07","chapter":20,"question":"Was bedeutet NULL in einer Datenbank grundsätzlich?","options":["Immer die Zahl null","Immer eine leere Zeichenfolge","Ein fehlender beziehungsweise unbekannter Wert","Immer ein gelöschter Datensatz"],"correct":2,"explanation":"NULL hat eigene Vergleichssemantik. Zur Prüfung wird in SQL IS NULL verwendet, nicht die Gleichheit mit der Zahl null.","hint":"Zur Prüfung wird in SQL IS NULL verwendet, nicht die Gleichheit mit der Zahl null.","originalChapter":19},{"id":"ch19-extra-08","chapter":32,"question":"Ein Dienst verarbeitet 600 Anfragen in 60 Sekunden. Welcher mittlere Durchsatz ergibt sich?","options":["60 Anfragen pro Sekunde","600 Anfragen pro Sekunde","0,1 Anfragen pro Sekunde","10 Anfragen pro Sekunde"],"correct":3,"explanation":"Durchsatz ist Menge geteilt durch Zeit. 600 geteilt durch 60 ergibt 10; der Mittelwert zeigt keine kurzzeitigen Spitzen.","hint":"600 geteilt durch 60 ergibt 10; der Mittelwert zeigt keine kurzzeitigen Spitzen.","originalChapter":19},{"id":"ch19-extra-09","chapter":33,"question":"Welche Maßnahme macht ein Formular für Tastaturnutzer besser bedienbar?","options":["Erreichbare Bedienelemente mit sichtbarem Fokus","Entfernung aller Fokusmarkierungen","Nur Mausgesten anbieten","Alle Beschriftungen löschen"],"correct":0,"explanation":"Tastaturnutzer müssen wissen, welches Element aktiv ist. Erreichbarkeit und sichtbarer Fokus sind dafür zentral.","hint":"Erreichbarkeit und sichtbarer Fokus sind dafür zentral.","originalChapter":19},{"id":"ch19-extra-10","chapter":21,"question":"Eine Transaktion enthält zwei zusammengehörige Änderungen. Was verlangt Atomicity?","options":["Die erste wird immer bestätigt","Beide werden als Einheit bestätigt oder bei Scheitern zurückgenommen","Jede Änderung wird zufällig verzögert","Alle Werte werden verschlüsselt"],"correct":1,"explanation":"Atomarität verhindert halbfertige Gesamtänderungen. Sie sagt für sich allein nichts über die fachliche Richtigkeit der Änderungen aus.","hint":"Sie sagt für sich allein nichts über die fachliche Richtigkeit der Änderungen aus.","originalChapter":19},{"id":"ch19-extra-11","chapter":26,"question":"Ein Nutzer ist angemeldet, darf aber einen Datensatz nicht löschen. Welche Prüfung fehlt bei bloßer Anmeldung?","options":["Die Bildschirmauflösung","Die Dateikompression","Die Berechtigung für diesen Vorgang und Datensatz","Die CPU-Temperatur"],"correct":2,"explanation":"Authentifizierung klärt die Identität. Autorisierung entscheidet, welche konkreten Handlungen erlaubt sind.","hint":"Autorisierung entscheidet, welche konkreten Handlungen erlaubt sind.","originalChapter":19},{"id":"ch20-extra-01","chapter":15,"question":"Ein Import enthält doppelte Auftragsnummern. Wie gehst du vor?","options":["Alle Zeilen ungeprüft übernehmen","Duplikate anhand fachlicher Regeln erkennen und eine nachvollziehbare Behandlung festlegen","Zufällig die Hälfte löschen","Nur den Dateinamen ändern"],"correct":1,"explanation":"Duplikate können echte Fehler oder berechtigte Wiederholungen sein. Fachregeln und ein Importprotokoll verhindern unbemerkte Datenverluste.","hint":"Fachregeln und ein Importprotokoll verhindern unbemerkte Datenverluste.","originalChapter":20},{"id":"ch20-extra-02","chapter":25,"question":"Nach einem Update bleiben alte Browserressourcen im Cache. Welche Maßnahme passt?","options":["Den Lernfortschritt aller Nutzer löschen","Nur das Logo umbenennen","Eine neue Cache-Version und einen kontrollierten Austausch der App-Ressourcen bereitstellen","Den Service Worker unverändert lassen"],"correct":2,"explanation":"Ein versionierter Cache erleichtert die Aktualisierung statischer Ressourcen. Nutzerdaten müssen unabhängig davon erhalten bleiben.","hint":"Nutzerdaten müssen unabhängig davon erhalten bleiben.","originalChapter":20},{"id":"ch20-extra-03","chapter":5,"question":"Ein Kunde fordert Offline-Arbeit mit späterer Synchronisation. Welcher Fall muss geplant werden?","options":["Nur die Farbe des Offline-Symbols","Nur die Dateigröße des Logos","Das vollständige Verbot lokaler Daten","Konflikte durch Änderungen desselben Datensatzes auf mehreren Geräten"],"correct":3,"explanation":"Offline-Synchronisation benötigt Regeln für Konflikte, Wiederholungen und Berechtigungen. Ein später Upload allein löst diese Probleme nicht.","hint":"Ein später Upload allein löst diese Probleme nicht.","originalChapter":20},{"id":"ch20-extra-04","chapter":32,"question":"Eine Anwendung verliert unter hoher Last Anfragen. Was ist ein sinnvoller erster Analyseansatz?","options":["Fehlerraten, Ressourcen und Engpässe unter reproduzierbarer Last messen","Sofort alle Server ohne Befund austauschen","Nur Benutzerpasswörter ändern","Tests ausschließlich ohne Last durchführen"],"correct":0,"explanation":"Messungen grenzen die Ursache ein. Erst dann lässt sich zwischen Kapazitäts-, Datenbank- oder Implementierungsproblemen entscheiden.","hint":"Erst dann lässt sich zwischen Kapazitäts-, Datenbank- oder Implementierungsproblemen entscheiden.","originalChapter":20},{"id":"ch20-extra-05","chapter":19,"question":"Ein externer API-Anbieter ist nicht erreichbar. Wie kann die eigene App robust reagieren?","options":["Unbegrenzt synchron warten","Timeouts, begrenzte sichere Wiederholungen und verständliche Fehlermeldungen vorsehen","Jede Anfrage tausendmal sofort wiederholen","Nutzern immer Erfolg melden"],"correct":1,"explanation":"Robuste Fehlerbehandlung verhindert Blockaden und Überlastungswellen. Ein Ersatzverhalten muss fachlich vertretbar sein.","hint":"Ein Ersatzverhalten muss fachlich vertretbar sein.","originalChapter":20},{"id":"ch20-extra-06","chapter":31,"question":"Ein Rollout ist technisch erfolgreich, Nutzer können aber ihre Aufgaben nicht erledigen. Was fehlt wahrscheinlich?","options":["Eine längere Versionsnummer","Ein weiteres Logo","Die Prüfung tatsächlicher Nutzungsabläufe und passende Einführungshilfen","Grundsätzlich mehr Datenbankindizes"],"correct":2,"explanation":"Technische Erreichbarkeit beweist keine Gebrauchstauglichkeit. Fachliche Tests, Schulung und Feedback sind für Einführungserfolg nötig.","hint":"Fachliche Tests, Schulung und Feedback sind für Einführungserfolg nötig.","originalChapter":20},{"id":"ch20-extra-07","chapter":15,"question":"Nach einer Migration stimmt die Zahl der Aufträge, ihre Gesamtsumme aber nicht. Was folgt?","options":["Gleiche Zeilenzahl beweist vollständigen Erfolg","Die Summe ist grundsätzlich unwichtig","Die Prüfung wird als bestanden archiviert","Die fachliche Datenrichtigkeit ist nicht nachgewiesen und muss untersucht werden"],"correct":3,"explanation":"Vollständigkeit und Richtigkeit sind verschiedene Kriterien. Summenabgleiche können Fehler entdecken, die reine Zählung übersieht.","hint":"Summenabgleiche können Fehler entdecken, die reine Zählung übersieht.","originalChapter":20},{"id":"ch20-extra-08","chapter":26,"question":"Ein Protokoll enthält Zugriffstoken. Welche Maßnahme ist angemessen?","options":["Offenlegung begrenzen, betroffene Token behandeln und Logging bereinigen","Das Protokoll öffentlich teilen","Nur die Schriftfarbe ändern","Den Befund wegen kurzer Token ignorieren"],"correct":0,"explanation":"Token können Zugriff ermöglichen. Neben Bereinigung sind Widerruf beziehungsweise Rotation und eine Folgenprüfung erforderlich.","hint":"Neben Bereinigung sind Widerruf beziehungsweise Rotation und eine Folgenprüfung erforderlich.","originalChapter":20},{"id":"ch20-extra-09","chapter":13,"question":"Ein Team will Microservices nur wegen eines Trends. Welche Rückfrage ist hilfreich?","options":["Welches Logo ist moderner?","Welches konkrete Problem rechtfertigt den zusätzlichen Betriebs- und Abstimmungsaufwand?","Kann man deshalb alle Tests löschen?","Sind möglichst viele Dienste immer besser?"],"correct":1,"explanation":"Architektur folgt Anforderungen und Rahmenbedingungen. Verteilung lohnt sich nur, wenn ihr Nutzen die zusätzliche Komplexität rechtfertigt.","hint":"Verteilung lohnt sich nur, wenn ihr Nutzen die zusätzliche Komplexität rechtfertigt.","originalChapter":20},{"id":"ch20-extra-10","chapter":33,"question":"Eine mobile Seite funktioniert im Hochformat, überläuft aber quer. Was ist sinnvoll?","options":["Querformat ohne Begründung für alle Browser verbieten","Nur den Seitentitel kürzen","Layout bei mehreren Breiten und langen Inhalten prüfen und anpassen","Alle Inhalte in ein Bild umwandeln"],"correct":2,"explanation":"Responsive Gestaltung muss verschiedene Ansichten und Inhalte tragen. Lange Texte und große Schrift können zusätzliche Layoutprobleme sichtbar machen.","hint":"Lange Texte und große Schrift können zusätzliche Layoutprobleme sichtbar machen.","originalChapter":20},{"id":"ch20-extra-11","chapter":15,"question":"Ein alter Lernstand soll nach einer Fragen-Erweiterung erhalten bleiben. Was ist entscheidend?","options":["Alle Fragen neu durchnummerieren","Den Speicher bei jedem Start löschen","Alle alten Lösungen ohne Prüfung verändern","Bestehende Fragen-IDs und gespeicherte Antworten kompatibel halten"],"correct":3,"explanation":"Fortschritt ist an Identitäten gebunden. Neue Fragen erhalten neue IDs, während alte Zuordnungen unverändert bleiben.","hint":"Neue Fragen erhalten neue IDs, während alte Zuordnungen unverändert bleiben.","originalChapter":20},{"id":"ch21-extra-01","chapter":29,"question":"Welche Formulierung ist als Testempfehlung präzise?","options":["Wir testen irgendwie alles","Wir klicken ein bisschen","Wir prüfen ungültige IDs und erwarten eine Ablehnung ohne Datenänderung","Es wird schon funktionieren"],"correct":2,"explanation":"Die Empfehlung nennt Eingabe und erwartetes Verhalten. Dadurch lässt sie sich in einen nachvollziehbaren Test umsetzen.","hint":"Dadurch lässt sie sich in einen nachvollziehbaren Test umsetzen.","originalChapter":21},{"id":"ch21-extra-02","chapter":13,"question":"Was fehlt im Satz „Wir setzen einen Cache ein“ für eine begründete Lösung?","options":["Ein längerer Werkzeugname","Die Lieblingsfarbe des Kunden","Eine zusätzliche Abkürzung ohne Erklärung","Ziel, Aktualitätsanforderung und Umgang mit veralteten Einträgen"],"correct":3,"explanation":"Caching ist ein Mittel mit Nebenwirkungen. Eine vollständige Empfehlung erklärt Nutzen und Regeln zur Datenaktualität.","hint":"Eine vollständige Empfehlung erklärt Nutzen und Regeln zur Datenaktualität.","originalChapter":21},{"id":"ch21-extra-03","chapter":26,"question":"Welche Antwort beschreibt eine Sicherheitsmaßnahme mit Wirkung?","options":["Objektberechtigungen werden serverseitig geprüft, damit fremde Aufträge nicht abrufbar sind","Sicherheit wird generell besser","Der Button wird blau","Wir benutzen moderne Technik"],"correct":0,"explanation":"Die Verknüpfung von Maßnahme und Risiko zeigt fachliches Verständnis. Eine allgemeine Zusicherung bleibt nicht überprüfbar.","hint":"Eine allgemeine Zusicherung bleibt nicht überprüfbar.","originalChapter":21},{"id":"ch21-extra-04","chapter":16,"question":"Wie wird eine Annahme in einer Musterlösung kenntlich gemacht?","options":["„Es sind sicher 100 Nutzer“, obwohl keine Angabe vorliegt","„Ich nehme für die Planung 100 gleichzeitige Nutzer an und prüfe dies im Lasttest.“","Die Zahl ohne Erklärung in eine Grafik schreiben","Die Datenlücke vollständig verschweigen"],"correct":1,"explanation":"Die Aussage trennt Annahme und Nachweis. Sie macht sichtbar, wie die Planung später validiert wird.","hint":"Sie macht sichtbar, wie die Planung später validiert wird.","originalChapter":21},{"id":"ch21-extra-05","chapter":31,"question":"Welche Empfehlung verbindet Einführung und Rückfallplanung?","options":["Wir führen einfach alles sofort ein","Wir hoffen auf wenige Fehler","Ein Pilot wird überwacht; bei definierten Fehlergrenzen erfolgt ein kompatibler Rückfall","Wir entfernen vorab jede alte Version und Sicherung"],"correct":2,"explanation":"Eine kontrollierte Einführung braucht Messung und eine realistische Reaktion bei Problemen. Rückfall muss technisch möglich sein.","hint":"Rückfall muss technisch möglich sein.","originalChapter":21},{"id":"ch21-extra-06","chapter":31,"question":"Was verbessert den Antwortbaustein „Wir machen Backups“?","options":["Nur das Wort Backup wiederholen","Den Servernamen länger schreiben","Keine Zuständigkeit festlegen","Sicherungsumfang, Frequenz und getestete Wiederherstellung nennen"],"correct":3,"explanation":"Ein Sicherungskonzept muss zu RPO und RTO passen. Erfolg zeigt sich erst in einer nutzbaren Wiederherstellung.","hint":"Erfolg zeigt sich erst in einer nutzbaren Wiederherstellung.","originalChapter":21},{"id":"ch21-extra-07","chapter":13,"question":"Welche Begründung für einen modularen Monolithen ist überzeugend?","options":["Er erfüllt unsere Anforderungen bei geringem Betriebsaufwand und klaren Modulgrenzen","Monolithen sind immer in jeder Situation überlegen","Microservices sind grundsätzlich fehlerhaft","Die Entscheidung benötigt keine Rahmenbedingungen"],"correct":0,"explanation":"Eine gute Begründung gilt für den konkreten Kontext. Pauschalurteile vernachlässigen unterschiedliche Projektziele.","hint":"Pauschalurteile vernachlässigen unterschiedliche Projektziele.","originalChapter":21},{"id":"ch21-extra-08","chapter":16,"question":"Wie sollte eine Musterantwort mehrere Alternativen darstellen?","options":["Mit Werbung nur für die bevorzugte Lösung","Mit gemeinsamen Kriterien, Vor- und Nachteilen sowie einer begründeten Auswahl","Nur mit alphabetisch sortierten Namen","Mit unbelegten Zahlen für die Konkurrenz"],"correct":1,"explanation":"Ein transparenter Vergleich macht die Schlussfolgerung nachvollziehbar. Relevante Kriterien sind etwa Kosten, Risiko und Wartbarkeit.","hint":"Relevante Kriterien sind etwa Kosten, Risiko und Wartbarkeit.","originalChapter":21},{"id":"ch21-extra-09","chapter":32,"question":"Welche Aussage zeigt eine prüfbare Erfolgskontrolle?","options":["Nach der Änderung fühlt es sich modern an","Der Entwickler ist zufrieden, also ist alles erfüllt","Nach der Änderung messen wir p95 unter vereinbarter Last und vergleichen mit dem Zielwert","Erfolg wird grundsätzlich vorausgesetzt"],"correct":2,"explanation":"Messbedingungen und Zielwert ermöglichen objektive Bewertung. Subjektiver Eindruck kann ergänzen, ersetzt aber keine Leistungsprüfung.","hint":"Subjektiver Eindruck kann ergänzen, ersetzt aber keine Leistungsprüfung.","originalChapter":21},{"id":"ch21-extra-10","chapter":33,"question":"Was macht eine Risikobeschreibung handlungsfähig?","options":["Nur „gefährlich“ schreiben","Jedes Risiko als sicher eintretend behandeln","Alle Risiken ohne Priorität auflisten","Ursache, mögliche Folge und passende Gegenmaßnahme nennen"],"correct":3,"explanation":"Die Verbindung erklärt, wo eingegriffen werden kann. Wahrscheinlichkeit und Auswirkung unterstützen die Priorisierung.","hint":"Wahrscheinlichkeit und Auswirkung unterstützen die Priorisierung.","originalChapter":21},{"id":"ch21-extra-11","chapter":16,"question":"Wie sollte ein Fazit zu einer Fallaufgabe formuliert sein?","options":["Empfehlung, zentrale Begründung und verbleibende Bedingungen knapp zusammenführen","Neue unbelegte Fakten einführen","Alle vorigen Argumente widersprechen","Nur den Aufgabentext wiederholen"],"correct":0,"explanation":"Ein Fazit verdichtet die Entscheidung. Offene Voraussetzungen sollten erkennbar bleiben, ohne die gesamte Analyse zu wiederholen.","hint":"Offene Voraussetzungen sollten erkennbar bleiben, ohne die gesamte Analyse zu wiederholen.","originalChapter":21},{"id":"ch22-extra-01","chapter":8,"question":"Was gehört in eine Vorlage für ein Akzeptanzkriterium?","options":["Nur die Schriftgröße","Nur der Name des Entwicklers","Eine zufällige Prioritätszahl ohne Bedeutung","Ausgangssituation, Handlung und überprüfbares Ergebnis"],"correct":3,"explanation":"Eine klare Struktur wie Given-When-Then verbindet Bedingungen und Verhalten. Sie erleichtert die Ableitung fachlicher Tests.","hint":"Sie erleichtert die Ableitung fachlicher Tests.","originalChapter":22},{"id":"ch22-extra-02","chapter":29,"question":"Welche Felder braucht ein Fehlerbericht mindestens für Reproduzierbarkeit?","options":["Umgebung, Schritte sowie Soll- und Ist-Ergebnis","Nur ein Emoji","Nur die Dateigröße","Nur die Uhrzeit ohne Beschreibung"],"correct":0,"explanation":"Diese Angaben ermöglichen, denselben Fehler nachzustellen. Zusätzliche Logs und anonymisierte Beispiele können helfen.","hint":"Zusätzliche Logs und anonymisierte Beispiele können helfen.","originalChapter":22},{"id":"ch22-extra-03","chapter":15,"question":"Was sollte ein Migrationsplan als Kontrollpunkt enthalten?","options":["Nur einen neuen Dateinamen","Prüfungen von Vollständigkeit und fachlicher Konsistenz","Nur einen Screenshot des Startbuttons","Nur den Namen des Lieferanten"],"correct":1,"explanation":"Migration muss Daten korrekt übertragen. Kontrollpunkte helfen, Fehler vor der Freigabe zu erkennen.","hint":"Kontrollpunkte helfen, Fehler vor der Freigabe zu erkennen.","originalChapter":22},{"id":"ch22-extra-04","chapter":34,"question":"Welche Angaben machen eine Maßnahme in einer Aufgabenliste verbindlich?","options":["Nur ein allgemeines Stichwort","Nur die Reihenfolge der Buchstaben","Verantwortlicher, Termin und Abschlusskriterium","Nur die persönliche Meinung des Autors"],"correct":2,"explanation":"So wird klar, wer was bis wann erledigt und woran Fertigstellung erkannt wird. Das erleichtert Nachverfolgung.","hint":"Das erleichtert Nachverfolgung.","originalChapter":22},{"id":"ch22-extra-05","chapter":11,"question":"Was gehört in eine ADR-Vorlage zusätzlich zur Entscheidung?","options":["Nur ein Firmenlogo","Alle Benutzerpasswörter","Nur die Tageszeit des Meetings","Kontext, Alternativen und Konsequenzen"],"correct":3,"explanation":"Die Gründe machen Architekturentscheidungen später verständlich. Konsequenzen zeigen auch Nachteile und Folgeaufgaben.","hint":"Konsequenzen zeigen auch Nachteile und Folgeaufgaben.","originalChapter":22},{"id":"ch22-extra-06","chapter":31,"question":"Welche Information benötigt ein Rollback-Plan?","options":["Auslösekriterien, Schritte und Grenzen der Datenkompatibilität","Nur den alten Versionsnamen","Nur den Projektordner","Keine Voraussetzungen, weil Rollback immer funktioniert"],"correct":0,"explanation":"Ein Rückfall muss ausführbar und fachlich sicher sein. Datenänderungen können seine Möglichkeiten einschränken.","hint":"Datenänderungen können seine Möglichkeiten einschränken.","originalChapter":22},{"id":"ch22-extra-07","chapter":6,"question":"Was gehört in eine Stakeholder-Matrix?","options":["Nur Lieblingsfarben","Rolle, Interessen, Einfluss und passender Kommunikationsbedarf","Nur die CPU-Ausstattung","Nur Urlaubsfotos"],"correct":1,"explanation":"Die Matrix unterstützt gezielte Beteiligung. Einfluss und Betroffenheit können je nach Projektphase variieren.","hint":"Einfluss und Betroffenheit können je nach Projektphase variieren.","originalChapter":22},{"id":"ch22-extra-08","chapter":29,"question":"Was sollte eine Testvorlage für den Ausgangszustand enthalten?","options":["Nur das spätere Ergebnis","Nur den Namen des Browsers ohne Version","Voraussetzungen und benötigte Testdaten","Eine zufällige Bewertung"],"correct":2,"explanation":"Ein Test ist nur reproduzierbar, wenn seine Voraussetzungen bekannt sind. Das verhindert unterschiedliche Ergebnisse durch ungleiche Ausgangsdaten.","hint":"Das verhindert unterschiedliche Ergebnisse durch ungleiche Ausgangsdaten.","originalChapter":22},{"id":"ch22-extra-09","chapter":34,"question":"Welche Spalte hilft im Risikoregister bei der laufenden Steuerung?","options":["Nur die Farbe der Tabellenzelle","Nur eine zufällige Nummer","Nur das Jahr der Firmengründung","Status der Maßnahme und Datum der nächsten Prüfung"],"correct":3,"explanation":"Risiken ändern sich im Projektverlauf. Nachverfolgung zeigt, ob Maßnahmen wirken oder angepasst werden müssen.","hint":"Nachverfolgung zeigt, ob Maßnahmen wirken oder angepasst werden müssen.","originalChapter":22},{"id":"ch22-extra-10","chapter":31,"question":"Was dokumentiert ein Abnahmeprotokoll sinnvoll?","options":["Geprüfte Kriterien, Ergebnisse, offene Mängel und die Abnahmeentscheidung","Nur die Rechnungssumme","Nur die Anzahl der Anwesenden","Ein pauschales „alles gut“ ohne Bezug"],"correct":0,"explanation":"Ein Protokoll hält fest, was tatsächlich akzeptiert wurde. Offene Punkte und Vorbehalte bleiben nachvollziehbar.","hint":"Offene Punkte und Vorbehalte bleiben nachvollziehbar.","originalChapter":22},{"id":"ch22-extra-11","chapter":30,"question":"Welche Angaben gehören in eine Quellenliste für technische Entscheidungen?","options":["Nur ein nicht anklickbares „Internet“","Herausgeber, Titel, Version beziehungsweise Stand und Fundstelle","Nur die Farbe der Webseite","Nur ein verkürzter Produktname"],"correct":1,"explanation":"Eine präzise Quellenangabe ermöglicht Prüfung und spätere Aktualisierung. Versionen sind bei technischen Regeln besonders wichtig.","hint":"Versionen sind bei technischen Regeln besonders wichtig.","originalChapter":22},{"id":"ch23-extra-01","chapter":16,"question":"Wie beantwortest du den Operator „Erläutern“?","options":["Den Sachverhalt erklären und Zusammenhänge beziehungsweise Beispiele hinzufügen","Nur einen Begriff nennen","Nur eine Liste ohne Bezug schreiben","Ausschließlich eine Meinung äußern"],"correct":0,"explanation":"Erläutern verlangt Verständnis und Einordnung. Ein konkretes Beispiel kann die Erklärung anschaulich machen.","hint":"Ein konkretes Beispiel kann die Erklärung anschaulich machen.","originalChapter":23},{"id":"ch23-extra-02","chapter":16,"question":"Wie verteilst du Zeit bei einer schriftlichen Übung sinnvoll?","options":["Die gesamte Zeit für die erste leichte Frage nutzen","Teilaufgaben und Bedeutung beachten sowie Zeit zur Kontrolle reservieren","Kontrolle grundsätzlich ausschließen","Schwierige Aufgaben ohne Lesen streichen"],"correct":1,"explanation":"Zeitplanung hilft, alle Aufträge zu bearbeiten. Die Schlusskontrolle findet ausgelassene Teile und offensichtliche Widersprüche.","hint":"Die Schlusskontrolle findet ausgelassene Teile und offensichtliche Widersprüche.","originalChapter":23},{"id":"ch23-extra-03","chapter":3,"question":"Was ist eine gute Präsentationsstruktur für einen Praxisfall?","options":["Nur eine lange Werkzeugliste","Nur Screenshots ohne Erklärung","Ausgangslage, Ziele, Optionen, Entscheidung, Umsetzung und Ergebnis","Nur eine chronologische Liste aller E-Mails"],"correct":2,"explanation":"Die Struktur zeigt den Weg von Problem zu begründeter Lösung. Ergebnis und Reflexion machen den Nutzen sichtbar.","hint":"Ergebnis und Reflexion machen den Nutzen sichtbar.","originalChapter":23},{"id":"ch23-extra-04","chapter":3,"question":"Welche Foliengestaltung unterstützt einen Fachvortrag?","options":["Vollständige Absätze in sehr kleiner Schrift","Jede Folie mit allen Quellcodes füllen","Nur dekorative Bilder ohne Bezug","Lesbare Kernpunkte und passende visualisierte Zusammenhänge"],"correct":3,"explanation":"Folien sollen die Argumentation unterstützen. Zu viel Text konkurriert mit dem gesprochenen Vortrag.","hint":"Zu viel Text konkurriert mit dem gesprochenen Vortrag.","originalChapter":23},{"id":"ch23-extra-05","chapter":28,"question":"Ein Prüfer nennt eine Alternative zu deiner Lösung. Wie reagierst du?","options":["Ihre Vor- und Nachteile anhand des Falls abwägen","Jede Alternative sofort als falsch bezeichnen","Ohne Prüfung die eigene Lösung widerrufen","Die Frage ignorieren"],"correct":0,"explanation":"Das Fachgespräch prüft begründete Reflexion. Eine Alternative kann unter anderen Bedingungen sinnvoll sein.","hint":"Eine Alternative kann unter anderen Bedingungen sinnvoll sein.","originalChapter":23},{"id":"ch23-extra-06","chapter":3,"question":"Warum ist lautes Üben einer Präsentation hilfreich?","options":["Es ersetzt jede fachliche Recherche","Es prüft Verständlichkeit, Übergänge und tatsächliche Dauer","Es garantiert eine bestimmte Note","Es macht Rückfragen unmöglich"],"correct":1,"explanation":"Gedankliches Durchgehen unterschätzt häufig die Redezeit. Lautes Üben macht unklare Stellen erkennbar.","hint":"Lautes Üben macht unklare Stellen erkennbar.","originalChapter":23},{"id":"ch23-extra-07","chapter":28,"question":"Wie gehst du im Fachgespräch mit einer unklaren Frage um?","options":["Eine beliebige Antwort auswendig aufsagen","Den Prüfer persönlich kritisieren","Den gemeinten Aspekt kurz klären und dann gezielt antworten","Die Frage vollständig ignorieren"],"correct":2,"explanation":"Eine kurze Klärung verhindert Antworten am Thema vorbei. Anschließend sollte die Antwort direkt und fachlich begründet sein.","hint":"Anschließend sollte die Antwort direkt und fachlich begründet sein.","originalChapter":23},{"id":"ch23-extra-08","chapter":28,"question":"Was sollte die Reflexion eines Projekts enthalten?","options":["Nur Eigenlob","Nur die Schuld anderer Beteiligter","Keine Aussagen zum Ergebnis","Erreichte Ziele, Grenzen und konkrete Lernpunkte"],"correct":3,"explanation":"Reflexion zeigt, wie Erfahrungen zur Verbesserung genutzt werden. Grenzen transparent zu benennen stärkt die fachliche Nachvollziehbarkeit.","hint":"Grenzen transparent zu benennen stärkt die fachliche Nachvollziehbarkeit.","originalChapter":23},{"id":"ch23-extra-09","chapter":16,"question":"Eine Aufgabe verlangt drei Maßnahmen. Was ist am zielführendsten?","options":["Drei unterscheidbare passende Maßnahmen mit Wirkung nennen","Eine Maßnahme dreimal anders formulieren","Zehn Schlagwörter ohne Begründung nennen","Nur das Problem wiederholen"],"correct":0,"explanation":"Unterscheidbare Maßnahmen decken verschiedene Ansatzpunkte ab. Die jeweilige Wirkung zeigt den Bezug zum Problem.","hint":"Die jeweilige Wirkung zeigt den Bezug zum Problem.","originalChapter":23},{"id":"ch23-extra-10","chapter":4,"question":"Wie nutzt du eine Musterlösung zum Lernen?","options":["Den Text ohne Verständnis auswendig kopieren","Eigene Antwort vergleichen, Abweichungen begründen und den Fall erneut lösen","Nur die Länge vergleichen","Alle anderen Lösungswege ausschließen"],"correct":1,"explanation":"Musterlösungen sind Vergleichs- und Lernhilfen. Bei offenen Aufgaben können mehrere begründete Lösungen tragfähig sein.","hint":"Bei offenen Aufgaben können mehrere begründete Lösungen tragfähig sein.","originalChapter":23},{"id":"ch23-extra-11","chapter":16,"question":"Was prüfst du bei der letzten Durchsicht einer Fachantwort?","options":["Nur die Anzahl der Fremdwörter","Nur ob jede Zeile gleich lang ist","Vollständigkeit, fachliche Konsistenz und klaren Bezug zum Auftrag","Nur die Farbe der Überschriften"],"correct":2,"explanation":"Die Kontrolle soll die Antwortqualität erhöhen. Besonders wichtig sind übersehene Teilaufträge und widersprüchliche Empfehlungen.","hint":"Besonders wichtig sind übersehene Teilaufträge und widersprüchliche Empfehlungen.","originalChapter":23},{"id":"ch24-extra-01","chapter":21,"question":"Was bedeutet CRUD?","options":["Cache, Route, Upload und Download","Create, Read, Update und Delete","Compile, Run, Undo und Debug","Client, Router, User und Domain"],"correct":1,"explanation":"CRUD bezeichnet grundlegende Operationen auf Daten. Berechtigungen und Fachregeln müssen für jede Operation passend geprüft werden.","hint":"Berechtigungen und Fachregeln müssen für jede Operation passend geprüft werden.","originalChapter":24},{"id":"ch24-extra-02","chapter":22,"question":"Was bedeutet Refactoring?","options":["Eine neue Fachfunktion hinzufügen","Alle Tests entfernen","Die interne Struktur verbessern, ohne das beobachtbare Verhalten gezielt zu ändern","Die Datenbank ungeprüft leeren"],"correct":2,"explanation":"Refactoring soll Wartbarkeit verbessern und vorhandenes Verhalten erhalten. Tests helfen, unbeabsichtigte Änderungen zu erkennen.","hint":"Tests helfen, unbeabsichtigte Änderungen zu erkennen.","originalChapter":24},{"id":"ch24-extra-03","chapter":11,"question":"Was ist technische Schuld?","options":["Nur eine unbezahlte Hardware-Rechnung","Jeder vorhandene Kommentar","Jede Verwendung einer Bibliothek","Ein späterer Mehraufwand durch ungünstige technische Entscheidungen oder unterlassene Pflege"],"correct":3,"explanation":"Technische Schuld kann Entwicklung verlangsamen und Risiken erhöhen. Sie sollte sichtbar gemacht und bewusst priorisiert werden.","hint":"Sie sollte sichtbar gemacht und bewusst priorisiert werden.","originalChapter":24},{"id":"ch24-extra-04","chapter":19,"question":"Was bedeutet Idempotenz?","options":["Mehrfache gleiche Operationen haben dieselbe beabsichtigte Wirkung wie eine einmalige","Jede Operation muss denselben Antworttext liefern","Jede Operation ist ohne Nebenwirkungen","Jede Operation ist verschlüsselt"],"correct":0,"explanation":"Idempotenz betrifft die Wirkung, nicht zwingend identische Antworten. Sie ist bei Wiederholungen nach unklaren Fehlern besonders hilfreich.","hint":"Sie ist bei Wiederholungen nach unklaren Fehlern besonders hilfreich.","originalChapter":24},{"id":"ch24-extra-05","chapter":32,"question":"Was bezeichnet Observability?","options":["Nur die Bildschirmhelligkeit","Die Möglichkeit, interne Zustände anhand von Ausgaben wie Logs, Metriken und Traces zu verstehen","Nur den Zugang zur Startseite","Nur die Anzahl der Nutzerkonten"],"correct":1,"explanation":"Observability unterstützt Diagnose auch bei nicht vorab erwarteten Problemen. Gute Instrumentierung macht Zusammenhänge erkennbar.","hint":"Gute Instrumentierung macht Zusammenhänge erkennbar.","originalChapter":24},{"id":"ch24-extra-06","chapter":31,"question":"Was ist ein SLA?","options":["Eine Programmierschleife","Ein Dateikompressionsverfahren","Eine Vereinbarung über Dienstleistungsniveau und zugehörige Bedingungen","Ein Datenbankindex"],"correct":2,"explanation":"Ein Service Level Agreement legt Leistungen und Bedingungen zwischen Parteien fest. Es unterscheidet sich von einer rein internen Zielvorgabe.","hint":"Es unterscheidet sich von einer rein internen Zielvorgabe.","originalChapter":24},{"id":"ch24-extra-07","chapter":13,"question":"Was bedeutet Skalierbarkeit?","options":["Dass jede Anwendung immer schneller als jede andere ist","Dass keinerlei Tests nötig sind","Dass alle Daten öffentlich werden","Die Fähigkeit, mit veränderter Last durch passende Ressourcen beziehungsweise Struktur umzugehen"],"correct":3,"explanation":"Skalierbarkeit bewertet Verhalten bei wachsender oder sinkender Last. Sie ist von momentaner Geschwindigkeit zu unterscheiden.","hint":"Sie ist von momentaner Geschwindigkeit zu unterscheiden.","originalChapter":24},{"id":"ch24-extra-08","chapter":25,"question":"Was ist ein Hotfix?","options":["Eine kurzfristige gezielte Korrektur eines dringenden Problems","Eine beliebige neue Großfunktion","Ein jährlicher Hardwaretausch","Eine Löschung aller alten Versionen"],"correct":0,"explanation":"Hotfixes reagieren auf dringende Fehler. Trotz Zeitdruck bleiben angemessene Prüfung und Nachvollziehbarkeit erforderlich.","hint":"Trotz Zeitdruck bleiben angemessene Prüfung und Nachvollziehbarkeit erforderlich.","originalChapter":24},{"id":"ch24-extra-09","chapter":24,"question":"Was bedeutet Deployment-Pipeline?","options":["Ein einzelner Bildschirmbutton ohne Prozess","Eine Folge definierter Schritte von Änderung beziehungsweise Build bis zur Bereitstellung","Ein Netzwerk-Kabeltyp","Eine Liste privater Passwörter"],"correct":1,"explanation":"Die Pipeline automatisiert und ordnet Prüf- und Auslieferungsschritte. Freigaben können je nach Prozess ebenfalls dazugehören.","hint":"Freigaben können je nach Prozess ebenfalls dazugehören.","originalChapter":24},{"id":"ch24-extra-10","chapter":10,"question":"Was ist Vendor Lock-in?","options":["Ein grundsätzlich kostenloser Anbieterwechsel","Eine automatische Datenlöschung","Eine Abhängigkeit, die den Wechsel zu einem anderen Anbieter erschwert","Eine spezielle HTTP-Methode"],"correct":2,"explanation":"Proprietäre Schnittstellen, Datenformate und Vertragsbedingungen können Wechselkosten erhöhen. Export- und Ausstiegsmöglichkeiten begrenzen das Risiko.","hint":"Export- und Ausstiegsmöglichkeiten begrenzen das Risiko.","originalChapter":24},{"id":"ch24-extra-11","chapter":12,"question":"Was ist ein Proof of Concept?","options":["Ein vollständiger Nachweis sämtlicher Produktqualität","Eine endgültige Abnahme","Ein Ersatz für alle Anforderungen","Ein begrenzter Versuch zum Nachweis einer technischen Machbarkeit"],"correct":3,"explanation":"Ein PoC prüft ausgewählte technische Annahmen. Produktionsreife, Sicherheit und Wartbarkeit müssen zusätzlich bewertet werden.","hint":"Produktionsreife, Sicherheit und Wartbarkeit müssen zusätzlich bewertet werden.","originalChapter":24},{"id":"ch25-extra-01","chapter":18,"question":"Welche Quelle ist für HTTP-Semantik besonders geeignet?","options":["Ein Produktlogo","Eine beliebige Werbeanzeige","Die einschlägigen RFCs der IETF","Ein undatierter Forenwitz"],"correct":2,"explanation":"RFCs dokumentieren die maßgebliche Protokollsemantik. Für HTTP beschreibt etwa RFC 9110 Methoden und Statuscodes.","hint":"Für HTTP beschreibt etwa RFC 9110 Methoden und Statuscodes.","originalChapter":25},{"id":"ch25-extra-02","chapter":33,"question":"Wo findest du die maßgeblichen Erfolgskriterien der WCAG?","options":["Nur in einer Social-Media-Umfrage","Nur in einer Hardware-Rechnung","Nur im App-Store-Ranking","In den Veröffentlichungen des W3C"],"correct":3,"explanation":"Das W3C veröffentlicht die WCAG. Für eine Prüfung müssen die passende Version und das angestrebte Konformitätsniveau festgelegt werden.","hint":"Für eine Prüfung müssen die passende Version und das angestrebte Konformitätsniveau festgelegt werden.","originalChapter":25},{"id":"ch25-extra-03","chapter":30,"question":"Warum sind Versionsangaben bei einer technischen Quelle wichtig?","options":["Verhalten und Anforderungen können zwischen Versionen abweichen","Weil jede ältere Quelle automatisch falsch ist","Weil Versionsnummern Tests ersetzen","Weil Quellen dann keine Herausgeber brauchen"],"correct":0,"explanation":"Eine Aussage kann für eine bestimmte Version korrekt sein. Versionsbezug verhindert unpassende Übertragung auf andere Stände.","hint":"Versionsbezug verhindert unpassende Übertragung auf andere Stände.","originalChapter":25},{"id":"ch25-extra-04","chapter":20,"question":"Welche Quelle ist für das konkrete Verhalten einer Datenbankfunktion zuerst geeignet?","options":["Eine Anleitung eines anderen Produkts ohne Vergleich","Die offizielle Dokumentation der verwendeten Datenbankversion","Nur eine zufällige Antwort ohne Version","Nur der Name der Funktion"],"correct":1,"explanation":"Datenbanksysteme unterscheiden sich auch bei ähnlichen Begriffen. Produkt- und Versionsbezug sind deshalb entscheidend.","hint":"Produkt- und Versionsbezug sind deshalb entscheidend.","originalChapter":25},{"id":"ch25-extra-05","chapter":30,"question":"Wie gehst du mit widersprüchlichen technischen Quellen um?","options":["Immer die kürzere Aussage wählen","Beide als identisch darstellen","Version, Kontext und Primärquelle vergleichen und die Abweichung klären","Die Quellenangaben löschen"],"correct":2,"explanation":"Widersprüche entstehen häufig durch unterschiedliche Versionen oder Bedingungen. Eine nachvollziehbare Prüfung verhindert falsche Verallgemeinerung.","hint":"Eine nachvollziehbare Prüfung verhindert falsche Verallgemeinerung.","originalChapter":25},{"id":"ch25-extra-06","chapter":33,"question":"Was ist bei einer Normenangabe in einer Entscheidung nötig?","options":["Nur „nach Norm“ schreiben","Jede Norm als automatisch gesetzlich verpflichtend behandeln","Nur den Verlag nennen","Die einschlägige Norm mit Version und relevantem Anwendungsbereich nennen"],"correct":3,"explanation":"Normen haben definierte Anwendungsbereiche. Ob sie verbindlich sind, hängt vom jeweiligen rechtlichen oder vertraglichen Kontext ab.","hint":"Ob sie verbindlich sind, hängt vom jeweiligen rechtlichen oder vertraglichen Kontext ab.","originalChapter":25},{"id":"ch25-extra-07","chapter":26,"question":"Welche Quelle hilft bei produktspezifischen Sicherheitslücken?","options":["Offizielle Sicherheitsmeldungen des Herstellers mit betroffenen Versionen","Nur Produktwerbung","Nur ein beliebiger Screenshot","Nur die Downloadzahl"],"correct":0,"explanation":"Herstellerhinweise benennen häufig betroffene und korrigierte Versionen. Die eigene Exposition muss zusätzlich bewertet werden.","hint":"Die eigene Exposition muss zusätzlich bewertet werden.","originalChapter":25},{"id":"ch25-extra-08","chapter":4,"question":"Warum sollte eine KI-generierte Fachantwort überprüft werden?","options":["Weil sie grundsätzlich niemals richtige Aussagen enthält","Weil sie plausible, aber falsche oder veraltete Aussagen enthalten kann","Weil Quellen dadurch verboten werden","Weil formale Sprache jede Aussage beweist"],"correct":1,"explanation":"Plausibilität ist kein Nachweis. Kritische Aussagen müssen mit passenden Primärquellen und dem konkreten Kontext verglichen werden.","hint":"Kritische Aussagen müssen mit passenden Primärquellen und dem konkreten Kontext verglichen werden.","originalChapter":25},{"id":"ch25-extra-09","chapter":1,"question":"Welche Quelle beschreibt den gesetzlichen Rahmen der schriftlichen SEFPrV-Prüfung?","options":["Eine beliebige Quiz-Auswertung","Ein Cloud-Preisblatt","§ 6 der SEFPrV","Ein Betriebssystemhandbuch"],"correct":2,"explanation":"§ 6 beschreibt die situationsbezogene schriftliche Prüfung. Eine Quiz-Simulation dient dem Lernen und bildet nicht automatisch die offizielle Prüfung ab.","hint":"Eine Quiz-Simulation dient dem Lernen und bildet nicht automatisch die offizielle Prüfung ab.","originalChapter":25},{"id":"ch25-extra-10","chapter":1,"question":"Wo wird der Rahmen von Präsentation und Fachgespräch für diesen Abschluss beschrieben?","options":["Nur in einem Git-Commit","Im HTTP-Standard","In einer beliebigen Lizenzdatei","§ 7 der SEFPrV"],"correct":3,"explanation":"§ 7 regelt die mündliche Prüfung. Organisatorische Hinweise der zuständigen Stelle ergänzen die Vorbereitung.","hint":"Organisatorische Hinweise der zuständigen Stelle ergänzen die Vorbereitung.","originalChapter":25},{"id":"ch25-extra-11","chapter":30,"question":"Warum sollte eine Quellenliste auch spätere Überprüfung ermöglichen?","options":["Damit Aussagen bei geänderten Regeln oder Versionen aktualisiert werden können","Damit Inhalte nie wieder geprüft werden","Damit jede Quelle dauerhaft unverändert bleibt","Damit Entscheidungen ohne Kontext gelten"],"correct":0,"explanation":"Nachvollziehbare Fundstellen und Stände erleichtern Pflege. Das ist bei Recht, Sicherheit und Softwareversionen besonders wichtig.","hint":"Das ist bei Recht, Sicherheit und Softwareversionen besonders wichtig.","originalChapter":25},{"id":"course-1-1-01","chapter":2,"question":"Welche Übung prüft aktiven Wissensabruf besonders gut?","options":["Den Absatz mehrfach markieren","Nur die Überschrift anschauen","Die Lösung sofort neben der Frage lesen","Nach dem Lesen den Text schließen und den Zusammenhang frei erklären"],"correct":3,"explanation":"Freie Erklärung zeigt, was ohne Vorlage abrufbar ist. Anschließend hilft der Vergleich, Lücken zu erkennen.","hint":"Anschließend hilft der Vergleich, Lücken zu erkennen."},{"id":"course-1-1-02","chapter":2,"question":"Warum sind mehrere zeitlich verteilte Wiederholungen sinnvoll?","options":["Sie bieten wiederholt Gelegenheit, Wissen erneut abzurufen","Sie garantieren ohne Übung vollständiges Verständnis","Sie ersetzen jede Anwendung","Sie funktionieren nur für Programmiersyntax"],"correct":0,"explanation":"Wiederholter Abruf unterstützt langfristiges Behalten. Der Rhythmus sollte an Schwierigkeit und Fehler angepasst werden.","hint":"Der Rhythmus sollte an Schwierigkeit und Fehler angepasst werden."},{"id":"course-1-1-03","chapter":2,"question":"Du kennst die Definition von RPO, verwechselst sie aber im Fall mit RTO. Was hilft?","options":["Nur die Abkürzungen größer schreiben","Beide anhand desselben Störfalls vergleichen und eigene Beispiele lösen","Ein anderes Hintergrundbild wählen","Die Begriffe nie mehr gemeinsam betrachten"],"correct":1,"explanation":"Der direkte Vergleich klärt unterschiedliche Bedeutungen. Ein eigener Fall prüft, ob die Unterscheidung wirklich verstanden wurde.","hint":"Ein eigener Fall prüft, ob die Unterscheidung wirklich verstanden wurde."},{"id":"course-1-1-04","chapter":2,"question":"Welche Lernkarte fördert fachliche Anwendung?","options":["„Welche Farbe hat unser Server?“","„Wie lang ist der Kapitelname?“","„Wann reicht ein vorhandenes Backup nicht aus? Begründe am Fall.“","„Welches Wort steht an fünfter Stelle?“"],"correct":2,"explanation":"Die Karte fordert Zusammenhang und Begründung. Lernkarten können damit mehr trainieren als bloße Worterkennung.","hint":"Lernkarten können damit mehr trainieren als bloße Worterkennung."},{"id":"course-1-1-05","chapter":2,"question":"Was ist ein sinnvoller Umgang mit einer falsch gelösten Frage?","options":["Nur die richtige Buchstabenposition merken","Die Frage dauerhaft meiden","Den Punktestand ohne Lernen ändern","Fehlerursache notieren und den Zusammenhang später erneut ohne Vorlage lösen"],"correct":3,"explanation":"Die Fehlerursache zeigt, was nachzuarbeiten ist. Der erneute Abruf prüft die Verbesserung unabhängig von der Antwortposition.","hint":"Der erneute Abruf prüft die Verbesserung unabhängig von der Antwortposition."},{"id":"course-1-1-06","chapter":2,"question":"Was bedeutet Transfer beim Lernen?","options":["Wissen auf eine veränderte Situation anwenden","Eine Datei auf einen Server kopieren","Den Lerntext wortgleich abschreiben","Eine bekannte Antwort nur wiedererkennen"],"correct":0,"explanation":"Transfer verlangt, Prinzipien auch bei neuen Rahmenbedingungen zu nutzen. Deshalb sind Fallvarianten wichtig.","hint":"Deshalb sind Fallvarianten wichtig."},{"id":"course-1-1-07","chapter":2,"question":"Welches Lernziel ist überprüfbar?","options":["„Ich lese irgendwann Datenbanken.“","„Ich kann ein 1:n-Datenmodell zeichnen und die Schlüssel erklären.“","„Ich mag das Thema.“","„Ich öffne fünf Dateien.“"],"correct":1,"explanation":"Ein überprüfbares Ziel nennt ein beobachtbares Ergebnis. Reine Aktivität ist noch kein Nachweis von Können.","hint":"Reine Aktivität ist noch kein Nachweis von Können."},{"id":"course-1-1-08","chapter":2,"question":"Warum solltest du einen Begriff in eigenen Worten erklären?","options":["Um die technische Bedeutung beliebig zu ändern","Um Quellen immer zu ersetzen","Um Verständnis und Zusammenhänge sichtbar zu machen","Um formale Regeln zu ignorieren"],"correct":2,"explanation":"Eigene Formulierungen prüfen Verständnis, müssen aber fachlich korrekt bleiben. Ein Beispiel hilft, unklare Begriffe aufzudecken.","hint":"Ein Beispiel hilft, unklare Begriffe aufzudecken."},{"id":"course-1-1-09","chapter":2,"question":"Eine Lernsitzung endet mit einer kurzen freien Zusammenfassung. Welchen Nutzen hat sie?","options":["Sie beweist automatisch vollständige Prüfungsreife","Sie macht spätere Wiederholung unnötig","Sie ersetzt alle Übungsaufgaben","Sie zeigt zentrale Erkenntnisse und noch offene Lücken"],"correct":3,"explanation":"Eine freie Zusammenfassung ist ein schneller Selbstcheck. Schwierige Punkte fließen in die nächste Wiederholung ein.","hint":"Schwierige Punkte fließen in die nächste Wiederholung ein."},{"id":"course-1-1-10","chapter":2,"question":"Wie sollte eine persönliche Wiederholungsplanung auf wiederholte Fehler reagieren?","options":["Schwierige Inhalte früher erneut abrufen und die Ursache klären","Alle Inhalte unabhängig vom Ergebnis gleich behandeln","Das Thema aus dem Lehrgang entfernen","Nur die bereits leichten Fragen wiederholen"],"correct":0,"explanation":"Eine angepasste Planung konzentriert Übung auf die tatsächlichen Lücken. Ohne Ursachenklärung kann derselbe Fehler bestehen bleiben.","hint":"Ohne Ursachenklärung kann derselbe Fehler bestehen bleiben."},{"id":"course-1-2-01","chapter":3,"question":"Was macht einen Wochenlernplan realistisch?","options":["Verfügbare konzentrierte Zeit, konkrete Ergebnisse und Puffer berücksichtigen","Jede freie Minute als gleich produktiv annehmen","Pausen grundsätzlich verbieten","Nur den Umfang der Bücher zählen"],"correct":0,"explanation":"Kalenderzeit und produktive Lernzeit unterscheiden sich. Puffer ermöglichen den Umgang mit Verzögerungen.","hint":"Puffer ermöglichen den Umgang mit Verzögerungen."},{"id":"course-1-2-02","chapter":3,"question":"Wie lässt sich Gruppenarbeit vor dem Start sinnvoll strukturieren?","options":["Nur Aufgaben ohne gemeinsamen Zusammenhang verteilen","Ziel, Rollen, Zeitrahmen und Ergebnis gemeinsam festlegen","Ergebnisse erst beim Vortrag erstmals zusammenführen","Alle Entscheidungen ausschließlich vertagen"],"correct":1,"explanation":"Gemeinsame Struktur verhindert doppelte und widersprüchliche Beiträge. Eine Endkontrolle verbindet die Teilstücke.","hint":"Eine Endkontrolle verbindet die Teilstücke."},{"id":"course-1-2-03","chapter":3,"question":"Welche Aufgabe hat eine Moderation in einer Lerngruppe?","options":["Jede fachliche Entscheidung allein treffen","Nur die längsten Beiträge belohnen","Die Diskussion am Ziel halten und Beteiligung ermöglichen","Abweichende Sichtweisen grundsätzlich unterbrechen"],"correct":2,"explanation":"Moderation unterstützt den gemeinsamen Arbeitsprozess. Sachliche Entscheidungen brauchen weiterhin Kriterien und Fachbeiträge.","hint":"Sachliche Entscheidungen brauchen weiterhin Kriterien und Fachbeiträge."},{"id":"course-1-2-04","chapter":3,"question":"Ein Vortrag überschreitet ständig die Übungszeit. Was hilft?","options":["Nur die Schrift verkleinern","Noch mehr Details ergänzen","Den Zeitrahmen ohne Rücksprache ignorieren","Laut mit Zeitmessung üben und auf Kernargumente kürzen"],"correct":3,"explanation":"Lautes Üben zeigt tatsächliche Dauer und unklare Übergänge. Kürzen soll die Argumentation erhalten, nicht nur Sprechtempo erhöhen.","hint":"Kürzen soll die Argumentation erhalten, nicht nur Sprechtempo erhöhen."},{"id":"course-1-2-05","chapter":3,"question":"Welche Folie unterstützt einen Architekturvergleich?","options":["Ein übersichtlicher Vergleich mit relevanten Kriterien und Schlussfolgerung","Ein Screenshot von 200 unlesbaren Zeilen","Eine reine Logoansammlung","Ein vollständiger Gesetzestext ohne Einordnung"],"correct":0,"explanation":"Eine Folie soll die gesprochene Argumentation unterstützen. Lesbare Kriterien machen die Entscheidung nachvollziehbar.","hint":"Lesbare Kriterien machen die Entscheidung nachvollziehbar."},{"id":"course-1-2-06","chapter":3,"question":"Was ist ein geeigneter Umgang mit einer stockenden Gruppenaufgabe?","options":["Den Fortschritt ohne Prüfung als fertig markieren","Blockade benennen, Unterstützung organisieren und den Plan gemeinsam anpassen","Die Blockade bis zum Termin verschweigen","Andere Teilaufgaben automatisch löschen"],"correct":1,"explanation":"Frühe Transparenz ermöglicht Gegenmaßnahmen. Verschweigen nimmt der Gruppe Handlungsspielraum.","hint":"Verschweigen nimmt der Gruppe Handlungsspielraum."},{"id":"course-1-2-07","chapter":3,"question":"Welche Rückmeldung zu einem Vortrag ist besonders hilfreich?","options":["„Alles ist schlecht.“","„Du solltest einfach moderner wirken.“","„Der Entscheidung fehlen noch Kriterien zu Betrieb und Integration.“","„Die Schriftfarbe entscheidet über die fachliche Qualität.“"],"correct":2,"explanation":"Konkrete Rückmeldung benennt einen bearbeitbaren Punkt. Persönliche oder vage Werturteile helfen wenig.","hint":"Persönliche oder vage Werturteile helfen wenig."},{"id":"course-1-2-08","chapter":3,"question":"Warum sollte eine Gruppenpräsentation gemeinsam durchgegangen werden?","options":["Um individuelle Vorbereitung vollständig zu ersetzen","Um jede Rückfrage auszuschließen","Um lediglich die Dateigröße zu messen","Um Begriffe, Übergänge und Widersprüche zwischen Beiträgen zu prüfen"],"correct":3,"explanation":"Die Qualität des Ganzen entsteht nicht automatisch aus guten Einzelteilen. Ein gemeinsamer Probelauf prüft den roten Faden.","hint":"Ein gemeinsamer Probelauf prüft den roten Faden."},{"id":"course-1-2-09","chapter":3,"question":"Du hast zwei Lernstunden, aber fünf große Themen. Was ist sinnvoll?","options":["Ein Ergebnis priorisieren und die übrigen Themen bewusst später einplanen","Alle Themen in zwei Minuten vollständig beherrschen wollen","Nur die leichteste Überschrift lesen","Den Lernplan ersatzlos streichen"],"correct":0,"explanation":"Priorisierung ermöglicht eine sinnvolle Tiefe. Kleine überprüfbare Ergebnisse sind besser steuerbar als unrealistischer Gesamtumfang.","hint":"Kleine überprüfbare Ergebnisse sind besser steuerbar als unrealistischer Gesamtumfang."},{"id":"course-1-2-10","chapter":3,"question":"Was gehört zu einer nachvollziehbaren Fachpräsentation am Ende?","options":["Nur eine Wiederholung aller Werkzeugnamen","Ergebnis, Grenzen und sinnvolle nächste Schritte","Neue unbelegte Zahlen","Die vollständige Ausblendung offener Probleme"],"correct":1,"explanation":"Das Ende zeigt, was nachgewiesen wurde und was offen bleibt. Diese Reflexion unterstützt auch Rückfragen.","hint":"Diese Reflexion unterstützt auch Rückfragen."},{"id":"course-1-3-01","chapter":4,"question":"Welches Lernmedium passt besonders zur Erklärung von Objektbeziehungen?","options":["Nur eine Audiodatei mit Dateinamen","Ein beschriftetes Daten- oder Klassendiagramm mit Erläuterung","Ein unkommentiertes Produktlogo","Eine reine Liste von Passwörtern"],"correct":1,"explanation":"Ein Diagramm macht Beziehungen räumlich sichtbar. Bedeutung und Kardinalitäten müssen trotzdem erklärt werden.","hint":"Bedeutung und Kardinalitäten müssen trotzdem erklärt werden."},{"id":"course-1-3-02","chapter":4,"question":"Du hast eine Frage richtig geraten. Was ist eine gute Konsequenz?","options":["Den Begriff als sicher beherrscht abhaken","Nur die Position der Antwort speichern","Die Begründung lernen und später erneut ohne Lösung prüfen","Die Erklärung grundsätzlich überspringen"],"correct":2,"explanation":"Ein richtiger Treffer kann zufällig sein. Eine freie Begründung prüft das dahinterliegende Verständnis.","hint":"Eine freie Begründung prüft das dahinterliegende Verständnis."},{"id":"course-1-3-03","chapter":4,"question":"Was soll ein Selbstcheck zusätzlich zum Punktestand erfassen?","options":["Nur die Farbe richtig markierter Antworten","Nur die Länge der Erklärung","Nur die Anzahl geöffneter Seiten","Welche Begriffe und Entscheidungen noch unsicher begründet werden"],"correct":3,"explanation":"Unsicherheit und Begründungsfähigkeit zeigen weiteren Lernbedarf. Der Punktestand allein kann Lücken verdecken.","hint":"Der Punktestand allein kann Lücken verdecken."},{"id":"course-1-3-04","chapter":4,"question":"Eine Lernquelle beschreibt eine andere Datenbankversion. Wie gehst du vor?","options":["Aussagen mit der offiziellen Dokumentation der verwendeten Version abgleichen","Alle Aussagen ungeprüft übernehmen","Die Versionsangabe entfernen","Die Quelle allein wegen ihrer Länge wählen"],"correct":0,"explanation":"Versionen können Verhalten verändern. Ein passender Bezug verhindert unzutreffende Übertragung.","hint":"Ein passender Bezug verhindert unzutreffende Übertragung."},{"id":"course-1-3-05","chapter":4,"question":"Welche Fehlerliste ist didaktisch nützlich?","options":["Nur falsche Buchstabenpositionen","Fehler, Ursache, eigene korrekte Erklärung und Wiederholungstermin","Nur die Anzahl der Fehler ohne Themen","Nur die Namen anderer Lernender"],"correct":1,"explanation":"Die Liste verbindet Diagnose und Maßnahme. So kann der nächste Lernplan gezielt gestaltet werden.","hint":"So kann der nächste Lernplan gezielt gestaltet werden."},{"id":"course-1-3-06","chapter":4,"question":"Wie ergänzt du ein Erklärvideo sinnvoll?","options":["Das Video nur im Hintergrund wiederholen","Den Titel auswendig lernen","Danach eine Aufgabe selbst lösen und das Ergebnis prüfen","Die Lösung während jeder Antwort ablesen"],"correct":2,"explanation":"Eigenständige Anwendung zeigt, ob die Erklärung verstanden wurde. Konsum allein belegt das nicht.","hint":"Konsum allein belegt das nicht."},{"id":"course-1-3-07","chapter":4,"question":"Warum sollten Quiztraining und offene Aufgaben kombiniert werden?","options":["Weil Quizfragen nie nützlich sind","Weil offene Aufgaben keine Fachkenntnis brauchen","Weil beide nur die Lesegeschwindigkeit messen","Weil Auswahl und freie Argumentation unterschiedliche Anforderungen stellen"],"correct":3,"explanation":"Quizfragen liefern gezieltes Feedback; offene Aufgaben trainieren Aufbau und Begründung. Beide ergänzen sich.","hint":"Beide ergänzen sich."},{"id":"course-1-3-08","chapter":4,"question":"Was bedeutet eine scheinbar sichere falsche Antwort im Selbstcheck?","options":["Ein mögliches Missverständnis muss gezielt überprüft werden","Dass die Prüfung grundsätzlich unfair ist","Dass Wiederholung unnötig ist","Dass alle übrigen Antworten falsch sein müssen"],"correct":0,"explanation":"Hohe Sicherheit bei falschem Ergebnis zeigt eine besonders wichtige Lücke. Die zugrunde liegende Annahme sollte geklärt werden.","hint":"Die zugrunde liegende Annahme sollte geklärt werden."},{"id":"course-1-3-09","chapter":4,"question":"Wie prüfst du ein Datenmodell ohne Vorlage?","options":["Nur den Screenshot wiedererkennen","Es neu zeichnen und Beziehungen anhand eines veränderten Falls erläutern","Nur die Dateiendung nennen","Die Lösung unverändert kopieren"],"correct":1,"explanation":"Freies Modellieren prüft Wissen und Transfer. Der veränderte Fall macht starres Auswendiglernen sichtbar.","hint":"Der veränderte Fall macht starres Auswendiglernen sichtbar."},{"id":"course-1-3-10","chapter":4,"question":"Welche Aussage über Lernmedien ist angemessen?","options":["Ein einziges Medium ist für jede Aufgabe optimal","Mehr geöffnete Medien beweisen immer mehr Können","Das Medium soll zum Lernziel und zur Aufgabe passen","Videos ersetzen alle eigenen Übungen"],"correct":2,"explanation":"Unterschiedliche Aufgaben benötigen unterschiedliche Darstellungen und Aktivitäten. Entscheidend ist die nachgewiesene Fähigkeit.","hint":"Entscheidend ist die nachgewiesene Fähigkeit."},{"id":"course-2-0-01","chapter":5,"question":"Was ist über den Fall „Mittelland Logistik“ in dieser App zutreffend?","options":["Die Zahlen sind nachgewiesene Originaldaten des Bildungsträgers","Jede Annahme ist eine gesetzliche Vorgabe","Die konkreten Falldaten sind eine eigene gekennzeichnete Übungsannahme","Die Fallstudie ersetzt sämtliche echten Kursunterlagen"],"correct":2,"explanation":"Der Name stammt aus der Kursübersicht; der ausgearbeitete Fall ist eigenes Lernmaterial. Seine Annahmen dürfen nicht als belegte Unternehmensdaten behandelt werden.","hint":"Seine Annahmen dürfen nicht als belegte Unternehmensdaten behandelt werden."},{"id":"course-2-0-02","chapter":5,"question":"Warum bleibt im Übungsfall die vorhandene Warenwirtschaft wichtig?","options":["Sie kann ohne Untersuchung sofort gelöscht werden","Sie verhindert jede Digitalisierung","Sie ist nur wegen ihres Namens relevant","Sie muss mit dem neuen Portal in einer abgestimmten Systemlandschaft zusammenarbeiten"],"correct":3,"explanation":"Bestehende Systeme besitzen Daten und Verantwortung. Integration und führende Datenquellen müssen bewusst geklärt werden.","hint":"Integration und führende Datenquellen müssen bewusst geklärt werden."},{"id":"course-2-0-03","chapter":5,"question":"Ein Fahrer verliert während einer Statusmeldung die Verbindung. Welche Fachfrage ist wichtig?","options":["Wie die Meldung später zuverlässig und ohne widersprüchliche Mehrfachwirkung übernommen wird","Welche Hintergrundfarbe das Telefon hat","Ob sämtliche Servernamen gleich lang sind","Ob Papier grundsätzlich verboten ist"],"correct":0,"explanation":"Fehlendes Netz beeinflusst Prozess und Synchronisation. Der Ausgang einer Anfrage kann unklar sein und braucht definierte Behandlung.","hint":"Der Ausgang einer Anfrage kann unklar sein und braucht definierte Behandlung."},{"id":"course-2-0-04","chapter":5,"question":"Warum werden Disposition, Lager und Kunden getrennt betrachtet?","options":["Weil jede Rolle zwingend ein eigenes Gesamtsystem braucht","Ihre Aufgaben, Sichten und Rechte können unterschiedlich sein","Weil gemeinsame Daten nie möglich sind","Weil alle dieselben Funktionen ohne Rechte benötigen"],"correct":1,"explanation":"Ein gemeinsamer Auftrag kann verschiedene Nutzungssituationen haben. Das ist für Oberfläche, Berechtigungen und Anforderungen relevant.","hint":"Das ist für Oberfläche, Berechtigungen und Anforderungen relevant."},{"id":"course-2-0-05","chapter":5,"question":"Ein Kunde wünscht eine Offline-App. Was sollte zuerst geklärt werden?","options":["Welche Programmiersprache am beliebtesten ist","Welche App das schönste Symbol besitzt","Welche Tätigkeiten bei fehlender Verbindung tatsächlich möglich sein müssen","Ob sofort alle Daten lokal kopiert werden"],"correct":2,"explanation":"Der Lösungswunsch muss auf seinen Bedarf zurückgeführt werden. Daraus folgen Umfang und Risiken der Offline-Funktion.","hint":"Daraus folgen Umfang und Risiken der Offline-Funktion."},{"id":"course-2-1-01","chapter":6,"question":"Welche Frage ermittelt den Bedarf hinter einer Live-Karte besonders gut?","options":["Welche Kartenfarbe bevorzugt der Entwickler?","Wie viele Animationen sind möglich?","Welches Framework ist derzeit bekannt?","Welche Entscheidung soll mit welchen Standortinformationen unterstützt werden?"],"correct":3,"explanation":"Bedarf entsteht aus Aufgaben und Entscheidungen. Erst danach lässt sich notwendige Genauigkeit und Aktualität bestimmen.","hint":"Erst danach lässt sich notwendige Genauigkeit und Aktualität bestimmen."},{"id":"course-2-1-02","chapter":6,"question":"Warum gehört der IT-Betrieb zu den Stakeholdern?","options":["Weil er Anforderungen an Überwachung, Wartung und Wiederherstellung beitragen kann","Weil ausschließlich er alle Fachziele festlegt","Weil er niemals von Änderungen betroffen ist","Weil er nur Produktwerbung bewertet"],"correct":0,"explanation":"Betriebserfordernisse beeinflussen langfristige Nutzbarkeit. Werden sie spät berücksichtigt, entstehen vermeidbare Einführungslücken.","hint":"Werden sie spät berücksichtigt, entstehen vermeidbare Einführungslücken."},{"id":"course-2-1-03","chapter":6,"question":"Was macht eine Persona in der Anforderungsanalyse hilfreich?","options":["Sie ersetzt alle Gespräche durch beliebige Fantasie","Sie fasst belegte typische Aufgaben und Nutzungssituationen einer Zielgruppe zusammen","Sie dokumentiert ausschließlich Privatdaten","Sie ist immer ein vollständiger tatsächlicher Kunde"],"correct":1,"explanation":"Personas strukturieren Erkenntnisse, sollten aber nicht auf Klischees beruhen. Sie ersetzen keine Überprüfung des echten Bedarfs.","hint":"Sie ersetzen keine Überprüfung des echten Bedarfs."},{"id":"course-2-1-04","chapter":6,"question":"Ein Portal entlastet Kunden, erzeugt aber Nacharbeit im Lager. Was folgt?","options":["Der Kundennutzen macht jede interne Folge irrelevant","Das Projekt ist zwingend sofort abzubrechen","Der Nutzen muss über den gesamten betroffenen Ablauf bewertet werden","Nur die Oberfläche braucht eine andere Farbe"],"correct":2,"explanation":"Eine lokale Verbesserung kann Belastung verschieben. Mehrere Zielgruppen und Schnittstellen müssen gemeinsam betrachtet werden.","hint":"Mehrere Zielgruppen und Schnittstellen müssen gemeinsam betrachtet werden."},{"id":"course-2-1-05","chapter":6,"question":"Welche Formulierung beschreibt zunächst ein Ziel statt einer festen Lösung?","options":["Alle Komponenten müssen ohne Bedarf in einer bestimmten Cloud laufen","Jede Maske muss genau zehn Buttons haben","Alle Tabellen müssen zu einer einzigen zusammengeführt werden","Kunden sollen den aktuellen Stand ihres Auftrags selbst abrufen können"],"correct":3,"explanation":"Das Ziel beschreibt den gewünschten Nutzen. Die Umsetzung kann danach anhand von Randbedingungen gewählt werden.","hint":"Die Umsetzung kann danach anhand von Randbedingungen gewählt werden."},{"id":"course-2-2-01","chapter":7,"question":"Welche Ermittlungsmethode zeigt besonders informelle Arbeitsschritte?","options":["Beobachtung tatsächlicher Arbeitsabläufe","Nur eine Standardproduktbroschüre lesen","Nur den späteren Code zählen","Nur die Servergröße messen"],"correct":0,"explanation":"Beobachtung kann Workarounds und Abweichungen aufdecken. Gespräche helfen anschließend, deren Gründe zu verstehen.","hint":"Gespräche helfen anschließend, deren Gründe zu verstehen."},{"id":"course-2-2-02","chapter":7,"question":"Wann passt ein gemeinsamer Anforderungsworkshop besonders?","options":["Wenn keinerlei Abstimmung gewünscht ist","Wenn mehrere Rollen widersprüchliche Abläufe und Zuständigkeiten klären müssen","Wenn nur eine bereits feststehende Dateiendung gesucht wird","Wenn ausschließlich ein Prozessorbenchmark benötigt wird"],"correct":1,"explanation":"Ein Workshop bringt betroffene Perspektiven zusammen. Er braucht ein Ziel, Moderation und dokumentierte Ergebnisse.","hint":"Er braucht ein Ziel, Moderation und dokumentierte Ergebnisse."},{"id":"course-2-2-03","chapter":7,"question":"Was ist nach einem Interview wichtig?","options":["Alle Interpretationen ungeprüft als Fakten ausgeben","Sofort jede Äußerung ohne Prüfung programmieren","Die Zusammenfassung rückbestätigen und offene Punkte kennzeichnen","Die Herkunft der Aussagen entfernen"],"correct":2,"explanation":"Rückbestätigung deckt Missverständnisse auf. Offene Fragen bleiben dadurch bewusst nachverfolgbar.","hint":"Offene Fragen bleiben dadurch bewusst nachverfolgbar."},{"id":"course-2-2-04","chapter":7,"question":"Welche Nachfrage macht einen Standardablauf vollständiger?","options":["Welche Schriftart steht in der Broschüre?","Wer besitzt die neueste Tastatur?","Wie klingt der Produktname?","Was passiert bei Storno, fehlenden Daten oder gleichzeitigen Änderungen?"],"correct":3,"explanation":"Ausnahmen können wichtige Fach- und Qualitätsanforderungen liefern. Nur der fehlerfreie Standardfall ist häufig unzureichend.","hint":"Nur der fehlerfreie Standardfall ist häufig unzureichend."},{"id":"course-2-2-05","chapter":7,"question":"Warum sollten Aussagen und Interpretationen getrennt dokumentiert werden?","options":["Damit erkennbar bleibt, was beobachtet wurde und was noch geprüft werden muss","Damit jede Aussage automatisch falsch wird","Damit Quellen nie mehr benötigt werden","Damit Anforderungen beliebig geändert werden können"],"correct":0,"explanation":"Die Trennung macht Unsicherheit sichtbar. Eine Interpretation kann sinnvoll sein, braucht aber passenden Nachweis.","hint":"Eine Interpretation kann sinnvoll sein, braucht aber passenden Nachweis."},{"id":"course-2-5-01","chapter":10,"question":"Was ist eine typische zusätzliche Prüfung bei Standardsoftware?","options":["Nur die Produktfarbe vergleichen","Nur die Werbeaussage wiederholen","Alle Abnahmekriterien streichen","Ob die benötigte Schnittstelle tatsächlich fachlich und technisch passt"],"correct":3,"explanation":"Funktionslisten beweisen noch keine passende Integration. Eine konkrete Probe kann entscheidende Lücken aufdecken.","hint":"Eine konkrete Probe kann entscheidende Lücken aufdecken."},{"id":"course-2-5-02","chapter":10,"question":"Welche Kosten gehören zu einer Make-or-Buy-Abwägung?","options":["Auch Integration, Schulung, Betrieb, Wartung und späterer Wechsel","Nur die erste Lizenzzahlung","Nur der Preis des Entwicklerlaptops","Nur das Design des Logos"],"correct":0,"explanation":"Der Lebenszyklus enthält wesentliche Folgekosten. Eine niedrige Anschaffung kann langfristig teurer sein.","hint":"Eine niedrige Anschaffung kann langfristig teurer sein."},{"id":"course-2-5-03","chapter":10,"question":"Welche Form hat eine prüfbare Innovationshypothese?","options":["Die neue Lösung ist modern, also immer besser","Die neue Lösung soll unter definierten Bedingungen eine messbare Verbesserung erzielen","Mehr Technik erzeugt automatisch mehr Nutzen","Jeder Trend muss sofort produktiv werden"],"correct":1,"explanation":"Eine Hypothese nennt Bedingungen und erwartete Wirkung. Ein begrenzter Versuch liefert dann belastbares Feedback.","hint":"Ein begrenzter Versuch liefert dann belastbares Feedback."},{"id":"course-2-5-04","chapter":10,"question":"Was belegt ein erfolgreicher technischer Proof of Concept?","options":["Sämtliche Produktionsqualität ohne weitere Prüfung","Die vollständige Erfüllung aller Lizenzpflichten","Die untersuchte technische Machbarkeit unter den getesteten Bedingungen","Garantierte Wirtschaftlichkeit über zehn Jahre"],"correct":2,"explanation":"Ein PoC beantwortet eine begrenzte Frage. Sicherheit, Wartbarkeit und Betrieb brauchen zusätzliche Bewertung.","hint":"Sicherheit, Wartbarkeit und Betrieb brauchen zusätzliche Bewertung."},{"id":"course-2-5-05","chapter":10,"question":"Welche Information begrenzt Anbieterabhängigkeit?","options":["Nur ein langjähriges Markenlogo","Nur die Anzahl der Werbevideos","Das grundsätzliche Verbot jeder Dokumentation","Nachvollziehbare Exportmöglichkeiten, Schnittstellen und Ausstiegsbedingungen"],"correct":3,"explanation":"Ein späterer Wechsel hängt von technischen und vertraglichen Bedingungen ab. Diese sollten vor der Auswahl geprüft werden.","hint":"Diese sollten vor der Auswahl geprüft werden."},{"id":"course-2-6-01","chapter":11,"question":"Was ist arc42 hauptsächlich?","options":["Eine Strukturvorlage für Architekturdokumentation","Eine verpflichtende Programmiersprache","Eine fertige automatische Systemarchitektur","Ein Lasttestwerkzeug"],"correct":0,"explanation":"arc42 hilft, relevante Architekturinformationen zu ordnen. Die konkrete Architektur und ihre Entscheidungen müssen weiterhin erarbeitet werden.","hint":"Die konkrete Architektur und ihre Entscheidungen müssen weiterhin erarbeitet werden."},{"id":"course-2-6-02","chapter":11,"question":"Welche Frage beantwortet eine Kontextsicht besonders?","options":["Welche lokalen Variablennamen verwendet werden","Welche externen Beteiligten und Systeme mit dem betrachteten System interagieren","Wie viele Zeilen jede Funktion hat","Welche Farbe alle Server haben"],"correct":1,"explanation":"Die Kontextsicht zeigt Grenze und Umgebung. Sie erklärt nicht automatisch alle internen Komponenten.","hint":"Sie erklärt nicht automatisch alle internen Komponenten."},{"id":"course-2-6-03","chapter":11,"question":"Was zeigt eine Bausteinsicht?","options":["Nur einen einzelnen Benutzerklick über die Zeit","Nur den Rechnungsbetrag","Die interne Struktur und Verantwortlichkeiten wichtiger Komponenten","Nur einen Terminplan"],"correct":2,"explanation":"Die Bausteinsicht beschreibt die statische Struktur. Laufzeitabläufe und Infrastruktur benötigen ergänzende Sichten.","hint":"Laufzeitabläufe und Infrastruktur benötigen ergänzende Sichten."},{"id":"course-2-6-04","chapter":11,"question":"Welche Sicht hilft, einen konkreten Auftragsablauf zwischen Diensten zu erklären?","options":["Nur eine alphabetische Liste der Entwickler","Nur ein Glossar","Nur die Tabelle der Lizenzkosten","Eine Laufzeitsicht mit dem Zusammenspiel im Szenario"],"correct":3,"explanation":"Eine Laufzeitsicht zeigt Interaktionen im konkreten Fall. Sie ergänzt die statische Komponentenstruktur.","hint":"Sie ergänzt die statische Komponentenstruktur."},{"id":"course-2-6-05","chapter":11,"question":"Was gehört zur Verteilungssicht einer Architektur?","options":["Welche Softwareteile auf welcher Infrastruktur laufen und verbunden sind","Nur die fachlichen Kundennamen","Nur eine Sammlung von User Stories","Nur die Reihenfolge der Kapitel"],"correct":0,"explanation":"Die Verteilungssicht unterstützt Planung von Betrieb und Verfügbarkeit. Sie zeigt nicht allein den fachlichen Datenfluss.","hint":"Sie zeigt nicht allein den fachlichen Datenfluss."},{"id":"course-2-6-06","chapter":11,"question":"Was ist bei einer IST-Aufnahme als Erstes wichtig?","options":["Nur die gewünschte Zukunftslösung dokumentieren","Vorhandene Systeme, Schnittstellen und Verantwortlichkeiten mit nachvollziehbaren Quellen erfassen","Alle alten Systeme ohne Untersuchung löschen","Jede Vermutung als bewiesenen Fakt darstellen"],"correct":1,"explanation":"Eine belastbare Ausgangslage braucht Evidenz. Soll-Vorstellungen dürfen die tatsächliche Struktur nicht verdecken.","hint":"Soll-Vorstellungen dürfen die tatsächliche Struktur nicht verdecken."},{"id":"course-2-6-07","chapter":11,"question":"Warum werden Qualitätsanforderungen als Szenarien konkretisiert?","options":["Damit alle Zahlen vermieden werden","Damit jeder Diagrammtyp entfällt","Damit erwartetes Verhalten unter bestimmten Bedingungen prüfbar wird","Damit Qualität nur eine Meinung bleibt"],"correct":2,"explanation":"Ein Szenario verbindet Situation und erwartete Reaktion. So kann ein allgemeines Ziel in eine überprüfbare Anforderung überführt werden.","hint":"So kann ein allgemeines Ziel in eine überprüfbare Anforderung überführt werden."},{"id":"course-2-6-08","chapter":11,"question":"Welche Information gehört zu dokumentierten technischen Schulden?","options":["Nur ein schöner Komponentenname","Nur die Anzahl aller Nutzer","Nur ein Screenshot ohne Erläuterung","Das Problem, seine Folgen und gegebenenfalls ein Umgang damit"],"correct":3,"explanation":"Technische Schuld beeinflusst spätere Änderungen und Risiken. Sichtbarkeit ermöglicht bewusste Priorisierung.","hint":"Sichtbarkeit ermöglicht bewusste Priorisierung."},{"id":"course-2-6-09","chapter":11,"question":"Warum sollte Architekturdokumentation einen Glossarbezug haben?","options":["Damit Begriffe wie Auftrag und Lieferung einheitlich verstanden werden","Damit sämtliche Diagramme automatisch korrekt sind","Damit keine Fachgespräche nötig sind","Damit Datenbankregeln ignoriert werden dürfen"],"correct":0,"explanation":"Unterschiedliche Begriffsbedeutungen erzeugen fachliche Missverständnisse. Ein Glossar schafft eine gemeinsame Grundlage.","hint":"Ein Glossar schafft eine gemeinsame Grundlage."},{"id":"course-2-6-10","chapter":11,"question":"Eine IST-Skizze enthält ungeprüfte Annahmen. Wie werden sie behandelt?","options":["Ohne Hinweis als endgültige Fakten speichern","Als Annahmen markieren und gezielt überprüfen","Alle Skizzen verwerfen","Den Zeitpunkt der Aufnahme verschweigen"],"correct":1,"explanation":"Eine Skizze kann trotz offener Punkte nützlich sein. Transparente Unsicherheit verhindert falsche Schlussfolgerungen.","hint":"Transparente Unsicherheit verhindert falsche Schlussfolgerungen."},{"id":"course-2-12-01","chapter":17,"question":"Welche Interviewfrage ist offen und bedarfsorientiert?","options":["Wollen Sie nicht unbedingt meine bevorzugte Cloud nutzen?","Sie brauchen doch zehn neue Buttons, richtig?","Wie bearbeiten Sie heute einen neuen Transportauftrag?","Ist mein fertiger Entwurf nicht bereits perfekt?"],"correct":2,"explanation":"Eine offene Frage lässt den Ablauf und Probleme sichtbar werden. Suggestivfragen lenken zu einer bereits bevorzugten Lösung.","hint":"Suggestivfragen lenken zu einer bereits bevorzugten Lösung."},{"id":"course-2-12-02","chapter":17,"question":"Was ist eine sinnvolle Nachfrage nach einer unklaren Aussage „Das passiert oft“?","options":["Welche Farbe hatte der Bildschirm?","Können wir die Aussage einfach weglassen?","Wollen wir ohne Prüfung die höchste Priorität vergeben?","Wie häufig trat es in einem konkreten Zeitraum auf und mit welchen Folgen?"],"correct":3,"explanation":"Häufigkeit und Wirkung helfen bei Bewertung. Unbestimmte Wörter müssen passend konkretisiert werden.","hint":"Unbestimmte Wörter müssen passend konkretisiert werden."},{"id":"course-2-12-03","chapter":17,"question":"Ein Interviewpartner fordert eine konkrete Technik. Was fragst du nach?","options":["Welches Problem und welches Ziel damit gelöst werden sollen","Nur wer die Technik beworben hat","Nur wie lang der Produktname ist","Ob jede alternative Lösung ver
