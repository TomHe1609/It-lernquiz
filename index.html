<script id="quizdata" type="application/json">{"chapters": [{"id": 1, "title": "Die Weiterbildung und die Prüfung verstehen", "lesson": "\n\n<section class=\"level3\" id=\"was-ist-das-berufsbild\">\n<h3>1.1 Was ist das Berufsbild?<\/h3>\n<p>Der Geprüfte Berufsspezialist für Softwareentwicklung ist ein\nanerkannter Fortbildungsabschluss auf der ersten Stufe der\nhöherqualifizierenden Berufsbildung. Das berufliche Ziel ist nicht\nbloßes Auswendiglernen technischer Begriffe. Man soll Softwarelösungen\nkundengerecht planen und entwickeln, ihre Implementation und Evaluation\nunter Qualitätsstandards sicherstellen und dabei organisatorische,\nrechtliche, nachhaltigkeitsbezogene sowie ethische Gesichtspunkte\nberücksichtigen. Die Verordnung nennt für den Kompetenzerwerb in der\nRegel einen Lernumfang von mindestens 400 Stunden. [Q1]<\/p>\n<p>Die acht offiziellen Qualifikationsschwerpunkte sind: (1) Analysieren\nund Planen der Softwarearchitekturen, (2) Entwickeln von\nSoftwarearchitekturen, (3) Sicherstellen der Produktqualität, (4)\nSoftware- und Anwenderdokumentationen erstellen, (5) Übergeben und\nEinführen von Systemen, (6) Evaluation als Basis kontinuierlicher\nVerbesserung durchführen, (7) Organisatorische und rechtliche Vorgaben\nsowie (8) Projektunterstützung und -koordination. Das Lernheft behandelt\nsie nach den Grundlagen in dieser Systematik. [Q1]<\/p>\n<\/section>\n<section class=\"level3\" id=\"wie-läuft-die-prüfung\">\n<h3>1.2 Wie läuft die Prüfung?<\/h3>\n<p>Die schriftliche Prüfung besteht nach § 6 SEFPrV aus zwei\nsituationsbezogenen Aufgaben unter Aufsicht. Jede hat mindestens 90\nMinuten Bearbeitungszeit; zusammen sollen 240 Minuten nicht\nüberschritten werden. Die mündliche Prüfung umfasst eine Präsentation\nvon höchstens 15 Minuten und ein unmittelbar anschließendes Fachgespräch\nvon höchstens 30 Minuten. Das Präsentationsthema ist selbst zu wählen\nund spätestens bis zur schriftlichen Prüfung zur Genehmigung\neinzureichen; nach der Genehmigung stehen 30 aufeinanderfolgende\nKalendertage zur Erstellung und Einreichung der Präsentationsunterlagen\nzur Verfügung. Einzelheiten und aktuelle organisatorische Fristen\nerfährst du bei der zuständigen IHK. [Q1]<\/p>\n<p>Zum Bestehen müssen in allen Prüfungsleistungen mindestens 50 Punkte\nohne Rundung erreicht werden. Präsentation und Fachgespräch werden in\nder mündlichen Prüfung mit einem Drittel beziehungsweise zwei Dritteln\ngewichtet. Eine bedingte mündliche Ergänzungsprüfung ist für bestimmte\nschriftliche Ergebnisse vorgesehen; deshalb frühzeitig die konkrete\nSituation mit der zuständigen IHK klären. [Q1]<\/p>\n<\/section>\n<section class=\"level3\" id=\"wie-sieht-eine-starke-fachantwort-aus\">\n<h3>1.3 Wie sieht eine starke Fachantwort aus?<\/h3>\n<p>Eine reine Fachwort-Antwort reicht bei komplexen Situationsaufgaben\nnicht aus. Nutze möglichst die Reihenfolge: <strong>Sachlage nennen →\nRisiko oder Ziel erklären → Lösungsoptionen vergleichen → Entscheidung\nbegründen → Umsetzung und Prüfung beschreiben<\/strong>. Beispiel: „Die\nderzeitige Datenbankmigration gefährdet den Rollback. Ich empfehle daher\nein No-Go, bis Kompatibilität und Restore getestet wurden. Danach\nentscheidet die verantwortliche Stelle anhand dokumentierter\nFreigabekriterien.“<\/p>\n<blockquote>\n<p>MERKSATZ: In der Prüfung zählt nicht nur, ob du einen Begriff kennst,\nsondern ob du ihn in einer betrieblichen Situation sinnvoll anwendest\nund Entscheidungen nachvollziehbar begründest.<\/p>\n<\/blockquote>\n<\/section>\n<section class=\"level3\" id=\"lernplan-ohne-informatiker-vorwissen\">\n<h3>1.4 Lernplan ohne Informatiker-Vorwissen<\/h3>\n<p>Zuerst brauchst du ein Grundgerüst aus Hardware, Betriebssystem,\nNetzwerken, Datenformaten, Datenbanken und Softwareaufbau. Danach folgen\nAnforderungen, Entwurf, Qualität, Sicherheit, Einführung und\nProjektsteuerung. Ergänze dieses Heft durch eigene kurze Praxisübungen:\neinen Prozess skizzieren, ein Datenmodell zeichnen, einen Testfall\nschreiben, einen Projektstatusbericht erstellen und eine Lösung mündlich\nverteidigen. So lernst du berufliche Handlungen statt isolierter\nVokabeln.<\/p>\n<\/section>\n", "questions": 4}, {"id": 2, "title": "IT-Basiswissen: Hardware, Betriebssysteme und Daten", "lesson": "\n\n<section class=\"level3\" id=\"hardware-software-und-betriebssystem\">\n<h3>2.1 Hardware, Software und Betriebssystem<\/h3>\n<p><strong>Hardware<\/strong> bezeichnet die physischen Bestandteile\neines IT-Systems. Typische Komponenten sind CPU (Rechenwerk), RAM\n(kurzfristiger Arbeitsspeicher), SSD (dauerhafter Speicher),\nNetzwerkschnittstelle und Eingabegeräte. <strong>Software<\/strong> sind\nProgramme und zugehörige Daten. Das <strong>Betriebssystem<\/strong>\nverwaltet Ressourcen, Prozesse, Dateien, Zugriffsrechte und\nSchnittstellen, über die Anwendungen die Hardware nutzen.<\/p>\n<p>Wenn ein Mitarbeiter im Browser die Wartungssoftware öffnet, stellt\ndie Hardware Rechenleistung und Speicher bereit; das Betriebssystem\nverwaltet Geräte und Netzwerkkommunikation; der Browser zeigt das\nFrontend an. Die Wartungsdaten liegen beispielsweise auf einem\ngesonderten Datenbankserver oder bei einem Cloud-Dienst. Ein Server ist\ndabei eine Rolle im System und kann physisch, virtuell oder als Dienst\nrealisiert werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"cpu-ram-und-massenspeicher-unterscheiden\">\n<h3>2.2 CPU, RAM und Massenspeicher unterscheiden<\/h3>\n<p>Die CPU verarbeitet Befehle und steuert Rechenvorgänge. Im RAM liegen\naktuell benötigte Daten und Programmteile; RAM ist üblicherweise\nflüchtig. Auf SSDs oder anderen dauerhaften Medien werden Programme und\nDaten über Neustarts hinweg gespeichert. <strong>Persistenz<\/strong>\nbedeutet, dass Daten dauerhaft abgelegt werden. Performanceprobleme\nkönnen verschiedene Ursachen haben: zu wenig RAM, langsame\nMassenspeicher, hohe Prozessorlast, ineffiziente Software oder eine\nlangsame Netzwerkverbindung.<\/p>\n<p><strong>Bit<\/strong> ist die kleinste binäre Informationseinheit (0\noder 1), <strong>Byte<\/strong> umfasst acht Bit. Bei Datenmengen\nunterscheidet man dezimale Einheiten (1 KB = 1.000 Byte) und binäre\nEinheiten (1 KiB = 1.024 Byte). Bit/s und Byte/s nicht verwechseln: 100\nMbit/s entsprechen theoretisch maximal 12,5 MB/s vor\nProtokoll-Overhead.<\/p>\n<\/section>\n<section class=\"level3\" id=\"prozesse-threads-und-dienste\">\n<h3>2.3 Prozesse, Threads und Dienste<\/h3>\n<p>Ein <strong>Prozess<\/strong> ist eine laufende Programminstanz mit\neigenem Ausführungskontext. <strong>Threads<\/strong> sind\nAusführungsstränge innerhalb eines Prozesses; sie können auf gemeinsam\ngenutzte Daten zugreifen. Gleichzeitiger Zugriff braucht Koordination,\netwa Sperren oder geeignete Transaktionen. Ein <strong>Dienst<\/strong>\narbeitet oft im Hintergrund und stellt eine Funktion bereit,\nbeispielsweise einen Webserver oder Datenbankdienst.<\/p>\n<p><strong>Virtualisierung<\/strong> trennt virtuelle Maschinen logisch\nvom physischen Host; jede VM hat normalerweise ein eigenes\nGastbetriebssystem. <strong>Container<\/strong> bündeln Anwendung und\nLaufzeitumgebung und teilen sich typischerweise den Kernel des Hosts.\nBeides hilft bei Bereitstellung und Isolation, löst aber weder\nSicherheitsfragen noch Ressourcenprobleme automatisch.<\/p>\n<\/section>\n<section class=\"level3\" id=\"dateien-formate-logs-und-konfiguration\">\n<h3>2.4 Dateien, Formate, Logs und Konfiguration<\/h3>\n<p>Ein Dateisystem organisiert Verzeichnisse, Dateinamen und\nBerechtigungen. Konfigurationen bestimmen das Verhalten einer Software,\nzum Beispiel welche Datenbank angesprochen wird. <strong>Logs<\/strong>\ndokumentieren Ereignisse und Fehler, <strong>Metriken<\/strong> messen\nGrößen wie Antwortzeiten oder CPU-Auslastung. Trenne produktive\nAnmeldedaten und andere Geheimnisse vom Quellcode; sie gehören in\ngeschützte Konfiguration beziehungsweise ein\nSecret-Management-System.<\/p>\n<\/section>\n<section class=\"level3\" id=\"verfügbarkeit-zuverlässigkeit-und-wartbarkeit\">\n<h3>2.5 Verfügbarkeit, Zuverlässigkeit und Wartbarkeit<\/h3>\n<p><strong>Verfügbarkeit<\/strong> beschreibt, in welchem Umfang eine\nAnwendung nutzbar ist. <strong>Zuverlässigkeit<\/strong> meint das\nverlässliche Erbringen erwarteter Funktionen unter festgelegten\nBedingungen. <strong>Wartbarkeit<\/strong> beschreibt, wie gut Fehler\nbehoben und Änderungen vorgenommen werden können. Ein System kann\nschnell sein und dennoch unzuverlässig, wenn es regelmäßig abstürzt.\nService Level Agreements (SLA) definieren vereinbarte Serviceziele;\ntechnische Kennzahlen müssen sich immer auf konkrete Messzeiträume\nbeziehen.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Beschreibe bei einem Performanceproblem zuerst\ndas beobachtete Symptom, dann mögliche Engpässe (Frontend, Server,\nDatenbank, Netzwerk) und schließlich Messungen, mit denen sich die\nUrsache eingrenzen lässt.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 3, "title": "Netzwerke, Internet und Client-Server", "lesson": "\n\n<section class=\"level3\" id=\"client-und-server\">\n<h3>3.1 Client und Server<\/h3>\n<p>Ein <strong>Client<\/strong> stellt Anforderungen an einen Dienst; ein\n<strong>Server<\/strong> stellt diesen Dienst bereit. Ein Browser ist\nbeispielsweise Client eines Webservers. In einer Wartungssoftware sendet\ndas Frontend einen Request an ein Backend, das fachliche Regeln prüft\nund Daten aus einer Datenbank abruft. Diese Kommunikation kann lokal,\nüber das Firmennetz oder über das Internet stattfinden.<\/p>\n<p><strong>LAN<\/strong> ist ein lokales Netzwerk; <strong>WAN<\/strong>\nverbindet größere Entfernungen. Ein <strong>VPN<\/strong> schafft einen\ngeschützten logischen Kommunikationskanal, macht aber eine Anwendung\nallein noch nicht sicher. Eine <strong>Firewall<\/strong> kontrolliert\nNetzwerkverkehr nach Regeln. Ein <strong>Proxy<\/strong> vermittelt\nVerbindungen, ein <strong>Load Balancer<\/strong> verteilt Anfragen auf\nmehrere Instanzen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"ip-adresse-port-und-dns\">\n<h3>3.2 IP-Adresse, Port und DNS<\/h3>\n<p>Die <strong>IP-Adresse<\/strong> identifiziert eine\nNetzwerkschnittstelle im jeweiligen Netz, etwa 192.168.1.100 (privates\nIPv4-Beispiel). Der <strong>Port<\/strong> identifiziert den\nKommunikationsendpunkt eines Dienstes, etwa 443 für HTTPS. Ein Server\nkann auf unterschiedlichen Ports mehrere Dienste anbieten.\n<strong>DNS<\/strong> löst Namen wie <code>intranet.beispiel.de<\/code> in\npassende IP-Adressen auf. Dadurch müssen Anwender keine numerischen\nAdressen kennen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"tcp-udp-http-und-https\">\n<h3>3.3 TCP, UDP, HTTP und HTTPS<\/h3>\n<p><strong>TCP<\/strong> bietet einen verbindungsorientierten,\nzuverlässigen Byte-Stream mit Reihenfolge- und Verlustbehandlung.\n<strong>UDP<\/strong> arbeitet verbindungslos, ohne die gleichen\neingebauten Zustellgarantien. <strong>HTTP<\/strong> ist ein\nAnwendungsprotokoll für Request und Response. <strong>HTTPS<\/strong>\nverwendet HTTP über eine gesicherte TLS-Verbindung und schützt\ninsbesondere Vertraulichkeit und Integrität der Übertragung. Ein\nZertifikat unterstützt die Prüfung der Serveridentität. HTTPS ersetzt\nkeine Login-, Rechte- oder Eingabeprüfungen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"http-methoden-und-statuscodes\">\n<h3>3.4 HTTP-Methoden und Statuscodes<\/h3>\n<p>In typischen REST-orientierten APIs liest <code>GET<\/code>\nRessourcen, <code>POST<\/code> erzeugt häufig neue Einträge,\n<code>PUT<\/code> ersetzt eine Ressourcendarstellung, <code>PATCH<\/code>\nändert Teile davon und <code>DELETE<\/code> fordert das Löschen einer\nRessource an. Ihre genaue Semantik folgt der konkreten\nAPI-Dokumentation. Wichtige Codes: 200 = erfolgreich, 201 = erstellt,\n204 = erfolgreich ohne Antwortinhalt, 400 = fehlerhafte Anfrage, 401 =\nfehlende/ungültige Authentifizierung, 403 = Zugriff verboten, 404 =\nRessource nicht gefunden, 409 = Konflikt, 429 = zu viele Anfragen, 500 =\ninterner Serverfehler, 503 = Dienst momentan nicht verfügbar.<\/p>\n<p><strong>Request-Response<\/strong> bedeutet: Der Client stellt eine\nAnfrage und der Server liefert eine Antwort. Für asynchrone Abläufe und\nPush-Nachrichten gibt es ergänzende Muster wie Message Queues, Webhooks\noder WebSockets.<\/p>\n<\/section>\n<section class=\"level3\" id=\"json-und-schnittstellenverträge\">\n<h3>3.5 JSON und Schnittstellenverträge<\/h3>\n<p><strong>JSON<\/strong> ist ein textbasiertes Format für strukturierte\nDaten. Ein Objekt enthält Schlüssel/Wert-Paare, ein Array mehrere Werte\noder Objekte. JSON-Werte können Zeichenketten, Zahlen, Wahrheitswerte,\nnull, Arrays oder Objekte sein. Beispiel:<\/p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode json\"><code class=\"sourceCode json\"><span id=\"cb1-1\"><span class=\"fu\">{<\/span><span class=\"dt\">\"maschinenId\"<\/span><span class=\"fu\">:<\/span><span class=\"dv\">102<\/span><span class=\"fu\">,<\/span><span class=\"dt\">\"name\"<\/span><span class=\"fu\">:<\/span><span class=\"st\">\"Roboter 2\"<\/span><span class=\"fu\">,<\/span><span class=\"dt\">\"status\"<\/span><span class=\"fu\">:<\/span><span class=\"st\">\"Wartung\"<\/span><span class=\"fu\">}<\/span><\/span><\/code><\/pre><\/div>\n<p>Eine <strong>API<\/strong> ist ein definierter Vertrag zwischen\nSoftwaresystemen: Welche Operationen sind erlaubt, welche Daten werden\nübergeben, welche Antworten und Fehler entstehen? APIs reduzieren die\nAbhängigkeit vom Innenleben des jeweils anderen Systems. Sie müssen\ndennoch versioniert, dokumentiert und gegen unberechtigte Zugriffe\ngeschützt werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"synchron-asynchron-und-fehlertoleranz\">\n<h3>3.6 Synchron, asynchron und Fehlertoleranz<\/h3>\n<p>Synchron wartet ein Client unmittelbar auf eine Antwort. Asynchron\nkann die Verarbeitung später erfolgen, etwa über eine Warteschlange. Bei\nNetzwerkfehlern sind <strong>Timeouts<\/strong>, <strong>Retries<\/strong>\nund <strong>Idempotenz<\/strong> wichtig. Idempotenz bedeutet, dass eine\nwiederholte identische Operation das beabsichtigte Ergebnis nicht\nmehrfach verändert; <code>GET<\/code> und <code>PUT<\/code> sind\nentsprechend ihrer HTTP-Semantik idempotent, <code>POST<\/code> nicht\ngenerell. Wiederholte Auftragsanlage muss eventuell mit einem\nIdempotency-Key geschützt werden.<\/p>\n<blockquote>\n<p>MERKSATZ: IP-Adresse = Ziel im Netz; Port = Dienstendpunkt; DNS =\nNamensauflösung; HTTPS = geschützte HTTP-Kommunikation; API =\nvereinbarte Schnittstelle.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 4, "title": "Grundlagen von Programmen und Softwareentwicklung – ohne Programmierkurs", "lesson": "\n\n<section class=\"level3\" id=\"algorithmus-und-datenfluss\">\n<h3>4.1 Algorithmus und Datenfluss<\/h3>\n<p>Ein <strong>Algorithmus<\/strong> ist eine endliche, nachvollziehbare\nHandlungsbeschreibung zur Lösung einer Aufgabe. Ein Beispiel: Temperatur\neinlesen, mit Grenzwert vergleichen, bei Überschreitung Alarm auslösen.\n<strong>Eingabe → Verarbeitung → Ausgabe<\/strong> hilft, fachliche\nAbläufe zu verstehen. Bei einer Wartungssoftware: Maschinen-ID erfassen\n→ Berechtigung und Eingabe prüfen → Datensatz speichern → Rückmeldung\nanzeigen.<\/p>\n<p><strong>Variablen<\/strong> sind benannte Bezugspunkte auf Werte;\n<strong>Datentypen<\/strong> legen erlaubte Werte und Operationen fest.\nHäufige Typen sind Ganzzahl, Dezimalzahl, Text, Wahrheitswert und Datum.\n<strong>Bedingungen<\/strong> treffen Entscheidungen,\n<strong>Schleifen<\/strong> wiederholen Schritte,\n<strong>Funktionen<\/strong> kapseln eine zusammengehörige Aufgabe. Ein\nFehler kann auftreten, wenn etwa Text statt einer Zahl verarbeitet wird\noder ein Grenzwert falsch gewählt ist.<\/p>\n<\/section>\n<section class=\"level3\" id=\"objektorientierung-und-komponenten\">\n<h3>4.2 Objektorientierung und Komponenten<\/h3>\n<p>In der objektorientierten Entwicklung modelliert man fachliche\nObjekte und Verhalten. Eine <strong>Klasse<\/strong> beschreibt\ngemeinsame Eigenschaften und Methoden, ein <strong>Objekt<\/strong> ist\neine konkrete Instanz. <strong>Kapselung<\/strong> schützt interne\nZustände über definierte Zugriffe. <strong>Vererbung<\/strong> ermöglicht\ndie Übernahme beziehungsweise Spezialisierung von Eigenschaften,\n<strong>Polymorphie<\/strong> unterschiedliche Implementierungen einer\ngemeinsamen Schnittstelle. In vielen modernen Architekturen ist\n<strong>Komposition<\/strong> (Bausteine kombinieren) der Vererbung\nvorzuziehen, wenn sie die Abhängigkeiten reduziert.<\/p>\n<p>Beispiel: Das Fachobjekt <code>Wartungsauftrag<\/code> hat\nAuftragsnummer, Maschine, Fälligkeit und Status. Eine fachliche Regel\nlautet: Ein Auftrag darf nur abgeschlossen werden, wenn erforderliche\nPrüfergebnisse vorliegen. Die Regel gehört in die zuständige\nGeschäftslogik und muss auch bei Zugriff über eine andere\nBenutzeroberfläche gelten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"codequalität-fehler-und-laufzeit\">\n<h3>4.3 Codequalität, Fehler und Laufzeit<\/h3>\n<p>Ein <strong>Syntaxfehler<\/strong> verletzt die Schreibregeln einer\nProgrammiersprache. Ein <strong>Laufzeitfehler<\/strong> tritt beim\nAusführen auf. Ein <strong>Logikfehler<\/strong> liefert falsche\nErgebnisse, obwohl das Programm technisch läuft.\n<strong>Debugging<\/strong> bedeutet, Ursachen systematisch zu finden;\n<strong>Logging<\/strong> unterstützt die Nachvollziehbarkeit. Guter Code\nsollte verständlich, testbar, wartbar und möglichst einfach sein. Regeln\nwie DRY (unnötige Wiederholungen vermeiden) und KISS (unnötige\nKomplexität vermeiden) sind Leitideen, keine mechanischen Gesetze.<\/p>\n<\/section>\n<section class=\"level3\" id=\"programmiersprachen-bibliotheken-frameworks\">\n<h3>4.4 Programmiersprachen, Bibliotheken, Frameworks<\/h3>\n<p>Eine <strong>Programmiersprache<\/strong> definiert Ausdrucks- und\nVerhaltensregeln. Ein <strong>Compiler<\/strong> übersetzt Code\nüblicherweise in eine andere ausführbare oder zwischenliegende\nDarstellung; ein <strong>Interpreter<\/strong> führt eine Repräsentation\naus. In der Praxis gibt es Mischformen mit virtuellen Maschinen und\nJust-in-Time-Kompilierung. Eine <strong>Bibliothek<\/strong> stellt\nwiederverwendbare Funktionen bereit, ein <strong>Framework<\/strong> gibt\noft einen größeren Struktur- und Ablaufrahmen vor. Abhängigkeiten müssen\nbezüglich Version, Lizenz und Sicherheit verwaltet werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"architekturentscheidungen-statt-syntaxwissen\">\n<h3>4.5 Architekturentscheidungen statt Syntaxwissen<\/h3>\n<p>Für die Rolle des Berufsspezialisten ist wichtig zu erkennen, ob\nfachliche Regeln an der richtigen Stelle liegen, wie Komponenten\nzusammenwirken und welche Folgen Änderungen haben. Allerdings verlangt\ndie Prüfungsverordnung auch die Umsetzung von Kundenanforderungen in\neiner Anwendung mit einer Programmiersprache. Plane daher ergänzend\nmindestens ein kleines vollständiges praktisches Softwareprojekt ein:\nDaten erfassen, speichern, testen, dokumentieren und bereitstellen.\n[Q1]<\/p>\n<blockquote>\n<p>MERKSATZ: Eine Anwendung ist mehr als Quellcode: Sie besteht aus\nAnforderungen, Komponenten, Daten, Schnittstellen, Sicherheitsregeln,\nTests, Betrieb und Dokumentation.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 5, "title": "Anforderungen analysieren und strukturieren", "lesson": "\n\n<section class=\"level3\" id=\"stakeholder-und-bedarfsanalyse\">\n<h3>5.1 Stakeholder und Bedarfsanalyse<\/h3>\n<p><strong>Stakeholder<\/strong> sind Personen oder Gruppen, die ein\nInteresse am Projekt haben oder von ihm betroffen sind: Auftraggeber,\nAnwender, IT-Betrieb, Datenschutz, Betriebsrat, Support und\nEntwicklungsteam. Unterschiedliche Gruppen haben teils widersprüchliche\nZiele. Sammle Erwartungen mit Interviews, Workshops, Beobachtungen,\nDokumentenanalyse oder Prototypen. Frage nicht nur „Was soll die App\nkönnen?“, sondern auch „Welches Problem soll gelöst werden?“ und „Woran\nerkennen wir Erfolg?“<\/p>\n<p>Bei der Wartungssoftware benötigt die Instandhaltung schnelle\nFehlererfassung, die Produktionsleitung Berichte, die IT sichere\nZugriffe und die Geschäftsleitung kalkulierbare Kosten. Eine gute\nAnforderungsanalyse macht Konflikte sichtbar und dokumentiert offene\nEntscheidungen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"funktional-nichtfunktional-und-randbedingungen\">\n<h3>5.2 Funktional, nichtfunktional und Randbedingungen<\/h3>\n<p><strong>Funktionale Anforderungen<\/strong> legen fest, was ein System\ntut: Wartungsauftrag erzeugen, Maschinen suchen, Rollen verwalten.\n<strong>Nichtfunktionale Anforderungen<\/strong> beschreiben\nQualitätsmerkmale: Antwortzeit, Verfügbarkeit, Sicherheit,\nBedienbarkeit, Barrierefreiheit, Skalierbarkeit und Wartbarkeit.\n<strong>Randbedingungen<\/strong> setzen feste Grenzen wie bestehende\nTablets, Budget oder Datenschutzvorgaben.<\/p>\n<p>Eine Aussage wie „Die Software soll schnell sein“ ist schwer testbar.\nBesser: „Die Maschinenübersicht zeigt bei 100 gleichzeitigen Anwendern\nund 10.000 Datensätzen im 95. Perzentil innerhalb von zwei Sekunden ein\nvollständiges Ergebnis.“ Dazu sind Testumgebung, Messpunkte und\nLastprofil festzulegen. So wird eine vage Erwartung zu einem\nüberprüfbaren Kriterium.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lastenheft-pflichtenheft-user-story\">\n<h3>5.3 Lastenheft, Pflichtenheft, User Story<\/h3>\n<p>Ein <strong>Lastenheft<\/strong> beschreibt typischerweise die\nAnforderungen und Ziele aus Auftraggebersicht (was und wozu). Ein\n<strong>Pflichtenheft<\/strong> konkretisiert aus Auftragnehmersicht, wie\ndie Anforderungen umgesetzt werden sollen. Die Dokumentformen hängen von\nVertrag und Projektmodell ab. In agilen Teams sind <strong>User\nStories<\/strong> verbreitet: „Als Instandhaltungsmitarbeiter möchte ich\noffene Wartungen nach Fälligkeit sehen, damit ich meine Arbeit planen\nkann.“ Sie ersetzen nicht automatisch notwendige Architektur-,\nSicherheits- oder Vertragsdokumentation.<\/p>\n<p><strong>Akzeptanzkriterien<\/strong> definieren prüfbare Bedingungen\neiner einzelnen Anforderung, etwa „Es werden nur offene Aufträge\nangezeigt“ und „Die Anzeige ist nach Fälligkeitsdatum sortierbar“. Eine\n<strong>Definition of Done<\/strong> enthält übergreifende\nQualitätsanforderungen für das fertige Increment, beispielsweise\nerfolgreich durchgeführte Tests und aktualisierte Dokumentation. Beides\nergänzt sich.<\/p>\n<\/section>\n<section class=\"level3\" id=\"priorisierung-und-konflikte\">\n<h3>5.4 Priorisierung und Konflikte<\/h3>\n<p>Die <strong>MoSCoW-Methode<\/strong> unterscheidet Must, Should, Could\nund Won’t (im betrachteten Zeitraum). Must-Anforderungen sind für die\nvereinbarte Lieferung zwingend, Should sind wichtig, Could optional und\nWon’t werden bewusst verschoben. Die Entscheidung basiert auf\nGeschäftswert, Risiken, gesetzlichen Vorgaben, Aufwand und\nAbhängigkeiten. Eine Berichtsfunktion könnte Should sein, wenn es eine\nmanuelle Übergangslösung gibt; eine korrekte Maschinenzuordnung wäre\nhäufig Must.<\/p>\n<p>Eine andere Möglichkeit bewertet Wert und Aufwand, z. B. einfache\nNutzen-Aufwand-Matrizen. Vorsicht: „Hoher Wert“ ist keine Messgröße ohne\ndefinierte Kriterien. Priorisierungen müssen mit Stakeholdern abgestimmt\nund bei neuen Informationen angepasst werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"nachverfolgbarkeit-und-änderungsmanagement\">\n<h3>5.5 Nachverfolgbarkeit und Änderungsmanagement<\/h3>\n<p><strong>Traceability<\/strong> verbindet Anforderung → Entwurf →\nImplementierung → Test → Abnahme. Dadurch lässt sich nachweisen, welche\nForderungen erfüllt wurden und wo Änderungen wirken. Ein <strong>Change\nRequest<\/strong> beschreibt eine gewünschte Änderung einschließlich\nGrund, Nutzen, Aufwand, Risiken und Auswirkungen auf Termine. Änderungen\nsollten bewertet, beschlossen und dokumentiert werden; sonst entsteht\nunkontrollierter Scope Creep (schleichende Umfangserweiterung).<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Nenne bei einer Anforderung nicht nur\n„funktional“ oder „nichtfunktional“, sondern formuliere eine messbare\nFassung, weise ihr eine Priorität zu und leite einen passenden Testfall\nab.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 6, "title": "Softwarearchitektur und Systemdesign", "lesson": "\n\n<section class=\"level3\" id=\"was-beschreibt-architektur\">\n<h3>6.1 Was beschreibt Architektur?<\/h3>\n<p>Die <strong>Softwarearchitektur<\/strong> beschreibt wesentliche\nBausteine eines Systems, ihre Verantwortlichkeiten, Beziehungen,\nSchnittstellen und grundlegenden Entscheidungen. Architektur soll\nQualitätsziele unterstützen und Änderungen beherrschbar halten. Sie ist\nmehr als ein Bild mit Kästen: Dokumentiere Annahmen, Alternativen,\nRisiken und die Begründung wichtiger Entscheidungen.<\/p>\n<p>Das Beispielsystem besitzt ein <strong>Frontend<\/strong> für die\nBenutzerschnittstelle, ein <strong>Backend<\/strong> für Fachregeln, eine\n<strong>Datenbank<\/strong> zur persistenten Speicherung und eventuell\nDienste für Benachrichtigungen oder Berichte. Diese Trennung erleichtert\nWartung und Testbarkeit, kann aber zusätzliche Kommunikation und\nBetriebsaufwand verursachen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"schichten-monolith-und-microservices\">\n<h3>6.2 Schichten, Monolith und Microservices<\/h3>\n<p>Bei einer <strong>Schichtenarchitektur<\/strong> sind Präsentation,\nGeschäftslogik und Datenzugriff getrennt. Ein <strong>Monolith<\/strong>\nbündelt größere Teile in einer gemeinsam bereitgestellten Anwendung. Er\nist häufig einfacher zu betreiben und besonders für kleine Teams\ngeeignet. <strong>Microservices<\/strong> teilen fachliche Bereiche in\neigenständig bereitstellbare Dienste. Das erlaubt separate Skalierung,\nerhöht aber Komplexität durch Netzwerkkommunikation, Datenkonsistenz,\nObservability und Betrieb. Microservices sind nicht automatisch moderner\noder besser.<\/p>\n<p>Eine <strong>modulare Monolith-Architektur<\/strong> kann fachliche\nKomponenten sauber trennen, ohne verteilte Systemkomplexität\neinzuführen. Entscheide nach Anforderungen, Teamgröße, Änderungsdynamik,\nLastprofil und Betriebsfähigkeit.<\/p>\n<\/section>\n<section class=\"level3\" id=\"schnittstellen-kopplung-und-kohäsion\">\n<h3>6.3 Schnittstellen, Kopplung und Kohäsion<\/h3>\n<p><strong>Geringe Kopplung<\/strong> bedeutet, dass Komponenten\nmöglichst wenig Wissen über interne Details anderer Komponenten\nbenötigen. <strong>Hohe Kohäsion<\/strong> bedeutet, dass ein Baustein\nfachlich zusammengehörige Aufgaben bündelt. Eine API zwischen Frontend\nund Backend ermöglicht klar definierte Zugriffe. Ihre Stabilität hängt\naber von einem verlässlichen Vertrag, Versionierung und Tests ab. Eine\nÄnderung an einer API kann Clients beschädigen, auch wenn die Datenbank\nunverändert bleibt.<\/p>\n<p><strong>Schnittstellenvertrag<\/strong> kann Pfade, Methoden,\nDatenformate, Validierung, Fehlercodes, Authentifizierung, Version und\nLeistungsgrenzen definieren. Bei asynchronen Integrationen zusätzlich\nZustellverhalten, Dublettenbehandlung, Reihenfolge und\nFehlerwiederholung beachten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"uml-und-diagramme-verstehen\">\n<h3>6.4 UML und Diagramme verstehen<\/h3>\n<p><strong>Use-Case-Diagramm:<\/strong> Wer möchte welche Funktion\nnutzen? <strong>Klassendiagramm:<\/strong> Welche Klassen, Attribute und\nBeziehungen existieren? <strong>Sequenzdiagramm:<\/strong> Welche Aufrufe\nerfolgen in welcher zeitlichen Reihenfolge?\n<strong>Aktivitätsdiagramm:<\/strong> Wie läuft ein Prozess mit\nEntscheidungen ab? <strong>Komponentendiagramm:<\/strong> Welche Module\nbieten oder benötigen welche Schnittstellen?\n<strong>Deployment-Diagramm:<\/strong> Wo werden Softwarebausteine\nbetrieben?<\/p>\n<p>Für die Prüfung genügt kein kunstvolles Diagramm ohne Aussage. Nutze\ndie Darstellungsart, die die konkrete Frage erklärt. Beispiel: Für\n„Frontend ruft API auf, Backend prüft Berechtigung und speichert\nDatensatz“ eignet sich ein Sequenzdiagramm. Für Maschinen und\nWartungsaufträge ein Datenmodell beziehungsweise ER-Diagramm.<\/p>\n<\/section>\n<section class=\"level3\" id=\"architekturentscheidungen-dokumentieren-adr\">\n<h3>6.5 Architekturentscheidungen dokumentieren (ADR)<\/h3>\n<p>Ein <strong>Architecture Decision Record<\/strong> hält eine\nEntscheidung und ihre Gründe fest: Kontext, Optionen, Entscheidung,\nKonsequenzen. Beispiel: „Wir wählen eine relationale Datenbank, weil\nWartungsaufträge klare Beziehungen zu Maschinen und Mitarbeitern haben\nund referenzielle Integrität wichtig ist.“ Dokumentiere Nachteile\nehrlich, etwa Lizenzkosten oder notwendige Datenbankkompetenz.<\/p>\n<\/section>\n<section class=\"level3\" id=\"make-or-buy-cloud-und-plattformwahl\">\n<h3>6.6 Make-or-Buy, Cloud und Plattformwahl<\/h3>\n<p><strong>Make-or-Buy<\/strong> vergleicht Eigenentwicklung und\nStandardsoftware. Kriterien: Funktionsabdeckung, Anpassbarkeit, laufende\nKosten, Integration, Herstellerabhängigkeit, Datenschutz, Betrieb und\nTime-to-Market. <strong>On-Premises<\/strong> bedeutet Betrieb auf\neigener oder selbst verwalteter Infrastruktur, <strong>Cloud<\/strong>\neine fremd betriebene bereitgestellte Ressource. Cloud-Modelle umfassen\nIaaS (Infrastruktur), PaaS (Plattform) und SaaS (fertiger\nAnwendungsdienst). Entscheidend ist das konkrete Verantwortungsmodell;\nDatenschutz- und Sicherheitsaufgaben verschwinden nicht durch\nCloud-Nutzung.<\/p>\n<blockquote>\n<p>MERKSATZ: Gute Architektur ist die begründete Auswahl eines\nangemessenen Systems unter realen Anforderungen und Risiken – nicht die\nmöglichst komplizierte Technologie.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 7, "title": "Datenbanken und Datenmodellierung", "lesson": "\n\n<section class=\"level3\" id=\"relationale-grundlagen\">\n<h3>7.1 Relationale Grundlagen<\/h3>\n<p>Eine relationale Datenbank organisiert Informationen in Tabellen.\nJede Zeile ist ein Datensatz, jede Spalte ein Attribut. Ein\n<strong>Primärschlüssel<\/strong> identifiziert einen Datensatz eindeutig\nund darf nicht NULL sein. Ein <strong>Fremdschlüssel<\/strong> verweist\nauf einen Schlüssel in einer anderen beziehungsweise derselben Tabelle.\nBeispielsweise trägt der Wartungsauftrag eine MaschinenID, die auf die\nMaschinentabelle verweist. Damit kann die Datenbank eine korrekte\nZuordnung erzwingen.<\/p>\n<p><strong>1:1<\/strong> bedeutet ein Datensatz pro Gegenüber,\n<strong>1:n<\/strong> ein Datensatz zu mehreren anderen,\n<strong>n:m<\/strong> eine wechselseitig mehrfache Zuordnung. Bei n:m\nnutzt man meist eine Zwischentabelle, etwa\n<code>MitarbeiterProjekt<\/code> mit MitarbeiterID, ProjektID und\ngeleisteten Stunden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"normalisierung-verstehen\">\n<h3>7.2 Normalisierung verstehen<\/h3>\n<p>Normalisierung reduziert problematische Redundanzen. Die\n<strong>erste Normalform (1NF)<\/strong> verlangt atomare Attributwerte\nim gewählten Datenmodell; eine kommagetrennte Liste mehrerer\nTelefonnummern in einer Spalte ist ein typischer Verstoß. Die\n<strong>zweite Normalform (2NF)<\/strong> verlangt zusätzlich, dass\nNicht-Schlüsselattribute nicht von einem echten Teil eines\nKandidatenschlüssels abhängen. Bei\n<code>MitarbeiterID + ProjektID<\/code> gehört\n<code>MitarbeiterName<\/code> daher nicht in die Zuordnungstabelle. Die\n<strong>dritte Normalform (3NF)<\/strong> vermeidet bestimmte transitive\nAbhängigkeiten von Nicht-Schlüsselattributen, beispielsweise\n<code>MitarbeiterID → AbteilungID → AbteilungsName<\/code>.<\/p>\n<p>Normalisierung verhindert <strong>Änderungsanomalien<\/strong>\n(Dubletten widersprechen sich), <strong>Einfügeanomalien<\/strong>\n(Informationen lassen sich nicht unabhängig speichern) und\n<strong>Löschanomalien<\/strong> (beim Löschen gehen zusätzliche\nInformationen verloren). Im Betrieb wird manchmal bewusst\n<strong>denormalisiert<\/strong>, etwa zur Beschleunigung von\nAuswertungen; die zusätzlichen Konsistenzpflichten müssen dann\nkontrolliert werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"referenzielle-integrität-und-löschregeln\">\n<h3>7.3 Referenzielle Integrität und Löschregeln<\/h3>\n<p>Ein Fremdschlüssel verhindert normalerweise, dass ein Wartungsauftrag\nauf eine nicht existierende Maschine verweist. Wird eine referenzierte\nMaschine gelöscht, kann die Datenbank mit einer konfigurierten Regel\nreagieren: <strong>RESTRICT/NO ACTION<\/strong> verweigert eine\nunzulässige Löschung, <strong>CASCADE<\/strong> löscht abhängige Zeilen\nmit, <strong>SET NULL<\/strong> entfernt die Zuordnung, falls NULL\nerlaubt ist. Für Wartungshistorien ist häufig eine logische Stilllegung\nder Maschine sinnvoller als physisches Löschen, damit Nachweise erhalten\nbleiben.<\/p>\n<\/section>\n<section class=\"level3\" id=\"sql-grundidee\">\n<h3>7.4 SQL-Grundidee<\/h3>\n<p><strong>SQL<\/strong> ist die Standardsprache vieler relationaler\nDatenbanken. <code>SELECT<\/code> fragt ab, <code>INSERT<\/code> legt an,\n<code>UPDATE<\/code> ändert und <code>DELETE<\/code> löscht Datensätze.\n<code>JOIN<\/code> verknüpft Tabellen, <code>WHERE<\/code> filtert und\n<code>GROUP BY<\/code> gruppiert Ergebnisse. Beispiel zum Verstehen,\nnicht zum Auswendiglernen:<\/p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><span class=\"kw\">SELECT<\/span> m.Name, w.AuftragID<\/span>\n<span id=\"cb2-2\"><span class=\"kw\">FROM<\/span> Maschinen m<\/span>\n<span id=\"cb2-3\"><span class=\"kw\">JOIN<\/span> Wartungen w <span class=\"kw\">ON<\/span> m.MaschinenID <span class=\"op\">=<\/span> w.MaschinenID<\/span>\n<span id=\"cb2-4\"><span class=\"kw\">WHERE<\/span> w.Status <span class=\"op\">=<\/span> <span class=\"st\">'Offen'<\/span>;<\/span><\/code><\/pre><\/div>\n<p>Dieser Ausdruck liefert offene Wartungsaufträge und die dazugehörigen\nMaschinennamen. Reale Abfragen erfordern korrektes Schema,\nParameterbindung und entsprechende Zugriffsrechte. Ein\n<strong>Index<\/strong> kann Zugriffe beschleunigen, kostet aber Speicher\nund kann Schreibvorgänge verlangsamen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"transaktionen-und-acid\">\n<h3>7.5 Transaktionen und ACID<\/h3>\n<p>Eine <strong>Transaktion<\/strong> bündelt zusammengehörige\nOperationen. <code>COMMIT<\/code> bestätigt die Änderungen,\n<code>ROLLBACK<\/code> macht unbestätigte Änderungen der Transaktion\nrückgängig. Die vier ACID-Eigenschaften sind: <strong>Atomicity<\/strong>\n(alles oder nichts), <strong>Consistency<\/strong> (definierte\nIntegritätsbedingungen bleiben erhalten), <strong>Isolation<\/strong>\n(gleichzeitige Transaktionen werden nach definierten Isolationsregeln\nkoordiniert) und <strong>Durability<\/strong> (bestätigte Änderungen\nüberstehen unterstützte Ausfallszenarien).<\/p>\n<p>Beispiel Lager: Wenn zwei Mitarbeiter gleichzeitig 7 und 6 Teile von\neinem Bestand von 10 entnehmen wollen, muss die Anwendung in Verbindung\nmit der Datenbank eine sichere Buchung gewährleisten. Ohne passende\nIsolation, Sperren oder atomare Aktualisierungen können Race Conditions\nund inkorrekte Bestände entstehen. Nicht jedes Isolationsniveau\nverhindert jede Anomalie; beachte insbesondere Lost Updates und\nkonkurrierende Schreibzugriffe.<\/p>\n<\/section>\n<section class=\"level3\" id=\"datenschutz-backups-und-migration\">\n<h3>7.6 Datenschutz, Backups und Migration<\/h3>\n<p><strong>Datenintegrität<\/strong> ist Richtigkeit und Unversehrtheit,\n<strong>Verfügbarkeit<\/strong> ist Zugriff bei Bedarf,\n<strong>Vertraulichkeit<\/strong> schützt unberechtigte Einsicht. Ein\nBackup ermöglicht die Wiederherstellung vergangener Stände; Replikation\nund RAID sind für sich allein kein Backup. Bei einer\n<strong>Migration<\/strong> werden Schema oder Daten verändert. Sichere\nMigrationen umfassen Bestandsaufnahme, Testlauf, Kompatibilitätsprüfung,\nSicherung, Zeitplan, Datenvalidierung, Rollback-/Restore-Konzept und\ndokumentierte Freigabe. Bei Expand-and-Contract werden neue Strukturen\nzunächst ergänzt, später umgestellt und alte Teile erst nach\nerfolgreicher Übergangsphase entfernt.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Bei Datenbankaufgaben immer zwischen fachlichem\nDatenmodell, technischer Umsetzung, Datenqualität und\nMigrations-/Betriebsrisiken unterscheiden.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 8, "title": "Softwareentwicklung organisieren: Git, Build, CI/CD", "lesson": "\n\n<section class=\"level3\" id=\"repository-commit-und-branch\">\n<h3>8.1 Repository, Commit und Branch<\/h3>\n<p><strong>Versionsverwaltung<\/strong> hält Änderungen und ihre\nEntstehung nachvollziehbar. Git verwaltet Projektstände in einem\nRepository. Ein <strong>Commit<\/strong> speichert eine nachvollziehbare\nÄnderung, ein <strong>Branch<\/strong> ist ein Entwicklungszweig,\n<strong>Merge<\/strong> führt Entwicklungen zusammen. Bei Konflikten\nmüssen Unterschiede fachlich aufgelöst werden. Branch-Namen und\nFreigaberegeln dienen der Teamkoordination; kurze, überprüfbare\nÄnderungen sind meist leichter zu testen als große unübersichtliche\nPakete.<\/p>\n<\/section>\n<section class=\"level3\" id=\"code-review-und-pull-request\">\n<h3>8.2 Code Review und Pull Request<\/h3>\n<p>Ein <strong>Pull Request<\/strong> beziehungsweise Merge Request\nbittet um Prüfung einer Änderung vor dem Zusammenführen. Reviews prüfen\nVerständlichkeit, Funktion, Sicherheitsrisiken, Tests und Standards. Sie\nersetzen weder automatisierte Tests noch fachliche Abnahme. Eine gute\nRückmeldung benennt eine beobachtbare Schwäche und schlägt eine\nnachvollziehbare Verbesserung vor, ohne Personen zu bewerten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"build-test-package-deployment-release\">\n<h3>8.3 Build, Test, Package, Deployment, Release<\/h3>\n<p>Ein <strong>Build<\/strong> erstellt aus Projektdateien ein nutzbares\nArtefakt, etwa ein Programm oder Container-Image. <strong>Tests<\/strong>\nprüfen definierte Eigenschaften; ein erfolgreicher Build ist noch kein\nQualitätsnachweis. <strong>Deployment<\/strong> stellt ein Artefakt in\neiner Zielumgebung bereit. Ein <strong>Release<\/strong> bezeichnet die\nzur Nutzung vorgesehene beziehungsweise freigegebene Produktversion.\nDeployment und Release können zeitlich getrennt sein, etwa mithilfe von\nFeature Flags.<\/p>\n<\/section>\n<section class=\"level3\" id=\"ci-continuous-delivery-und-continuous-deployment\">\n<h3>8.4 CI, Continuous Delivery und Continuous Deployment<\/h3>\n<p>Bei <strong>Continuous Integration<\/strong> integrieren Teams\nÄnderungen regelmäßig und überprüfen sie automatisiert. Eine typische\nPipeline ist: Versionsänderung → Build → statische Prüfungen →\nautomatisierte Tests → Artefakt → Freigabe/Deployment.\n<strong>Continuous Delivery<\/strong> hält geprüfte Software in einem\nveröffentlichbaren Zustand; die Produktivfreigabe kann manuell erfolgen.\n<strong>Continuous Deployment<\/strong> veröffentlicht nach bestandener\nPipeline ohne gesonderte manuelle Freigabe automatisch. Nicht jede\nPipeline braucht dieselbe Automatisierungstiefe.<\/p>\n<\/section>\n<section class=\"level3\" id=\"qualität-sicherheit-und-lieferkette\">\n<h3>8.5 Qualität, Sicherheit und Lieferkette<\/h3>\n<p>Eine <strong>Software Bill of Materials (SBOM)<\/strong> beschreibt\nverwendete Softwarekomponenten und Abhängigkeiten. Sicherheitsprüfungen\numfassen beispielsweise Secret Scanning, Dependency Scanning, statische\nAnalysen sowie dynamische Tests. Signierte Artefakte, eindeutige\nVersionen und getrennte Berechtigungen helfen gegen Lieferkettenrisiken.\nAutomatisierung erhöht Wiederholbarkeit, aber falsch konfigurierte\nPipelines können Fehler ebenfalls automatisiert verbreiten.<\/p>\n<blockquote>\n<p>MERKSATZ: Git macht Änderungen nachvollziehbar; CI prüft Integration;\nCD unterstützt die Bereitstellung; ein Release braucht zusätzlich\nfachlich und betrieblich verantwortete Entscheidungen.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 9, "title": "Produktqualität und systematisches Testen", "lesson": "\n\n<section class=\"level3\" id=\"qualität-ist-mehr-als-fehlerfreiheit\">\n<h3>9.1 Qualität ist mehr als Fehlerfreiheit<\/h3>\n<p>Softwarequalität umfasst neben korrekten Funktionen auch Aspekte wie\nPerformance, Zuverlässigkeit, Sicherheit, Benutzbarkeit, Wartbarkeit und\nAnpassungsfähigkeit. Die Norm <strong>ISO/IEC 25010:2023<\/strong>\nbeschreibt ein Produktqualitätsmodell mit neun Qualitätsmerkmalen; sie\nkann beim Festlegen und Bewerten von Anforderungen helfen. [Q4] Eine\nzentrale Frage lautet: „Woran lässt sich objektiv erkennen, dass die\nQualität für diesen Einsatz ausreicht?“ Antwortzeiten, Fehlerraten,\nBarrierefreiheitsprüfungen oder erfolgreiche Wiederherstellungstests\nsind messbare Beispiele.<\/p>\n<\/section>\n<section class=\"level3\" id=\"verifikation-und-validierung\">\n<h3>9.2 Verifikation und Validierung<\/h3>\n<p><strong>Verifikation:<\/strong> Wird die Lösung gemäß der\nSpezifikation umgesetzt? <strong>Validierung:<\/strong> Löst die Lösung\ndas tatsächliche Problem der Benutzer? Eine technisch korrekt nach\nPflichtenheft entwickelte Funktion kann dennoch am Bedarf vorbeigehen.\nBeispiel: Die Software sortiert Wartungsaufträge korrekt alphabetisch;\ndie Mitarbeiter benötigen aber vor allem eine Sortierung nach\nFälligkeit. Darum sollten Anwender früh Prototypen sehen und bei\nAbnahmetests einbezogen werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"teststufen\">\n<h3>9.3 Teststufen<\/h3>\n<p>Ein <strong>Komponenten- oder Unit-Test<\/strong> prüft eine einzelne\nEinheit, etwa die Berechnung des Wartungsdatums. Ein\n<strong>Integrationstest<\/strong> prüft das Zusammenspiel, etwa Frontend\n→ API → Backend. Ein <strong>Systemtest<\/strong> betrachtet das\nvollständige System im relevanten Betriebsumfeld. Ein\n<strong>Abnahmetest<\/strong> überprüft vertraglich oder fachlich\nvereinbarte Akzeptanzkriterien. Eine Teststufe definiert den\nPrüfgegenstand; eine <strong>Testart<\/strong> bezeichnet, was geprüft\nwird (Funktion, Sicherheit, Leistung, Benutzbarkeit etc.). Die Begriffe\ndaher nicht vermischen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"testentwurf-und-testfälle\">\n<h3>9.4 Testentwurf und Testfälle<\/h3>\n<p>Ein Testfall enthält Test-ID, Ziel, Voraussetzungen, Eingabedaten,\nSchritte, Soll-Ergebnis, später Ist-Ergebnis und Bewertung. Ein\n<strong>Positivtest<\/strong> verwendet gültige Eingaben; ein\n<strong>Negativtest<\/strong> prüft ungültige Eingaben. Ein Negativtest\nist erfolgreich, wenn das System erwartungsgemäß ablehnt.\n<strong>Grenzwertanalyse<\/strong> testet Werte am Rand gültiger\nBereiche, z. B. maximal 100 Zeichen: 99, 100 und 101.\n<strong>Äquivalenzklassen<\/strong> teilen Eingaben in Bereiche, die\nwahrscheinlich gleich behandelt werden.<\/p>\n<p>Ein gutes Beispiel: „Ohne Maschinen-ID darf kein Wartungsauftrag\ngespeichert werden.“ Voraussetzung: berechtigter Benutzer. Eingabe:\nleere Maschinen-ID. Soll: Speichern verhindert, klare Meldung, keine\nneue Zeile in der Datenbank. Dokumentiere bei der Ausführung auch\nUmgebung und Softwareversion.<\/p>\n<\/section>\n<section class=\"level3\" id=\"retest-regressionstest-smoke--und-lasttest\">\n<h3>9.5 Retest, Regressionstest, Smoke- und Lasttest<\/h3>\n<p>Ein <strong>Retest<\/strong> kontrolliert die Behebung eines konkreten\nFehlers. Ein <strong>Regressionstest<\/strong> prüft, ob Änderungen\nbereits funktionierende Bereiche beeinträchtigt haben. Ein\n<strong>Smoke-Test<\/strong> kontrolliert nach einem neuen Build oder\nDeployment zentrale Grundfunktionen, um grobe Defekte schnell zu\nerkennen. <strong>Lasttests<\/strong> prüfen Leistung unter erwarteter\nund steigender Auslastung, <strong>Stresstests<\/strong> betrachten\nVerhalten über normalen Betriebsgrenzen.\n<strong>Sicherheitstests<\/strong> untersuchen Angriffsflächen, Zugriffe\nund Schutzmechanismen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"testpyramide-und-automatisierung\">\n<h3>9.6 Testpyramide und Automatisierung<\/h3>\n<p>Viele schnelle, stabile Komponententests bilden häufig die Basis;\nweniger Integrations- und noch weniger teure End-to-End-Tests ergänzen\nsie. Das ist eine nützliche Heuristik, kein starres Gesetz.\nAutomatisiere vor allem wiederkehrende und stabile Prüfschritte.\nExploratives Testen durch Menschen bleibt wichtig, weil nicht alle\nNutzungsprobleme aus vorbereiteten Testfällen hervorgehen.\nAussagekräftige Testergebnisse benötigen kontrollierte Testdaten und\neine realistische Umgebung.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fehlerbericht-severity-und-priority\">\n<h3>9.7 Fehlerbericht, Severity und Priority<\/h3>\n<p>Ein <strong>Bug Report<\/strong> beschreibt eine Abweichung\nreproduzierbar: eindeutiger Titel, Version, Umgebung, Schritte,\nSoll-/Ist-Ergebnis, Belege und Auswirkungen.\n<strong>Schweregrad/Severity<\/strong> bewertet das Ausmaß des Fehlers,\n<strong>Priorität/Priority<\/strong> die Dringlichkeit der Behebung.\nBeide können auseinanderfallen: Ein seltener Absturz einer noch nicht\nfreigegebenen Funktion hat hohen Schweregrad, aber möglicherweise\nniedrigere sofortige Priorität. Ein Schreibfehler auf einer prominenten\nPräsentationsseite hat niedrigen Schweregrad, kann aber kurzfristig hohe\nPriorität haben.<\/p>\n<p>Ein typischer Defect Lifecycle lautet New → In Progress → Fixed →\nRetest → Closed; ist die Korrektur nicht erfolgreich, kann der Fehler\nauf Reopened gesetzt werden. Die genauen Status sind\norganisationsabhängig.<\/p>\n<\/section>\n<section class=\"level3\" id=\"risikobasiertes-testen\">\n<h3>9.8 Risikobasiertes Testen<\/h3>\n<p>Prüfe zuerst Funktionen, bei denen eine Fehlfunktion wahrscheinlicher\noder folgenreicher ist. Ein einfaches Modell nutzt <strong>Risikowert =\nWahrscheinlichkeit × Schadensausmaß<\/strong>, beispielsweise auf Skalen\nvon 1 bis 3. Diese Zahlen sind nur ordinal vereinfachte\nEntscheidungshilfen. Datenverlust, Sicherheitsmängel und falsche\nMaschinenzuordnung erhalten in der Regel mehr Aufmerksamkeit als reine\nDarstellungsfehler. Berücksichtige zusätzlich Pflichtvorgaben, bereits\nvorhandene Schutzmaßnahmen und die Entdeckbarkeit eines Fehlers.<\/p>\n<blockquote>\n<p>MERKSATZ: Build erfolgreich ist nicht gleich Software\nqualitätsgesichert; Test bestanden ist nicht gleich freigabefähig.\nEntscheidend sind Umfang, Aussagekraft, Risiken und dokumentierte\nFreigabekriterien.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 10, "title": "Software- und Anwenderdokumentation", "lesson": "\n\n<section class=\"level3\" id=\"unterschiedliche-zielgruppen-benötigen-unterschiedliche-dokumente\">\n<h3>10.1 Unterschiedliche Zielgruppen benötigen unterschiedliche\nDokumente<\/h3>\n<p><strong>Technische Dokumentation<\/strong> richtet sich an\nEntwicklung, Betrieb, Wartung und Support. Sie beschreibt Architektur,\nSchnittstellen, Datenmodelle, Konfiguration, Deployment und bekannte\nRisiken. <strong>Anwenderdokumentation<\/strong> richtet sich an\nEndbenutzer und beschreibt Aufgaben und Bedienung mit Beispielen.\n<strong>Administrationshandbücher<\/strong> behandeln Einrichtung,\nRechte, Sicherung, Monitoring und Störungsbehebung.\n<strong>Schulungsunterlagen<\/strong> vermitteln typische Arbeitsabläufe\nin einer didaktischen Reihenfolge.<\/p>\n<\/section>\n<section class=\"level3\" id=\"was-gehört-in-eine-api-dokumentation\">\n<h3>10.2 Was gehört in eine API-Dokumentation?<\/h3>\n<p>Eine API-Dokumentation sollte Zweck, Authentifizierung, Endpunkte,\nMethoden, Anfrage-/Antwortschema, Beispiele, Fehlercodes,\nVersionskonzept und Limits enthalten. Ein Beispiel-Endpunkt\n<code>GET /maschinen/102<\/code> könnte ein JSON-Objekt mit ID, Name und\nStatus liefern. Erkläre auch mögliche Antwortcodes 401, 403 und 404.\nEine formale Beschreibung, etwa OpenAPI, kann Doku und Tests\nunterstützen, ersetzt aber verständliche fachliche Erläuterungen\nnicht.<\/p>\n<\/section>\n<section class=\"level3\" id=\"betriebsdokumentation-und-runbooks\">\n<h3>10.3 Betriebsdokumentation und Runbooks<\/h3>\n<p>Ein <strong>Runbook<\/strong> ist eine konkrete Handlungsanleitung für\neinen wiederkehrenden Betriebsfall: Störung erkennen, Auswirkungen\nbeurteilen, Verantwortliche informieren, sichere Gegenmaßnahme wählen,\nErgebnis dokumentieren. Bei einem fehlgeschlagenen Deployment sollte\nbeschrieben sein, wie Logs geprüft werden, wer die\nGo-/No-Go-Entscheidung trifft und wie Rollback oder Restore sicher\nablaufen. Dokumentiere Voraussetzungen und Abbruchkriterien, statt nur\n„alte Version wiederherstellen“ zu schreiben.<\/p>\n<\/section>\n<section class=\"level3\" id=\"dokumentation-pflegen\">\n<h3>10.4 Dokumentation pflegen<\/h3>\n<p>Gute Dokumentation ist versioniert, auffindbar, rollenbezogen und\nfachlich geprüft. Veraltete Screenshots oder falsche Parameter sind\ngefährlicher als fehlende Ausschmückung. Lege Eigentümer,\nAktualisierungsanlass und Reviewrhythmus fest.\n<strong>Wissensdatenbanken<\/strong> sammeln wiederkehrende Fragen,\nbekannte Störungen, Ursachen und Abhilfen. Ein Wissensartikel sollte\nDatum, Gültigkeitsbereich, Symptom, Lösung und Warnhinweise\nenthalten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"schulungen-planen\">\n<h3>10.5 Schulungen planen<\/h3>\n<p>Ein Schulungskonzept beschreibt Zielgruppe, Lernziele, Vorwissen,\nUmfang, Methoden und Erfolgskontrolle. Beispiel: Instandhalter sollen\nnach 45 Minuten einen Auftrag erstellen, einem Gerät zuordnen und\nabschließen können. Nutze anwendungsnahe Übungen und frage am Ende nach\nkonkretem Handlungswissen statt bloß nach Zufriedenheit. Barrierearme\nSprache und zugängliche Materialien verbessern die Nutzbarkeit.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Erkläre immer, <strong>für wen<\/strong> du ein\nDokument erstellst, <strong>welche Entscheidung oder Tätigkeit<\/strong>\nes unterstützt und <strong>wie<\/strong> Aktualität und Verständlichkeit\ngesichert werden.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 11, "title": "Softwareeinführung, Abnahme und Betrieb", "lesson": "\n\n<section class=\"level3\" id=\"entwicklungs--test--staging--und-produktivumgebung\">\n<h3>11.1 Entwicklungs-, Test-, Staging- und Produktivumgebung<\/h3>\n<p>Die <strong>Entwicklungsumgebung<\/strong> dient Änderungen und\nlokalen Prüfungen, die <strong>Testumgebung<\/strong> definierten\nPrüfungen, <strong>Staging<\/strong> möglichst produktionsnahen Proben\nund <strong>Produktion<\/strong> dem tatsächlichen Betrieb. Die Trennung\nverhindert nicht alle Fehler, reduziert aber unmittelbare Auswirkungen\nunfertiger Änderungen. Testdaten sollten personenbezogene Daten nicht\nunnötig offenlegen; nutze synthetische oder anonymisierte Daten, wenn\nmöglich.<\/p>\n<\/section>\n<section class=\"level3\" id=\"abnahme-vorbereiten\">\n<h3>11.2 Abnahme vorbereiten<\/h3>\n<p>Eine <strong>Abnahme<\/strong> ist die vereinbarte Feststellung, ob\ndie Lösung die geschuldeten Kriterien erfüllt. Vorher definiert man\nTestfälle, Beteiligte, Abnahmeumgebung, Nachweisform, Umgang mit\nRestmängeln und Entscheidungsbefugnisse. Ein\n<strong>Abnahmeprotokoll<\/strong> enthält Version, Datum, geprüfte\nKriterien, Ergebnis, offene Mängel, Vorbehalte und Freigabeentscheidung.\nVertragliche Folgen unterscheiden sich je nach Vertrag und gelten nicht\nautomatisch aus dem Teststatus.<\/p>\n<\/section>\n<section class=\"level3\" id=\"deployment--und-rollout-strategien\">\n<h3>11.3 Deployment- und Rollout-Strategien<\/h3>\n<p><strong>Big Bang:<\/strong> alle Benutzer werden zu einem Termin\numgestellt; organisatorisch einfach, bei Fehlern breiter betroffen.\n<strong>Canary:<\/strong> zunächst kleiner Anteil, dann schrittweise\nErweiterung; erlaubt kontrollierte Beobachtung.\n<strong>Blue-Green:<\/strong> zwei vorbereitete Umgebungen, Umschaltung\nnach Prüfung; vereinfacht bei passender Architektur das Zurückwechseln.\n<strong>Rolling Deployment:<\/strong> Instanzen werden nacheinander\nersetzt. Beachte stets gemeinsam genutzte Datenbankänderungen; sie\nkönnen selbst bei Canary oder Blue-Green Auswirkungen auf alle Nutzer\nhaben.<\/p>\n<\/section>\n<section class=\"level3\" id=\"release-patch-rollback-und-migration\">\n<h3>11.4 Release, Patch, Rollback und Migration<\/h3>\n<p>Ein <strong>Release<\/strong> ist eine für die Nutzung vorgesehene\nVersion, ein <strong>Patch<\/strong> eine gezielte Korrektur, ein\n<strong>Update<\/strong> eine Änderung beziehungsweise Aktualisierung.\nEin <strong>Rollback<\/strong> kehrt zu einem vorherigen Softwarestand\nzurück, sofern dies technisch sicher möglich ist. Bei\nDatenbankmigrationen reicht das Rückspielen einer älteren Anwendung oft\nnicht aus. Plane Datenmigration, Abwärtskompatibilität, Backup und\nRestore als gemeinsamen Ablauf. Teste mit repräsentativen Datenmengen\nund dokumentiere notwendige Wartungsfenster.<\/p>\n<\/section>\n<section class=\"level3\" id=\"go-no-go-entscheidung\">\n<h3>11.5 Go-/No-Go-Entscheidung<\/h3>\n<p>Vor Produktivsetzung prüft das zuständige Gremium beispielsweise:\nkritische Tests bestanden, offene Fehler und Restrisiken bewertet,\nBackup und Wiederherstellung getestet, Betriebsüberwachung vorbereitet,\nSupport informiert, Schulungen durchgeführt, Rückfallplan\nfunktionsfähig. Ein <strong>Go<\/strong> ist keine Garantie für\nFehlerfreiheit; ein <strong>No-Go<\/strong> schützt vor nicht\nverantwortbaren Risiken. Trenne die fachliche Freigabeentscheidung von\nder technischen Ausführung.<\/p>\n<\/section>\n<section class=\"level3\" id=\"rpo-rto-und-datensicherung\">\n<h3>11.6 RPO, RTO und Datensicherung<\/h3>\n<p><strong>RPO (Recovery Point Objective)<\/strong> bezeichnet das\nmaximal tolerierbare Alter des Wiederherstellungspunkts beziehungsweise\nden tolerierten Datenverlust als Zeitspanne. <strong>RTO (Recovery Time\nObjective)<\/strong> bezeichnet die angestrebte maximale Dauer bis zur\nWiederherstellung einer Leistung. Ein RPO von 30 Minuten erfordert\ngeeignete Sicherungs- oder Replikationsverfahren; ein nächtliches Backup\nallein genügt typischerweise nicht. Ein RTO von zwei Stunden verlangt\nzudem, dass Restore, Infrastruktur und Freigabe rechtzeitig durchgeführt\nwerden können. Das BSI fordert, RPO und die tatsächliche\nWiederherstellbarkeit im Sicherungskonzept zu berücksichtigen. [Q3]<\/p>\n<\/section>\n<section class=\"level3\" id=\"support-betrieb-und-monitoring\">\n<h3>11.7 Support, Betrieb und Monitoring<\/h3>\n<p>Nach dem Rollout beginnt der Lebenszyklus erst richtig. Definiere\nKontaktwege, Supportlevel (1st/2nd/3rd Level), Eskalation, Incident- und\nProblem-Management. Ein <strong>Incident<\/strong> ist eine aktuelle\nBeeinträchtigung, ein <strong>Problem<\/strong> die zugrunde liegende\nbeziehungsweise vermutete Ursache wiederkehrender Vorfälle.\n<strong>Monitoring<\/strong> erfasst Zustände und Metriken,\n<strong>Logging<\/strong> Ereignisse, <strong>Tracing<\/strong> Abläufe\nüber mehrere Dienste. Sinnvolle Alarmierung meldet relevante\nAbweichungen statt jede technische Kleinigkeit.<\/p>\n<blockquote>\n<p>MERKSATZ: Eine sichere Einführung benötigt getestete Software,\ndokumentierte Abnahme, vorbereiteten Betrieb, geschulte Nutzer und einen\nrealistischen Notfall-/Rückfallplan.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 12, "title": "Evaluation und kontinuierliche Verbesserung", "lesson": "\n\n<section class=\"level3\" id=\"was-bedeutet-evaluation\">\n<h3>12.1 Was bedeutet Evaluation?<\/h3>\n<p><strong>Evaluation<\/strong> überprüft nach definierten Kriterien, ob\neine Software oder ein Entwicklungsprozess die angestrebten Ziele\nerreicht. Beispiel: Vor Einführung brauchten Mitarbeiter im Durchschnitt\nsechs Minuten zur Erfassung eines Wartungsauftrags; danach drei. Das\nErgebnis ist aussagekräftiger, wenn die Messbedingungen vergleichbar\nsind und keine relevanten Nebenwirkungen übersehen werden. Eine gute\nEvaluation beginnt bereits bei der Anforderungsanalyse mit messbaren\nZielen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"kennzahlen-und-kpis\">\n<h3>12.2 Kennzahlen und KPIs<\/h3>\n<p><strong>KPI (Key Performance Indicator)<\/strong> ist eine wesentliche\nKennzahl, die einen Zielerreichungsgrad sichtbar macht. Typische Größen\nsind Antwortzeit (z. B. P95), Fehlerrate, Verfügbarkeit, Supporttickets,\nBearbeitungsdauer, Anzahl kritischer Fehler, Nutzerzufriedenheit oder\nWiederherstellungsdauer. Vermeide reine Aktivitätskennzahlen wie „Anzahl\ngeschriebener Codezeilen“ als Qualitätsbeleg. Jede Kennzahl braucht\nDefinition, Datenquelle, Erfassungsintervall, Zielwert und\nVerantwortlichen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"pdca-und-ursachenanalyse\">\n<h3>12.3 PDCA und Ursachenanalyse<\/h3>\n<p>Der <strong>PDCA-Zyklus<\/strong> besteht aus Plan, Do, Check und Act:\nVerbesserung planen, im geeigneten Rahmen umsetzen, Wirkung prüfen und\nErkenntnisse in Standards übernehmen oder nachbessern. <strong>Root\nCause Analysis<\/strong> sucht die Ursache hinter Symptomen. Hilfreich\nsind die <strong>5-Why-Methode<\/strong> und ein\n<strong>Ishikawa-Diagramm<\/strong>. Beispiel: Wartungsaufträge\nerscheinen verspätet → API ist langsam → Datenbankabfrage dauert → Index\nfehlt → Zugriffsmuster wurden bei der Planung nicht geprüft. Die\neigentliche Maßnahme ist nicht nur „Server schneller machen“, sondern\ndas Datenzugriffsverhalten überprüfen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"prozess--und-produktverbesserung-unterscheiden\">\n<h3>12.4 Prozess- und Produktverbesserung unterscheiden<\/h3>\n<p><strong>Produktverbesserung<\/strong> verändert die Anwendung, etwa\nLadezeit reduzieren. <strong>Prozessverbesserung<\/strong> verändert\nArbeitsweisen, etwa Tester schon in der Anforderungsphase einbeziehen.\nBeides kann zusammenhängen, sollte aber getrennt bewertet werden. Nach\neiner Retrospektive können ein oder zwei konkret messbare Maßnahmen in\nden nächsten Sprint übernommen und überprüft werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lessons-learned-und-wissensmanagement\">\n<h3>12.5 Lessons Learned und Wissensmanagement<\/h3>\n<p>Dokumentiere Anlass, Beobachtungen, Ursachen, Maßnahmen,\nVerantwortliche und Nachverfolgung. Halte sowohl Erfolge als auch\nFehleinschätzungen fest. „Wiederherstellung nie getestet“ führt nicht\nnur zu einem einmaligen Restore-Test, sondern zu einer dauerhaften Regel\nfür regelmäßige Wiederherstellungsübungen. Wissensmanagement ist erst\nnützlich, wenn Erkenntnisse auffindbar, verständlich und aktuell\nsind.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Formuliere Verbesserungen mit Verantwortlichen,\nMessgrößen und Kontrolltermin. „Wir verbessern die Kommunikation“ ist\nkeine überprüfbare Maßnahme.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 13, "title": "IT-Sicherheit und sichere Softwareentwicklung", "lesson": "\n\n<section class=\"level3\" id=\"schutzziele-und-bedrohungen\">\n<h3>13.1 Schutzziele und Bedrohungen<\/h3>\n<p>Die klassischen Schutzziele der Informationssicherheit sind\n<strong>Vertraulichkeit<\/strong> (nur Berechtigte erhalten Einsicht),\n<strong>Integrität<\/strong> (Daten bleiben korrekt und unverfälscht) und\n<strong>Verfügbarkeit<\/strong> (Dienste stehen bei Bedarf bereit).\nErgänzend sind Authentizität, Nachvollziehbarkeit und Verbindlichkeit\nwichtig. Eine <strong>Schwachstelle<\/strong> ist eine ausnutzbare\nSchwäche, eine <strong>Bedrohung<\/strong> ein mögliches schädigendes\nEreignis und ein <strong>Risiko<\/strong> die bewertete Möglichkeit\nnegativer Folgen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"authentifizierung-autorisierung-least-privilege\">\n<h3>13.2 Authentifizierung, Autorisierung, Least Privilege<\/h3>\n<p><strong>Authentifizierung<\/strong> prüft Identität („Wer bist du?“),\n<strong>Autorisierung<\/strong> prüft Befugnisse („Was darfst du?“).\nRollenbasierte Zugriffskontrolle (<strong>RBAC<\/strong>) ordnet Rechte\nRollen zu, z. B. Instandhalter, Schichtleitung, Administrator. Das\n<strong>Least-Privilege-Prinzip<\/strong> vergibt nur notwendige Rechte.\nEin Frontend darf Berechtigungen anzeigen, aber die sicherheitsrelevante\nPrüfung muss auf der durchsetzenden Serverseite erfolgen.\n<strong>Mehrfaktor-Authentisierung (MFA)<\/strong> verwendet mindestens\nzwei unabhängige Faktoren, zum Beispiel Passwort und Besitzfaktor.<\/p>\n<\/section>\n<section class=\"level3\" id=\"passwörter-hashing-verschlüsselung\">\n<h3>13.3 Passwörter, Hashing, Verschlüsselung<\/h3>\n<p>Passwörter dürfen nicht im Klartext gespeichert werden. Geeignete\nPasswort-Hash-Verfahren wie Argon2id verwenden pro Passwort einen\nzufälligen Salt und eine bewusst aufwendige Berechnung.\n<strong>Hashing<\/strong> ist nicht dasselbe wie Verschlüsselung: Hashing\nist für Einwegprüfungen gedacht, Verschlüsselung für später wieder\nentschlüsselbare Informationen. <strong>TLS<\/strong> schützt Daten\nwährend der Übertragung; Datenträgerverschlüsselung kann gespeicherte\nDaten schützen. Schlüssel und Geheimnisse brauchen sicheren\nLebenszyklus, Zugriffskontrolle und Rotation.<\/p>\n<\/section>\n<section class=\"level3\" id=\"eingabevalidierung-und-typische-schwachstellen\">\n<h3>13.4 Eingabevalidierung und typische Schwachstellen<\/h3>\n<p>Ungültige Eingaben können Datenqualität oder Sicherheit gefährden.\n<strong>SQL Injection<\/strong> entsteht unter anderem, wenn Eingaben\nungeprüft in SQL-Befehle eingefügt werden. Schutz: parametrisierte\nDatenbankabfragen und minimale Rechte. <strong>Cross-Site Scripting\n(XSS)<\/strong> bedeutet, dass fremde Skripte im Browserkontext\nausgeführt werden; Gegenmaßnahmen sind kontextgerechte Ausgabecodierung,\nsichere Framework-Nutzung und ergänzende Schutzmechanismen.\n<strong>Broken Access Control<\/strong> tritt auf, wenn fremde Daten oder\nFunktionen trotz fehlender Berechtigung erreichbar sind. Die OWASP Top\n10:2025 nennt unter anderem mangelhafte Zugriffskontrolle,\nFehlkonfiguration, Lieferkettenprobleme, unsichere Kryptografie,\nInjection und Authentifizierungsfehler. [Q5]<\/p>\n<\/section>\n<section class=\"level3\" id=\"security-by-design-und-datenschutz-by-design\">\n<h3>13.5 Security by Design und Datenschutz by Design<\/h3>\n<p>Sicherheit sollte schon bei Anforderungen und Architektur\nberücksichtigt werden: Schutzbedarf bestimmen, Angriffsflächen\nidentifizieren, Rechte prüfen, Eingaben validieren, Geheimnisse\nschützen, sichere Voreinstellungen wählen, protokollieren und Tests\nplanen. <strong>Threat Modeling<\/strong> überlegt systematisch, welche\nAngreifer oder Fehlbedienungen welche Komponenten und Daten bedrohen.\nEine unabhängige Sicherheitsprüfung vor der Freigabe ist bei kritischen\nAnwendungen sinnvoll.<\/p>\n<\/section>\n<section class=\"level3\" id=\"backup-notfallpläne-und-risikobehandlung\">\n<h3>13.6 Backup, Notfallpläne und Risikobehandlung<\/h3>\n<p>Ein Datensicherungskonzept behandelt Sicherungsumfang, Häufigkeit,\nVerschlüsselung, Zugriff, getrennte Aufbewahrung, Aufbewahrungsdauer und\nRestore-Tests. Die bekannte <strong>3-2-1-Regel<\/strong> lautet als\nAusgangspunkt: drei Datenkopien, auf zwei unterschiedlichen Medien,\ndavon eine außer Haus beziehungsweise getrennt. Zusätzlich sind\nunveränderbare oder offline geschützte Sicherungen für bestimmte\nBedrohungslagen nützlich. Ein Backup wird erst durch erfolgreich\ngetestete Wiederherstellung betriebspraktisch glaubwürdig. [Q3]<\/p>\n<p>Risikobehandlung umfasst <strong>Vermeidung<\/strong> (riskante\nTätigkeit unterlassen), <strong>Minderung<\/strong> (Eintritt oder\nSchaden reduzieren), <strong>Übertragung<\/strong> (bestimmte finanzielle\nFolgen verlagern) und <strong>Akzeptanz<\/strong> (bewusstes Restrisiko).\nBei der Bewertung dokumentiere Wahrscheinlichkeit, Auswirkungen,\nMaßnahmen, verantwortliche Person und Restbewertung.<\/p>\n<blockquote>\n<p>MERKSATZ: Sicherheitsanforderungen sind ein Teil des gesamten\nLebenszyklus – sie können nicht erst unmittelbar vor dem Release\n„hinzugefügt“ werden.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 14, "title": "Datenschutz, Recht, Lizenzen, Nachhaltigkeit", "lesson": "\n\n<section class=\"level3\" id=\"personenbezogene-daten-und-dsgvo\">\n<h3>14.1 Personenbezogene Daten und DSGVO<\/h3>\n<p><strong>Personenbezogene Daten<\/strong> sind Informationen, die sich\nauf identifizierte oder identifizierbare natürliche Personen beziehen,\netwa Mitarbeitername, Personalnummer oder zuordenbare\nNutzungsprotokolle. Die DSGVO verlangt unter anderem Rechtmäßigkeit,\nZweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung sowie\nIntegrität und Vertraulichkeit. Eine Rechtsgrundlage ist erforderlich;\neine Einwilligung ist nicht in jeder Unternehmenssituation die passende\noder notwendige Grundlage. Die konkrete Bewertung erfolgt anhand des\nVerarbeitungskontexts. [Q2]<\/p>\n<\/section>\n<section class=\"level3\" id=\"privacy-by-design-rollen-und-verträge\">\n<h3>14.2 Privacy by Design, Rollen und Verträge<\/h3>\n<p>Datenschutz durch Technikgestaltung bedeutet, notwendige\nSchutzmaßnahmen bei Planung und Entwicklung zu berücksichtigen.\nDatenschutzfreundliche Voreinstellungen minimieren Daten und Zugriffe.\nKläre Verantwortlichenrollen, Zugriffe, Löschfristen, Auskunftsprozesse\nund gegebenenfalls Auftragsverarbeitungsverträge. Eine\n<strong>Datenschutz-Folgenabschätzung<\/strong> kann bei voraussichtlich\nhohem Risiko erforderlich sein. Datenschutz und Informationssicherheit\nüberschneiden sich, sind aber nicht identisch.<\/p>\n<\/section>\n<section class=\"level3\" id=\"urheberrecht-und-softwarelizenzen\">\n<h3>14.3 Urheberrecht und Softwarelizenzen<\/h3>\n<p>Software ist grundsätzlich urheberrechtlich geschützt. Eine Lizenz\nbestimmt, unter welchen Bedingungen Software genutzt, verändert und\nweitergegeben werden darf. <strong>Proprietäre Lizenzmodelle<\/strong>\ngewähren bestimmte vertragliche Nutzungsrechte.\n<strong>Open-Source-Lizenzen<\/strong> können Nutzung und Quelloffenheit\nerlauben, haben aber unterschiedliche Pflichten (Hinweise, Lizenztexte,\nteilweise Offenlegung abgeleiteter Werke). Prüfe Abhängigkeiten, Rechte\nund Lizenzkompatibilität, besonders bei Weitergabe an Kunden. Diese\nÜbersicht ersetzt keine rechtliche Prüfung.<\/p>\n<\/section>\n<section class=\"level3\" id=\"verträge-abnahme-haftung-und-it-compliance\">\n<h3>14.4 Verträge, Abnahme, Haftung und IT-Compliance<\/h3>\n<p>Beachte Projektvertrag, Leistungsspezifikation, Rechte an\nErgebnissen, Geheimhaltung, Support, Wartung, Servicelevels und\nAbnahmekriterien. Die konkrete rechtliche Einordnung hängt vom Vertrag\nund Einzelfall ab. <strong>Compliance<\/strong> bedeutet die Einhaltung\neinschlägiger Vorgaben, Richtlinien und Verpflichtungen; dokumentierte\nFreigaben und Nachweise unterstützen die Nachvollziehbarkeit. Prüfe auch\nbetriebliche Regeln wie Berechtigungskonzepte und interne\nChange-Prozesse.<\/p>\n<\/section>\n<section class=\"level3\" id=\"barrierefreiheit-ethik-und-nachhaltiges-wirtschaften\">\n<h3>14.5 Barrierefreiheit, Ethik und nachhaltiges Wirtschaften<\/h3>\n<p>Gute Software berücksichtigt Menschen mit unterschiedlichen\nEinschränkungen, etwa Tastaturbedienung, ausreichende Kontraste,\nverständliche Fehlermeldungen und Unterstützung assistiver Technik.\nEthische Fragen betreffen Transparenz, faire Behandlung, Überwachung,\nFehlentscheidungen und unbeabsichtigte Wirkungen. Nachhaltigkeit kann\nunter anderem energieeffiziente Systeme, längere Hardware-Nutzung,\nweniger Datenübertragung und ressourcenschonenden Betrieb umfassen.\nWirtschaftlichkeit, Schutzanforderungen und Nachhaltigkeit sollten\ngemeinsam bewertet werden, nicht isoliert.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Prüfe bei einer neuen Mitarbeitersoftware nicht\nnur Funktionsumfang, sondern auch Rechtsgrundlage, Zugriff,\nAufbewahrung, Dokumentation, Betroffenenrechte und organisatorische\nVerantwortung.<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 15, "title": "Projektunterstützung, Zeitplanung und Kalkulation", "lesson": "\n\n<section class=\"level3\" id=\"projektziele-scope-und-stakeholder\">\n<h3>15.1 Projektziele, Scope und Stakeholder<\/h3>\n<p>Ein Projekt ist eine zeitlich begrenzte, zielgerichtete Aufgabe mit\nRessourcen und Unsicherheiten. Formuliere Ziele <strong>SMART<\/strong>:\nspezifisch, messbar, attraktiv/akzeptiert, realistisch und terminiert.\nBeispiel: „Bis 30. November sollen 90 % aller Wartungsaufträge digital\nerfasst werden, ohne kritische Zuordnungsfehler.“ Definiere\nProjektumfang, Abgrenzungen und Erfolgskriterien ausdrücklich. Ein\n<strong>Stakeholderregister<\/strong> hilft, Interessen,\nInformationsbedarf und Einfluss zu erfassen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"projektstrukturplan-meilensteine-und-abhängigkeiten\">\n<h3>15.2 Projektstrukturplan, Meilensteine und Abhängigkeiten<\/h3>\n<p>Ein <strong>Projektstrukturplan (PSP)<\/strong> zerlegt das\nGesamtvorhaben in Arbeitspakete. Ein <strong>Meilenstein<\/strong>\nmarkiert einen wesentlichen überprüfbaren Punkt, z. B. „Anforderungen\nfreigegeben“ oder „Abnahme bestanden“. Ein Zeitplan ordnet Arbeit,\nDauer, Abhängigkeiten und Ressourcen. Ein <strong>kritischer\nPfad<\/strong> besteht aus Vorgängen, deren Verzögerung ohne Puffer den\nEndtermin beeinflusst. <strong>Gantt-Diagramme<\/strong> zeigen Zeiträume\nund Überschneidungen; bei komplexen Änderungen ist zusätzlich ein\nAbhängigkeitsplan sinnvoll.<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufwand-dauer-und-kosten-unterscheiden\">\n<h3>15.3 Aufwand, Dauer und Kosten unterscheiden<\/h3>\n<p><strong>Aufwand<\/strong> ist Arbeitsmenge, etwa 40 Personenstunden.\n<strong>Dauer<\/strong> ist Kalenderzeit, etwa fünf Arbeitstage. Zwei\nPersonen halbieren die Dauer nicht automatisch, weil Einarbeitung,\nAbstimmung und Abhängigkeiten anfallen. Grobe Schätzmethoden sind\nExpertenurteil, Analogieschätzung, Drei-Punkt-Schätzung und Zerlegung in\nArbeitspakete. Eine einfache Drei-Punkt-PERT-Schätzung lautet\n<code>E = (optimistisch + 4 × wahrscheinlich + pessimistisch) / 6<\/code>;\nsie ist nur ein Näherungsmodell.<\/p>\n<p><strong>Projektkosten<\/strong> enthalten Arbeitszeit, Lizenzen,\nInfrastruktur, Schulungen, Betrieb, Wartung, Tests und Risikopuffer.\n<strong>TCO (Total Cost of Ownership)<\/strong> betrachtet die\nGesamtkosten über den Lebenszyklus, nicht nur Anschaffungskosten. Ein\nROI oder Break-even sollte nur mit transparenten Annahmen berechnet\nwerden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"ressourcen--und-kommunikationsplanung\">\n<h3>15.4 Ressourcen- und Kommunikationsplanung<\/h3>\n<p>Ein Ressourcenplan klärt benötigte Rollen, Verfügbarkeit, Kompetenzen\nund Engpässe. Ein <strong>RACI-Modell<\/strong> ordnet Responsible\n(ausführend), Accountable (endverantwortlich), Consulted (einzubeziehen)\nund Informed (zu informieren) zu. Für jede Aufgabe sollte die\nLetztverantwortung klar sein. Ein Kommunikationsplan legt fest, wer\nwelche Informationen wann und über welchen Kanal erhält. Ein kurzer\nStatusbericht nennt Fortschritt, nächste Schritte, Risiken,\nEntscheidungen und Unterstützungsbedarf.<\/p>\n<\/section>\n<section class=\"level3\" id=\"projektcontrolling-und-kennzahlen\">\n<h3>15.5 Projektcontrolling und Kennzahlen<\/h3>\n<p>Vergleiche <strong>Plan<\/strong> und <strong>Ist<\/strong> für\nTermine, Aufwand, Kosten und Qualität. Abweichungen sollten erklärt und\nmit Gegenmaßnahmen verbunden werden. Beispiel: „Migrationstest liegt\ndrei Tage zurück, weil keine produktionsnahe Testdatenbank verfügbar\nist; Maßnahme: Bereitstellung bis Mittwoch; Auswirkungen auf Go-live neu\nbewerten.“ Transparenz ist besser als ein formal grüner Status ohne\nbelastbare Nachweise.<\/p>\n<\/section>\n<section class=\"level3\" id=\"scrum-kanban-und-klassische-planung\">\n<h3>15.6 Scrum, Kanban und klassische Planung<\/h3>\n<p><strong>Scrum<\/strong> ist ein leichtgewichtiges Rahmenwerk für\nkomplexe Produktentwicklung. Verantwortlichkeiten: Product Owner\nmaximiert den Wert und verantwortet Product Backlog, Scrum Master\nunterstützt Scrum-Verständnis und -Wirksamkeit, Developers erstellen das\nSprint Backlog und das nutzbare Increment. Ereignisse: Sprint, Sprint\nPlanning, Daily Scrum, Sprint Review und Sprint Retrospective. Ein\nSprint dauert höchstens einen Monat. [Q6]<\/p>\n<p><strong>Product Backlog<\/strong> enthält geordnete Produktarbeiten,\n<strong>Sprint Backlog<\/strong> Sprintziel, ausgewählte Arbeiten und\nUmsetzungsplan, <strong>Increment<\/strong> ein überprüfbares nutzbares\nErgebnis. Die <strong>Definition of Done<\/strong> beschreibt\nübergreifende Qualitätsanforderungen. <strong>Sprint Review<\/strong>\nbetrachtet Produkt und Feedback, <strong>Retrospektive<\/strong>\nZusammenarbeit und Prozess. <strong>Kanban<\/strong> visualisiert\nArbeitsfluss und begrenzt parallele Arbeit (WIP-Limits); es lässt sich\nauch außerhalb von Scrum nutzen. Klassische Planung ist bei stabilen,\nfesten Vorgaben nützlich; hybride Modelle verbinden Ansätze je nach\nKontext.<\/p>\n<\/section>\n<section class=\"level3\" id=\"risiken-im-projekt-aktiv-führen\">\n<h3>15.7 Risiken im Projekt aktiv führen<\/h3>\n<p>Ein <strong>Risikoregister<\/strong> enthält Ereignis, Ursache,\nAuswirkung, Bewertung, Maßnahme, Eigentümer und Kontrolltermin.\nUnterscheide ein noch mögliches Risiko von einem bereits eingetretenen\nProblem. Eskaliere sachlich: „Backup-Restore ungeprüft, möglicher\nDatenverlust, Testtermin offen, Go-live gefährdet; Entscheidung\nerforderlich.“ Dokumentiere Annahmen und bewerte Restrisiken erneut,\nwenn sich Rahmenbedingungen verändern.<\/p>\n<blockquote>\n<p>MERKSATZ: Ein guter Projektstatus nennt nicht nur erledigte Aufgaben,\nsondern gibt eine belastbare Antwort auf die Fragen: Sind Ziel,\nQualität, Termin und Budget noch erreichbar – und was muss entschieden\nwerden?<\/p>\n<\/blockquote>\n<\/section>\n", "questions": 4}, {"id": 16, "title": "Softwareentwurf, Fachmodelle und Schnittstellen im Detail", "lesson": "\n\n<section class=\"level3\" id=\"vom-geschäftsprozess-zur-systemfunktion\">\n<h3>16.1 Vom Geschäftsprozess zur Systemfunktion<\/h3>\n<p>Ein betrieblicher Prozess beschreibt zusammengehörige Tätigkeiten mit\nAuslöser, Beteiligten, Regeln und Ergebnis. Für die Wartungssoftware\nkönnte er lauten: Maschine meldet Störung → Mitarbeiter erfasst Meldung\n→ Vorgesetzter priorisiert → Auftrag wird zugewiesen → Techniker\ndokumentiert Maßnahme → Auftrag wird geschlossen. Identifiziere an jedem\nSchritt erforderliche Daten, Verantwortlichkeiten, Varianten und\nFehlerfälle. So wird aus einem mündlich beschriebenen Ablauf ein\nbelastbarer Lösungsentwurf.<\/p>\n<p>Wichtig ist die Unterscheidung von <strong>Ist-Prozess<\/strong> und\n<strong>Soll-Prozess<\/strong>. Der Ist-Prozess zeigt, wie heute\ngearbeitet wird; der Soll-Prozess beschreibt den künftigen Ablauf. Eine\nneue App sollte nicht automatisch einen unnötig komplizierten Altprozess\ndigital kopieren. Prüfe zuerst, ob Schritte entfallen oder\nstandardisiert werden können.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fachliches-und-technisches-datenmodell\">\n<h3>16.2 Fachliches und technisches Datenmodell<\/h3>\n<p>Ein fachliches Modell zeigt Geschäftsobjekte und ihre Beziehungen:\nMaschine (1) → (n) Wartungsauftrag, Mitarbeiter (1) → (n) erfasste\nAufträge. Ein technisches Datenmodell ergänzt konkrete Datentypen,\nSchlüssel, Nullbarkeit, Constraints und Indizes. Beispiel:\n<code>Wartungsauftrag.AuftragID<\/code> als nichtleerer Primärschlüssel;\n<code>MaschinenID<\/code> als Pflicht-Fremdschlüssel; <code>Status<\/code>\nmit definiertem Wertebereich. Für jedes Feld sollten Zweck, Format und\nValidierung klar sein.<\/p>\n<p><strong>ER-Diagramme<\/strong> (Entity Relationship) machen Entitäten,\nAttribute und Kardinalitäten sichtbar. Bei einer n:m-Beziehung, etwa\nMitarbeiter zu Schulung, legt man eine Zuordnungstabelle an. Bei\nhistorisierungsbedürftigen Daten (z. B. frühere Maschinenstandorte)\nreicht ein einzelnes überschriebenes Feld nicht immer; dann braucht man\nein Zeitmodell oder eine Historientabelle.<\/p>\n<\/section>\n<section class=\"level3\" id=\"entwurf-von-schnittstellen\">\n<h3>16.3 Entwurf von Schnittstellen<\/h3>\n<p>Definiere eine API anhand fachlicher Ressourcen. Beispiel:\n<code>GET /maschinen<\/code> listet Maschinen,\n<code>GET /maschinen/102<\/code> zeigt eine Maschine,\n<code>POST /wartungsauftraege<\/code> legt einen Auftrag an. Ein\nSchnittstellenvertrag beantwortet: Wer ruft auf? Welche Berechtigungen\ngelten? Welche Felder sind Pflicht? Wie werden ungültige Eingaben\ngemeldet? Welche Antwortzeiten und Versionsregeln gelten? Welche\nEreignisse werden protokolliert?<\/p>\n<p><strong>Schema-Validierung<\/strong> prüft Typen und Strukturen,\nbeispielsweise dass <code>maschinenId<\/code> eine Zahl ist.\n<strong>Fachliche Validierung<\/strong> prüft Regeln, beispielsweise dass\ndie referenzierte Maschine existiert und aktiv sein muss.\n<strong>Autorisierung<\/strong> prüft, ob der konkrete Benutzer den\nAuftrag anlegen darf. Diese drei Prüfungen erfüllen unterschiedliche\nZwecke und sollten nicht vermischt werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"api-versionierung-und-kompatibilität\">\n<h3>16.4 API-Versionierung und Kompatibilität<\/h3>\n<p>Eine Schnittstellenänderung ist <strong>rückwärtskompatibel<\/strong>,\nwenn bestehende berechtigte Clients unter den vereinbarten Bedingungen\nweiterhin funktionieren. Ein neues optionales Feld ist oft relativ\nunproblematisch; das Umbenennen eines Pflichtfelds kann bestehende\nClients brechen. Für Änderungen gibt es mehrere Strategien: additive\nErweiterungen, explizite API-Versionen, frühzeitige Deprecation-Hinweise\nund Übergangsfristen. Zur Absicherung nutzt man <strong>Contract\nTests<\/strong>, die Erwartungen zwischen Diensten überprüfen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"synchrone-und-ereignisgesteuerte-architektur\">\n<h3>16.5 Synchrone und ereignisgesteuerte Architektur<\/h3>\n<p>Synchron: Das Frontend ruft das Backend auf und wartet auf die\nAntwort. Das ist einfach nachzuvollziehen, aber ein langsamer\nBackend-Dienst verlängert die Antwortzeit. Ereignisgesteuert: Nach der\nAuftragserfassung wird ein Ereignis „WartungsauftragErstellt“\nveröffentlicht; ein anderer Dienst erzeugt später eine Benachrichtigung.\nDas entkoppelt Abläufe, führt aber zu zusätzlichen Fragen: Was passiert\nbei verspäteter Zustellung? Wie erkennt man doppelte Nachrichten? Wie\nwird ein Fehler nachträglich korrigiert?<\/p>\n<p>In verteilten Systemen gilt oft <strong>eventual\nconsistency<\/strong>: Nicht alle beteiligten Dienste besitzen jederzeit\ndenselben Datenstand. Das kann akzeptabel sein, wenn Anforderungen und\nNutzerführung darauf abgestimmt sind. Für eine verbindliche\nMaschinenzuordnung kann sofortige Konsistenz dagegen entscheidend\nsein.<\/p>\n<\/section>\n<section class=\"level3\" id=\"uml-in-vier-mini-beispielen\">\n<h3>16.6 UML in vier Mini-Beispielen<\/h3>\n<p><strong>Use Case:<\/strong> Akteur „Instandhalter“ führt\n„Wartungsauftrag erstellen“ aus. <strong>Aktivitätsablauf:<\/strong>\nLogin prüfen → Maschinen-ID eingeben → Existenz prüfen → Auftrag\nspeichern → Erfolg anzeigen; bei Fehler: Meldung anzeigen.\n<strong>Sequenz:<\/strong> Benutzer → Frontend → API → Geschäftslogik →\nDatenbank → Antwort. <strong>Komponentenmodell:<\/strong> Web-Frontend\nbenötigt Wartungs-API; Wartungsservice benötigt Datenzugriff. Zeichne\nzuerst die fachlich wesentlichen Elemente, nicht alle technischen\nEinzelheiten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"architekturqualität-und-technische-schulden\">\n<h3>16.7 Architekturqualität und technische Schulden<\/h3>\n<p><strong>Technische Schulden<\/strong> sind zukünftige Mehrkosten durch\ngegenwärtige, oft bewusst eingegangene technische Vereinfachungen. Sie\nkönnen sinnvoll sein, wenn sie tran
