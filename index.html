<script id="quizdata" type="application/json">{"version":3,"modules":[{"id":0,"title":"Prüfungs-Kickoff: Abschluss, Prüfung und Kursfahrplan","description":"Orientierung zum Abschluss und zur Prüfung. Separater Kickoff laut Kursübersicht.","examRelevant":false},{"id":1,"title":"Lern- und Arbeitsmethodik","description":"Methodische Grundlage für den Lehrgang; laut Kursübersicht kein eigener Prüfungsschwerpunkt.","examRelevant":false},{"id":2,"title":"Analysieren und Planen der Softwarearchitektur","description":"Kundenbedarf, Anforderungen, bestehende Architektur, Design, Datenmodelle, Migration und Wartung. 60 UE laut Kursübersicht.","examRelevant":true},{"id":3,"title":"Entwickeln von Softwarearchitekturen","description":"Schnittstellen, Datenbanken, Implementierung, Entwicklungsqualität, Lieferprozess und Sicherheit. 60 UE laut Kursübersicht.","examRelevant":true},{"id":4,"title":"Sicherstellen der Produktqualität","description":"Qualitätsziele, Testplanung, Testumgebung, Verfahren, Ergebnisse und Verbesserungen.","examRelevant":true},{"id":5,"title":"Software- und Anwenderdokumentation erstellen","description":"Entwicklungs-, Betriebs- und Anwenderdokumentation, Schulungsunterlagen und Wissenspflege.","examRelevant":true},{"id":6,"title":"Übergeben und Einführen des Systems","description":"Abnahme, Übergabe, Rollout und Schulung.","examRelevant":true},{"id":7,"title":"Evaluation als Basis kontinuierlicher Verbesserung","description":"Prozesse bewerten, Datenmodelle und Verfahren verbessern, Erkenntnisse im Wissensmanagement bereitstellen.","examRelevant":true},{"id":8,"title":"Organisatorische und rechtliche Vorgaben","description":"Datensicherheit, Risiken, organisatorische Regeln und rechtliche Anforderungen.","examRelevant":true},{"id":9,"title":"Projektunterstützung und -koordination","description":"Teilprojekte, Termine, Ressourcen, Kalkulation, Statusberichte und projektbezogene Beratung.","examRelevant":true}],"chapters":[{"id":1,"code":"0.1","title":"Prüfung, Taxonomie und Kursfahrplan","module":0,"minutes":180,"examRelevant":false,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Den Abschluss einordnen, Aufgabenoperatoren verstehen und den Kursaufbau für die Vorbereitung nutzen.<\/p><\/div><h3>Berufliche Handlung statt Begriffsliste<\/h3><p>Du planst, entwickelst, implementierst und evaluierst kundenspezifische Softwarelösungen. Eine Fachantwort verbindet Bedarf, Entscheidung, Umsetzung und Kontrolle. Technik, Qualität, Betrieb, wirtschaftliche und rechtliche Rahmenbedingungen gehören zusammen. Die Module 2 bis 9 bilden die acht Fachschwerpunkte deiner Kursübersicht ab.<\/p><h3>Prüfung und Kurszeit unterscheiden<\/h3><p>Die schriftliche Prüfung nach § 6 SEFPrV hat zwei situationsbezogene Aufgaben. Je Aufgabe sind mindestens 90 Minuten vorgesehen, insgesamt soll die Bearbeitung 240 Minuten nicht überschreiten. Die mündliche Prüfung nach § 7 umfasst Präsentation und anschließendes Fachgespräch. Die dort genannten Höchstdauern sind 15 beziehungsweise 30 Minuten. Konkrete Organisation und Termine klärst du mit deiner zuständigen Stelle. Unterrichtszeiten in der Kursübersicht sind keine Prüfungszeiten.<\/p><h3>Operatoren in eine Antwort übersetzen<\/h3><p>Nennen: passende Punkte aufführen. Beschreiben: einen Sachverhalt nachvollziehbar darstellen. Erläutern: Zusammenhänge und Beispiele erklären. Begründen: Gründe mit dem Fall verbinden. Bewerten: Kriterien anwenden und ein Urteil ableiten. Diese Lernhilfe ist keine verbindliche vollständige IHK-Operatorenliste. Lies immer den konkreten Arbeitsauftrag.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Ein Release mit neuer Datenstruktur darf nicht allein wegen bestandener Oberflächentests freigegeben werden. Du bewertest Kompatibilität, Migration, Restore, fachliche Datenprüfungen und Betriebsbereitschaft.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Der Auftrag lautet: „Bewerten Sie Standardsoftware und Eigenentwicklung für das Kundenportal.“ Wie gliederst du die Antwort?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Bedarf und Randbedingungen nennen; beide Optionen anhand derselben Kriterien wie Funktionsfit, Integrationsaufwand, Kosten und Abhängigkeit vergleichen; eine Empfehlung mit Bedingungen und Risiken geben. Nur die Namen zweier Produkte zu nennen reicht nicht.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein Urteil braucht Kriterien, eine Begründung braucht Fallbezug und eine Maßnahme braucht Erfolgskontrolle.<\/strong><\/p><h3>Weiterführende Primärquellen<\/h3><ul><li><a href=\"https://www.gesetze-im-internet.de/sefprv/__6.html\" target=\"_blank\" rel=\"noopener noreferrer\">Schriftliche Prüfung: § 6 SEFPrV<\/a><\/li><li><a href=\"https://www.gesetze-im-internet.de/sefprv/__7.html\" target=\"_blank\" rel=\"noopener noreferrer\">Präsentation und Fachgespräch: § 7 SEFPrV<\/a><\/li><\/ul>","referenceIds":[1,23,25]},{"id":2,"code":"1.1","title":"Lernen lernen und Lerntechniken","module":1,"minutes":180,"examRelevant":false,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Wissen durch aktiven Abruf, verteilte Wiederholung und Anwendung dauerhaft verfügbar machen.<\/p><\/div><h3>Aktiv erinnern<\/h3><p>Lies einen überschaubaren Abschnitt und schließe ihn anschließend. Erkläre aus dem Gedächtnis, welche Entscheidung der Begriff unterstützt. Prüfe erst danach deine Antwort. Dieses aktive Abrufen zeigt Lücken zuverlässiger als das bloße Wiedererkennen markierter Wörter.<\/p><h3>Wiederholung verteilen<\/h3><p>Plane mehrere kurze Wiederholungen statt nur einer langen Sitzung. Ein möglicher persönlicher Rhythmus ist nach einem, drei, sieben und vierzehn Tagen; passe ihn an deine Fehler und Termine an. Das ist eine Lernempfehlung und keine starre Vorgabe des Kurses.<\/p><h3>Begriffe vernetzen<\/h3><p>Verknüpfe ein neues Thema mit vorhandenen Grundlagen. Eine API ist nicht nur eine Abkürzung: Sie verbindet Vertragsdefinition, Validierung, Berechtigungen, Tests und Betrieb. Gemischte Aufgaben helfen, ähnliche Begriffe wie RPO/RTO oder Retest/Regression auseinanderzuhalten.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Erkläre ohne Lerntext, warum eine wiederholte Zahlungs- oder Auftragsanfrage nach einem Timeout problematisch sein kann. Skizziere danach eine Lösung mit Idempotenzschlüssel und prüfe deine Erklärung.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Du erkennst alle Definitionen beim Lesen, kannst sie in einer offenen Aufgabe aber nicht erklären. Wie änderst du deine Lernroutine?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Nach jedem Abschnitt eine freie Kurzantwort und einen eigenen Fall bearbeiten, anschließend vergleichen und eine Fehlerliste führen. Beim nächsten Termin genau die schwierigen Fälle erneut aus dem Gedächtnis lösen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Vertrautheit beim Lesen ist nicht dasselbe wie abrufbares und anwendbares Wissen.<\/strong><\/p>","referenceIds":[23]},{"id":3,"code":"1.2","title":"Zeitmanagement, Gruppenarbeit und Präsentationstechnik","module":1,"minutes":180,"examRelevant":false,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Lernzeit planbar nutzen, Gruppenarbeit strukturieren und Entscheidungen verständlich präsentieren.<\/p><\/div><h3>Zeit realistisch planen<\/h3><p>Zerlege ein Lernziel in kleine überprüfbare Ergebnisse, etwa „ein ER-Modell erklären“. Trage feste Lernfenster, Pausen, Wiederholungen und Puffer ein. Schätze verfügbare konzentrierte Zeit statt nur freie Kalenderstunden. Prüfe am Wochenende, was wirklich beherrscht wird, und passe den Plan an.<\/p><h3>Gruppenarbeit mit Verantwortung<\/h3><p>Vereinbart Ziel, Rollen, Zeitrahmen und Ergebnis. Eine Person moderiert, eine dokumentiert und eine prüft offene Fragen; Rollen können wechseln. Fachliche Kritik sollte sich auf konkrete Annahmen und Kriterien beziehen. Eine gemeinsame Endkontrolle verhindert widersprüchliche Einzelteile.<\/p><h3>Präsentation mit rotem Faden<\/h3><p>Führe von Ausgangslage und Ziel über Optionen zur begründeten Entscheidung, Umsetzung und Bewertung. Folien unterstützen Kernaussagen statt das gesamte Manuskript zu zeigen. Übe laut mit Zeitmessung und Rückfragen. Benenne Grenzen und offene Punkte sachlich.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Die Lerngruppe plant eine zehnminütige Präsentation zur Portalarchitektur: zwei Minuten Ausgangslage, vier Minuten Vergleich, zwei Minuten Empfehlung, zwei Minuten Risiken und Erfolgskontrolle. Dies ist ein Übungsformat, keine offizielle Prüfungsdauer.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Vier Gruppenmitglieder erstellen ohne Abstimmung jeweils Folien. Das Ergebnis ist doppelt und widersprüchlich. Was hilft?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Zuerst eine gemeinsame Gliederung und Kriterien abstimmen, Verantwortlichkeiten verteilen, Zwischenstände prüfen und abschließend die gesamte Argumentation gemeinsam durchgehen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Klare Ergebnisse, Zuständigkeiten und kurze Kontrollen machen Lernen und Zusammenarbeit verlässlicher.<\/strong><\/p>","referenceIds":[23,15]},{"id":4,"code":"1.3","title":"Vertiefung: Lernmedien und Selbstcheck","module":1,"minutes":90,"examRelevant":false,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Lernmedien gezielt auswählen und den eigenen Kenntnisstand ohne Scheinsicherheit prüfen.<\/p><\/div><h3>Medium nach Aufgabe wählen<\/h3><p>Nutze Text für präzise Begriffe, Diagramme für Beziehungen, Übungen für Anwendung und kurze Erklärungen für Wiederholung. Weder ein Video noch eine Karteikarte deckt automatisch das ganze Lernziel ab. Ergänze ein Medium, wenn es den schwierigen Zusammenhang besser sichtbar macht.<\/p><h3>Selbstcheck mit Begründung<\/h3><p>Beantworte eine Frage vor dem Lesen der Erklärung. Begründe richtige Antworten und erkläre, warum naheliegende Alternativen nicht passen. Markiere auch zufällig richtig geratene Fragen zur Wiederholung. Ein hoher Quizwert allein belegt noch keine freie Fachargumentation.<\/p><h3>Quellen und Fehlerliste<\/h3><p>Prüfe wichtige Aussagen anhand passender Primärquellen und ihrer Version. Halte typische Verwechslungen, ihre Ursache und eine eigene korrekte Erklärung fest. Aus einer Fehlerliste entsteht der nächste Lernplan: Wissenslücke, falsche Annahme oder Zeitproblem erfordern verschiedene Maßnahmen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Nach einem Quiz zu Datenbanken zeichnest du das Datenmodell ohne Vorlage und erklärst jede Kardinalität. Anschließend löst du einen Fall mit einer zusätzlichen Teillieferung. So prüfst du Transfer statt nur Wiedererkennung.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Dein Quizwert steigt, aber Fallstudien bleiben schwierig. Welche ergänzende Übung ist sinnvoll?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Eine offene Situationsaufgabe ohne Antwortoptionen bearbeiten, Annahmen markieren und anhand einer begründeten Musterlösung auswerten. Notiere, welche Entscheidungskriterien in der eigenen Antwort fehlen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein guter Selbstcheck prüft Erinnern, Erklären und Anwenden.<\/strong><\/p>","referenceIds":[19,21,24]},{"id":5,"code":"2.0","title":"Euer Praxisbetrieb: Mittelland Logistik","module":2,"minutes":30,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Den gemeinsamen Übungsbetrieb verstehen und zwischen Fallangabe, Annahme und offener Frage unterscheiden.<\/p><\/div><p><strong>Eigene Übungsfallstudie:<\/strong> „Mittelland Logistik“ ist hier ein fiktiver Übungsbetrieb. Die folgenden Angaben wurden für diese Lern-App entwickelt und sind keine Originalunterlagen deines Bildungsträgers.<\/p><p>Die Disposition plant Transporte in Tabellen. Das Lager meldet Abholbereitschaft telefonisch. Fahrer erhalten Änderungen per Nachricht. Ein Kundenportal soll künftig Aufträge erfassen und den Status anzeigen. Das vorhandene Warenwirtschaftssystem bleibt zunächst bestehen.<\/p><p>Für unsere Übungen nehmen wir 80 interne Nutzer, bis zu 200 gleichzeitig aktive Portalnutzer und zeitweise instabile Mobilverbindungen an. Personenbezogene Kontaktdaten, Lieferadressen und Rollen müssen geschützt werden. Mengen und Zeiten sind Übungsannahmen, keine belegten Unternehmensdaten.<\/p><p>Ein Transportauftrag gehört genau einem Kunden. Er enthält mindestens eine Position. Statuswechsel erfolgen nach Regeln: Entwurf → freigegeben → disponiert → unterwegs → abgeschlossen; Stornierung ist vor Fahrtbeginn möglich. Kunden dürfen nur eigene Aufträge sehen. Ob Mehrfachstopps, Teillieferungen oder andere Zustände erforderlich sind, muss im echten Projekt ermittelt werden.<\/p><h3>Ausgangspunkt und Ziele<\/h3><p>Die Beteiligten wünschen weniger doppelte Erfassung und einen verlässlichen Auftragsstatus. Daraus folgen noch keine fertigen technischen Anforderungen. Kläre zunächst die tatsächlichen Abläufe, Fehlerfolgen und Ziele der verschiedenen Rollen. Disposition, Lager, Fahrer, Kundenservice, Kunden und IT-Betrieb betrachten denselben Auftrag aus verschiedenen Perspektiven.<\/p><h3>Systemgrenze und Altbestand<\/h3><p>Das Portal soll mit der Warenwirtschaft zusammenarbeiten, sie aber zunächst nicht ersetzen. Ermittele, welches System welche Daten verantwortet. Werden Kundenstammdaten, Auftragsstatus und Positionsdaten ohne klare Zuständigkeit mehrfach gepflegt, entstehen Widersprüche.<\/p><h3>Durchgehender Arbeitsfall<\/h3><p>Ein Kunde erfasst einen Auftrag, die Disposition gibt ihn frei, das Lager meldet Bereitschaft und ein Fahrer aktualisiert den Status. Eine verlorene Antwort darf keinen doppelten Auftrag erzeugen. Ein Kunde darf auch durch Änderung einer URL keine Aufträge anderer Kunden sehen. Diese Fälle tauchen in Anforderungen, Architektur, Tests und Übergabe wieder auf.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Die Aussage „Fahrer brauchen eine Offline-App“ ist zunächst ein Lösungswunsch. Dahinter kann der Bedarf stehen, Statusmeldungen trotz Funkloch zuverlässig zu erfassen. Ob vollständig offline gearbeitet werden muss, ist durch Nutzungssituationen zu klären.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Nenne drei Rückfragen, bevor du das Portal entwirfst.<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Wer ist führend für Kundendaten und Status? Welche Ausnahmen wie Storno oder Teillieferung gibt es? Wie lange dürfen Statusmeldungen bei fehlendem Netz verzögert sein? Je nach Antworten ändern sich Modell und Synchronisation.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Fallangaben sind Grundlage; zusätzliche Annahmen müssen sichtbar bleiben.<\/strong><\/p>","referenceIds":[20]},{"id":6,"code":"2.1","title":"Kundenbedarfe und Zielgruppen","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Kundenbedarf und Zielgruppen erfassen, ohne Wünsche vorschnell als technische Lösung zu übernehmen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Bedarf hinter dem Wunsch<\/h3><p>Ein Wunsch wie „Wir brauchen eine App“ sagt wenig über das Problem. Frage nach Aufgaben, Schwierigkeiten, Häufigkeit und Folgen. Ziele wie geringere Doppelarbeit oder schnellere Auskunft müssen anschließend konkretisiert werden.<\/p><h3>Rollen und Betroffene<\/h3><p>Stakeholder sind nicht nur Auftraggeber: auch Anwender, Betrieb, Datenschutz, Support und angebundene Partner können Anforderungen haben. Beschreibe Zielgruppen anhand ihrer Aufgaben, Vorkenntnisse und Nutzungssituationen. Personas können helfen, müssen aber auf Erkenntnissen statt bloßen Klischees beruhen.<\/p><h3>Erfolg aus Nutzersicht<\/h3><p>Ermittle typische Abläufe und kritische Ausnahmen. Prüfe Nutzen und mögliche Belastungen: Eine neue Erfassungsmaske kann dem Kunden helfen, aber dem Lager zusätzliche Nacharbeit verursachen. Ein gemeinsames Zielbild erleichtert die Abstimmung.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Kunden benötigen den Status ihrer Transporte; Disponenten benötigen eine priorisierte Arbeitsliste. Dieselbe Datenquelle kann verschiedene Sichten liefern, während Berechtigungen und Aktualität unterschiedlich behandelt werden.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Der Kundenservice fordert eine Live-Karte aller Fahrer. Welche Punkte klärst du?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Welcher konkrete Auskunftsbedarf besteht, welche Genauigkeit und Aktualität notwendig sind, wer Zugriff benötigt und welche datenschutzrechtlichen sowie organisatorischen Bedingungen gelten. Ein grober Status kann den Bedarf unter Umständen bereits erfüllen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Beschreibe das Problem und den Nutzen, bevor du eine Lösung festlegst.<\/strong><\/p>","referenceIds":[5,18]},{"id":7,"code":"2.2","title":"Anforderungsermittlung","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Passende Ermittlungsmethoden kombinieren und auch Ausnahmefälle sowie Qualitätsanforderungen erfassen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Methoden bewusst auswählen<\/h3><p>Interviews liefern Motive und Beispiele, Beobachtung zeigt tatsächliche Arbeit, Workshops lösen Schnittstellenfragen, vorhandene Dokumente zeigen formale Regeln. Eine Umfrage kann breite Rückmeldungen sammeln, erklärt aber komplexe Abläufe oft nicht ausreichend. Wähle nach Erkenntnisbedarf und verfügbarer Zeit.<\/p><h3>Vom Ablauf zur Anforderung<\/h3><p>Lass dir einen konkreten Auftrag von Anfang bis Ende zeigen. Frage danach nach Abweichungen: fehlende Adresse, doppelte Erfassung, Storno, Funkloch, gleichzeitige Änderungen. Ermittele zusätzlich Leistungs-, Sicherheits-, Betriebs- und Bedienanforderungen.<\/p><h3>Ergebnisse bestätigen<\/h3><p>Dokumentiere Quelle, Aussage, offene Punkte und Annahmen. Spiele deine Zusammenfassung den Beteiligten zurück. Ein Interview ist erst dann belastbar, wenn Missverständnisse sichtbar werden und die relevanten Aussagen abgestimmt sind.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Beobachte einen Disponenten beim Bearbeiten einer verspäteten Lieferung und frage anschließend, welche Informationen er gesucht hat. So erkennst du informelle Hilfsmittel, die im offiziellen Prozessdiagramm fehlen können.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Eine Fachabteilung schildert nur den störungsfreien Standardablauf. Wie ergänzt du die Ermittlung?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Nach konkreten vergangenen Problemen fragen, Ausnahmen beobachten, weitere Rollen einbeziehen und Störfälle gezielt durchspielen. So entstehen Anforderungen für Fehlerbehandlung und Wiederherstellung.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Eine Methode zeigt selten alle Bedürfnisse; konkrete Fälle und Rückbestätigung schließen Lücken.<\/strong><\/p>","referenceIds":[5,18]},{"id":8,"code":"2.3","title":"Anforderungsdokumentation","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Anforderungen verständlich, prüfbar und rückverfolgbar dokumentieren.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Bedarf und Umsetzung unterscheiden<\/h3><p>Im klassischen Verständnis beschreibt das Lastenheft den Bedarf des Auftraggebers und das Pflichtenheft die vereinbarte Umsetzung. In anderen Vorgehensweisen werden Backlog-Einträge, Modelle und ergänzende Spezifikationen verwendet. Entscheidend ist ein gemeinsames überprüfbares Verständnis, nicht allein der Dokumentname.<\/p><h3>Eine Anforderung präzisieren<\/h3><p>Gib jeder Anforderung eine stabile Kennung, beschreibe Ziel und Quelle und ergänze Akzeptanzkriterien. Eine Qualitätsanforderung braucht Bedingungen, Metrik und Grenzwert. „Schnell“ ist zu unbestimmt; „p95 der Statusabfrage unter zwei Sekunden bei vereinbarter Testlast“ ist prüfbar. Die Zahlen sind Beispielwerte.<\/p><h3>Beziehungen und Änderungen<\/h3><p>Verknüpfe Anforderungen mit Entwurf, Umsetzung und Tests. Ein Glossar definiert Fachbegriffe wie Auftrag und Position. Änderungen erhalten nachvollziehbare Gründe und eine Auswirkungsanalyse auf Kosten, Zeit, Schnittstellen und Prüfungen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>REQ-STATUS-01: Ein berechtigter Kunde kann den Status eigener Aufträge sehen. Akzeptanz: eigener Auftrag sichtbar; fremder Auftrag abgelehnt; leere Liste verständlich; Statuszeitpunkt eindeutig angegeben.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Formuliere ein prüfbares Kriterium für „Doppelte Aufträge sollen vermieden werden“.<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Wird eine Erstellungsanfrage mit demselben Idempotenzschlüssel und Inhalt wiederholt, entsteht genau ein Auftrag; Wiederholungen liefern eine nachvollziehbare Referenz auf diesen Auftrag. Konfligierende Inhalte mit demselben Schlüssel werden definiert behandelt.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Eine gute Anforderung ermöglicht einen Test und bleibt mit ihrer Herkunft verbunden.<\/strong><\/p>","referenceIds":[5,22]},{"id":9,"code":"2.4","title":"Anforderungsbewertung und Priorisierung","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Anforderungen nach Nutzen, Risiko und Abhängigkeit bewerten und Prioritäten abstimmen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Bewertungsmaßstäbe<\/h3><p>Berücksichtige Geschäftsnutzen, Dringlichkeit, Aufwand, Risiko und Abhängigkeiten. Eine Funktion mit geringer sichtbarer Wirkung kann Voraussetzung für mehrere andere Funktionen sein. Gesetzliche oder vertragliche Bedingungen können den Spielraum begrenzen.<\/p><h3>MoSCoW richtig anwenden<\/h3><p>Must bedeutet unverzichtbar für den betrachteten Lieferumfang, Should wichtig mit vertretbarer Übergangslösung, Could optional und Won’t diesmal bewusst ausgeschlossen. Kategorien brauchen eine gemeinsame Definition. Wenn alles Must ist, fehlt eine wirksame Priorisierung.<\/p><h3>Konflikte und Freigabe<\/h3><p>Vergleiche konkurrierende Wünsche anhand derselben Kriterien. Halte fest, wer entscheidet und welche Folgen eine Zurückstellung hat. Eine Priorität wird bei neuen Erkenntnissen überprüft, nicht stillschweigend verändert.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Mandantentrennung und sichere Auftragsanlage sind für den Portalstart Must. Eine zusätzliche Darstellung als Karte kann ein Could sein, wenn eine Statusliste den notwendigen Bedarf deckt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein Must passt nicht in den Termin. Welche Handlungsoptionen bewertest du?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Umfang anderer Funktionen reduzieren, Termin oder Ressourcen realistisch anpassen oder eine geeignete alternative Lösung abstimmen. Das Must heimlich abzuwerten würde die vereinbarte Lieferung verfälschen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Priorisieren heißt, die Konsequenzen einer Reihenfolge bewusst zu entscheiden.<\/strong><\/p>","referenceIds":[5,18]},{"id":10,"code":"2.5","title":"Softwareauswahl und Innovationen","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Standardsoftware, Eigenentwicklung und Innovationen anhand des konkreten Bedarfs beurteilen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Make-or-Buy mit Kriterien<\/h3><p>Prüfe Funktionsfit, Integrationsmöglichkeiten, Anpassbarkeit, Lizenzbedingungen, Support, Datenschutz, Betrieb und Ausstieg. Ein günstiger Kaufpreis kann hohe Anpassungs- und Betriebskosten verdecken. Eine Eigenentwicklung kann passender sein, braucht aber dauerhaft Kapazität und Verantwortung.<\/p><h3>Innovation als prüfbare Hypothese<\/h3><p>Eine neue Technologie soll ein konkretes Problem besser lösen. Formuliere erwarteten Nutzen, Voraussetzungen und messbare Erfolgskriterien. Ein begrenzter Proof of Concept untersucht Machbarkeit; er belegt noch keine Produktionsreife.<\/p><h3>Wirtschaftlichkeit über die Laufzeit<\/h3><p>Betrachte Einführung, Schulung, laufende Gebühren, Wartung, Schnittstellenänderungen und späteren Wechsel. Gewichtete Bewertungen können helfen, bleiben aber von nachvollziehbaren Annahmen abhängig. Unsichere Zahlen sollten als Bandbreiten erscheinen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Für das Portal werden ein SaaS-Produkt und ein eigener modularer Dienst verglichen. Die benötigte Warenwirtschaftsschnittstelle, Datenexport und Rollenabgrenzung werden praktisch geprüft, bevor eine Kaufempfehlung erfolgt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein Anbieter wirbt mit KI-gestützter Disposition. Wie untersuchst du den Nutzen?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Einen begrenzten Fall mit repräsentativen Daten, fachlichen Qualitätsmaßen und menschlicher Kontrolle prüfen; Integration, Fehlentscheidungen, Datenverarbeitung und Kosten bewerten. Die Werbeaussage allein ist kein Nachweis.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Neu ist kein Qualitätsmerkmal; Nutzen und Folgen müssen zum eigenen Fall passen.<\/strong><\/p>","referenceIds":[6,16]},{"id":11,"code":"2.6","title":"IST-Aufnahme und Architekturdokumentation mit arc42","module":2,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Eine bestehende Architektur erfassen und ihre relevanten Zusammenhänge mit arc42 nachvollziehbar dokumentieren.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>IST-Aufnahme mit Evidenz<\/h3><p>Sammle Systemlandschaft, Datenflüsse, Schnittstellen, Verantwortliche, Betriebsumgebungen und bekannte Probleme. Nutze Konfiguration, Logs, vorhandene Dokumente und Gespräche. Kennzeichne beobachtete Fakten und noch ungeprüfte Vermutungen getrennt.<\/p><h3>arc42 als Strukturhilfe<\/h3><p>arc42 ordnet eine Architekturdokumentation in zwölf Bereiche. Dazu gehören Ziele, Rahmenbedingungen, Systemkontext, Lösungsstrategie, Struktur, Laufzeitabläufe, Verteilung, übergreifende Regeln, Entscheidungen, Qualitätsanforderungen, Risiken und Begriffe. Es ist eine Dokumentationsvorlage, kein vorgeschriebener Prozess und keine Architektur, die automatisch entsteht.<\/p><h3>Sichten ergänzen sich<\/h3><p>Eine Kontextsicht zeigt Systemgrenze und Umgebung; eine Bausteinsicht zeigt interne Komponenten; eine Laufzeitsicht erklärt ihr Zusammenspiel in einem Szenario; eine Verteilungssicht zeigt den Betrieb auf Infrastruktur. Wähle die nötige Tiefe für die Zielgruppe. Große Diagramme ohne Legende oder Zweck helfen wenig.<\/p><h3>Entscheidungen und Pflege<\/h3><p>Ein ADR hält Anlass, Optionen, Entscheidung und Folgen fest. Verknüpfe kritische Qualitätsziele mit Szenarien und benenne technische Schulden. Pflege die Dokumentation bei relevanten Änderungen; eine veraltete IST-Sicht kann falsche Entscheidungen auslösen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Die Kontextsicht zeigt Portal, Warenwirtschaft und Kunden. Die Laufzeitsicht erklärt den Auftragsimport bei Netzfehlern. Ein ADR begründet, warum die Warenwirtschaft zunächst führend für Stammdaten bleibt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Das Architekturdiagramm zeigt nur drei Server. Welche Informationen fehlen für die Analyse?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Fachliche Verantwortlichkeiten, Datenflüsse, Schnittstellenverträge, Systemgrenzen, Qualitätsanforderungen und konkrete Laufzeitszenarien. Serverstandorte allein erklären das Systemverhalten nicht.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Dokumentiere die für Entscheidungen wichtigen Zusammenhänge und die Herkunft deiner Aussagen.<\/strong><\/p><h3>Weiterführende Primärquellen<\/h3><ul><li><a href=\"https://arc42.org/overview/\" target=\"_blank\" rel=\"noopener noreferrer\">arc42: offizielle Strukturübersicht<\/a><\/li><\/ul>","referenceIds":[6,22]},{"id":12,"code":"2.7","title":"Prototypen und Plattformwahl","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Mit Prototypen Unsicherheit reduzieren und eine passende Plattform begründet auswählen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Die richtige Frage testen<\/h3><p>Ein klickbarer Prototyp prüft Navigation und Verständnis. Ein technischer PoC prüft zum Beispiel Integration oder einen Leistungsengpass. Definiere vorher, was nachgewiesen werden soll, mit wem und unter welchen Bedingungen. Erfolg in einer Eigenschaft beweist nicht alle übrigen.<\/p><h3>Plattformkriterien<\/h3><p>Bewerte vorhandene Infrastruktur, Kompetenzen, Sicherheitsanforderungen, Betrieb, Kosten, Datenhaltung und Einsatzgeräte. SaaS, eigene Server und Cloud-Angebote verteilen Verantwortung unterschiedlich. Betriebssystem-, Netzwerk- und Laufzeitgrundlagen helfen, diese Unterschiede zu verstehen.<\/p><h3>Aus dem Ergebnis lernen<\/h3><p>Halte Ergebnisse, Grenzen und offene Punkte fest. Ein Wegwerfprototyp darf technische Abkürzungen nutzen, muss aber als solcher kenntlich sein. Soll er zur Produktbasis werden, müssen Qualität und Wartbarkeit gezielt geprüft werden.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Ein mobiler Prototyp wird mit Fahrern bei schwacher Verbindung getestet. Eine separate Integrationsprobe prüft, ob der bestehende Warenwirtschaftsdienst neue Aufträge zuverlässig annimmt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Nutzer mögen den Prototyp. Darf er deshalb direkt produktiv eingesetzt werden?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Nein, nur die geprüften Eigenschaften sind belegt. Datenintegrität, Sicherheit, Last, Betrieb und Wartbarkeit können noch offen sein und benötigen eigene Nachweise.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein Prototyp ist ein Werkzeug zur Prüfung ausgewählter Annahmen.<\/strong><\/p>","referenceIds":[18,2]},{"id":13,"code":"2.8","title":"Grob- und Fein-Design","module":2,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Vom fachlichen Prozess über die Systemstruktur zu konkret prüfbaren Komponentenverträgen gelangen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Grob-Design<\/h3><p>Lege Systemgrenzen, Hauptkomponenten, Datenverantwortung und Kommunikationswege fest. Ein modularer Monolith kann bei kleinem Team ausreichend sein; Microservices ermöglichen unabhängige Entwicklung und Skalierung, verursachen aber zusätzliche Betriebs- und Konsistenzaufgaben. Die Auswahl folgt dem Bedarf.<\/p><h3>Fein-Design<\/h3><p>Beschreibe konkrete Operationen, Datenformate, Zustände, Fehlerverhalten, Berechtigungen und Transaktionsgrenzen. Ein Sequenzdiagramm kann einen Auftragsablauf zeigen; ein Zustandsmodell beschreibt erlaubte Statuswechsel. Qualitätsanforderungen müssen sich im Entwurf wiederfinden.<\/p><h3>Kopplung und Kohäsion<\/h3><p>Eine Komponente soll zusammengehörige Aufgaben bündeln und möglichst wenig über fremde Interna wissen. Klare Schnittstellen begrenzen Änderungsfolgen. Zyklen und geteilte Datenzuständigkeit machen Änderungen schwerer kontrollierbar.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Das Grob-Design trennt Portal, Auftragslogik und Warenwirtschaftsadapter. Das Fein-Design legt fest, wie Auftragserstellung, Wiederholung, Rollenprüfung und Fehlerantwort ablaufen.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Warum ist ein Diagramm mit nur „Frontend, Backend, Datenbank“ kein vollständiges Fein-Design?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Es fehlen konkrete Verträge und Regeln: Felder, Validierung, Zustandsübergänge, Zugriff, Fehler und Datenkonsistenz. Das Diagramm bietet eine grobe Struktur, aber noch keine ausreichende Detailspezifikation.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Grob-Design erklärt die Struktur; Fein-Design macht das Verhalten konkret.<\/strong><\/p>","referenceIds":[6,16]},{"id":14,"code":"2.9","title":"Datenbankmodellierung","module":2,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Ein fachliches Datenmodell mit Schlüsseln, Beziehungen und Konsistenzregeln erstellen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Von Fachobjekten zu Beziehungen<\/h3><p>Identifiziere Kunde, Auftrag, Position und gegebenenfalls Fahrzeug. Bestimme, ob eine Beziehung eins zu eins, eins zu vielen oder viele zu vielen ist. Optionalität und Kardinalität folgen den Fachregeln. Ein Auftrag mit mehreren Positionen wird durch eine 1:n-Beziehung modelliert, nicht durch eine Kommaliste in einer Zelle.<\/p><h3>Schlüssel und Normalisierung<\/h3><p>Ein Primärschlüssel identifiziert eine Zeile; Fremdschlüssel beziehen sich auf gültige Datensätze. Normalisierung reduziert redundante Fakten und Änderungsanomalien. Die erste Normalform verlangt atomare Werte; weitere Normalformen betrachten Abhängigkeiten vom Schlüssel und zwischen Nichtschlüsselattributen. Ein bewusst gespeicherter historischer Lieferadressstand hat eine andere Bedeutung als versehentlich kopierte Stammdaten.<\/p><h3>Regeln und Historie<\/h3><p>Klärungspunkte sind eindeutige Auftragsnummern, Löschregeln, erforderliche Felder und gültige Statuswerte. Historische Ereignisse können getrennt gespeichert werden, wenn der Verlauf benötigt wird. Datenminimierung und sinnvolle Aufbewahrung müssen bereits im Entwurf bedacht werden.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Kunde(id, name), Auftrag(id, kunde_id, status) und Position(id, auftrag_id, menge). Kunde → Auftrag ist 1:n; Auftrag → Position ist 1:n. Eine Position benötigt eine fachlich zulässige Menge. Fahrzeugzuordnung wird separat modelliert, wenn ein Auftrag mehrere Fahrten haben kann.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein Auftrag kann mehreren Fahrzeugen zugeordnet sein und ein Fahrzeug vielen Aufträgen. Wie modellierst du das?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Eine Zuordnungstabelle mit Fremdschlüsseln auf Auftrag und Fahrzeug. Zusätzliche Angaben wie Teilmenge oder Einsatzzeit gehören zur Zuordnung, sofern der Fachfall dies verlangt.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein Datenmodell bildet fachliche Regeln ab; Schlüssel allein erklären noch keine Bedeutung.<\/strong><\/p>","referenceIds":[7,24]},{"id":15,"code":"2.10","title":"Migration und Wartung","module":2,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Migration und Wartung so planen, dass Daten und Betrieb überprüfbar beherrscht werden.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Migrationsphasen<\/h3><p>Erfasse Quellen und Zielmodell, bereinige Daten und lege Zuordnungsregeln fest. Teste mit repräsentativen Daten in einer passenden Umgebung. Plane Sicherung, Wiederherstellung, Zuständigkeiten, Zeitfenster, Freigabe und Abbruch. Dokumentiere, welche Schritte reversibel sind.<\/p><h3>Kompatibler Übergang<\/h3><p>Expand-Contract erweitert zunächst das Schema, lässt alte und neue Anwendung vorübergehend nebeneinander arbeiten, überführt Daten und entfernt veraltete Strukturen erst später. Diese Strategie hilft, ist aber kein automatischer Beweis für Kompatibilität. Alle aktiven Leser und Schreiber müssen geprüft werden.<\/p><h3>Wartung organisieren<\/h3><p>Wartung umfasst Fehlerkorrektur, Anpassung an Umgebung und Verbesserung von Struktur oder Leistung. Plane Updates, Zuständigkeiten, Support, Monitoring und Dokumentationspflege. Backups benötigen erfolgreiche Restore-Tests; Ziele zu Datenverlust und Wiederherstellungszeit müssen vereinbart sein.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Eine alte Freitextspalte wird durch einen Statuscode ergänzt. Während des Übergangs schreiben beide App-Versionen kompatibel. Danach werden Werte abgeglichen und erst nach Freigabe die alte Spalte entfernt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Die Zeilenzahl nach dem Import stimmt, die Auftragssumme aber nicht. Wie bewertest du die Migration?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Sie ist fachlich noch nicht erfolgreich nachgewiesen. Summen, Zuordnungen und Stichproben müssen geprüft und Abweichungen geklärt werden. Eine gleiche Anzahl belegt lediglich einen Teil der Vollständigkeit.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Migration braucht fachliche Datenprüfung und einen realistischen Wiederherstellungsweg.<\/strong><\/p>","referenceIds":[7,11]},{"id":16,"code":"2.11","title":"Prüfungsvorbereitung und Modulabschluss","module":2,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Die Analyse- und Planungsinhalte in einer zusammenhängenden Situationsantwort anwenden.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Antwortkette<\/h3><p>Beginne mit Bedarf, Beteiligten und Randbedingungen. Beschreibe überprüfbare Anforderungen und priorisiere sie. Vergleiche Architektur- und Softwareoptionen, begründe Plattform und Datenmodell und plane den Übergang in die vorhandene Landschaft.<\/p><h3>Bewertung statt Schlagwortliste<\/h3><p>Erkläre, welche Anforderung durch welche Entscheidung erfüllt wird und welche Nachteile bleiben. Wirtschaftlichkeit, Sicherheit und Betrieb gehören zur Abwägung. Fehlende Angaben werden als Annahmen gekennzeichnet; offene Punkte erhalten einen Klärungsweg.<\/p><h3>Eigenkontrolle<\/h3><p>Prüfe Vollständigkeit, widerspruchsfreie Begriffe, fachliche Konsistenz und messbare Erfolgskriterien. Trainiere zusätzlich freie Antworten ohne Auswahloptionen. Die Quizfragen unterstützen Wissen und Entscheidungen, ersetzen aber keine vollständige schriftliche Situationsaufgabe.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Vergleiche für Mittelland Logistik eine gekaufte Portallösung und eine Eigenentwicklung. Bewerte Schnittstellenfit, Rollenmodell, Betriebsaufwand, Gesamtbetriebskosten und Wechselmöglichkeit.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Erstelle eine kurze Empfehlung mit zwei Risiken und je einer Maßnahme.<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Eine Lösung anhand der vorher genannten Kriterien auswählen. Beispielsweise Schnittstellenrisiko durch Integrationsprobe begrenzen und Datenübertragungsrisiko durch Probelauf mit fachlichem Abgleich behandeln. Bedingungen der Empfehlung transparent nennen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Eine starke Modulantwort verbindet Bedarf, Auswahl, Entwurf und überprüfbaren Übergang.<\/strong><\/p>","referenceIds":[20,21,23]},{"id":17,"code":"2.12","title":"Praxisübung: Anforderungen erfragen","module":2,"minutes":120,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Ein strukturiertes Anforderungsinterview führen und ein verwertbares Ergebnis erstellen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Vorbereiten<\/h3><p>Wähle eine Rolle und ein Erkenntnisziel. Sammle bekannte Fakten und offene Fragen. Plane offene Einstiegsfragen, konkrete Nachfragen, Ausnahmen und eine Zusammenfassung. Vermeide Suggestivfragen, die deine bevorzugte Lösung bereits vorgeben.<\/p><h3>Durchführen<\/h3><p>Frage nach dem letzten realen Vorgang: Wer tat was, mit welchen Informationen und Schwierigkeiten? Kläre Häufigkeit, Folgen und Sonderfälle. Frage auch nach Verfügbarkeits-, Sicherheits- und Leistungsbedarf. Notiere Beobachtungen getrennt von Interpretation.<\/p><h3>Nachbereiten<\/h3><p>Formuliere die Ergebnisse als Anforderungen mit Quelle, Priorität und Akzeptanzkriterien. Kennzeichne Annahmen und Rückfragen. Lass die Zusammenfassung bestätigen und verknüpfe Anforderungen mit späteren Tests.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Rollenübung: Eine Person spielt die Disposition, eine führt das Interview, eine beobachtet. Ausgangsproblem sind doppelte Aufträge nach Funklöchern. Die Gruppe prüft anschließend, ob Bedarf und Ausnahmefälle tatsächlich geklärt wurden.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Formuliere eine offene Einstiegsfrage und zwei sinnvolle Nachfragen.<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>„Wie bearbeiten Sie heute einen neuen Transportauftrag?“ Nachfragen: „Was geschieht bei einer unvollständigen Adresse?“ und „Woran erkennen Sie eine bereits erfasste Bestellung?“ Danach konkrete Antworten rückbestätigen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Fragen öffnen das Problem; Rückbestätigung macht das Ergebnis belastbar.<\/strong><\/p>","referenceIds":[5,22]},{"id":18,"code":"3.1","title":"Schnittstellenanalyse und API-Design","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Eine Schnittstelle aus Fachbedarf ableiten und ihren Vertrag vollständig festlegen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Bestand und Verbraucher analysieren<\/h3><p>Ermittle, welche Systeme kommunizieren, welche Daten sie benötigen und welches System führend ist. Untersuche Format, Protokoll, Authentifizierung, Aufrufhäufigkeit, Versionen und Fehlerfälle. Eine vorhandene Schnittstelle kann technisch erreichbar sein, aber fachlich unzureichend.<\/p><h3>HTTP und Vertrag<\/h3><p>Definiere Ressourcen, Operationen, Pflichtfelder, Typen, Einheiten, Zeitstempel, Statuscodes und Fehlerstruktur. GET fordert Lesen an; POST wird häufig zur Erzeugung oder Verarbeitung genutzt; PUT hat idempotente Ersetzungssemantik; PATCH beschreibt Teiländerungen und ist nicht automatisch idempotent. Konkretes API-Verhalten muss dokumentiert und getestet werden.<\/p><h3>Robustheit und Änderungen<\/h3><p>Plane Pagination, Versionswechsel, Timeouts und sichere Wiederholungen. Eine zufällige ID ersetzt keine objektbezogene Berechtigungsprüfung. Ein DTO legt die Ausgabe fest und verhindert, dass interne Datenbankfelder unkontrolliert Teil des Vertrags werden.<\/p><h3>Praxisbeispiel<\/h3><blockquote>POST /auftraege erhält Kundenreferenz und Positionen. Ein Idempotenzschlüssel verhindert doppelte Erzeugung bei Wiederholung. Geldbeträge haben definierte Dezimalregeln und Währung; Zeitangaben einen eindeutigen Zeitzonenbezug.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Welche Angaben fehlen in einem API-Entwurf, der nur URL und Beispielantwort zeigt?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Operation und Eingabeschema, Berechtigungen, Validierung, Fehlerfälle, Wiederholungsregeln, Versions- und Kompatibilitätsregeln sowie gegebenenfalls Last- und Größenlimits.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Eine Schnittstelle ist ein Vereinbarung über Verhalten, Daten und Fehler, nicht nur eine URL.<\/strong><\/p>","referenceIds":[3,16]},{"id":19,"code":"3.2","title":"Schnittstellenimplementierung und Schnittstellentest","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Den Vertrag korrekt implementieren und Zusammenspiel sowie Fehlerbehandlung prüfen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Vertrauensgrenzen<\/h3><p>Clientdaten werden serverseitig auf Form und Fachregeln geprüft. Anmeldung klärt Identität; Autorisierung prüft die erlaubte Operation auf dem konkreten Objekt. Die Fachlogik sollte unabhängig von einem bestimmten Bildschirmkanal bleiben.<\/p><h3>Tests an der Schnittstelle<\/h3><p>Prüfe gültige und ungültige Eingaben, Rollen, unbekannte IDs, fehlende Felder, Grenzwerte, Fehlerantworten und Kompatibilität. Ein Vertragstest prüft Erwartungen der beteiligten Systeme; Integrationstests prüfen ihr tatsächliches Zusammenspiel. Testdoubles ersetzen einzelne Abhängigkeiten gezielt, aber nicht alle realen Integrationstests.<\/p><h3>Netzfehler beherrschen<\/h3><p>Ein Timeout beweist nicht, dass die Verarbeitung ausgeblieben ist. Wiederholungen brauchen Begrenzung und fachliche Sicherheit. Backoff und Zufallsanteil verteilen Last; ein Circuit Breaker unterbricht wiederholt scheiternde Aufrufe zeitweise. Fehler werden verständlich gemeldet und mit einer Korrelations-ID analysierbar gemacht.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Ein Test sendet dieselbe Auftragsanlage zweimal mit demselben Schlüssel. Erwartet werden ein Auftrag und ein stabiler Bezug auf das Ergebnis. Ein weiterer Test versucht den Abruf eines fremden Kundenauftrags und erwartet eine Ablehnung.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Frontend und Backend bestehen isolierte Tests, interpretieren die Menge aber unterschiedlich. Welche Prüfung fehlt?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Ein Vertragstest beziehungsweise ein tatsächlicher Integrationstest mit vereinbarter Einheit und Semantik. Gleiche Datentypen allein beweisen kein gemeinsames Fachverständnis.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Teste nicht nur Erfolg, sondern auch Berechtigung, Grenzen und unklaren Ausgang einer Anfrage.<\/strong><\/p>","referenceIds":[3,9]},{"id":20,"code":"3.3","title":"Datenbankentwurf und Datenbankeinrichtung","module":3,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Aus dem Fachmodell ein passendes physisches Datenbankschema und eine kontrollierte Einrichtung ableiten.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Modell technisch umsetzen<\/h3><p>Überführe Entitäten und Beziehungen in Tabellen, Schlüssel, Typen und Constraints. NOT NULL, UNIQUE, CHECK und Fremdschlüssel sichern ausgewählte Regeln. Nicht jede komplexe Fachregel lässt sich allein durch einen einfachen Constraint abbilden.<\/p><h3>Abfragen und Indizes<\/h3><p>Wähle Indizes anhand tatsächlicher Such- und Verknüpfungsmuster. Sie können Lesen beschleunigen, erhöhen aber Schreibaufwand und Speicherbedarf. Prüfe Abfragepläne und repräsentative Daten, statt jede Spalte pauschal zu indizieren.<\/p><h3>Einrichtung und Versionierung<\/h3><p>Verwende getrennte Umgebungen, geeignete Zugriffsrollen und versionierte Schemaänderungen. Die Anwendung braucht nicht automatisch DDL-Rechte. Einrichtung, Testdaten, Sicherung und Wiederherstellung müssen dokumentiert und überprüft sein.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Auftragsnummern erhalten eine passende Eindeutigkeitsregel, Positionen einen Fremdschlüssel. Ein zusammengesetzter Index auf kunden_id und einem geeigneten Suchfeld kann die Kundenliste unterstützen, muss aber gemessen werden.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Warum reicht es nicht, nur Tabellen ohne Beziehungen und Constraints anzulegen?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Fachlich ungültige Verweise und Duplikate würden unbemerkt gespeichert. Das Schema soll grundlegende Integrität sichern; ergänzende Anwendungsregeln und Tests bleiben erforderlich.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Schema, Rechte und Migrationen gehören ebenso zum Datenbankentwurf wie die Tabellen.<\/strong><\/p>","referenceIds":[7]},{"id":21,"code":"3.4","title":"Datenbankintegration in die Anwendung","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Datenbankzugriffe sicher, konsistent und wartbar in die Anwendung integrieren.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Zugriff kapseln<\/h3><p>Trenne fachliche Operationen von technischen SQL-Details. Ein Repository oder vergleichbare Zugriffsschicht kann dies unterstützen. Nutze parametrisierte Abfragen statt unkontrollierter Textverkettung. Ein ORM nimmt Mappingarbeit ab, ersetzt aber keine Kenntnis der erzeugten Abfragen und Datenregeln.<\/p><h3>Transaktionen und Parallelität<\/h3><p>ACID umfasst atomare Gesamtänderung, Konsistenz der festgelegten Regeln, Isolation paralleler Vorgänge und Dauerhaftigkeit bestätigter Änderungen. Eine Transaktion kann mehrere fachlich zusammengehörige Schreibvorgänge umfassen. Isolationsniveau, Sperren und optimistisches Locking beeinflussen Konflikte und Leistung.<\/p><h3>Ressourcen und Datenumfang<\/h3><p>Verbindungen werden kontrolliert wiederverwendet und freigegeben. Große Listen benötigen begrenzten Datenumfang. Achte bei ORM-Nutzung auf N+1-Abfragen: eine Ausgangsabfrage plus je eine weitere Abfrage pro Objekt kann unnötige Netz- und Datenbankarbeit verursachen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Auftrag und Positionen werden als Einheit gespeichert. Scheitert eine Position, darf kein unvollständiger Auftrag bestätigt werden. Bei einem Statusupdate wird eine Versionsnummer geprüft, um parallele Änderungen zu erkennen.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Zwei Disponenten ändern denselben Auftrag auf Basis einer alten Anzeige. Wie verhinderst du unbemerkten Verlust?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Beim Schreiben die erwartete Versionsnummer prüfen. Bei Abweichung keinen stillen Überschreibvorgang durchführen, sondern den Konflikt fachlich behandeln. Das Verfahren muss auch unter paralleler Last getestet werden.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein Datenzugriff ist erst gut integriert, wenn Sicherheit, Konsistenz und Ressourcenverhalten passen.<\/strong><\/p>","referenceIds":[7]},{"id":22,"code":"3.5","title":"Clean Code, SOLID und Entwicklungsmethodik","module":3,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Lesbare und testbare Fachlogik entwickeln und Clean Code, SOLID und TDD praktisch einordnen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Clean Code<\/h3><p>Aussagekräftige Namen, kurze nachvollziehbare Funktionen und klar abgegrenzte Aufgaben erleichtern Wartung. Vermeide zufällige globale Abhängigkeiten, unkontrollierte Seiteneffekte und kopierte Fachregeln. Kommentare erklären wichtige Gründe; sie sollen unverständlichen Code nicht dauerhaft entschuldigen. Refactoring verbessert Struktur bei erhaltenem beobachtbarem Verhalten.<\/p><h3>SOLID als Entwurfshilfe<\/h3><p>Single Responsibility bündelt eine klar zusammengehörige Verantwortung. Open/Closed unterstützt Erweiterung ohne ständiges Ändern stabiler Teile. Liskov verlangt, dass ein ersetzender Untertyp die zugesagten Verhaltensverträge erfüllt. Interface Segregation vermeidet unnötig große Schnittstellen. Dependency Inversion richtet wichtige Logik auf passende Abstraktionen statt auf konkrete Infrastruktur aus. Die Prinzipien sind Hilfen; unnötige Abstraktion kann ebenfalls schaden.<\/p><h3>TDD: Rot, Grün, Refactoring<\/h3><p>Schreibe einen kleinen Test für erwartetes Verhalten und prüfe, dass er aus dem richtigen Grund fehlschlägt. Implementiere die kleinste sinnvolle Änderung, die ihn erfüllt. Verbessere danach Struktur bei weiterhin grünen Tests. Kleine Zyklen liefern frühe Rückmeldung. TDD ersetzt weder Anforderungsklärung noch Integrations-, Sicherheits- oder Abnahmetests.<\/p><h3>Fehler bewusst behandeln<\/h3><p>Definiere Verhalten für leere Eingaben, Grenzwerte und technische Fehler. Protokolliere passende Diagnoseinformationen ohne Geheimnisse. Ein Fehler darf nicht als Erfolg ausgegeben werden. Automatische Prüfungen und Reviews ergänzen persönliche Disziplin.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Die Funktion AuftragFreigeben prüft Fachregeln und nutzt einen abstrakten Speicherzugriff. Ein Unit-Test prüft, dass ein Auftrag ohne Positionen nicht freigegeben wird; ein weiterer prüft den gültigen Übergang. Der konkrete Datenbankadapter wird separat integriert getestet.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Eine Klasse validiert Aufträge, schreibt SQL, versendet E-Mails und baut HTML. Welche Verbesserung begründest du?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Verantwortlichkeiten mit verschiedenen Änderungsgründen trennen und über klare Verträge verbinden. Fachlogik wird dadurch isoliert testbar; Infrastruktur kann ersetzt werden. Die Aufteilung soll fachlich sinnvoll bleiben und keine Abstraktionen ohne Nutzen erzeugen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Gute Struktur hilft Änderungen; Tests sichern Verhalten, nicht bloß Zeilenausführung.<\/strong><\/p><h3>Weiterführende Primärquellen<\/h3><ul><li><a href=\"https://agilealliance.org/glossary/tdd/\" target=\"_blank\" rel=\"noopener noreferrer\">Agile Alliance: Test Driven Development<\/a><\/li><\/ul>","referenceIds":[4,9]},{"id":23,"code":"3.6","title":"Objektorientierung, Entwurfsmuster und UML","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Objekte, Verträge und passende Entwurfsmuster modellieren und mit geeigneten UML-Sichten erklären.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Objektorientierung<\/h3><p>Ein Objekt verbindet Zustand und Verhalten. Kapselung begrenzt unkontrollierte Änderungen; Fachregeln können über geeignete Operationen gesichert werden. Polymorphie erlaubt verschiedene Implementierungen eines gemeinsamen Vertrags. Vererbung passt nur, wenn die fachliche Ersetzbarkeit stimmt; Komposition kann flexibler sein.<\/p><h3>Muster mit Zweck<\/h3><p>Strategy kapselt austauschbare Verfahren, etwa verschiedene Preisberechnungen. Adapter übersetzt eine vorhandene fremde Schnittstelle in den benötigten Vertrag. Observer informiert registrierte Empfänger über Änderungen, wodurch neue Abhängigkeiten und Fehlerfälle entstehen können. Factory kapselt eine passende Objekterzeugung. Ein Mustername allein begründet noch keinen Einsatz.<\/p><h3>UML zielgerichtet einsetzen<\/h3><p>Ein Klassendiagramm beschreibt statische Typbeziehungen; ein Sequenzdiagramm eine konkrete Interaktion; ein Zustandsdiagramm gültige Zustände und Übergänge; ein Aktivitätsdiagramm Arbeitsabläufe mit Verzweigungen. Erkläre stets Bedeutung und gewünschte Aussage. Nicht jedes Diagramm muss alle Implementierungsdetails zeigen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Das Auftragsobjekt erlaubt Abschluss nur aus einem gültigen vorherigen Zustand. Eine Preisstrategie berechnet den Preis nach vereinbarten Regeln. Ein Adapter integriert die ältere Warenwirtschaft, ohne deren Datenformat überall zu verteilen.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Die Preisberechnung braucht künftig drei Tarifvarianten. Wann hilft Strategy und was ist zu testen?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Wenn Varianten einen gemeinsamen klaren Vertrag erfüllen und unabhängig austauschbar sein sollen. Prüfe jede Variante, ihre Auswahl und gemeinsame Regeln wie Rundung. Bei nur einer simplen Regel kann ein Muster unnötige Komplexität erzeugen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Modell und Muster müssen ein konkretes Fach- oder Änderungsproblem lösen.<\/strong><\/p>","referenceIds":[4,16]},{"id":24,"code":"3.7","title":"Versionsmanagement und CI/CD-Pipeline","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Änderungen nachvollziehbar versionieren und über eine verlässliche Pipeline prüfen und bereitstellen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Git im Team<\/h3><p>Commits dokumentieren zusammengehörige Änderungen; Branches ermöglichen getrennte Arbeit. Reviews prüfen Verständlichkeit, Fachlogik, Tests und Risiken. Konflikte werden bewusst aufgelöst und das kombinierte Ergebnis getestet. Geheimnisse gehören nicht ins Repository; bei Veröffentlichung müssen sie widerrufen beziehungsweise ersetzt werden.<\/p><h3>Pipeline und Artefakt<\/h3><p>Ein Build erzeugt ein versioniertes auslieferbares Artefakt. Die Pipeline prüft etwa Syntax, Unit- und Integrationstests, Abhängigkeiten und Paketierung. Definierte Werkzeug- und Abhängigkeitsversionen verbessern Reproduzierbarkeit. Das geprüfte Artefakt sollte unverändert durch die Umgebungen weitergegeben werden.<\/p><h3>CI, Delivery und Deployment<\/h3><p>Continuous Integration integriert kleine Änderungen regelmäßig mit automatischem Feedback. Continuous Delivery hält auslieferbare Stände bereit, eine Produktionsfreigabe kann manuell bleiben. Continuous Deployment überträgt geeignete bestandene Änderungen automatisiert in Produktion. Alle drei benötigen passende Qualitäts- und Rückfallmechanismen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Eine Änderung am Statusmodell erhält Tests und Review. Die Pipeline baut ein Paket mit Commitbezug. Nach Prüfung in Staging wird genau dieses Paket freigegeben; produktive Zugangsdaten werden erst über geschützte Konfiguration ergänzt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Eine Prüfung ist rot, aber der Termin drängt. Wie handelst du?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Fehler und Auswirkung klären, beheben oder eine begründete kontrollierte Ausnahme mit Verantwortung entscheiden. Die Prüfung stillschweigend abzuschalten würde das Qualitätssignal entwerten.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein Lieferprozess verbindet nachvollziehbare Änderung mit überprüftem Ergebnis.<\/strong><\/p>","referenceIds":[8]},{"id":25,"code":"3.8","title":"Release-Management und Software-Paketierung","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Eine Version vollständig paketieren und Releasewechsel kontrolliert planen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Was gehört ins Paket?<\/h3><p>Neben ausführbarem Code können statische Ressourcen, Schemaänderungen, Konfigurationsvorlagen, Lizenzhinweise, Betriebsanleitung und Versionsinformationen erforderlich sein. Umgebungsspezifische Geheimnisse werden separat verwaltet. Definiere Voraussetzungen, Abhängigkeiten und Installationsreihenfolge.<\/p><h3>Release und Deployment trennen<\/h3><p>Deployment bedeutet technische Bereitstellung; Release die Nutzungsfreigabe. Feature Flags können beides entkoppeln. Pilot, Canary und Blue-Green begrenzen unterschiedliche Risiken, erfordern aber Beobachtung, Kompatibilität und klare Zuständigkeit.<\/p><h3>Wechsel und Rückfall<\/h3><p>Beschreibe Ablauf, Freigabekriterien, Abbruchgrenzen, Datenmigration und Rückfallgrenzen. Ein altes Programm funktioniert nicht zwingend mit einem neuen Schema. Release Notes nennen Änderungen, bekannte Probleme und Maßnahmen für Anwender und Betrieb.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Das Portalpaket enthält Anwendung, Schemaerweiterung und Betriebsanleitung. Neue Funktionen bleiben zunächst deaktiviert. Nach Migration und Smoke-Test wird ein kleiner Nutzerkreis freigeschaltet, während Fehlergrenzen überwacht werden.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Warum ist „alte Version wieder starten“ nach einem Release keine ausreichende Rückfallplanung?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Datenformat, Schema, Konfiguration und externe Verträge können verändert sein. Ein sicherer Rückfall benötigt geprüfte Kompatibilität oder einen konkret getesteten Wiederherstellungsweg.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Paketierung, Datenwechsel und Freigabe bilden einen gemeinsamen kontrollierten Ablauf.<\/strong><\/p>","referenceIds":[8,11]},{"id":26,"code":"3.9","title":"Sicherheitsmaßnahmen in der Entwicklung","module":3,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Schutzmaßnahmen im Entwicklungsprozess planen, implementieren und anhand von Risiken überprüfen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Risiken und Vertrauensgrenzen<\/h3><p>Identifiziere Schutzgüter, mögliche Angriffe und Übergänge zwischen unterschiedlich vertrauenswürdigen Bereichen. Vertraulichkeit, Integrität und Verfügbarkeit betreffen verschiedene Schäden. Ein Bedrohungsmodell hilft, passende Maßnahmen schon im Entwurf zu wählen.<\/p><h3>Konkrete Maßnahmen<\/h3><p>Prüfe Rechte serverseitig auf dem einzelnen Objekt, nutze parametrisierte Abfragen und sichere Ausgabe fremder Texte. Anmeldung und Berechtigung sind getrennt. Passwörter werden mit geeigneten Passwort-Hashverfahren und Salt gespeichert, nicht reversibel als Passwortliste. TLS schützt den Transport, aber beweist keine sichere Fachlogik.<\/p><h3>Prüfbare Anforderungen<\/h3><p>OWASP bietet unter anderem überprüfbare Anwendungssicherheitsanforderungen; BSI-Materialien unterstützen Sicherheits- und Betriebsorganisation. Wähle die passende aktuelle Fassung und den passenden Anwendungsbereich. Ein Werkzeugscan allein beweist keine vollständige Sicherheit.<\/p><h3>Betrieb mitdenken<\/h3><p>Geheimnisse benötigen geeignete Verwaltung und Rotation. Logs sollen Ereignisse analysierbar machen, aber keine Token oder unnötige personenbezogene Inhalte offenlegen. Behandle bekannte Schwachstellen nach Exposition und Risiko und prüfe Updates angemessen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Ein Kunde ändert die Auftrags-ID in einem API-Aufruf. Der Server prüft trotzdem die Zuordnung zum angemeldeten Kunden und lehnt fremde Daten ab. Dieses Verhalten wird mit positiven und negativen Tests abgesichert.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein API-Schlüssel stand in einem öffentlichen Commit. Reicht das Löschen der aktuellen Datei?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Nein. Kopien und Historie können den Schlüssel weiter enthalten. Er muss widerrufen beziehungsweise rotiert werden; Nutzung und Folgen werden geprüft, anschließend wird die Ursache im Lieferprozess behoben.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Sicherheit entsteht durch passende Regeln, korrekte Umsetzung und überprüfte Wirkung.<\/strong><\/p><h3>Weiterführende Primärquellen<\/h3><ul><li><a href=\"https://owasp.org/projects/asvs\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP: Application Security Verification Standard<\/a><\/li><li><a href=\"https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Standards-und-Zertifizierung/IT-Grundschutz/it-grundschutz_node.html\" target=\"_blank\" rel=\"noopener noreferrer\">BSI: IT-Grundschutz<\/a><\/li><\/ul>","referenceIds":[13]},{"id":27,"code":"3.10","title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","module":3,"minutes":360,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Die Entwicklungsbausteine zu einer kleinen sicheren Auftragsanwendung zusammenführen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Vertikaler Schnitt<\/h3><p>Setze zuerst einen kleinen vollständigen Nutzungsfall um: berechtigter Kunde legt einen Auftrag mit Positionen an und ruft ihn wieder ab. Dieser Schnitt verbindet Oberfläche, API, Fachlogik, Datenbank und Betriebsdiagnose. Ein vollständiger einfacher Ablauf liefert früh Integrationsfeedback.<\/p><h3>Technische Grundlagen nutzen<\/h3><p>Prozesse, Speicher, Dateien und Logs erklären, wie die Anwendung läuft. Netzwerkgrundlagen erklären Adressen, Ports, DNS und sichere Übertragung. Algorithmen und Datentypen helfen bei Validierung und Verarbeitung. Diese Grundlagen bleiben in der ergänzenden Bibliothek verfügbar.<\/p><h3>Qualität schrittweise nachweisen<\/h3><p>Beginne mit Unit-Tests der Fachregeln, ergänze echte Integration, Rollenprüfung und Fehlerfälle. Prüfe konkurrierende Statusänderungen, wiederholte Auftragsanlage und fehlendes Netz. Dokumentiere Grenzen des Projekts statt einen kleinen Prototyp als vollständiges Produkt auszugeben.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Ein Statusupdate prüft Version und Rolle, schreibt Änderung und Verlauf konsistent und liefert eine verständliche Fehlerantwort bei einem Konflikt. Ein Trace verbindet API-Aufruf und Datenbankzugriff, ohne sensible Inhalte zu speichern.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Welche Nachweise gehören zu deinem kleinen Integrationsprojekt?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Anforderung und Akzeptanzkriterien, Entwurf und Datenmodell, nachvollziehbare Versionsstände, Testfälle und Ergebnisse, Sicherheitsprüfungen, Installations- und Betriebsinformationen sowie eine Reflexion offener Grenzen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Ein durchgängiger kleiner Nutzungsfall zeigt mehr als viele getrennte unverbundene Komponenten.<\/strong><\/p>","referenceIds":[2,3,4,19]},{"id":28,"code":"3.11","title":"Prüfungsvorbereitung und Modulabschluss","module":3,"minutes":180,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Entwicklung, Datenzugriff, Lieferprozess und Sicherheit fachlich begründet zusammen darstellen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Prüfungsantwort entwickeln<\/h3><p>Beschreibe Vertrag und Fachregeln, sichere Eingaben und Berechtigungen, Datenintegrität, Testverfahren, Build und Release. Erkläre Alternativen und Folgen. Ein Werkzeugname reicht nicht als Begründung.<\/p><h3>Präsentation und Fachgespräch<\/h3><p>Nutze einen nachvollziehbaren Ablauf: Ausgangslage, Entscheidung, Umsetzung, Nachweis, Grenzen. Bereite Rückfragen zu verworfenen Optionen, Tests, Sicherheit und Betrieb vor. Erkläre Unsicherheiten offen und benenne einen sinnvollen Klärungsweg.<\/p><h3>Selbstprüfung<\/h3><p>Löse eine neue Variante des Logistikfalls ohne Vorlage. Beispielsweise darf ein Kunde einen Auftrag stornieren, während die Disposition ihn freigibt. Leite Konfliktregel, Datenzugriff, Antwort und Test ab. So prüfst du Transfer statt bloß bekannte Begriffe.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Du erläuterst eine sichere Stornierung über API, Objektberechtigung, gültigen Statusübergang, Versionskontrolle, Transaktion und Regressionstest. Anschließend begründest du, wie diese Änderung kontrolliert ausgeliefert wird.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Wie antwortest du auf „Warum haben Sie kein Microservice-System gewählt?“<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Mit den Fallkriterien: Teamgröße, Betriebsaufwand, Änderungsbedarf, Last und Integrationsrisiko. Benenne den Nutzen deiner modularen Lösung und die Bedingungen, unter denen eine spätere Aufteilung neu bewertet würde.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Die Entscheidung und ihre überprüfte Wirkung stehen im Mittelpunkt, nicht die Zahl der verwendeten Werkzeuge.<\/strong><\/p>","referenceIds":[20,21,23]},{"id":29,"code":"4.0","title":"Sicherstellen der Produktqualität","module":4,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Produktqualität durch passende Ziele, Testverfahren und nachvollziehbare Bewertung sichern.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Qualitätsziele ableiten<\/h3><p>Funktionale Korrektheit ist nur ein Teil. Zuverlässigkeit, Bedienbarkeit, Leistung, Wartbarkeit und Sicherheit benötigen eigene Kriterien. Verifikation prüft die Übereinstimmung mit der Spezifikation; Validierung die Eignung für den tatsächlichen Bedarf.<\/p><h3>Testplan und Umgebung<\/h3><p>Leite Testziele aus Anforderungen und Risiken ab. Plane Daten, Rollen, Umgebung, Werkzeuge, Verantwortliche und Abschlusskriterien. Repräsentative Testdaten sind wichtig; echte personenbezogene Daten sollten nicht unnötig in Testsysteme kopiert werden.<\/p><h3>Testentwurf<\/h3><p>Äquivalenzklassen gruppieren Eingaben mit erwartet ähnlichem Verhalten; Grenzwerttests prüfen direkt an zulässigen Grenzen. Unit-, Integrations-, System- und Abnahmetests haben verschiedene Ziele. Retest bestätigt eine Fehlerbehebung, Regression sichert vorhandenes Verhalten. Lasttest prüft erwartete Last; Stresstest untersucht Grenzen und Erholung.<\/p><h3>Ergebnis und Verbesserung<\/h3><p>Dokumentiere Soll und Ist, Reproduktionsschritte und Umgebung. Severity bewertet Auswirkung, Priority die Bearbeitungsdringlichkeit. Hohe Codeabdeckung beweist keine Fehlerfreiheit. Bei flackernden Tests sind instabile Daten-, Zeit- oder Parallelitätsabhängigkeiten zu untersuchen.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Der Testplan für Auftragsanlage umfasst Pflichtfelder, Mengen 0/1 und obere Grenzen, fremde Kundenrollen, doppelte Requests, Datenbankfehler und Wiederherstellung. Die erwartete Fehlerrate und Antwortzeit werden unter definierter Last gemessen.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Eine neue Statusfunktion besteht ihren Unit-Test. Welche zusätzlichen Prüfungen sind angemessen?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Reales Zusammenspiel mit Datenbank und API, Objektberechtigungen, parallele Änderungen, gültige und ungültige Statusübergänge sowie Regression bestehender Abläufe. Der Umfang richtet sich nach Risiko.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Qualitätsziele bestimmen die Prüfungen; Testergebnisse müssen eine Entscheidung ermöglichen.<\/strong><\/p>","referenceIds":[9,22]},{"id":30,"code":"5.0","title":"Software- und Anwenderdokumentation erstellen","module":5,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Dokumentation für Entwicklung, Betrieb und Anwender zielgruppengerecht erstellen und pflegen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Zielgruppen und Aufgaben<\/h3><p>Entwickler brauchen Architektur, Verträge und Entscheidungen. Der Betrieb braucht Installation, Konfiguration, Überwachung und Wiederherstellung. Anwender brauchen verständliche Arbeitsabläufe und Hilfe bei Fehlern. Eine einzige unstrukturierte Datei erfüllt diese Bedürfnisse selten gut.<\/p><h3>Geeignete Inhalte<\/h3><p>API-Dokumentation enthält Eingaben, Ausgaben, Fehler und Sicherheit. Ein Runbook nennt Auslöser, Verantwortliche, Schritte und Prüfpunkte. Anwenderanleitungen beschreiben Voraussetzungen, Bedienfolge und erkennbare Ergebnisse. Screenshots brauchen passende Version und sollten keine unnötigen echten Kundendaten zeigen.<\/p><h3>Pflege und Schulung<\/h3><p>Versioniere wichtige Dokumente und verknüpfe Pflege mit Änderungen. Prüfe Anleitungen durch Personen der Zielgruppe. Schulungsunterlagen enthalten Lernziele, Übungen und Erfolgskontrolle. Eine Wissensdatenbank benötigt Verantwortliche, auffindbare Struktur und regelmäßige Prüfung.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Für das Portal entsteht eine kurze Kundenanleitung, ein Betriebshandbuch und eine Entwicklerbeschreibung der API. Der Support erhält typische Fehlerbilder und Eskalationswege. Änderungen am Statusmodell aktualisieren alle betroffenen Dokumente.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein neuer Mitarbeiter kann die Installation anhand der Anleitung nicht durchführen. Wie überprüfst du die Qualität?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Den Ablauf mit einem Zielgruppennutzer beobachten, fehlende Voraussetzungen und unklare Schritte erfassen, Anleitung verbessern und erneut durchführen lassen. Die Erfolgsprüfung gehört zum Dokument.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Dokumentation ist gut, wenn die Zielgruppe ihre Aufgabe damit sicher erfüllen kann.<\/strong><\/p>","referenceIds":[10,22]},{"id":31,"code":"6.0","title":"Übergeben und Einführen des Systems","module":6,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Abnahme, Betriebsübergabe und Rollout einschließlich Schulung kontrolliert durchführen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Abnahme vorbereiten<\/h3><p>Vereinbare Kriterien, Verantwortliche und Verfahren. Halte Ergebnisse, Mängel, Vorbehalte und die Entscheidung im Protokoll fest. Technischer Start und fachliche Abnahme sind unterschiedliche Nachweise. Vertragsfragen müssen im konkreten rechtlichen Kontext geprüft werden.<\/p><h3>Übergabe und Rollout<\/h3><p>Übergebe Artefakte, Konfiguration, Dokumentation, Rechte, Supportwege und Wiederherstellungsinformationen. Nutze eine passende Einführungsstrategie mit Messung und Abbruchkriterien. Datenmigration und alte Clients müssen berücksichtigt werden.<\/p><h3>Betriebsbereitschaft<\/h3><p>Definiere Wiederherstellungsdauer (RTO) und tolerierten Datenverlust (RPO) passend zum Prozess. Teste Restore, nicht nur Sicherung. Monitoring und Bereitschaftszuständigkeit gehören zur Einführung. Schulen und Unterstützung helfen Nutzern, neue Abläufe tatsächlich anzuwenden.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Das Portal startet mit einem Pilotkunden. Die Freigabe hängt an fachlichen Tests, geeigneten Sicherheitsnachweisen, getesteter Wiederherstellung und geschultem Support. Nach dem Pilot werden Probleme bewertet und der Rollout ausgeweitet.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Das System ist erreichbar, doch die Lagerarbeit stockt. War die Einführung erfolgreich?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Die technische Erreichbarkeit ist nachgewiesen, die wirksame Nutzung noch nicht. Prüfe Abläufe, Schulung, Berechtigungen und Unterstützung sowie vereinbarte fachliche Erfolgsziele.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Einführung endet nicht beim Deployment, sondern bei tragfähigem Betrieb und wirksamer Nutzung.<\/strong><\/p>","referenceIds":[11,22]},{"id":32,"code":"7.0","title":"Evaluation als Basis kontinuierlicher Verbesserung","module":7,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Ergebnisse und Entwicklungsprozesse messen, kritisch reflektieren und gezielt verbessern.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Ziele und Ausgangswerte<\/h3><p>Lege vor einer Maßnahme fest, welche Wirkung erwartet wird und wie sie gemessen wird. Vergleiche unter ähnlichen Bedingungen. Mittelwerte können langsame Randfälle verbergen; Perzentile, Fehlerraten und Nutzerfeedback ergänzen die Sicht.<\/p><h3>PDCA und Ursachen<\/h3><p>Plan: Problem und Ziel klären; Do: Maßnahme umsetzen; Check: Wirkung prüfen; Act: anpassen oder bewährtes Vorgehen übernehmen. Eine Ursachenanalyse betrachtet technische und organisatorische Bedingungen. Korrelation allein beweist keine Ursache.<\/p><h3>Verbesserung nachverfolgen<\/h3><p>Produktverbesserung verändert die Lösung; Prozessverbesserung die Arbeitsweise. Definiere Verantwortliche, Termin und Erfolgskriterium. Halte Erkenntnisse in der Wissensbasis fest. Unwirksame Maßnahmen werden überprüft, nicht durch angepasste Zahlen schön dargestellt.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Nach der Einführung sinkt die Zahl doppelter Aufträge, die Bearbeitungszeit steigt aber. Das Team prüft Oberfläche, Freigaberegeln und Nutzerfeedback, bevor es eine weitere Änderung auswählt.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein Cache wurde eingeführt, Beschwerden über alte Statusanzeigen nehmen zu. Was evaluierst du?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Antwortzeit und Aktualität gemeinsam, Regeln zur Invalidierung, betroffene Nutzungssituationen und fachliche Folgen. Eine schnelle falsche Anzeige erfüllt das Ziel nicht.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Eine Verbesserung braucht eine nachgewiesene Wirkung und einen verantwortlichen Lernprozess.<\/strong><\/p>","referenceIds":[12,17]},{"id":33,"code":"8.0","title":"Organisatorische und rechtliche Vorgaben","module":8,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Organisatorische Regeln, Datensicherheit und rechtliche Rahmenbedingungen im Projekt berücksichtigen.<\/p><\/div><p class=\"mini\">Die Praxisbeispiele beziehen sich auf die eigene Übungsfallstudie „Mittelland Logistik“ aus Einheit 2.0.<\/p><h3>Risiken und Datensicherheit<\/h3><p>Bestimme Schutzbedarf und Risiken nach Wahrscheinlichkeit und Auswirkung. Plane angemessene Maßnahmen für Rechte, Übertragung, Speicherung, Sicherung und Wiederherstellung. Benenne Verantwortung und regelmäßige Prüfung. Hochverfügbarkeit ersetzt keine Sicherung gegen falsche Änderungen oder Löschung.<\/p><h3>Datenschutz und Aufbewahrung<\/h3><p>Erhebe personenbezogene Daten zweckbezogen und begrenze Umfang und Zugriff. Prüfe Rechtsgrundlage, Informationspflichten, Rollen und notwendige Vereinbarungen mit externen Dienstleistern anhand der konkreten Verarbeitung. Pseudonymisierte Daten können weiterhin zuordenbar sein. Ein Löschkonzept muss Aufbewahrungspflichten und technische Abläufe berücksichtigen. Dies ist fachliche Orientierung, keine individuelle Rechtsberatung.<\/p><h3>Lizenzen, Verträge und Regeln<\/h3><p>Prüfe Nutzungsrechte von Code, Bildern und Komponenten. Open Source bedeutet nicht pflichtenfreie Nutzung. Dokumentiere Lizenzen und erforderliche Hinweise. Interne Freigaben, Beschaffung, Änderungsregeln und Zuständigkeiten gehören ebenfalls zur Compliance.<\/p><h3>Barrierefreiheit und Nachhaltigkeit<\/h3><p>Tastaturbedienung, verständliche Fehler, Kontrast und skalierbarer Text unterstützen unterschiedliche Nutzer. Vermeide unnötige Berechnung, Übertragung und dauerhaft ungenutzte Ressourcen. Konkrete rechtliche Pflichten hängen vom Anwendungsbereich ab und werden anhand aktueller Quellen geprüft.<\/p><h3>Praxisbeispiel<\/h3><blockquote>Kunden sehen nur eigene Aufträge. Testumgebungen arbeiten mit geeigneten synthetischen Daten. Ein Lizenzverzeichnis begleitet die Auslieferung; Betriebsregeln beschreiben Zugriff und Sicherung.<\/blockquote><h3>Selbstcheck ohne Antwortoptionen<\/h3><p>Ein Dienstleister soll Lieferadressen verarbeiten. Welche Punkte klärst du vor Beauftragung?<\/p><details><summary>Mögliche Lösung anzeigen<\/summary><p>Zweck und erforderliche Daten, rechtliche Rollen und Voraussetzungen, Schutzmaßnahmen, Zugriff, Aufbewahrung beziehungsweise Löschung, erforderliche Vereinbarungen sowie mögliche Übermittlungen. Die konkrete Bewertung erfolgt anhand aktueller verbindlicher Quellen.<\/p><\/details><h3>Merksatz<\/h3><p><strong>Rechtliche und organisatorische Anforderungen sind Teil des Entwurfs und des Betriebs.<\/strong><\/p>","referenceIds":[13,14,25]},{"id":34,"code":"9.0","title":"Projektunterstützung und -koordination","module":9,"minutes":null,"examRelevant":true,"lesson":"<div class=\"callout\"><strong>Lernziel<\/strong><p>Ein Teilprojekt mit Aufwand, Ressourcen, Risiken und verständlichem Status unterstützen.<\/p><\/div><p class=\"mini\">Die Praxisbeispi
