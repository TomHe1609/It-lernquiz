l-content/DE/TXT/?uri=CELEX:32016R0679<\/p>\n<p><strong>[Q3] Bundesamt für Sicherheit in der Informationstechnik\n(BSI), IT-Grundschutz-Kompendium und Standard 200-4, Themen\nDatensicherung, RPO, RTO, Wiederherstellung.<\/strong><br/>\nhttps://www.bsi.bund.de/<\/p>\n<p><strong>[Q4] ISO/IEC 25010:2023 –\nProduktqualitätsmodell.<\/strong><br/>\nhttps://www.iso.org/standard/78176.html<\/p>\n<p><strong>[Q5] OWASP Top 10:2025 – Risiken von Webanwendungen, deutsche\nAusgabe.<\/strong><br/>\nhttps://top10.owasp.org/2025/de/<\/p>\n<p><strong>[Q6] Scrum Guide, Version November 2020.<\/strong><br/>\nhttps://scrumguides.org/scrum-guide.html<\/p>\n<p><strong>Weiterführende Primärquelle zur\nPrüfungsorganisation:<\/strong> Die Internetseite und die jeweils\naktuellen Merkblätter deiner zuständigen Industrie- und Handelskammer.\nAllgemeine Lernhefte können individuelle IHK-Mitteilungen,\nGenehmigungsentscheidungen und vertragliche Rahmenbedingungen nicht\nersetzen.<\/p>\n","questions":4}],"caseStudy":{"title":"Mittelland Logistik","kind":"Eigene fiktive Übungsfallstudie","html":"<p><strong>Eigene Übungsfallstudie:<\/strong> „Mittelland Logistik“ ist hier ein fiktiver Übungsbetrieb. Die folgenden Angaben wurden für diese Lern-App entwickelt und sind keine Originalunterlagen deines Bildungsträgers.<\/p><p>Die Disposition plant Transporte in Tabellen. Das Lager meldet Abholbereitschaft telefonisch. Fahrer erhalten Änderungen per Nachricht. Ein Kundenportal soll künftig Aufträge erfassen und den Status anzeigen. Das vorhandene Warenwirtschaftssystem bleibt zunächst bestehen.<\/p><p>Für unsere Übungen nehmen wir 80 interne Nutzer, bis zu 200 gleichzeitig aktive Portalnutzer und zeitweise instabile Mobilverbindungen an. Personenbezogene Kontaktdaten, Lieferadressen und Rollen müssen geschützt werden. Mengen und Zeiten sind Übungsannahmen, keine belegten Unternehmensdaten.<\/p><p>Ein Transportauftrag gehört genau einem Kunden. Er enthält mindestens eine Position. Statuswechsel erfolgen nach Regeln: Entwurf → freigegeben → disponiert → unterwegs → abgeschlossen; Stornierung ist vor Fahrtbeginn möglich. Kunden dürfen nur eigene Aufträge sehen. Ob Mehrfachstopps, Teillieferungen oder andere Zustände erforderlich sind, muss im echten Projekt ermittelt werden.<\/p>"},"courseNote":"Die Gliederung folgt den bereitgestellten Kursbildern. Einzelzeiten sind Kursangaben; für Module 4–9 waren keine Unterthemen oder Zeiten sichtbar. Deren Vertiefung orientiert sich an den offiziellen Qualifikationsschwerpunkten."}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('quizdata').textContent),chapters=DATA.chapters,allQ=DATA.questions;
const $=s=>document.querySelector(s), view=$('#view');
let state={page:'home',chapter:1,tab:'learn',set:[],index:0,mode:'chapter',sessionAnswers:[],selected:null,submitted:false,complete:false,started:0,filter:'all',search:'',module:'all'};
let storageOk=true;
function load(){try{return JSON.parse(localStorage.getItem('bssw_quiz_v1'))||{attempts:{},settings:{theme:'dark',font:0},sessions:0}}catch(e){storageOk=false;return {attempts:{},settings:{theme:'dark',font:0},sessions:0}}}
let record=load();
function save(){try{localStorage.setItem('bssw_quiz_v1',JSON.stringify(record))}catch(e){storageOk=false}}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chapterName(i){return chapters.find(c=>c.id===i)?.title||''}
function questionCount(ch){return allQ.filter(q=>q.chapter===ch).length}
function attemptsFor(ch){return allQ.filter(q=>q.chapter===ch).filter(q=>record.attempts[q.id]).length}
function allAnswered(){return allQ.filter(q=>record.attempts[q.id]).length}
function allCorrect(){return allQ.filter(q=>record.attempts[q.id]?.lastCorrect).length}
function pct(a,b){return b?Math.round(100*a/b):0}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(page){state.page=page;state.submitted=false;window.scrollTo(0,0);render()}
function render(){
 document.body.classList.toggle('light',record.settings.theme==='light');
 document.body.style.setProperty('--zoom',String(1+(record.settings.font||0)*.12));
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===state.page||(state.page==='lesson'&&e.dataset.nav==='chapters')||(state.page==='quiz'&&e.dataset.nav==='practice')));
 if(state.page==='home')home();if(state.page==='chapters')chapterList();if(state.page==='lesson')lesson();if(state.page==='practice')practice();if(state.page==='quiz')quiz();if(state.page==='result')result();if(state.page==='progress')progress();if(state.page==='references')referenceLibrary();
}
function quiz(){const q=state.set[state.index],isExam=state.mode==='exam',total=state.set.length,p=state.index+1;const title=state.mode==='chapter'?`Lerneinheit ${chapterLabel(state.chapter)}`:state.mode==='module'?`Modul ${state.quizModule}`:isExam?'Prüfungssimulation':'Wissentraining';const answer=state.sessionAnswers[state.index];
 view.innerHTML=`<button class="back" data-action="quit">← Training verlassen</button><div class="heading-row"><div><div class="eyebrow">${esc(title)}</div><h1 style="margin:5px 0 13px;font-size:25px">${isExam?'Prüfungsmodus':esc(chapterName(q.chapter))}</h1></div><span class="chip">${p} von ${total}</span></div><div class="progress" aria-label="Fortschritt"><span style="width:${Math.round(100*(state.index+(state.submitted?1:0))/total)}%"></span></div>${isExam?`<div class="exam-banner">⏱ Prüfungsmodus: Rückmeldung erst nach dem letzten Antwortschritt. <span id="clock"></span></div>`:''}<div class="card qcard" style="margin-top:14px"><div class="qtag">FRAGE ${p} · ${esc(chapterName(q.chapter))}</div><div class="question">${esc(q.question)}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer ${state.selected===i?'selected':''} ${state.submitted&&i===q.correct?'correct':''} ${state.submitted&&i===state.selected&&i!==q.correct?'incorrect':''}" data-answer="${i}" ${state.submitted?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${!isExam&&!state.submitted?`<details class="tip"><summary>💡 Hinweis zur Frage anzeigen</summary><p>${esc(q.hint)}</p></details>`:''}${state.submitted&&!isExam?`<div class="feedback ${state.selected===q.correct?'good':'bad'}"><strong>${state.selected===q.correct?'✓ Richtig erkannt!':'↻ Noch nicht ganz.'}</strong><p>${esc(q.explanation)}</p>${state.selected!==q.correct?`<p class="reason">Richtige Antwort: ${esc(q.options[q.correct])}</p>`:''}</div>`:''}<div class="btn-row" style="margin-top:18px">${!state.submitted?`<button class="btn" data-action="check" ${state.selected===null?'disabled':''}>${isExam?(p===total?'Prüfung auswerten':'Antwort speichern →'):'Antwort überprüfen'}</button>`:`<button class="btn" data-action="next">${p===total?'Ergebnis ansehen':'Nächste Frage →'}</button>`}</div></div>`;
 if(isExam){const secs=Math.round((Date.now()-state.started)/1000),m=Math.floor(secs/60),s=secs%60;$('#clock').textContent=`· bisher ${m}:${String(s).padStart(2,'0')} Min.`}
}
function check(){if(state.selected===null)return;const q=state.set[state.index],passed=state.selected===q.correct;state.sessionAnswers[state.index]={q:q.id,correct:passed,picked:state.selected}; if(state.mode==='exam'){saveAttempt(q.id,passed);if(state.index>=state.set.length-1){finish()}else{state.index++;state.selected=null;render();window.scrollTo(0,0)}return};state.submitted=true;saveAttempt(q.id,passed);render()}
function saveAttempt(qid,passed){const old=record.attempts[qid]||{count:0};record.attempts[qid]={count:old.count+1,lastCorrect:passed,everCorrect:old.everCorrect||passed,at:new Date().toISOString()};save()}
function next(){if(state.index>=state.set.length-1){finish();return}state.index++;state.selected=null;state.submitted=false;render();window.scrollTo(0,0)}
function finish(){record.sessions++;save();state.page='result';state.complete=true;render();window.scrollTo(0,0)}
function result(){const total=state.set.length,correct=state.sessionAnswers.filter(a=>a?.correct).length,missed=state.sessionAnswers.filter(a=>!a?.correct);const review=state.set.map((q,i)=>{let a=state.sessionAnswers[i];return `<div class="review-item"><div class="qtag">${esc(chapterName(q.chapter))}</div><strong>${esc(q.question)}</strong><p>${a?.correct?'✅':'❌'} Deine Antwort: ${esc(q.options[a?.picked??0])}</p>${a?.correct?'':`<p>✓ Richtig: <b>${esc(q.options[q.correct])}</b></p>`}<p class="muted">${esc(q.explanation)}</p></div>`}).join('');view.innerHTML=`<button class="back" data-action="nav" data-page="practice">← Training</button><div class="card"><div class="result"><div class="eyebrow">TRAINING ABGESCHLOSSEN</div><div class="score">${correct}/${total}</div><h1 style="margin:10px 0">${pct(correct,total)} % richtig</h1><p class="muted">${correct===total?'Stark! Du hast alle Fragen korrekt gelöst.':correct>=total*.7?'Guter Stand – mit Wiederholungen wird es noch sicherer.':'Schau dir die Erklärungen an und übe die offenen Themen gezielt.'}</p><div class="btn-row"><button class="btn" data-action="nav" data-page="chapters">Kapitel ansehen</button><button class="btn outline" data-action="start" data-mode="wrong" ${allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect).length?'':'disabled'}>Fehler wiederholen</button></div></div><details><summary style="cursor:pointer;font-weight:800;margin:10px 0">Alle Antworten und Erklärungen anzeigen</summary>${review}</details></div>`}
function progress(){const total=allAnswered(),right=allCorrect(),wrong=total-right;view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Dein Lernfortschritt</h1><p class="muted">Du siehst hier, welche Themen du schon bearbeitet hast und wo Wiederholungen sinnvoll sind.</p><div class="stats"><div class="stat"><div class="num">${total}</div><small>Fragen bearbeitet</small></div><div class="stat"><div class="num">${right}</div><small>Zuletzt richtig</small></div><div class="stat"><div class="num">${wrong}</div><small>Wiederholen</small></div></div><div class="card stack"><div class="heading-row"><b>Gesamtfortschritt</b><span>${pct(total,allQ.length)} %</span></div><div class="progress"><span style="width:${pct(total,allQ.length)}%"></span></div><p class="mini">Deine bisherigen Antworten bleiben erhalten und sind jetzt passenden Kursthemen zugeordnet. Fortschritt basiert auf Fragen, die du mindestens einmal beantwortet hast. „Zuletzt richtig“ kann sich beim Wiederholen verändern.</p></div><h2 class="section-title">Deine Lerneinheiten</h2><div class="stack">${chapters.map(c=>`<button class="course" data-action="lesson" data-ch="${c.id}" style="min-height:auto"><div class="number">${chapterLabel(c.id)}</div><div class="ctext"><strong>${esc(c.title)}</strong><p>${attemptsFor(c.id)} von ${questionCount(c.id)} bearbeitet</p><div class="meter"><i style="width:${pct(attemptsFor(c.id),questionCount(c.id))}%"></i></div></div></button>`).join('')}</div><div class="card stack" style="margin-top:20px"><h3>Fortschritt verwalten</h3><p class="muted">Dieser Browser speichert deinen Lernstand lokal. Sichere ihn als JSON-Datei und importiere die Datei im anderen Browser. Der Import ersetzt nach Bestätigung den dort vorhandenen Stand.</p><div class="btn-row"><button class="btn soft" data-action="export">Fortschritt sichern</button><label class="btn outline" style="cursor:pointer">Fortschritt importieren<input id="import" type="file" accept="application/json" hidden></label></div><button class="btn outline" data-action="reset">Gespeicherten Fortschritt zurücksetzen</button>${!storageOk?'<div class="callout">Dein Browser blockiert die lokale Speicherung. Der Fortschritt bleibt dann nur bis zum Schließen erhalten.</div>':''}</div>`;$('#import').onchange=importData}
function exportData(){let blob=new Blob([JSON.stringify({app:'Berufsspezialist Quiz',version:1,record},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Berufsspezialist_Lernfortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result);if(v.version!==1||!v.record?.attempts)throw new Error('Format');if(!confirm('Vorhandenen Lernfortschritt durch den importierten Stand ersetzen?'))return;record=v.record;save();render()}catch(err){alert('Die Datei hat kein gültiges Lernstand-Format.')}};rd.readAsText(f)}
function reset(){if(confirm('Gesamten Lernfortschritt auf diesem Gerät wirklich löschen?')){record.attempts={};record.sessions=0;save();render()}}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action],[data-nav],[data-answer],[data-tab],[data-filter]');if(!a)return;
 if(a.dataset.nav){nav(a.dataset.nav);return}if(a.dataset.answer!==undefined){if(state.submitted)return;state.selected=Number(a.dataset.answer);render();return}if(a.dataset.filter){state.filter=a.dataset.filter;chapterList();return}if(a.dataset.tab){state.tab=a.dataset.tab;lesson();return}
 let act=a.dataset.action;
 if(act==='nav')nav(a.dataset.page);else if(act==='lesson'){state.chapter=Number(a.dataset.ch);state.tab='learn';nav('lesson')}else if(act==='quiz-ch')start(Number(a.dataset.ch),'chapter');else if(act==='start')start(state.chapter,a.dataset.mode);else if(act==='check')check();else if(act==='next')next();else if(act==='quit'){if(confirm('Training verlassen? Bereits geprüfte Antworten bleiben im Lernfortschritt gespeichert.'))nav(state.mode==='chapter'?'chapters':'practice')}else if(act==='export')exportData();else if(act==='reset')reset();
});
$('#theme').addEventListener('click',()=>{record.settings.theme=record.settings.theme==='light'?'dark':'light';save();render()});
$('#font').addEventListener('click',()=>{record.settings.font=((record.settings.font||0)+1)%4;save();render()});
// COURSE_UI_BEGIN

function chapterLabel(id){return chapters.find(c=>c.id===id)?.code||String(id)}
function moduleName(id){return DATA.modules.find(m=>m.id===id)?.title||''}
function moduleQuestions(id){return allQ.filter(q=>chapters.find(c=>c.id===q.chapter)?.module===id)}
function moduleAnswered(id){return moduleQuestions(id).filter(q=>record.attempts[q.id]).length}
function referenceDetails(c){return `<details class="reference-details"><summary>Zusätzliche Grundlagen und Vorlagen</summary>${c.referenceIds.map(id=>{const r=DATA.referenceChapters.find(x=>x.id===id);return `<details><summary>${esc(r.title)}</summary>${r.lesson}</details>`}).join('')}</details>`}
function home(){
 const done=allAnswered(),correct=allCorrect(),next=chapters.find(c=>attemptsFor(c.id)<questionCount(c.id))||chapters[0];
 view.innerHTML=`<section class="hero"><div class="eyebrow">DEINE WEITERBILDUNG · DEIN LERNPLAN</div><h1>Verstehen. Anwenden. Prüfungssicher werden.</h1><p class="lead">Dein Lernheft folgt dem Kursaufbau: vom Kickoff und der Lernmethodik über Architektur und Entwicklung bis zu Qualität, Einführung und Projektkoordination.</p><div class="hero-line"><span class="chip">${DATA.modules.length} Kursmodule</span><span class="chip">${chapters.length} Lerneinheiten</span><span class="chip">${allQ.length} erklärte Fragen</span><span class="chip">Offline nutzbar</span></div></section><aside class="install-card"><strong>📲 Als App auf deinem iPhone nutzen</strong><p>Installiere den Lerntrainer auf deinem Home-Bildschirm.</p><details><summary>Installationsanleitung anzeigen ▾</summary><ol><li>Öffne diese Seite in Safari.</li><li>Tippe auf Teilen und „Zu Home-Bildschirm hinzufügen“.</li><li>Aktiviere gegebenenfalls „Als Web-App öffnen“ und tippe auf „Hinzufügen“.</li><li>Starte die App über das neue Symbol. Nach dem ersten erfolgreichen Laden funktioniert sie auch offline.</li></ol></details></aside><section class="stats"><div class="stat"><div class="num">${done}<span class="muted">/${allQ.length}</span></div><small>Fragen bearbeitet</small></div><div class="stat"><div class="num">${pct(correct,done)}%</div><small>Aktuell richtig</small></div><div class="stat"><div class="num">${record.sessions}</div><small>Trainings abgeschlossen</small></div></section><div class="card stack"><div class="eyebrow">DEIN NÄCHSTER SCHRITT</div><h2>${esc(next.code)} · ${esc(next.title)}</h2><p class="muted">${questionCount(next.id)} Fragen mit Erklärungen · ${esc(moduleName(next.module))}</p><div class="progress"><span style="width:${pct(attemptsFor(next.id),questionCount(next.id))}%"></span></div><div class="btn-row"><button class="btn" data-action="lesson" data-ch="${next.id}">Lerneinheit öffnen →</button><button class="btn outline" data-action="quiz-ch" data-ch="${next.id}">Direkt zum Quiz</button></div></div><h2 class="section-title">Passend zu deinem Kurs</h2><div class="mode-grid"><div class="card"><h3>📚 Kursmodule</h3><p>Alle sichtbaren Kursthemen in ihrer Reihenfolge – mit Lernzielen, Beispielen und freien Selbstchecks.</p><button class="btn soft" data-action="nav" data-page="chapters">Kursübersicht öffnen</button></div><div class="card"><h3>🧠 Aktiv üben</h3><p>Einzelthemen, ganze Module oder einen gemischten Durchgang trainieren.</p><button class="btn soft" data-action="nav" data-page="practice">Trainingsmodi öffnen</button></div><div class="card"><h3>🚚 Mittelland Logistik</h3><p>Eine eigene, ausdrücklich gekennzeichnete Fallstudie verbindet Anforderungen, Entwurf, Entwicklung und Betrieb.</p><button class="btn soft" data-action="lesson" data-ch="${chapters.find(c=>c.code==='2.0').id}">Übungsbetrieb kennenlernen</button></div><div class="card"><h3>📖 Grundlagen und Vorlagen</h3><p>Die bisherigen Lerntexte, Fachbegriffe und Arbeitsvorlagen bleiben als Vertiefung verfügbar.</p><button class="btn soft" data-action="nav" data-page="references">Bibliothek öffnen</button></div></div><div class="callout" style="margin-top:17px">💡 Erkläre jede Entscheidung in eigenen Worten. Kickoff und Lernmethodik unterstützen deine Vorbereitung; die Prüfungssimulation konzentriert sich auf die acht Fachmodule.</div>`;
}
function chapterList(){
 const filters=['all','unstarted','started','done'],labels=['Alle','Offen','Begonnen','Erledigt'];
 view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Deine Kursmodule</h1><p class="muted">${chapters.length} Lerneinheiten in der Reihenfolge deiner Weiterbildung. Wähle ein Thema oder trainiere ein ganzes Modul.</p><label class="mini" for="modulePicker">Modul auswählen</label><select id="modulePicker" class="module-select"><option value="all">Alle Module</option>${DATA.modules.map(m=>`<option value="${m.id}" ${String(state.module)===String(m.id)?'selected':''}>${m.id}. ${esc(m.title)}</option>`).join('')}</select><input class="search" id="search" placeholder="Thema oder Kursnummer suchen …" value="${esc(state.search)}" aria-label="Kursthema suchen"><div class="filter">${filters.map((x,i)=>`<button data-filter="${x}" class="${state.filter===x?'active':''}">${labels[i]}</button>`).join('')}</div><div id="coursegrid" class="stack"></div><details class="card" style="margin-top:18px"><summary>Zur Gliederung und den Lernmaterialien</summary><p class="mini">${esc(DATA.courseNote)} Die Kurs-Abschlussmarkierungen in den Bildern werden nicht als beantwortete Quizfragen übernommen. Unterrichtsminuten und Quizfortschritt sind verschiedene Angaben.</p><button class="btn soft" data-action="nav" data-page="references">Weitere Grundlagen und Vorlagen</button></details>`;
 $('#search').addEventListener('input',e=>{state.search=e.target.value;drawCourses()});
 $('#modulePicker').addEventListener('change',e=>{state.module=e.target.value;drawCourses()});
 drawCourses();
}
function drawCourses(){
 const query=state.search.toLowerCase().trim();
 const filtered=chapters.filter(c=>(state.module==='all'||state.module===undefined||c.module===Number(state.module))&&`${c.code} ${c.title} ${moduleName(c.module)}`.toLowerCase().includes(query)).filter(c=>state.filter==='all'||(state.filter==='unstarted'&&attemptsFor(c.id)===0)||(state.filter==='started'&&attemptsFor(c.id)>0&&attemptsFor(c.id)<questionCount(c.id))||(state.filter==='done'&&attemptsFor(c.id)===questionCount(c.id)));
 $('#coursegrid').innerHTML=filtered.length?DATA.modules.map(m=>{const list=filtered.filter(c=>c.module===m.id);if(!list.length)return '';const total=moduleQuestions(m.id).length;return `<section class="module-section"><div class="heading-row"><div><div class="eyebrow">MODUL ${m.id}${m.examRelevant?' · FACHSCHWERPUNKT':' · VORBEREITUNG'}</div><h2>${esc(m.title)}</h2></div><button class="btn soft" data-action="module-quiz" data-mod="${m.id}">Modul üben</button></div><p class="muted">${esc(m.description)}</p><p class="mini">${moduleAnswered(m.id)} von ${total} Fragen bearbeitet</p><div class="course-grid">${list.map(c=>`<button class="course" data-action="lesson" data-ch="${c.id}"><div class="number">${esc(c.code)}</div><div class="ctext"><strong>${esc(c.title)}</strong><p>${attemptsFor(c.id)}/${questionCount(c.id)} Fragen bearbeitet${c.minutes?` · ${c.minutes} Kursminuten`:''}</p><div class="meter"><i style="width:${pct(attemptsFor(c.id),questionCount(c.id))}%"></i></div></div></button>`).join('')}</div></section>`}).join(''):'<div class="callout">Keine passenden Lerneinheiten gefunden.</div>';
}
function lesson(){
 const c=chapters.find(x=>x.id===state.chapter);
 view.innerHTML=`<button class="back" data-action="nav" data-page="chapters">← Kursübersicht</button><div class="eyebrow">LERNEINHEIT ${esc(c.code)} · MODUL ${c.module}</div><h1>${esc(c.title)}</h1><div class="meta"><span class="chip">${questionCount(c.id)} Quizfragen</span><span class="chip">${attemptsFor(c.id)} bearbeitet</span>${c.minutes?`<span class="chip">${c.minutes} Kursminuten</span>`:''}<span class="chip">${c.examRelevant?'Fachschwerpunkt':'Methodik und Orientierung'}</span></div><div class="tabs"><button data-tab="learn" class="${state.tab==='learn'?'active':''}">📖 Lernen</button><button data-tab="about" class="${state.tab==='about'?'active':''}">🎯 Quiz</button></div>${state.tab==='learn'?`<div class="card lesson">${c.lesson}${referenceDetails(c)}</div><div class="card" style="margin-top:14px"><p>Erst frei erklären, dann im Quiz prüfen.</p><button class="btn" data-action="quiz-ch" data-ch="${c.id}">Jetzt ${questionCount(c.id)} Fragen beantworten →</button></div>`:`<div class="card stack"><div class="eyebrow">THEMENTRAINING</div><h2>${esc(c.title)}</h2><p class="muted">${questionCount(c.id)} Fragen mit direktem Feedback. Übe auch den freien Selbstcheck im Lerntext.</p><button class="btn" data-action="quiz-ch" data-ch="${c.id}">Themenquiz starten →</button><button class="btn outline" data-action="tab" data-tab="learn">Vorher Lerntext lesen</button><button class="btn soft" data-action="module-quiz" data-mod="${c.module}">Ganzes Modul üben</button></div>`}`;
}
function start(ch,mode='chapter'){
 let pool=mode==='chapter'?allQ.filter(q=>q.chapter===ch):mode==='module'?moduleQuestions(ch):mode==='wrong'?allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect):mode==='new'?allQ.filter(q=>!record.attempts[q.id]):allQ;
 if(mode==='exam'){
  const buckets=shuffle(DATA.modules.filter(m=>m.examRelevant)).map(m=>shuffle(moduleQuestions(m.id)));
  pool=[];for(let i=0;i<20;i++){const q=buckets[i%buckets.length].pop();if(q)pool.push(q)}
 }else if(mode==='module')pool=shuffle(pool);
 else if(mode!=='chapter')pool=shuffle(pool).slice(0,20);
 if(!pool.length){alert('Dafür sind aktuell keine Fragen vorhanden. Starte zunächst ein Themenquiz.');return}
 state={...state,page:'quiz',chapter:mode==='module'?pool[0].chapter:ch,quizModule:mode==='module'?ch:null,set:pool,index:0,mode,sessionAnswers:[],selected:null,submitted:false,complete:false,started:Date.now()};render();window.scrollTo(0,0);
}
function practice(){
 const wrong=allQ.filter(q=>record.attempts[q.id]&&!record.attempts[q.id].lastCorrect).length,newQ=allQ.length-allAnswered();
 view.innerHTML=`<button class="back" data-action="nav" data-page="home">← Startseite</button><h1>Dein Training</h1><p class="muted">Themen und Module folgen deiner Kursgliederung.</p><div class="mode-grid"><div class="card stack"><h3>📚 Thema oder Modul</h3><p>Gezielt nach Kursnummer lernen und ein ganzes Fachmodul wiederholen.</p><button class="btn" data-action="nav" data-page="chapters">Kursmodul wählen</button></div><div class="card stack"><h3>🎓 Prüfungssimulation</h3><p>20 Fragen aus allen acht Fachmodulen 2–9. Lösungen erst zum Schluss. Dieser Quizmodus ist eine Lernübung; die offizielle Prüfung nutzt offene Situationsaufgaben.</p><button class="btn" data-action="start" data-mode="exam">Prüfungsmodus starten</button></div><div class="card stack"><h3>↻ Meine Fehler</h3><p>${wrong} zuletzt falsch beantwortete Fragen.</p><button class="btn soft" data-action="start" data-mode="wrong" ${wrong?'':'disabled'}>Fehler wiederholen</button></div><div class="card stack"><h3>✨ Neue Fragen</h3><p>${newQ} noch nicht beantwortete Fragen, einschließlich der neuen Kursthemen.</p><button class="btn soft" data-action="start" data-mode="new" ${newQ?'':'disabled'}>Neue Fragen üben</button></div><div class="card stack"><h3>🧠 Gemischtes Training</h3><p>20 Fragen aus dem gesamten Lernheft, mit direkter Erklärung.</p><button class="btn soft" data-action="start" data-mode="mix">Mix starten</button></div></div>`;
}
function referenceLibrary(){
 const selected=DATA.referenceChapters.find(c=>c.id===state.reference);
 if(selected){view.innerHTML=`<button class="back" data-action="reference-list">← Grundlagenbibliothek</button><div class="eyebrow">ZUSÄTZLICHE GRUNDLAGEN UND VORLAGEN</div><h1>${esc(selected.title)}</h1><div class="card lesson">${selected.lesson}</div>`;return}
 view.innerHTML=`<button class="back" data-action="nav" data-page="chapters">← Kursübersicht</button><h1>Grundlagen und Vorlagen</h1><p class="muted">Vertiefung und Nachschlagen ergänzend zum kursbezogenen Lernheft. Alle bisherigen Lerntexte sind hier weiterhin verfügbar.</p><div class="course-grid">${DATA.referenceChapters.map(c=>`<button class="course" data-action="read-reference" data-ref="${c.id}"><div class="ctext"><strong>${esc(c.title)}</strong><p>Lerntext öffnen →</p></div></button>`).join('')}</div>`;
}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-action]');if(!a)return;
 if(a.dataset.action==='module-quiz')start(Number(a.dataset.mod),'module');
 if(a.dataset.action==='read-reference'){state.reference=Number(a.dataset.ref);nav('references')}
 if(a.dataset.action==='reference-list'){state.reference=null;referenceLibrary();window.scrollTo(0,0)}
});

// COURSE_UI_END
render();
</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:' ||
    ('serviceWorker' in navigator && location.hostname === 'localhost')) {
 window.addEventListener('load', () => {
   navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.info('Offline-Modus nicht verfügbar:', err));
 });
}
</script></body></html>
