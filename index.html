ptions":["Die Teilaufträge markieren und die Antwort daran gliedern","Nur den ersten Teil beantworten","Mit einer beliebigen Definition beginnen","Alle Antworten in einem unstrukturierten Satz bündeln"],"correct":0,"explanation":"Eine klare Gliederung macht sichtbar, dass alle Anforderungen bearbeitet wurden. Sie erleichtert zugleich die Kontrolle unter Zeitdruck.","hint":"Sie erleichtert zugleich die Kontrolle unter Zeitdruck.","originalChapter":1},{"id":"ch02-extra-01","chapter":27,"question":"Welche Aufgabe übernimmt die CPU?","options":["Sie ersetzt das gesamte Betriebssystem","Sie speichert Daten grundsätzlich dauerhaft ohne Strom","Sie vergibt öffentliche Domainnamen","Sie führt Maschinenbefehle aus"],"correct":3,"explanation":"Die CPU verarbeitet Befehle und Daten. Dauerhafte Speicherung und Namensauflösung sind andere Aufgaben.","hint":"Dauerhafte Speicherung und Namensauflösung sind andere Aufgaben.","originalChapter":2},{"id":"ch02-extra-02","chapter":27,"question":"Was unterscheidet eine SSD vom Arbeitsspeicher?","options":["Eine SSD hält Daten auch ohne Strom","Eine SSD ist immer schneller als RAM","RAM speichert Dateien immer dauerhaft","Eine SSD führt sämtliche Prozessorbefehle aus"],"correct":0,"explanation":"SSD ist nichtflüchtiger Massenspeicher; RAM ist typischerweise flüchtiger Arbeitsspeicher. Beide erfüllen unterschiedliche Rollen.","hint":"Beide erfüllen unterschiedliche Rollen.","originalChapter":2},{"id":"ch02-extra-03","chapter":27,"question":"Warum trennt ein Betriebssystem die Speicherbereiche verschiedener Prozesse?","options":["Um jede Datei öffentlich zu machen","Um Prozesse vor unbeabsichtigtem Zugriff anderer Prozesse zu schützen","Um alle Programme auf dieselbe Adresse zu zwingen","Um Backups zu ersetzen"],"correct":1,"explanation":"Speicherisolation begrenzt Fehler und unzulässige Zugriffe. Ein Prozessfehler soll andere Prozesse möglichst nicht beschädigen.","hint":"Ein Prozessfehler soll andere Prozesse möglichst nicht beschädigen.","originalChapter":2},{"id":"ch02-extra-04","chapter":27,"question":"Was ist ein Thread?","options":["Ein dauerhaftes Speichermedium","Eine DNS-Zone","Ein Ausführungsstrang innerhalb eines Prozesses","Eine verschlüsselte Backup-Datei"],"correct":2,"explanation":"Threads gehören zu einem Prozess und teilen häufig dessen Speicher. Gemeinsame Daten benötigen bei parallelem Zugriff Synchronisation.","hint":"Gemeinsame Daten benötigen bei parallelem Zugriff Synchronisation.","originalChapter":2},{"id":"ch02-extra-05","chapter":27,"question":"Zwei Threads erhöhen gleichzeitig denselben Zähler ohne Synchronisation. Welches Problem droht?","options":["Automatische Datenbanknormalisierung","Garantierte Verdopplung jedes Wertes","Ein DNS-Ausfall als zwingende Folge","Verlorene Aktualisierungen durch eine Race Condition"],"correct":3,"explanation":"Lesen, Erhöhen und Schreiben sind nicht zwingend atomar. Überlappen diese Schritte, kann eine Erhöhung verloren gehen.","hint":"Überlappen diese Schritte, kann eine Erhöhung verloren gehen.","originalChapter":2},{"id":"ch02-extra-06","chapter":27,"question":"Warum benötigen Programme Dateiberechtigungen?","options":["Um Lese-, Schreib- und Ausführungszugriffe zu steuern","Um Textdateien automatisch zu verschlüsseln","Um jede Datei zu komprimieren","Um die CPU-Taktfrequenz festzulegen"],"correct":0,"explanation":"Berechtigungen steuern erlaubte Zugriffe. Sie ersetzen weder Verschlüsselung noch Datensicherung.","hint":"Sie ersetzen weder Verschlüsselung noch Datensicherung.","originalChapter":2},{"id":"ch02-extra-07","chapter":27,"question":"Ein Text mit Umlauten wird zwischen Systemen beschädigt. Was prüfst du zuerst?","options":["Ob beide Monitore gleich groß sind","Ob Sender und Empfänger dieselbe Zeichenkodierung verwenden","Ob die CPU dieselbe Marke hat","Ob die Datei denselben Hintergrund hat"],"correct":1,"explanation":"Bytes werden erst durch eine Kodierung zu Zeichen. Uneinheitliche Interpretation etwa zwischen UTF-8 und einer älteren Kodierung führt zu falscher Darstellung.","hint":"Uneinheitliche Interpretation etwa zwischen UTF-8 und einer älteren Kodierung führt zu falscher Darstellung.","originalChapter":2},{"id":"ch02-extra-08","chapter":27,"question":"Wie viele unterschiedliche Werte lassen sich mit 8 Bit darstellen?","options":["8","16","256","128"],"correct":2,"explanation":"Mit n Bit lassen sich 2 hoch n Kombinationen darstellen. Bei 8 Bit sind es 256, unabhängig davon, wie diese Kombinationen interpretiert werden.","hint":"Bei 8 Bit sind es 256, unabhängig davon, wie diese Kombinationen interpretiert werden.","originalChapter":2},{"id":"ch02-extra-09","chapter":27,"question":"Eine Anwendung verbraucht mit jeder Anfrage mehr RAM und gibt ihn nicht frei. Was ist plausibel?","options":["Eine höhere Bildschirmauflösung als alleinige Ursache","Eine automatisch bessere Cache-Strategie","Eine Änderung des DNS-Namens","Ein Speicherleck"],"correct":3,"explanation":"Ein stetig wachsender Speicherbedarf kann auf nicht freigegebene Objekte hinweisen. Messungen und Speicheranalysen helfen, die Ursache zu bestätigen.","hint":"Messungen und Speicheranalysen helfen, die Ursache zu bestätigen.","originalChapter":2},{"id":"ch02-extra-10","chapter":27,"question":"Wann kann Auslagerung auf Massenspeicher die Leistung beeinträchtigen?","options":["Wenn häufig benötigte Speicherseiten ständig ein- und ausgelagert werden","Wenn genügend freier RAM vorhanden ist und keine Auslagerung stattfindet","Wenn eine Textdatei umbenannt wird","Wenn ein Benutzer das Fenster verkleinert"],"correct":0,"explanation":"Massenspeicher ist typischerweise langsamer als RAM. Häufige Seitenwechsel können deshalb zu starken Verzögerungen führen.","hint":"Häufige Seitenwechsel können deshalb zu starken Verzögerungen führen.","originalChapter":2},{"id":"ch02-extra-11","chapter":27,"question":"Was ist der wesentliche Zweck eines Gerätetreibers?","options":["Er definiert die fachlichen Geschäftsregeln","Er vermittelt zwischen Betriebssystem und konkreter Hardware","Er ersetzt jede Anwendung","Er aktualisiert automatisch sämtliche Lizenzverträge"],"correct":1,"explanation":"Treiber stellen dem Betriebssystem eine passende Schnittstelle zur Hardware bereit. Fachlogik und Lizenzmanagement gehören nicht zu dieser Aufgabe.","hint":"Fachlogik und Lizenzmanagement gehören nicht zu dieser Aufgabe.","originalChapter":2},{"id":"ch03-extra-01","chapter":18,"question":"Welche Aufgabe hat ein Router?","options":["Pakete zwischen IP-Netzen weiterleiten","HTML im Browser darstellen","Passwörter hashen","Tabellen normalisieren"],"correct":0,"explanation":"Router entscheiden anhand von Routinginformationen über den nächsten Weg eines Pakets. Das verbindet unterschiedliche Netze.","hint":"Das verbindet unterschiedliche Netze.","originalChapter":3},{"id":"ch03-extra-02","chapter":18,"question":"Was ist ein wesentlicher Unterschied zwischen TCP und UDP?","options":["UDP garantiert die Reihenfolge aller Pakete","TCP bietet geordnete zuverlässige Übertragung; UDP liefert Datagramme ohne diese Zusagen","TCP benötigt keine Verbindung","Beide verschlüsseln automatisch sämtliche Daten"],"correct":1,"explanation":"TCP behandelt Reihenfolge und erneute Übertragung. UDP überlässt solche Anforderungen der Anwendung; Verschlüsselung ist eine zusätzliche Aufgabe.","hint":"UDP überlässt solche Anforderungen der Anwendung; Verschlüsselung ist eine zusätzliche Aufgabe.","originalChapter":3},{"id":"ch03-extra-03","chapter":26,"question":"Was schützt TLS bei einer HTTPS-Verbindung?","options":["Die fachliche Fehlerfreiheit der Anwendung","Alle Daten nach Speicherung automatisch","Vertraulichkeit und Integrität der Übertragung sowie die überprüfbare Serveridentität","Die Verfügbarkeit bei jedem Netzausfall"],"correct":2,"explanation":"TLS schützt den Transport und erlaubt die Identitätsprüfung anhand von Zertifikaten. Es beweist keine korrekte Geschäftslogik.","hint":"Es beweist keine korrekte Geschäftslogik.","originalChapter":3},{"id":"ch03-extra-04","chapter":26,"question":"Ein Zertifikat passt nicht zum aufgerufenen Hostnamen. Was ist angemessen?","options":["Die Prüfung für alle Nutzer abschalten","Alle Passwörter im Browser speichern","Die Warnung als erfolgreichen Sicherheitstest werten","Die Ursache untersuchen und das passende Zertifikat bereitstellen"],"correct":3,"explanation":"Hostname und Zertifikat müssen zusammenpassen, damit die Serveridentität überprüfbar ist. Das Abschalten der Prüfung beseitigt diesen Schutz.","hint":"Das Abschalten der Prüfung beseitigt diesen Schutz.","originalChapter":3},{"id":"ch03-extra-05","chapter":19,"question":"Was bedeutet HTTP-Status 404 typischerweise?","options":["Die angeforderte Ressource wurde nicht gefunden","Die Anfrage war immer erfolgreich","Der Server verlangt zwingend einen Neustart","Das Passwort ist korrekt"],"correct":0,"explanation":"404 kennzeichnet eine nicht gefundene Ressource. Es beschreibt nicht automatisch die Ursache, etwa einen falschen Pfad oder eine entfernte Ressource.","hint":"Es beschreibt nicht automatisch die Ursache, etwa einen falschen Pfad oder eine entfernte Ressource.","originalChapter":3},{"id":"ch03-extra-06","chapter":18,"question":"Welche HTTP-Methode soll eine Ressource abrufen, ohne fachliche Zustandsänderung anzufordern?","options":["POST","GET","DELETE","PATCH"],"correct":1,"explanation":"GET hat sichere Semantik: Der Client fordert keine Zustandsänderung an. Technische Nebeneffekte wie Protokollierung sind damit vereinbar.","hint":"Technische Nebeneffekte wie Protokollierung sind damit vereinbar.","originalChapter":3},{"id":"ch03-extra-07","chapter":19,"question":"Welche Gefahr besteht beim erneuten Senden einer Zahlungsanfrage nach einem Timeout?","options":["Ein Timeout beweist, dass keine Verarbeitung erfolgte","TLS verhindert jede doppelte Zahlung","Die Zahlung könnte doppelt ausgeführt werden","Ein anderer Browser beseitigt das Problem automatisch"],"correct":2,"explanation":"Ein Timeout lässt offen, ob der Server bereits verarbeitet hat. Ein Idempotenzschlüssel und serverseitige Duplikaterkennung können Mehrfachausführung verhindern.","hint":"Ein Idempotenzschlüssel und serverseitige Duplikaterkennung können Mehrfachausführung verhindern.","originalChapter":3},{"id":"ch03-extra-08","chapter":18,"question":"Welche Rolle hat ein Port zusätzlich zur IP-Adresse?","options":["Er bezeichnet stets eine physische Buchse","Er ersetzt die IP-Adresse","Er legt den Inhalt einer JSON-Datei fest","Er ordnet Verkehr einem Dienst beziehungsweise Kommunikationsendpunkt zu"],"correct":3,"explanation":"Eine IP-Adresse adressiert einen Host beziehungsweise eine Schnittstelle. Ports ermöglichen die Zuordnung zu Diensten auf diesem Host.","hint":"Ports ermöglichen die Zuordnung zu Diensten auf diesem Host.","originalChapter":3},{"id":"ch03-extra-09","chapter":26,"question":"Was bewirkt eine Firewall-Regel?","options":["Sie erlaubt oder blockiert Netzwerkverkehr nach definierten Kriterien","Sie korrigiert automatisch SQL-Abfragen","Sie sichert jede Datei täglich","Sie ersetzt die Benutzerverwaltung"],"correct":0,"explanation":"Firewalls kontrollieren Verkehr etwa anhand von Adressen, Ports oder Zuständen. Anwendungssicherheit erfordert weitere Maßnahmen.","hint":"Anwendungssicherheit erfordert weitere Maßnahmen.","originalChapter":3},{"id":"ch03-extra-10","chapter":19,"question":"Ein Browser blockiert einen API-Aufruf wegen CORS. Wo liegt die passende Konfiguration?","options":["In der CPU-Firmware des Clients","Bei den erlaubten Ursprüngen und Antworten des API-Servers","In den Tabellenprimärschlüsseln","In der Bildschirmhelligkeit"],"correct":1,"explanation":"CORS regelt browserseitige Zugriffe zwischen unterschiedlichen Origins. Der Server muss passende Freigabe-Header liefern; CORS ersetzt keine Autorisierung.","hint":"Der Server muss passende Freigabe-Header liefern; CORS ersetzt keine Autorisierung.","originalChapter":3},{"id":"ch03-extra-11","chapter":19,"question":"Warum braucht ein Client ein sinnvolles Anfrage-Timeout?","options":["Damit jede Anfrage garantiert erfolgreich ist","Damit der Server jede Transaktion zurücksetzt","Damit er bei fehlender Antwort nicht unbegrenzt blockiert","Damit DNS grundsätzlich entfällt"],"correct":2,"explanation":"Timeouts begrenzen die Wartezeit und ermöglichen Fehlerbehandlung. Wiederholungen müssen zusätzlich sicher und begrenzt gestaltet werden.","hint":"Wiederholungen müssen zusätzlich sicher und begrenzt gestaltet werden.","originalChapter":3},{"id":"ch04-extra-01","chapter":22,"question":"Was ist eine Variable?","options":["Ein festes Netzwerkprotokoll","Ein benannter Bezug auf einen Wert beziehungsweise Speicherinhalt","Eine vollständige Datenbank","Ein Gerätetreiber"],"correct":1,"explanation":"Variablen ermöglichen, Werte im Programm zu speichern und zu verwenden. Ihre zulässigen Werte hängen vom Datentyp und der Sprache ab.","hint":"Ihre zulässigen Werte hängen vom Datentyp und der Sprache ab.","originalChapter":4},{"id":"ch04-extra-02","chapter":22,"question":"Wann passt eine Schleife?","options":["Wenn eine Anwendung nur einmal installiert wird","Wenn ein Passwort verschlüsselt werden muss","Wenn eine Operation für mehrere Elemente wiederholt werden soll","Wenn ein Netzwerkname aufgelöst werden soll"],"correct":2,"explanation":"Schleifen drücken Wiederholungen aus. Abbruchbedingungen müssen korrekt sein, damit die Verarbeitung endet.","hint":"Abbruchbedingungen müssen korrekt sein, damit die Verarbeitung endet.","originalChapter":4},{"id":"ch04-extra-03","chapter":22,"question":"Welche Bedingung verhindert eine Endlosschleife am zuverlässigsten?","options":["Ein besonders langer Variablenname","Ein Kommentar mit dem Wort Ende","Ein größerer Monitor","Eine erreichbare Abbruchbedingung und Fortschritt in Richtung dieser Bedingung"],"correct":3,"explanation":"Die Schleifenbedingung muss irgendwann falsch werden oder ein definierter Ausstieg erfolgen. Ein Kommentar beeinflusst den Ablauf nicht.","hint":"Ein Kommentar beeinflusst den Ablauf nicht.","originalChapter":4},{"id":"ch04-extra-04","chapter":22,"question":"Warum sollte eine Funktion eine klar umrissene Aufgabe haben?","options":["Damit sie leichter verständlich, testbar und wiederverwendbar ist","Damit sie möglichst viele globale Daten verändert","Damit Fehler nie auftreten können","Damit Tests überflüssig werden"],"correct":0,"explanation":"Eine fokussierte Funktion reduziert Komplexität. Das erleichtert Tests und Änderungen, garantiert aber keine Fehlerfreiheit.","hint":"Das erleichtert Tests und Änderungen, garantiert aber keine Fehlerfreiheit.","originalChapter":4},{"id":"ch04-extra-05","chapter":22,"question":"Was trennt Syntaxfehler von logischen Fehlern?","options":["Logische Fehler verhindern immer das Parsen","Syntaxfehler verletzen Sprachregeln; logische Fehler können trotz gültiger Syntax falsche Ergebnisse liefern","Syntaxfehler sind ausschließlich Netzwerkfehler","Beide werden durch Kommentare vollständig verhindert"],"correct":1,"explanation":"Ein Programm kann formal gültig sein und fachlich falsch rechnen. Deshalb sind neben Syntaxprüfung auch fachliche Tests nötig.","hint":"Deshalb sind neben Syntaxprüfung auch fachliche Tests nötig.","originalChapter":4},{"id":"ch04-extra-06","chapter":22,"question":"Eine Liste hat n Elemente. Was beschreibt linearer Suchaufwand im schlechtesten Fall?","options":["Die Suche benötigt stets genau einen Vergleich","Der Aufwand wächst unabhängig von n quadratisch","Die Zahl geprüfter Elemente wächst proportional zu n","Die Liste muss verschlüsselt sein"],"correct":2,"explanation":"Bei linearer Suche kann jedes Element geprüft werden müssen. Dies wird als O(n) beschrieben.","hint":"Dies wird als O(n) beschrieben.","originalChapter":4},{"id":"ch04-extra-07","chapter":22,"question":"Wann ist binäre Suche in einer Liste unmittelbar anwendbar?","options":["Wenn die Liste beliebig ungeordnet ist","Wenn jedes Element eine andere Kodierung nutzt","Wenn keine Vergleiche möglich sind","Wenn die Elemente nach dem Suchkriterium sortiert sind"],"correct":3,"explanation":"Binäre Suche halbiert den verbleibenden Bereich anhand der Sortierung. Ohne diese Ordnung ist der Ausschluss ganzer Bereiche nicht verlässlich.","hint":"Ohne diese Ordnung ist der Ausschluss ganzer Bereiche nicht verlässlich.","originalChapter":4},{"id":"ch04-extra-08","chapter":22,"question":"Was ist eine typische Randbedingung für eine Funktion, die einen Mittelwert berechnet?","options":["Eine leere Eingabeliste","Die Farbe des Editors","Der Hersteller der Tastatur","Der Name des Projektordners"],"correct":0,"explanation":"Für eine leere Liste ist die Division durch die Anzahl nicht möglich. Die Funktion braucht eine definierte Reaktion, etwa einen Fehler oder einen ausdrücklich vereinbarten Rückgabewert.","hint":"Die Funktion braucht eine definierte Reaktion, etwa einen Fehler oder einen ausdrücklich vereinbarten Rückgabewert.","originalChapter":4},{"id":"ch04-extra-09","chapter":26,"question":"Warum sollten Eingaben auch serverseitig validiert werden?","options":["Weil Browser keine Formulare darstellen können","Weil Clients umgangen oder manipuliert werden können","Weil TLS Eingabeprüfungen verbietet","Weil clientseitige Prüfung alle Angriffe ausschließt"],"correct":1,"explanation":"Der Server ist die maßgebliche Vertrauensgrenze. Clientprüfungen verbessern Bedienbarkeit, bieten allein aber keinen verlässlichen Schutz.","hint":"Clientprüfungen verbessern Bedienbarkeit, bieten allein aber keinen verlässlichen Schutz.","originalChapter":4},{"id":"ch04-extra-10","chapter":22,"question":"Eine Ausnahme wird abgefangen. Was ist eine sinnvolle Behandlung?","options":["Den Fehler immer lautlos ignorieren","Alle Sicherheitsprüfungen entfernen","Einen passenden Fehlerzustand herstellen und hilfreiche Diagnoseinformationen sichern","Unabhängig vom Fehler Erfolg melden"],"correct":2,"explanation":"Fehlerbehandlung soll einen konsistenten Zustand und nachvollziehbare Diagnose ermöglichen. Verschluckte Fehler verschieben Probleme oft nur.","hint":"Verschluckte Fehler verschieben Probleme oft nur.","originalChapter":4},{"id":"ch04-extra-11","chapter":22,"question":"Was erleichtert die Wartung von Quellcode besonders?","options":["Einbuchstabige Namen für sämtliche Fachobjekte","Möglichst viele kopierte Codeblöcke","Alle Funktionen in einer einzigen Zeile","Aussagekräftige Namen und überschaubare Verantwortlichkeiten"],"correct":3,"explanation":"Lesbarer Code macht Absicht und Zusammenhänge erkennbar. Das senkt das Risiko bei späteren Änderungen.","hint":"Das senkt das Risiko bei späteren Änderungen.","originalChapter":4},{"id":"ch05-extra-01","chapter":8,"question":"Was beschreibt ein Akzeptanzkriterium?","options":["Eine beliebige Wunschliste des Entwicklers","Nur den Namen des Auftraggebers","Eine überprüfbare Bedingung für die Erfüllung einer Anforderung","Eine verpflichtende Programmiersprache für jedes Projekt"],"correct":2,"explanation":"Akzeptanzkriterien konkretisieren, wann eine Anforderung erfüllt ist. Sie dienen Entwicklung und Abnahme als gemeinsame Grundlage.","hint":"Sie dienen Entwicklung und Abnahme als gemeinsame Grundlage.","originalChapter":5},{"id":"ch05-extra-02","chapter":9,"question":"Wie sollte mit widersprüchlichen Anforderungen zweier Fachbereiche umgegangen werden?","options":["Beide stillschweigend ignorieren","Den lauteren Fachbereich automatisch bevorzugen","Ohne Rücksprache zufällig entscheiden","Den Konflikt sichtbar machen und gemeinsam priorisieren beziehungsweise auflösen"],"correct":3,"explanation":"Widersprüche benötigen eine bewusste fachliche Entscheidung. Dokumentierte Prioritäten verhindern spätere Missverständnisse.","hint":"Dokumentierte Prioritäten verhindern spätere Missverständnisse.","originalChapter":5},{"id":"ch05-extra-03","chapter":8,"question":"Was ist der Kern einer User Story?","options":["Rolle, gewünschtes Ziel und erwarteter Nutzen","Nur eine Datenbanktabelle","Ein vollständiger Quelltext","Die genaue Bildschirmauflösung"],"correct":0,"explanation":"Eine User Story beschreibt Bedarf aus Nutzersicht. Technische Details und Akzeptanzkriterien können ergänzend ausgearbeitet werden.","hint":"Technische Details und Akzeptanzkriterien können ergänzend ausgearbeitet werden.","originalChapter":5},{"id":"ch05-extra-04","chapter":8,"question":"Welche Frage klärt eine unbestimmte Anforderung „Das System soll schnell sein“?","options":["Welche Farbe hat das Logo?","Welche Antwortzeit gilt unter welcher Last als akzeptabel?","Welchen Vornamen hat der Entwickler?","Wie viele Ordner enthält das Repository?"],"correct":1,"explanation":"Eine messbare Leistungsanforderung braucht Metrik, Grenzwert und Bedingungen. Erst dann ist eine faire Prüfung möglich.","hint":"Erst dann ist eine faire Prüfung möglich.","originalChapter":5},{"id":"ch05-extra-05","chapter":6,"question":"Warum werden Stakeholder identifiziert?","options":["Damit ausschließlich Entwickler entscheiden","Damit Anforderungen nicht mehr dokumentiert werden","Damit relevante Interessen, Einflüsse und Bedürfnisse berücksichtigt werden","Damit Tests automatisch entstehen"],"correct":2,"explanation":"Stakeholder umfassen auch Nutzer, Betrieb und weitere Betroffene. Übersehene Interessen können die Einführung gefährden.","hint":"Übersehene Interessen können die Einführung gefährden.","originalChapter":5},{"id":"ch05-extra-06","chapter":8,"question":"Was bedeutet Rückverfolgbarkeit einer Anforderung?","options":["Jeden Benutzer dauerhaft orten","Alle Anforderungen unnummeriert speichern","Nur die Dateigröße erfassen","Ihre Verbindung zu Umsetzung, Tests und Änderungen nachvollziehen können"],"correct":3,"explanation":"Traceability zeigt, warum eine Funktion existiert und wie ihre Erfüllung geprüft wird. Das unterstützt Änderungsanalysen.","hint":"Das unterstützt Änderungsanalysen.","originalChapter":5},{"id":"ch05-extra-07","chapter":9,"question":"Eine Muss-Anforderung kann im Zeitrahmen nicht umgesetzt werden. Was ist sinnvoll?","options":["Umfang, Termin oder Lösungsweg mit den Verantwortlichen neu abstimmen","Sie heimlich in eine Kann-Anforderung umbenennen","Ihre Nichterfüllung in der Abnahme verschweigen","Tests dafür löschen"],"correct":0,"explanation":"Eine zwingende Anforderung erfordert eine transparente Entscheidung. Die Konsequenzen für Lieferung und Abnahme müssen abgestimmt werden.","hint":"Die Konsequenzen für Lieferung und Abnahme müssen abgestimmt werden.","originalChapter":5},{"id":"ch05-extra-08","chapter":8,"question":"Was unterscheidet eine Randbedingung von einer Funktion?","options":["Sie beschreibt immer einen Button","Sie begrenzt den Lösungsraum, etwa durch eine vorgegebene Plattform","Sie ist grundsätzlich unverbindlich","Sie ist nur ein Testergebnis"],"correct":1,"explanation":"Randbedingungen schränken zulässige Lösungen ein. Funktionen beschreiben dagegen, was das System leisten soll.","hint":"Funktionen beschreiben dagegen, was das System leisten soll.","originalChapter":5},{"id":"ch05-extra-09","chapter":8,"question":"Warum sollten Fachbegriffe in einem gemeinsamen Glossar stehen?","options":["Um Anforderungen absichtlich unklar zu halten","Um sämtliche Gespräche zu ersetzen","Um unterschiedliche Interpretationen im Team zu vermeiden","Um Tests auf Rechtschreibung zu beschränken"],"correct":2,"explanation":"Ein Begriff wie Auftrag kann in Abteilungen verschieden verwendet werden. Ein gemeinsames Verständnis reduziert fachliche Fehler.","hint":"Ein gemeinsames Verständnis reduziert fachliche Fehler.","originalChapter":5},{"id":"ch05-extra-10","chapter":7,"question":"Welche Methode hilft, den heutigen Arbeitsablauf vor einer Digitalisierung zu verstehen?","options":["Sofort eine Architektur ohne Rückfragen bestellen","Nur die Homepage des Herstellers lesen","Alle Ausnahmen vom Ablauf ignorieren","Nutzer beobachten und den Prozess mit ihnen besprechen"],"correct":3,"explanation":"Beobachtung und Gespräch zeigen tatsächliche Arbeit einschließlich Sonderfällen. Diese Erkenntnisse ergänzen formale Prozessbeschreibungen.","hint":"Diese Erkenntnisse ergänzen formale Prozessbeschreibungen.","originalChapter":5},{"id":"ch05-extra-11","chapter":9,"question":"Warum muss eine Anforderungsänderung auf Auswirkungen geprüft werden?","options":["Sie kann Kosten, Termine, Tests und andere Anforderungen beeinflussen","Jede Änderung ist kostenlos","Änderungen betreffen ausschließlich Textformatierung","Bereits umgesetzte Funktionen bleiben zwingend unberührt"],"correct":0,"explanation":"Anforderungen hängen oft zusammen. Eine Auswirkungsanalyse verhindert, dass indirekte Folgen übersehen werden.","hint":"Eine Auswirkungsanalyse verhindert, dass indirekte Folgen übersehen werden.","originalChapter":5},{"id":"ch06-extra-01","chapter":13,"question":"Was beschreibt Kohäsion innerhalb einer Komponente?","options":["Wie viele fremde Komponenten sie direkt verändert","Wie schnell ihr Netzwerk ist","Wie lang ihr Dateiname ist","Wie eng ihre Aufgaben fachlich zusammengehören"],"correct":3,"explanation":"Hohe Kohäsion bündelt zusammengehörige Aufgaben. Das erleichtert klare Verantwortlichkeiten und Wartung.","hint":"Das erleichtert klare Verantwortlichkeiten und Wartung.","originalChapter":6},{"id":"ch06-extra-02","chapter":13,"question":"Wann kann ein modularer Monolith sinnvoll sein?","options":["Bei überschaubarem Team und klaren Modulgrenzen ohne Bedarf für unabhängige Deployments","Nur wenn keinerlei Tests möglich sind","Wenn jede Funktion zwingend separat betrieben werden muss","Nur bei genau einem Nutzer"],"correct":0,"explanation":"Ein modularer Monolith kann geringe Betriebsaufwände mit Struktur verbinden. Microservices verursachen zusätzliche verteilte Komplexität.","hint":"Microservices verursachen zusätzliche verteilte Komplexität.","originalChapter":6},{"id":"ch06-extra-03","chapter":11,"question":"Welche Aufgabe hat eine Architektursicht für den Betrieb?","options":["Nur die Wortwahl in Benutzertexten prüfen","Deployment, Infrastruktur und Laufzeitverteilung verdeutlichen","Alle Geschäftsregeln ersetzen","Nur Klassennamen alphabetisch sortieren"],"correct":1,"explanation":"Eine Betriebssicht zeigt, wo Komponenten laufen und wie sie verbunden sind. Sie unterstützt Kapazitäts-, Sicherheits- und Verfügbarkeitsplanung.","hint":"Sie unterstützt Kapazitäts-, Sicherheits- und Verfügbarkeitsplanung.","originalChapter":6},{"id":"ch06-extra-04","chapter":13,"question":"Welche Folge kann eine zyklische Modulabhängigkeit haben?","options":["Module sind automatisch unabhängig","Alle Aufrufe werden automatisch verschlüsselt","Änderungen und Tests werden schwerer isolierbar","Datenbanken werden überflüssig"],"correct":2,"explanation":"Wenn Module einander benötigen, lassen sie sich schwer separat entwickeln und testen. Klar gerichtete Abhängigkeiten reduzieren diese Verflechtung.","hint":"Klar gerichtete Abhängigkeiten reduzieren diese Verflechtung.","originalChapter":6},{"id":"ch06-extra-05","chapter":13,"question":"Warum werden externe Dienste häufig hinter einer eigenen Schnittstelle gekapselt?","options":["Um jeden Netzwerkfehler zu verhindern","Um Lizenzbedingungen auszuschalten","Um alle Daten lokal zu löschen","Um Anbieterwechsel und Tests zu erleichtern"],"correct":3,"explanation":"Ein Adapter begrenzt die Abhängigkeit von einem konkreten Anbieter. Er ermöglicht Ersatzimplementierungen und Testdoubles.","hint":"Er ermöglicht Ersatzimplementierungen und Testdoubles.","originalChapter":6},{"id":"ch06-extra-06","chapter":13,"question":"Was ist ein Architektur-Trade-off?","options":["Eine Abwägung zwischen konkurrierenden Qualitätszielen","Ein syntaktischer Programmfehler","Ein unveränderlicher Liefertermin","Ein zufälliger Servername"],"correct":0,"explanation":"Mehr Konsistenz, Verfügbarkeit oder Einfachheit kann jeweils andere Ziele beeinträchtigen. Entscheidungen brauchen deshalb Kontext und Prioritäten.","hint":"Entscheidungen brauchen deshalb Kontext und Prioritäten.","originalChapter":6},{"id":"ch06-extra-07","chapter":13,"question":"Wann hilft ereignisbasierte Kommunikation besonders?","options":["Wenn jede Antwort zwingend sofort synchron vorliegen muss","Wenn Komponenten auf fachliche Ereignisse reagieren sollen, ohne den Sender direkt aufzurufen","Wenn keine Duplikate behandelt werden dürfen","Wenn keinerlei Nachrichteninfrastruktur existieren darf"],"correct":1,"explanation":"Ereignisse können Sender und Empfänger entkoppeln. Dafür müssen unter anderem Verzögerungen und mehrfache Zustellung berücksichtigt werden.","hint":"Dafür müssen unter anderem Verzögerungen und mehrfache Zustellung berücksichtigt werden.","originalChapter":6},{"id":"ch06-extra-08","chapter":11,"question":"Was sollte ein Systemkontextdiagramm zeigen?","options":["Alle lokalen Variablen","Nur Datenbankindizes","Das System, externe Beteiligte und wesentliche Beziehungen","Nur die Sprintdauer"],"correct":2,"explanation":"Die Kontextsicht grenzt das System ab. Sie macht Schnittstellen zu Nutzern und anderen Systemen verständlich.","hint":"Sie macht Schnittstellen zu Nutzern und anderen Systemen verständlich.","originalChapter":6},{"id":"ch06-extra-09","chapter":10,"question":"Eine neue Bibliothek soll eingeführt werden. Welche Architekturprüfung ist sinnvoll?","options":["Nur die Anzahl der Sterne betrachten","Nur das Logo vergleichen","Alle bestehenden Tests überspringen","Kompatibilität, Wartungszustand und Auswirkungen auf Abhängigkeiten prüfen"],"correct":3,"explanation":"Eine Bibliothek beeinflusst langfristige Wartung und technische Risiken. Popularität ersetzt diese Prüfung nicht.","hint":"Popularität ersetzt diese Prüfung nicht.","originalChapter":6},{"id":"ch06-extra-10","chapter":13,"question":"Warum soll fachliche Logik nicht vollständig in der Oberfläche liegen?","options":["Damit sie unabhängig von einem bestimmten Bedienkanal nutzbar und testbar bleibt","Damit keinerlei Oberfläche benötigt wird","Damit das Backend keine Daten sieht","Damit Validierung überall entfällt"],"correct":0,"explanation":"Eine getrennte Fachlogik kann Weboberfläche, API und Hintergrundverarbeitung konsistent bedienen. Sie lässt sich zudem gezielt testen.","hint":"Sie lässt sich zudem gezielt testen.","originalChapter":6},{"id":"ch06-extra-11","chapter":13,"question":"Welche Strategie begrenzt einen riskanten Architekturumbau?","options":["Alle Komponenten gleichzeitig ohne Tests ersetzen","Schrittweise Änderungen mit überprüfbaren Zwischenständen","Die alte Anwendung sofort löschen","Risiken erst nach der Einführung dokumentieren"],"correct":1,"explanation":"Kleine Schritte begrenzen Fehlerfolgen und erleichtern Rückmeldung. Ein vollständiger Umbau auf einmal erhöht Unsicherheit und Rücksetzaufwand.","hint":"Ein vollständiger Umbau auf einmal erhöht Unsicherheit und Rücksetzaufwand.","originalChapter":6},{"id":"ch07-extra-01","chapter":14,"question":"Welche Beziehung liegt vor, wenn ein Kunde mehrere Aufträge hat und jeder Auftrag genau einem Kunden gehört?","options":["1:n","1:1","n:m ohne weitere Tabelle","Keine Beziehung"],"correct":0,"explanation":"Ein Kunde kann viele Aufträge besitzen, ein Auftrag nur einen Kunden. Der Fremdschlüssel liegt typischerweise beim Auftrag.","hint":"Der Fremdschlüssel liegt typischerweise beim Auftrag.","originalChapter":7},{"id":"ch07-extra-02","chapter":14,"question":"Wie wird eine n:m-Beziehung in relationalen Datenbanken gewöhnlich umgesetzt?","options":["Mit einer Kommaliste in jedem Primärschlüssel","Mit einer Zuordnungstabelle und Fremdschlüsseln","Durch Entfernen aller Schlüssel","Mit einer einzigen booleschen Spalte"],"correct":1,"explanation":"Die Zwischentabelle speichert Paare der beteiligten Schlüssel. So werden Beziehungen einzeln prüfbar und abfragbar.","hint":"So werden Beziehungen einzeln prüfbar und abfragbar.","originalChapter":7},{"id":"ch07-extra-03","chapter":20,"question":"Was kann ein UNIQUE-Constraint absichern?","options":["Dass jede Abfrage schnell ist","Dass alle Daten automatisch verschlüsselt sind","Die Eindeutigkeit eines Wertes oder einer Wertekombination","Dass jede Tabelle nur eine Zeile hat"],"correct":2,"explanation":"UNIQUE verhindert doppelte Schlüsselwerte nach den Regeln des Datenbanksystems. Es garantiert keine allgemeine Abfrageleistung.","hint":"Es garantiert keine allgemeine Abfrageleistung.","originalChapter":7},{"id":"ch07-extra-04","chapter":20,"question":"Welcher Nachteil entsteht durch zusätzliche Indizes?","options":["Lesen wird grundsätzlich unmöglich","Transaktionen sind nicht mehr erlaubt","Fremdschlüssel verlieren immer ihre Wirkung","Schreibvorgänge und Speicherbedarf können zunehmen"],"correct":3,"explanation":"Indizes müssen bei Änderungen mitgepflegt werden. Ihr Nutzen bei Abfragen ist gegen diesen Aufwand abzuwägen.","hint":"Ihr Nutzen bei Abfragen ist gegen diesen Aufwand abzuwägen.","originalChapter":7},{"id":"ch07-extra-05","chapter":20,"question":"Welche SQL-Klausel filtert Zeilen vor einer Gruppierung?","options":["WHERE","ORDER BY","HAVING","GROUP BY"],"correct":0,"explanation":"WHERE filtert einzelne Zeilen vor dem Gruppieren. HAVING filtert anschließend Gruppen anhand von Bedingungen.","hint":"HAVING filtert anschließend Gruppen anhand von Bedingungen.","originalChapter":7},{"id":"ch07-extra-06","chapter":20,"question":"Was liefert ein LEFT JOIN?","options":["Nur Zeilen mit Treffern auf beiden Seiten","Alle Zeilen der linken Tabelle und passende rechte Werte, sonst NULL","Nur die rechte Tabelle","Immer das kartesische Produkt"],"correct":1,"explanation":"LEFT JOIN erhält linke Datensätze ohne Zuordnung. Das eignet sich etwa zum Anzeigen von Kunden ohne Aufträge.","hint":"Das eignet sich etwa zum Anzeigen von Kunden ohne Aufträge.","originalChapter":7},{"id":"ch07-extra-07","chapter":14,"question":"Warum wird eine Normalisierung durchgeführt?","options":["Um Backups unnötig zu machen","Um jede Abfrage ohne Index zu beschleunigen","Um Redundanzen und Änderungsanomalien zu reduzieren","Um alle Beziehungen zu löschen"],"correct":2,"explanation":"Mehrfach gespeicherte Fakten können widersprüchlich werden. Normalisierung strukturiert Abhängigkeiten, um solche Probleme zu vermindern.","hint":"Normalisierung strukturiert Abhängigkeiten, um solche Probleme zu vermindern.","originalChapter":7},{"id":"ch07-extra-08","chapter":21,"question":"Zwei Nutzer ändern denselben Datensatz. Wie kann optimistisches Locking Konflikte erkennen?","options":["Durch Abschalten aller Transaktionen","Durch Löschen des Primärschlüssels","Durch bloßes Neuladen der Startseite","Durch Prüfen einer Versionsnummer beim Speichern"],"correct":3,"explanation":"Die Aktualisierung gelingt nur bei der erwarteten Version. Andernfalls kann die Anwendung den zwischenzeitlichen Konflikt melden.","hint":"Andernfalls kann die Anwendung den zwischenzeitlichen Konflikt melden.","originalChapter":7},{"id":"ch07-extra-09","chapter":21,"question":"Welche ACID-Eigenschaft betrifft die gegenseitige Beeinflussung paralleler Transaktionen?","options":["Isolation","Durability","Atomicity","Dateikompression"],"correct":0,"explanation":"Isolation regelt, welche Zwischenzustände andere Transaktionen sehen. Das konkrete Verhalten hängt auch vom Isolationsniveau ab.","hint":"Das konkrete Verhalten hängt auch vom Isolationsniveau ab.","originalChapter":7},{"id":"ch07-extra-10","chapter":15,"question":"Was ist vor einer destruktiven Datenmigration besonders wichtig?","options":["Nur ein Screenshot der Tabellenliste","Eine getestete Sicherung und ein nachvollziehbarer Wiederherstellungsweg","Die Entfernung aller Testdaten ohne Ersatz","Das Umbenennen des Servers"],"correct":1,"explanation":"Ein Backup allein reicht ohne funktionierenden Restore nicht aus. Zusätzlich müssen Migration und Wiederherstellung unter passenden Bedingungen geprüft werden.","hint":"Zusätzlich müssen Migration und Wiederherstellung unter passenden Bedingungen geprüft werden.","originalChapter":7},{"id":"ch07-extra-11","chapter":21,"question":"Warum ist SELECT * in einer langfristigen API-Abfrage oft ungünstig?","options":["SQL verbietet grundsätzlich mehrere Spalten","Es verschlüsselt Ergebnisse unkontrolliert","Unnötige Spalten und Schemaänderungen können Leistung und Vertrag beeinflussen","Es verhindert alle Joins"],"correct":2,"explanation":"Explizite Spalten machen den benötigten Datenumfang sichtbar. Sie vermeiden unnötige Übertragung und unbeabsichtigte Änderungen der Ausgabe.","hint":"Sie vermeiden unnötige Übertragung und unbeabsichtigte Änderungen der Ausgabe.","originalChapter":7},{"id":"ch08-extra-01","chapter":24,"question":"Was unterscheidet einen Git-Branch von einer Kopie des gesamten Projekts?","options":["Ein Branch enthält grundsätzlich keine Historie","Ein Branch ist eine bewegliche Referenz auf eine Commit-Linie","Ein Branch ist immer ein eigener Server","Ein Branch verschlüsselt automatisch Dateien"],"correct":1,"explanation":"Branches verweisen auf Commits und bewegen sich mit neuen Commits weiter. Git muss dafür nicht das gesamte Projekt separat kopieren.","hint":"Git muss dafür nicht das gesamte Projekt separat kopieren.","originalChapter":8},{"id":"ch08-extra-02","chapter":24,"question":"Wann entsteht ein Merge-Konflikt?","options":["Bei jedem Commit ohne Ausnahme","Wenn ein Bild geöffnet wird","Wenn Änderungen nicht automatisch eindeutig zusammengeführt werden können","Wenn zwei Branches denselben Namensteil haben"],"correct":2,"explanation":"Überlappende oder widersprüchliche Änderungen benötigen eine bewusste Auflösung. Danach muss das kombinierte Ergebnis geprüft werden.","hint":"Danach muss das kombinierte Ergebnis geprüft werden.","originalChapter":8},{"id":"ch08-extra-03","chapter":26,"question":"Warum gehören Zugangsschlüssel nicht in das Repository?","options":["Weil Git keine Textdateien speichert","Weil Schlüssel nur auf Papier funktionieren","Weil ein privates Repository jede Offenlegung ausschließt","Weil sie über Historie und Kopien unkontrolliert verbreitet werden können"],"correct":3,"explanation":"Auch private Repositories haben Kopien und Zugriffsrisiken. Geheimnisse gehören in geeignete Secret-Verwaltung; geleakte Schlüssel müssen widerrufen werden.","hint":"Geheimnisse gehören in geeignete Secret-Verwaltung; geleakte Schlüssel müssen widerrufen werden.","originalChapter":8},{"id":"ch08-extra-04","chapter":25,"question":"Was ist ein Build-Artefakt?","options":["Ein erzeugtes auslieferbares Ergebnis wie ein Paket oder Container-Image","Nur ein mündliches Meetingergebnis","Eine beliebige Kundenanforderung","Ein Git-Benutzername"],"correct":0,"explanation":"Ein Build verwandelt Quellen in ausführbare oder verteilbare Ergebnisse. Versionierte Artefakte erleichtern nachvollziehbare Deployments.","hint":"Versionierte Artefakte erleichtern nachvollziehbare Deployments.","originalChapter":8},{"id":"ch08-extra-05","chapter":25,"question":"Warum sollte dasselbe geprüfte Artefakt in Produktion eingesetzt werden?","options":["Damit Produktionskonfiguration veröffentlicht wird","Damit Test und Auslieferung auf demselben Ergebnis beruhen","Damit sämtliche Freigaben entfallen","Damit Quellcode nicht mehr versioniert werden muss"],"correct":1,"explanation":"Ein erneuter Build kann Abweichungen erzeugen. Ein unverändertes Artefakt verringert Unterschiede zwischen geprüfter und ausgelieferter Version.","hint":"Ein unverändertes Artefakt verringert Unterschiede zwischen geprüfter und ausgelieferter Version.","originalChapter":8},{"id":"ch08-extra-06","chapter":24,"question":"Was sollte bei einer fehlgeschlagenen CI-Prüfung geschehen?","options":["Die Prüfung kommentarlos dauerhaft abschalten","Den Fehler automatisch als Erfolg markieren","Ursache klären und den Fehler vor der Freigabe beheben oder begründet behandeln","Die Historie aller Branches löschen"],"correct":2,"explanation":"Fehlschläge sind Signale für Qualitätsrisiken. Ausnahmen müssen nachvollziehbar sein und dürfen die Prüfung nicht bedeutungslos machen.","hint":"Ausnahmen müssen nachvollziehbar sein und dürfen die Prüfung nicht bedeutungslos machen.","originalChapter":8},{"id":"ch08-extra-07","chapter":24,"question":"Warum werden Abhängigkeitsversionen festgehalten?","options":["Um jede Sicherheitsaktualisierung zu verbieten","Um Lizenzprüfungen zu ersetzen","Um alle Bibliotheken in Quellcode umzuschreiben","Um Builds reproduzierbarer und Änderungen nachvollziehbar zu machen"],"correct":3,"explanation":"Festgelegte Versionen vermeiden unerwartete Updates beim Build. Sie müssen trotzdem regelmäßig auf notwendige Aktualisierungen geprüft werden.","hint":"Sie müssen trotzdem regelmäßig auf notwendige Aktualisierungen geprüft werden.","originalChapter":8},{"id":"ch08-extra-08","chapter":24,"question":"Welcher Vorteil hat git revert bei einem gemeinsam genutzten Branch?","options":["Es erzeugt einen neuen Commit, der eine frühere Änderung rückgängig macht","Es entfernt zwingend die gesamte Historie","Es löscht alle lokalen Dateien","Es deaktiviert Reviews"],"correct":0,"explanation":"Revert erhält die veröffentlichte Historie und dokumentiert die Rücknahme. Das ist bei gemeinsam genutzten Branches oft leichter koordinierbar.","hint":"Das ist bei gemeinsam genutzten Branches oft leichter koordinierbar.","originalChapter":8},{"id":"ch08-extra-09","chapter":25,"question":"Was ist ein Feature Flag?","options":["Ein Ersatz für alle Tests","Eine steuerbare Aktivierung einer Funktion unabhängig vom Deployment","Ein verschlüsselter Primärschlüssel","Ein Git-Konfliktmarker"],"correct":1,"explanation":"Flags ermöglichen schrittweise Aktivierung oder Abschaltung. Auch deaktivierte und aktivierte Pfade benötigen Tests und spätere Bereinigung.","hint":"Auch deaktivierte und aktivierte Pfade benötigen Tests und spätere Bereinigung.","originalChapter":8},{"id":"ch08-extra-10","chapter":24,"question":"Welche Prüfung gehört typischerweise in eine Pipeline?","options":["Nur ein täglicher Wetterbericht","Nur die Bildschirmfarbe","Automatisierte Tests und statische Prüfungen","Ausschließlich eine manuelle Dateiumbenennung"],"correct":2,"explanation":"Automatische Prüfungen geben frühes Feedback bei jeder Änderung. Sie ergänzen Reviews und fachliche Abnahme.","hint":"Sie ergänzen Reviews und fachliche Abnahme.","originalChapter":8},{"id":"ch08-extra-11","chapter":24,"question":"Was bedeutet ein möglichst reproduzierbarer Build?","options":["Jeder Entwickler nutzt beliebige Bibliotheksversionen","Der Build hängt vom Tagesdatum ohne Dokumentation ab","Die Ausgabe wird nachträglich zufällig verändert","Gleiche Quellen und definierte Eingaben liefern ein nachvollziehbar gleiches Ergebnis"],"correct":3,"explanation":"Reproduzierbarkeit benötigt kontrollierte Werkzeuge und Abhängigkeiten. So lassen sich Fehler und ausgelieferte Versionen besser nachvollziehen.","hint":"So lassen sich Fehler und ausgelieferte Versionen besser nachvollziehen.","originalChapter":8},{"id":"ch09-extra-01","chapter":29,"question":"Welche Werte sind für eine zulässige Altersgrenze von 18 bis 65 besonders geeignete Grenzwerttests?","options":["Nur 30 und 40","Nur 0 und 1000","17, 18, 65 und 66","Nur viermal 18"],"correct":2,"explanation":"Werte direkt innerhalb und außerhalb der Grenzen erkennen typische Vergleichsfehler. Ein Normalwert ergänzt die Prüfung.","hint":"Ein Normalwert ergänzt die Prüfung.","originalChapter":9},{"id":"ch09-extra-02","chapter":29,"question":"Was ist eine Äquivalenzklasse beim Testen?","options":["Ein Team mit gleicher Berufsbezeichnung","Eine Liste aller Programmiersprachen","Ein identischer Testname für jedes Szenario","Eine Gruppe von Eingaben, für die ähnliches Verhalten erwartet wird"],"correct":3,"explanation":"Repräsentative Werte aus Klassen reduzieren Testaufwand. Die Klasseneinteilung muss fachlich begründet sein.","hint":"Die Klasseneinteilung muss fachlich begründet sein.","originalChapter":9},{"id":"ch09-extra-03","chapter":29,"question":"Was ist das Ziel eines Unit-Tests?","options":["Eine kleine Einheit isoliert auf erwartetes Verhalten prüfen","Die gesamte Produktionsinfrastruktur ersetzen","Nur die Benutzerzufriedenheit messen","Ein komplettes Projekt abnehmen"],"correct":0,"explanation":"Unit-Tests liefern gezieltes Feedback für begrenzte Logik. Zusammenspiel und reale Nutzung benötigen zusätzliche Testebenen.","hint":"Zusammenspiel und reale Nutzung benötigen zusätzliche Testebenen.","originalChapter":9},{"id":"ch09-extra-04","chapter":29,"question":"Wozu dient ein Mock in einem Test?","options":["Produktionsdaten dauerhaft löschen","Eine Abhängigkeit kontrolliert ersetzen und Interaktionen prüfen","Den Test zufällig machen","Alle Erwartungen entfernen"],"correct":1,"explanation":"Mocks ermöglichen definierte Reaktionen und prüfbare Aufrufe. Zu starke Bindung an Implementierungsdetails macht Tests jedoch fragil.","hint":"Zu starke Bindung an Implementierungsdetails macht Tests jedoch fragil.","originalChapter":9},{"id":"ch09-extra-05","chapter":29,"question":"Was unterscheidet einen Lasttest von einem Stresstest?","options":["Lasttests prüfen nur Rechtschreibung","Stresstests dürfen keine Messwerte erfassen","Lasttests prüfen erwartete Last; Stresstests untersuchen Verhalten jenseits normaler Grenzen","Beide sind ausschließlich manuelle Interviews"],"correct":2,"explanation":"Beide bewerten Leistungsfähigkeit, aber mit unterschiedlichem Schwerpunkt. Stresstests zeigen insbesondere Grenzen und Erholung nach Überlastung.","hint":"Stresstests zeigen insbesondere Grenzen und Erholung nach Überlastung.","originalChapter":9},{"id":"ch09-extra-06","chapter":29,"question":"Warum ist 100 % Codeabdeckung kein Beweis für Fehlerfreiheit?","options":["Codeabdeckung misst ausschließlich Kosten","Alle Fehler liegen zwingend außerhalb des Codes","Abdeckung verhindert fachliche Tests","Ausgeführte Zeilen sagen nicht, ob alle relevanten Fälle und Ergebnisse geprüft wurden"],"correct":3,"explanation":"Coverage zeigt, was ausgeführt wurde. Sie bewertet weder Vollständigkeit der Anforderungen noch Qualität der Assertions.","hint":"Sie bewertet weder Vollständigkeit der Anforderungen noch Qualität der Assertions.","originalChapter":9},{"id":"ch09-extra-07","chapter":29,"question":"Was gehört in einen hilfreichen Fehlerbericht?","options":["Reproduktionsschritte, erwartetes und tatsächliches Ergebnis sowie Umgebung","Nur „geht nicht“","Nur die Lieblingsfarbe des Testers","Eine Vermutung ohne beobachtetes Verhalten"],"correct":0,"explanation":"Ein reproduzierbarer Bericht ermöglicht gezielte Analyse. Umgebungsangaben erklären Unterschiede zwischen Systemen.","hint":"Umgebungsangaben erklären Unterschiede zwischen Systemen.","originalChapter":9},{"id":"ch09-extra-08","chapter":29,"question":"Ein Test schlägt unregelmäßig ohne Codeänderung fehl. Was ist sinnvoll?","options":["Ihn immer als Erfolg zählen","Zeit-, Daten- und Umgebungsabhängigkeiten untersuchen","Sämtliche Tests löschen","Das Release unabhängig vom Befund freigeben"],"correct":1,"explanation":"Flaky Tests können Rennen oder instabile Voraussetzungen zeigen. Sie müssen stabilisiert werden, damit Prüfergebnisse vertrauenswürdig bleiben.","hint":"Sie müssen stabilisiert werden, damit Prüfergebnisse vertrauenswürdig bleiben.","originalChapter":9},{"id":"ch09-extra-09","chapter":29,"question":"Wer beurteilt in einer fachlichen Abnahme besonders die Eignung für den Geschäftsprozess?","options":["Nur der Compiler","Ausschließlich der Hardwarelieferant","Die zuständigen fachlichen Vertreter beziehungsweise Auftraggeber","Ein beliebiger unbeteiligter Nutzer"],"correct":2,"explanation":"Abnahme prüft vereinbarte fachliche Kriterien. Technische Tests liefern dafür wichtige, aber nicht allein ausreichende Nachweise.","hint":"Technische Tests liefern dafür wichtige, aber nicht allein ausreichende Nachweise.","originalChapter":9},{"id":"ch09-extra-10","chapter":29,"question":"Warum sollten Tests nachvollziehbare Soll-Ergebnisse haben?","options":["Damit jede Ausgabe akzeptiert wird","Damit Testdaten überflüssig werden","Damit nur die Ausführungszeit zählt","Damit Erfolg und Fehler objektiv unterscheidbar sind"],"correct":3,"explanation":"Ohne Erwartung lässt sich eine Ausgabe nicht bewerten. Soll-Ergebnisse sollten aus Anforderungen oder fachlichen Regeln abgeleitet werden.","hint":"Soll-Ergebnisse sollten aus Anforderungen oder fachlichen Regeln abgeleitet werden.","originalChapter":9},{"id":"ch09-extra-11","chapter":29,"question":"Was sollte ein risikobasierter Testplan priorisieren?","options":["Funktionen mit hoher Fehlerwahrscheinlichkeit oder großem Schadenspotenzial","Nur die zuletzt geschriebene Funktion","Nur optisch auffällige Buttons","Zufällig ausgewählte Dateien ohne Begründung"],"correct":0,"explanation":"Begrenzte Testzeit wird auf besonders kritische Bereiche konzentriert. Auch seltene Fehler können wegen hoher Folgen wichtig sein.","hint":"Auch seltene Fehler können wegen hoher Folgen wichtig sein.","originalChapter":9},{"id":"ch10-extra-01","chapter":30,"question":"Was gehört in eine Installationsanleitung?","options":["Nur ein Produktlogo","Nur die Namen der Entwickler","Alle privaten Passwörter","Voraussetzungen, Schritte und eine Prüfung des erfolgreichen Starts"],"correct":3,"explanation":"Eine Anleitung muss nicht nur Installation ermöglichen, sondern auch Erfolg erkennbar machen. Sensible Zugangsdaten gehören nicht hinein.","hint":"Sensible Zugangsdaten gehören nicht hinein.","originalChapter":10},{"id":"ch10-extra-02","chapter":30,"question":"Warum sollten technische und fachliche Zielgruppen unterschiedliche Dokumentationsschwerpunkte erhalten?","options":["Weil sie andere Aufgaben und Vorkenntnisse haben","Weil technische Nutzer keine Erklärungen brauchen","Weil fachliche Nutzer nie Fehler melden","Weil eine Dokumentation nur Bilder enthalten darf"],"correct":0,"explanation":"Betrieb benötigt etwa Diagnose- und Wiederherstellungsinformationen; Anwender benötigen Abläufe. Zielgruppenorientierung macht Inhalte nutzbar.","hint":"Zielgruppenorientierung macht Inhalte nutzbar.","originalChapter":10},{"id":"ch10-extra-03","chapter":30,"question":"Welche Information hilft bei einer API-Fehlermeldung?","options":["Nur die Farbe des Servers","Status, Fehlercode, Bedeutung und mögliche Behandlung","Nur ein zufälliger Zahlenwert","Ein vollständiges Passwort"],"correct":1,"explanation":"Ein stabiler Fehlervertrag ermöglicht passende Clientreaktionen. Interne Details und Geheimnisse sollten nicht offengelegt werden.","hint":"Interne Details und Geheimnisse sollten nicht offengelegt werden.","originalChapter":10},{"id":"ch10-extra-04","chapter":30,"question":"Was sind Release Notes?","options":["Eine vollständige Ersatzimplementierung","Eine Liste aller gespeicherten Passwörter","Hinweise auf Änderungen, bekannte Probleme und gegebenenfalls notwendige Maßnahmen","Nur ein Kalenderblatt"],"correct":2,"explanation":"Release Notes erklären den Unterschied zur vorherigen Version. Sie unterstützen Nutzer und Betrieb bei Aktualisierungen.","hint":"Sie unterstützen Nutzer und Betrieb bei Aktualisierungen.","originalChapter":10},{"id":"ch10-extra-05","chapter":30,"question":"Wie lässt sich Dokumentationsdrift reduzieren?","options":["Dokumentation nur einmal bei Projektbeginn erstellen","Versionsangaben entfernen","Alle Rückmeldungen ignorieren","Dokumentationsprüfung in den Änderungsprozess integrieren"],"correct":3,"explanation":"Code und Verhalten ändern sich. Eine gekoppelte Pflege verhindert, dass Anleitungen dauerhaft einen veralteten Stand beschreiben.","hint":"Eine gekoppelte Pflege verhindert, dass Anleitungen dauerhaft einen veralteten Stand beschreiben.","originalChapter":10},{"id":"ch10-extra-06","chapter":30,"question":"Was macht ein Screenshot in einer Anleitung langfristig brauchbar?","options":["Passende Beschriftung, Versionsbezug und regelmäßige Aktualisierung","Möglichst viele echte personenbezogene Daten","Das Weglassen sämtlicher Bildtexte","Eine beliebige Aufnahme einer anderen Anwendung"],"correct":0,"explanation":"Bilder helfen nur, wenn sie zum beschriebenen Ablauf passen. Ergänzende Texte machen wichtige Schritte auch ohne genaue Bildinterpretation verständlich.","hint":"Ergänzende Texte machen wichtige Schritte auch ohne genaue Bildinterpretation verständlich.","originalChapter":10},{"id":"ch10-extra-07","chapter":30,"question":"Was sollte ein Notfall-Runbook konkret nennen?","options":["Nur allgemeine Motivation","Auslöser, Verantwortliche, Schritte und Erfolgskontrollen","Nur den Firmennamen","Nur ein Architektur-Schlagwort"],"correct":1,"explanation":"Unter Zeitdruck braucht der Betrieb ausführbare Schritte und klare Zuständigkeiten. Prüfpunkte verhindern unbemerkte Fehlversuche.","hint":"Prüfpunkte verhindern unbemerkte Fehlversuche.","originalChapter":10},{"id":"ch10-extra-08","chapter":30,"question":"Wie wird eine Anleitung auf Verständlichkeit geprüft?","options":["Nur der Autor überfliegt die Überschriften","Die Dateigröße wird verglichen","Eine Person der Zielgruppe führt den Ablauf anhand der Anleitung aus","Die Anzahl der Fremdwörter wird erhöht"],"correct":2,"explanation":"Ein Nutzungstest zeigt ausgelassene Schritte und unklare Begriffe. Autoren kennen häufig Voraussetzungen, die neue Nutzer nicht kennen.","hint":"Autoren kennen häufig Voraussetzungen, die neue Nutzer nicht kennen.","originalChapter":10},{"id":"ch10-extra-09","chapter":30,"question":"Welche Dokumentation erläutert Struktur und zentrale technische Entscheidungen?","options":["Urlaubsplan","Marketingbroschüre ohne Technik","Nur die Rechnung","Architekturdokumentation"],"correct":3,"explanation":"Architekturdokumentation erklärt Komponenten, Beziehungen und Gründe für Entscheidungen. Das unterstützt Weiterentwicklung und Einarbeitung.","hint":"Das unterstützt Weiterentwicklung und Einarbeitung.","originalChapter":10},{"id":"ch10-extra-10","chapter":30,"question":"Warum braucht eine Datenmigration eine eigene Anleitung?","options":["Reihenfolge, Voraussetzungen und Rückfallgrenzen müssen nachvollziehbar sein","Migrationen betreffen nie Daten","Ein Startbutton ersetzt jede Planung","Die alte Version funktioniert immer mit jedem neuen Schema"],"correct":0,"explanation":"Migrationen können irreversible Änderungen enthalten. Eine Anleitung schafft Klarheit über Ablauf, Kontrolle und Wiederherstellung.","hint":"Eine Anleitung schafft Klarheit über Ablauf, Kontrolle und Wiederherstellung.","originalChapter":10},{"id":"ch10-extra-11","chapter":30,"question":"Welche Maßnahme erleichtert das Auffinden relevanter Dokumentation?","options":["Alle Inhalte in unbenannten Dateien speichern","Klare Struktur, aussagekräftige Titel und interne Verweise","Zugriff ausschließlich über Zufallslinks","Jede Information mehrfach widersprüchlich kopieren"],"correct":1,"explanation":"Information muss auffindbar und eindeutig sein. Gute Navigation reduziert Suchzeit und die Nutzung veralteter Kopien.","hint":"Gute Navigation reduziert Suchzeit und die Nutzung veralteter Kopien.","originalChapter":10},{"id":"ch11-extra-01","chapter":25,"question":"Was unterscheidet Deployment und Release?","options":["Deployment stellt bereit; Release macht eine Version beziehungsweise Funktion zur Nutzung frei","Beide bedeuten immer einen Hardwaretausch","Ein Release ist ausschließlich ein Backup","Deployment ist nur ein fachlicher Test"],"correct":0,"explanation":"Bereitstellung und Freigabe können getrennt erfolgen, etwa mit Feature Flags. So kann bereits installierter Code noch deaktiviert bleiben.","hint":"So kann bereits installierter Code noch deaktiviert bleiben.","originalChapter":11},{"id":"ch11-extra-02","chapter":25,"question":"Was beschreibt eine Blue-Green-Einführung?","options":["Alle Nutzer erhalten zufällige Bildschirmfarben","Zwei Umgebungen ermöglichen das Umschalten zwischen alter und neuer Version","Nur die Datenbank wird kopiert, ohne Anwendung","Es gibt grundsätzlich keine Rückfallmöglichkeit"],"correct":1,"explanation":"Eine zweite Umgebung erleichtert kontrolliertes Umschalten. Gemeinsame Daten und Schemaänderungen müssen trotzdem kompatibel bleiben.","hint":"Gemeinsame Daten und Schemaänderungen müssen trotzdem kompatibel bleiben.","originalChapter":11},{"id":"ch11-extra-03","chapter":31,"question":"Warum ist eine fachliche Abnahme vor Einführung wichtig?","options":["Sie ersetzt jede Betriebsvorbereitung","Sie verhindert jeden zukünftigen Fehler","Sie bestätigt die Erfüllung vereinbarter Kriterien aus Sicht des Auftraggebers","Sie dient nur der Logoauswahl"],"correct":2,"explanation":"Abnahme schafft Klarheit über das akzeptierte Ergebnis. Technische Bereitstellung und betriebliche Bereitschaft sind zusätzliche Aufgaben.","hint":"Technische Bereitstellung und betriebliche Bereitschaft sind zusätzliche Aufgaben.","originalChapter":11},{"id":"ch11-extra-04","chapter":31,"question":"Was sollte vor einer Produktionsfreigabe definiert sein?","options":["Nur der neue Versionsname","Nur die Länge des Meetings","Eine zufällige Reihenfolge der Schritte","Verantwortliche, Freigabekriterien und Abbruchkriterien"],"correct":3,"explanation":"Klare Kriterien ermöglichen eine nachvollziehbare Go-/No-Go-Entscheidung. Abbruchgrenzen unterstützen schnelle Reaktion bei Problemen.","hint":"Abbruchgrenzen unterstützen schnelle Reaktion bei Problemen.","originalChapter":11},{"id":"ch11-extra-05","chapter":31,"question":"Warum werden Anwender vor einer Einführung geschult?","options":["Damit sie neue Abläufe sicher anwenden können","Damit Softwaretests entfallen","Damit alle Benutzer Administratoren werden","Damit Dokumentation gelöscht werden kann"],"correct":0,"explanation":"Technischer Erfolg reicht nicht für wirksame Nutzung. Schulung reduziert Bedienfehler und Unsicherheit bei veränderten Prozessen.","hint":"Schulung reduziert Bedienfehler und Unsicherheit bei veränderten Prozessen.","originalChapter":11},{"id":"ch11-extra-06","chapter":31,"question":"Was prüft ein Restore-Test?","options":["Nur ob eine Sicherungsdatei existiert","Ob gesicherte Daten tatsächlich wiederhergestellt und genutzt werden können","Nur ob der Dateiname korrekt ist","Ob die Oberfläche ein neues Logo zeigt"],"correct":1,"explanation":"Ein vorhandenes Backup kann beschädigt oder unvollständig sein. Erst Wiederherstellung und Funktionsprüfung zeigen seine Nutzbarkeit.","hint":"Erst Wiederherstellung und Funktionsprüfung zeigen seine Nutzbarkeit.","originalChapter":11},{"id":"ch11-extra-07","chapter":31,"question":"Was gehört zur Betriebsübergabe?","options":["Nur die Rechnung","Alle Geheimnisse in einer öffentlichen Tabelle","Zuständigkeiten, Überwachung, Supportwege und Wiederherstellungsverfahren","Nur ein mündliches „fertig“"],"correct":2,"explanation":"Der Betrieb benötigt ausführbare Informationen und klare Verantwortung. Sonst bleibt das System trotz funktionierender Software schwer betreibbar.","hint":"Sonst bleibt das System trotz funktionierender Software schwer betreibbar.","originalChapter":11},{"id":"ch11-extra-08","chapter":31,"question":"Ein neues Release erhöht die Fehlerrate deutlich. Was unterstützt die Entscheidung über einen Abbruch?","options":["Nur das Bauchgefühl eines unbeteiligten Mitarbeiters","Nur die Anzahl neuer Features","Nur die Farbe des Dashboards","Vorab festgelegte Schwellen und aktuelle Messwerte"],"correct":3,"explanation":"Messbare Abbruchkriterien erlauben eine schnelle, nachvollziehbare Reaktion. Sie sollten bereits vor dem Rollout vereinbart werden.","hint":"Sie sollten bereits vor dem Rollout vereinbart werden.","originalChapter":11},{"id":"ch11-extra-09","chapter":15,"question":"Warum ist ein Datenabgleich nach einer Migration sinnvoll?","options":["Um Vollständigkeit und fachliche Konsistenz zu prüfen","Um grundsätzlich alle Altdaten zu löschen","Um jede Transaktion zu beschleunigen","Um einen Restore-Test zu ersetzen"],"correct":0,"explanation":"Anzahlen, Summen und Stichproben können Übertragungsfehler erkennen. Technischer Skripterfolg allein beweist nicht die fachliche Richtigkeit.","hint":"Technischer Skripterfolg allein beweist nicht die fachliche Richtigkeit.","originalChapter":11},{"id":"ch11-extra-10","chapter":31,"question":"Welche Information benötigt der Support nach einem Release?","options":["Nur die CPU-Marke des Entwicklers","Änderungen, bekannte Probleme und Wege zur Eskalation","Nur das Datum des ersten Commits","Keine Informationen vor der ersten Störung"],"correct":1,"explanation":"Informierter Support kann Nutzerfragen einordnen und Störungen gezielt weitergeben. Das verkürzt Reaktionszeiten.","hint":"Das verkürzt Reaktionszeiten.","originalChapter":11},{"id":"ch11-extra-11","chapter":31,"question":"Wann ist eine Einführung organisatorisch gelungen?","options":["Sobald eine Installationsdatei erzeugt ist","Sobald der Server einmal startet","Wenn Systembetrieb und vereinbarte Geschäftsabläufe wirksam funktionieren","Sobald alle Tickets unabhängig vom Ergebnis geschlossen sind"],"correct":2,"explanation":"Einführung umfasst Betrieb und Nutzung. Die bloße Installation sagt wenig über den tatsächlichen Nutzen im Arbeitsablauf aus.","hint":"Die bloße Installation sagt wenig über den tatsächlichen Nutzen im Arbeitsablauf aus.","originalChapter":11},{"id":"ch12-extra-01","chapter":32,"question":"Warum sollte vor einer Verbesserung ein Ausgangswert gemessen werden?","options":["Damit jede Verbesserung garantiert erfolgreich ist","Damit spätere Veränderungen vergleichbar sind","Damit keine Ziele nötig sind","Damit Nutzerfeedback überflüssig wird"],"correct":1,"explanation":"Eine Baseline ermöglicht den Vorher-Nachher-Vergleich. Vergleichbare Messbedingungen sind dabei entscheidend.","hint":"Vergleichbare Messbedingungen sind dabei entscheidend.","originalChapter":12},{"id":"ch12-extra-02","chapter":32,"question":"Was ist eine aussagekräftige Zielkennzahl für einen Fehlerbehebungsprozess?","options":["Anzahl der Farben im Ticketformular","Anzahl der Teamfotos","Zeit von der Fehlermeldung bis zur verifizierten Behebung","Länge der Versionsnamen"],"correct":2,"explanation":"Die Kennzahl bezieht sich auf den Prozessnutzen. Sie sollte mit Qualität betrachtet werden, damit schnelle, aber fehlerhafte Abschlüsse nicht belohnt werden.","hint":"Sie sollte mit Qualität betrachtet werden, damit schnelle, aber fehlerhafte Abschlüsse nicht belohnt werden.","originalChapter":12},{"id":"ch12-extra-03","chapter":32,"question":"Was gehört in die Check-Phase des PDCA-Zyklus?","options":["Maßnahmen ohne Auswertung ausrollen","Neue Probleme grundsätzlich verschweigen","Nur den Plan neu formatieren","Ergebnisse mit Zielen vergleichen"],"correct":3,"explanation":"Check bewertet, ob die umgesetzte Veränderung den gewünschten Effekt erzielt. Daraus folgen Anpassung oder Standardisierung.","hint":"Daraus folgen Anpassung oder Standardisierung.","originalChapter":12},{"id":"ch12-extra-04","chapter":32,"question":"Was ist eine Retrospektive im Team?","options":["Eine gemeinsame Reflexion der Zusammenarbeit mit Verbesserungsmaßnahmen","Eine fachliche Produktabnahme","Eine reine Schuldzuweisung","Ein Ersatz für jede Sprintplanung"],"correct":0,"explanation":"Retrospektiven betrachten die Arbeitsweise und leiten konkrete Verbesserungen ab. Ein sicherer Gesprächsrahmen fördert offene Beiträge.","hint":"Ein sicherer Gesprächsrahmen fördert offene Beiträge.","originalChapter":12},{"id":"ch12-extra-05","chapter":32,"question":"Warum ist reine Korrelation kein Beweis für eine Ursache?","options":["Korrelation bedeutet immer Zufall","Andere Einflussfaktoren können beide Größen verändern","Messdaten sind grundsätzlich wertlos","Ursachen lassen sich nur durch Abstimmung bestimmen"],"correct":1,"explanation":"Gleichzeitige Veränderungen können einen Zusammenhang nahelegen. Eine Ursachenbehauptung braucht zusätzliche Evidenz und Prüfung möglicher Störfaktoren.","hint":"Eine Ursachenbehauptung braucht zusätzliche Evidenz und Prüfung möglicher Störfaktoren.","originalChapter":12},{"id":"ch12-extra-06","chapter":32,"questi  gemeinsame Transparenz über Fertigstellung. Nicht erfüllte Qualität darf nicht durch bloße Statusänderung verborgen werden.","hint":"Nicht erfüllte Qualität darf nicht durch bloße Statusänderung verborgen werden.","originalChapter":15},{"id":"ch15-extra-08","chapter":34,"question":"Eine Aufgabe ist zu groß für verlässliche Planung. Was hilft?","options":["Die Unsicherheit verschweigen","Alle Tests streichen","Die Schätzung zufällig halbieren","Sie in kleinere fachlich sinnvolle Teile zerlegen"],"correct":3,"explanation":"Kleinere Arbeitspakete lassen sich leichter verstehen und verfolgen. Die Zerlegung sollte Nutzen und Abhängigkeiten berücksichtigen.","hint":"Die Zerlegung sollte Nutzen und Abhängigkeiten berücksichtigen.","originalChapter":15},{"id":"ch15-extra-09","chapter":34,"question":"Was soll ein Projektstatusbericht deutlich machen?","options":["Stand, Abweichungen, Risiken und benötigte Entscheidungen","Nur positive Ereignisse","Nur die Anzahl der E-Mails","Nur die verwendeten Werkzeuge"],"correct":0,"explanation":"Ein Statusbericht unterstützt Steuerung. Verdeckte Probleme verhindern rechtzeitige Gegenmaßnahmen.","hint":"Verdeckte Probleme verhindern rechtzeitige Gegenmaßnahmen.","originalChapter":15},{"id":"ch15-extra-10","chapter":34,"question":"Was ist ein Change Request?","options":["Ein beliebiger Git-Branch","Ein nachvollziehbarer Antrag auf Änderung mit Bewertung seiner Auswirkungen","Ein automatischer Serverneustart","Eine endgültige Abnahme"],"correct":1,"explanation":"Ein Change Request ermöglicht bewusste Entscheidung über geänderten Umfang. Aufwand, Nutzen und Auswirkungen gehören zur Bewertung.","hint":"Aufwand, Nutzen und Auswirkungen gehören zur Bewertung.","originalChapter":15},{"id":"ch15-extra-11","chapter":34,"question":"Wie werden knappe Kapazitäten sinnvoll zugeordnet?","options":["Nur nach alphabetischer Reihenfolge","Alle Personen gleichzeitig auf jede Aufgabe setzen","Nach Priorität, benötigten Fähigkeiten und Abhängigkeiten","Nur nach der Länge des Aufgabentitels"],"correct":2,"explanation":"Die Zuteilung soll den Projektfortschritt unterstützen. Fehlende Fähigkeiten und blockierende Abhängigkeiten sind dabei ebenso wichtig wie Priorität.","hint":"Fehlende Fähigkeiten und blockierende Abhängigkeiten sind dabei ebenso wichtig wie Priorität.","originalChapter":15},{"id":"ch16-extra-01","chapter":23,"question":"Was beschreibt eine fachliche Invariante?","options":["Eine Bildschirmfarbe","Eine Bedingung, die für gültige Fachzustände immer gelten muss","Eine beliebige Logmeldung","Die Uhrzeit des Builds"],"correct":1,"explanation":"Ein Beispiel ist ein Auftrag ohne negative Menge. Invarianten sollten dort abgesichert werden, wo Fachzustände geändert werden.","hint":"Invarianten sollten dort abgesichert werden, wo Fachzustände geändert werden.","originalChapter":16},{"id":"ch16-extra-02","chapter":23,"question":"Was zeigt ein Zustandsdiagramm?","options":["Nur die Serverstandorte","Nur Tabellenindizes","Zulässige Zustände und Übergänge eines Objekts","Nur Aufwandsschätzungen"],"correct":2,"explanation":"Ein Zustandsmodell beschreibt etwa offen, freigegeben und abgeschlossen. Es macht erlaubte und verbotene Übergänge prüfbar.","hint":"Es macht erlaubte und verbotene Übergänge prüfbar.","originalChapter":16},{"id":"ch16-extra-03","chapter":23,"question":"Eine Bestellung darf nur einmal abgeschlossen werden. Was gehört ins Fachmodell?","options":["Nur ein andersfarbiger Button","Nur ein Kommentar in der Anleitung","Eine neue IP-Adresse","Eine Regel für den zulässigen Zustandsübergang"],"correct":3,"explanation":"Die Regel muss auch bei API-Aufrufen und parallelen Zugriffen gelten. Die Oberfläche allein schützt den Fachzustand nicht.","hint":"Die Oberfläche allein schützt den Fachzustand nicht.","originalChapter":16},{"id":"ch16-extra-04","chapter":18,"question":"Was ist bei der Einführung einer neuen API-Version wichtig?","options":["Kompatibilität, Übergangszeit und Kommunikation mit den Nutzern der API","Alte Clients ohne Hinweis sofort blockieren","Versionsangaben überall entfernen","Nur die Dokumentationsfarbe ändern"],"correct":0,"explanation":"Schnittstellen haben externe Verbraucher. Ein geplanter Übergang verhindert unerwartete Ausfälle bei diesen Systemen.","hint":"Ein geplanter Übergang verhindert unerwartete Ausfälle bei diesen Systemen.","originalChapter":16},{"id":"ch16-extra-05","chapter":18,"question":"Welche Änderung kann bestehende API-Clients brechen?","options":["Einen Tippfehler in einem internen Kommentar korrigieren","Ein bisher erforderliches Antwortfeld entfernen","Eine interne Variable ohne Verhaltensänderung umbenennen","Ein zusätzliches Entwicklerdokument erstellen"],"correct":1,"explanation":"Clients können sich auf vereinbarte Felder verlassen. Entfernen oder Bedeutungsänderung erfordern Kompatibilitätsprüfung.","hint":"Entfernen oder Bedeutungsänderung erfordern Kompatibilitätsprüfung.","originalChapter":16},{"id":"ch16-extra-06","chapter":18,"question":"Warum nutzt eine API Pagination für große Listen?","options":["Um alle Datensätze zu verbergen","Um Authentifizierung zu ersetzen","Um Antwortgröße, Laufzeit und Speicherbedarf zu begrenzen","Um Tabellen grundsätzlich ungeordnet zu machen"],"correct":2,"explanation":"Teilweise Übertragung begrenzt Ressourcen. Eine stabile Sortierung beziehungsweise Cursor-Strategie hilft bei konsistentem Durchblättern.","hint":"Eine stabile Sortierung beziehungsweise Cursor-Strategie hilft bei konsistentem Durchblättern.","originalChapter":16},{"id":"ch16-extra-07","chapter":18,"question":"Was sollte ein Schnittstellenvertrag für Zeitstempel festlegen?","options":["Nur die Textfarbe","Nur den Namen des Servers","Nur die maximale Bildschirmbreite","Format, Zeitzonenbezug und Bedeutung des Zeitpunkts"],"correct":3,"explanation":"Ohne klare Zeitsemantik drohen Fehlinterpretationen. Ein eindeutiges Format mit Zeitzonenbezug erleichtert Datenaustausch.","hint":"Ein eindeutiges Format mit Zeitzonenbezug erleichtert Datenaustausch.","originalChapter":16},{"id":"ch16-extra-08","chapter":18,"question":"Wann ist ein DTO sinnvoll?","options":["Um die Daten einer Schnittstelle getrennt vom internen Modell festzulegen","Um jede Geschäftsregel zu entfernen","Um alle Datenbankspalten automatisch öffentlich zu machen","Um Netzwerkfehler auszuschließen"],"correct":0,"explanation":"Ein Data Transfer Object begrenzt übertragene Informationen. Das schützt interne Struktur und verhindert unbeabsichtigte Offenlegung.","hint":"Das schützt interne Struktur und verhindert unbeabsichtigte Offenlegung.","originalChapter":16},{"id":"ch16-extra-09","chapter":14,"question":"Was ist bei Geldbeträgen im Datenmodell wichtig?","options":["Ein beliebiger Fließkommawert ohne Rundungsregeln","Geeignete Dezimaldarstellung und eine definierte Währung","Nur ein Text ohne Währungsbezug","Grundsätzlich ganze Euro ohne Cent"],"correct":1,"explanation":"Geld benötigt definierte Genauigkeit und Rundung. Binäre Fließkommazahlen können unerwartete Rundungseffekte erzeugen.","hint":"Binäre Fließkommazahlen können unerwartete Rundungseffekte erzeugen.","originalChapter":16},{"id":"ch16-extra-10","chapter":18,"question":"Wie können zwei Systeme ein gemeinsames Datenverständnis absichern?","options":["Nur dieselbe Schriftart nutzen","Nur gleiche Dateinamen vergeben","Feldbedeutungen, Einheiten und Validierungsregeln vereinbaren","Alle Nullwerte ungeprüft als null Euro interpretieren"],"correct":2,"explanation":"Gleiche technische Datentypen bedeuten nicht gleiche Fachsemantik. Einheiten und erlaubte Werte gehören zum Vertrag.","hint":"Einheiten und erlaubte Werte gehören zum Vertrag.","originalChapter":16},{"id":"ch16-extra-11","chapter":10,"question":"Welche Frage ist bei Make-or-Buy zusätzlich zum Preis wichtig?","options":["Hat der Hersteller das schönste Logo?","Ist der Produktname möglichst kurz?","Kann man Dokumentation vollständig weglassen?","Passt die Lösung zu Anforderungen, Integration und langfristiger Abhängigkeit?"],"correct":3,"explanation":"Eine Kaufentscheidung beeinflusst Anpassbarkeit und Anbieterbindung. Lebenszykluskosten und Ausstiegsmöglichkeiten gehören zur Bewertung.","hint":"Lebenszykluskosten und Ausstiegsmöglichkeiten gehören zur Bewertung.","originalChapter":16},{"id":"ch17-extra-01","chapter":32,"question":"Was unterscheidet Latenz und Durchsatz?","options":["Beide messen nur Speicherbedarf","Durchsatz ist die Länge eines Dateinamens","Latenz misst Dauer einer Verarbeitung; Durchsatz misst verarbeitete Menge je Zeit","Latenz ist immer ein Prozentwert"],"correct":2,"explanation":"Eine Anwendung kann hohen Durchsatz und trotzdem hohe Antwortzeiten haben. Beide Größen müssen passend zum Nutzungsfall bewertet werden.","hint":"Beide Größen müssen passend zum Nutzungsfall bewertet werden.","originalChapter":17},{"id":"ch17-extra-02","chapter":32,"question":"Was bedeutet ein p95 von zwei Sekunden?","options":["Jede Anfrage dauert genau zwei Sekunden","Nur fünf Prozent sind schneller als zwei Sekunden","95 Prozent aller Anfragen sind fehlerhaft","95 Prozent der gemessenen Antwortzeiten liegen bei höchstens zwei Sekunden"],"correct":3,"explanation":"Das Perzentil beschreibt die Verteilung der gemessenen Zeiten. Die langsamsten fünf Prozent können deutlich darüber liegen.","hint":"Die langsamsten fünf Prozent können deutlich darüber liegen.","originalChapter":17},{"id":"ch17-extra-03","chapter":13,"question":"Was ist eine typische Gefahr beim Caching?","options":["Veraltete Daten können ausgeliefert werden","Daten werden grundsätzlich immer aktuell","Jeder Schreibzugriff wird automatisch atomar","Backups werden vollständig ersetzt"],"correct":0,"explanation":"Caches benötigen Regeln zu Ablauf und Invalidierung. Der akzeptable Aktualitätsverlust hängt vom Fachfall ab.","hint":"Der akzeptable Aktualitätsverlust hängt vom Fachfall ab.","originalChapter":17},{"id":"ch17-extra-04","chapter":32,"question":"Warum sollte ein Engpass vor einer Optimierung gemessen werden?","options":["Damit jede Messung mehr Server ersetzt","Damit die Maßnahme die tatsächlich begrenzende Ressource adressiert","Damit Datenbankprobleme ignoriert werden","Damit nur die schnellste Funktion weiter beschleunigt wird"],"correct":1,"explanation":"Eine Optimierung am falschen Ort kann wirkungslos sein. Profiling und Metriken zeigen die relevanten Warte- und Verarbeitungszeiten.","hint":"Profiling und Metriken zeigen die relevanten Warte- und Verarbeitungszeiten.","originalChapter":17},{"id":"ch17-extra-05","chapter":33,"question":"Was ist ein Single Point of Failure?","options":["Ein besonders kurzer Test","Ein einzelner Kommentar","Eine einzelne Komponente, deren Ausfall den betrachteten Dienst ausfallen lässt","Eine harmlose Kopie einer Datei"],"correct":2,"explanation":"Redundanz kann solche Abhängigkeiten vermindern. Gemeinsame Strom-, Netz- oder Datenabhängigkeiten müssen trotzdem geprüft werden.","hint":"Gemeinsame Strom-, Netz- oder Datenabhängigkeiten müssen trotzdem geprüft werden.","originalChapter":17},{"id":"ch17-extra-06","chapter":13,"question":"Was bewirkt ein Load Balancer typischerweise?","options":["Er normalisiert Tabellen","Er ersetzt sämtliche Authentifizierung","Er macht jede Anwendung zustandslos","Er verteilt Anfragen auf mehrere geeignete Instanzen"],"correct":3,"explanation":"Verteilung verbessert Kapazitätsnutzung und kann Ausfälle abfangen. Sitzungszustand und Health Checks benötigen eine passende Gestaltung.","hint":"Sitzungszustand und Health Checks benötigen eine passende Gestaltung.","originalChapter":17},{"id":"ch17-extra-07","chapter":31,"question":"Warum müssen Health Checks sinnvoll definiert sein?","options":["Damit tatsächlich nicht funktionsfähige Instanzen erkannt werden","Damit jeder Server möglichst oft neu startet","Damit nur die Logo-Datei geprüft wird","Damit Überwachung keine Messwerte liefert"],"correct":0,"explanation":"Ein erreichbarer Prozess kann fachlich unbrauchbar sein. Checks sollten relevante Bereitschaft erkennen, ohne durch Überempfindlichkeit unnötige Ausfälle auszulösen.","hint":"Checks sollten relevante Bereitschaft erkennen, ohne durch Überempfindlichkeit unnötige Ausfälle auszulösen.","originalChapter":17},{"id":"ch17-extra-08","chapter":19,"question":"Was ist ein Circuit Breaker bei Dienstaufrufen?","options":["Er garantiert sofortige Reparatur","Er unterbricht vorübergehend Aufrufe einer wiederholt scheiternden Abhängigkeit","Er erhöht ohne Grenze die Wiederholungsrate","Er löscht alle fehlerhaften Datensätze"],"correct":1,"explanation":"Das begrenzt Kaskadenfehler und entlastet die Abhängigkeit. Nach einer Wartezeit können kontrollierte Probeaufrufe die Erholung prüfen.","hint":"Nach einer Wartezeit können kontrollierte Probeaufrufe die Erholung prüfen.","originalChapter":17},{"id":"ch17-extra-09","chapter":19,"question":"Warum werden Wiederholungen oft mit Backoff und Zufallsanteil gestaltet?","options":["Um jede Anfrage unbegrenzt zu wiederholen","Um Idempotenz überflüssig zu machen","Um gleichzeitige Wiederholungswellen und weitere Überlastung zu reduzieren","Um TLS zu ersetzen"],"correct":2,"explanation":"Wachsende Wartezeiten und Jitter verteilen Last. Wiederholungen bleiben begrenzt und müssen fachlich sicher sein.","hint":"Wiederholungen bleiben begrenzt und müssen fachlich sicher sein.","originalChapter":17},{"id":"ch17-extra-10","chapter":32,"question":"Was unterscheidet ein SLI von einem SLO?","options":["Beide sind Dateiformate","SLI ist immer ein Vertrag mit Vertragsstrafe","SLO bezeichnet ausschließlich RAM-Größe","SLI ist die gemessene Dienstqualität; SLO ist das dafür gesetzte Ziel"],"correct":3,"explanation":"Ein SLI kann etwa den Anteil erfolgreicher Anfragen messen. Ein SLO legt den angestrebten Wert und Zeitraum fest.","hint":"Ein SLO legt den angestrebten Wert und Zeitraum fest.","originalChapter":17},{"id":"ch17-extra-11","chapter":32,"question":"Wie unterstützt ein gemeinsamer Korrelationsbezeichner die Diagnose?","options":["Er verbindet zusammengehörige Vorgänge über mehrere Dienste hinweg","Er verschlüsselt automatisch Protokolle","Er ersetzt Zeitstempel vollständig","Er verhindert alle Fehler"],"correct":0,"explanation":"Eine gemeinsame Request- oder Trace-ID macht Abläufe nachvollziehbar. Sie ergänzt strukturierte Logs und Metriken.","hint":"Sie ergänzt strukturierte Logs und Metriken.","originalChapter":17},{"id":"ch18-extra-01","chapter":8,"question":"Welche Anforderung vermeidet unnötige Festlegung einer Lösung?","options":["Es muss ohne Begründung genau Bibliothek X verwendet werden","Jede Seite braucht zwingend zehn Buttons","Alle Daten müssen in einer einzigen Tabelle stehen","Nutzer müssen einen Auftrag innerhalb eines definierten Zeitrahmens finden können"],"correct":3,"explanation":"Eine bedarfsorientierte Anforderung beschreibt das Ziel. Technische Vorgaben können berechtigt sein, sollten aber als Randbedingung begründet werden.","hint":"Technische Vorgaben können berechtigt sein, sollten aber als Randbedingung begründet werden.","originalChapter":18},{"id":"ch18-extra-02","chapter":9,"question":"Wie lässt sich eine strittige Entscheidung fair vorbereiten?","options":["Gemeinsame Kriterien vereinbaren und Alternativen daran prüfen","Nur die eigene Alternative mit Daten belegen","Gegenvorschläge ohne Prüfung abweisen","Nur die Ranghöhe der Vorschlagenden betrachten"],"correct":0,"explanation":"Ein gemeinsamer Maßstab erleichtert sachliche Diskussion. Kriterien und Gewichtung sollten den Projektzielen entsprechen.","hint":"Kriterien und Gewichtung sollten den Projektzielen entsprechen.","originalChapter":18},{"id":"ch18-extra-03","chapter":7,"question":"Was ist bei einem Workshop zur Anforderungsanalyse hilfreich?","options":["Ein Termin ohne Thema und Ergebnis","Ziele, Teilnehmerrollen und dokumentierte Ergebnisse","Ausschließlich monologischer Vortrag ohne Rückfragen","Das Verbot, Unklarheiten anzusprechen"],"correct":1,"explanation":"Ein strukturierter Workshop sa
