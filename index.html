ast-privilege\">\n<h3>13.2 Authentifizierung, Autorisierung, Least Privilege<\/h3>\n<p><strong>Authentifizierung<\/strong> prüft Identität („Wer bist du?“),\n<strong>Autorisierung<\/strong> prüft Befugnisse („Was darfst du?“).\nRollenbasierte Zugriffskontrolle (<strong>RBAC<\/strong>) ordnet Rechte\nRollen zu, z. B. Instandhalter, Schichtleitung, Administrator. Das\n<strong>Least-Privilege-Prinzip<\/strong> vergibt nur notwendige Rechte.\nEin Frontend darf Berechtigungen anzeigen, aber die sicherheitsrelevante\nPrüfung muss auf der durchsetzenden Serverseite erfolgen.\n<strong>Mehrfaktor-Authentisierung (MFA)<\/strong> verwendet mindestens\nzwei unabhängige Faktoren, zum Beispiel Passwort und Besitzfaktor.<\/p>\n<\/section>\n<section class=\"level3\" id=\"passwörter-hashing-verschlüsselung\">\n<h3>13.3 Passwörter, Hashing, Verschlüsselung<\/h3>\n<p>Passwörter dürfen nicht im Klartext gespeichert werden. Geeignete\nPasswort-Hash-Verfahren wie Argon2id verwenden pro Passwort einen\nzufälligen Salt und eine bewusst aufwendige Berechnung.\n<strong>Hashing<\/strong> ist nicht dasselbe wie Verschlüsselung: Hashing\nist für Einwegprüfungen gedacht, Verschlüsselung für später wieder\nentschlüsselbare Informationen. <strong>TLS<\/strong> schützt Daten\nwährend der Übertragung; Datenträgerverschlüsselung kann gespeicherte\nDaten schützen. Schlüssel und Geheimnisse brauchen sicheren\nLebenszyklus, Zugriffskontrolle und Rotation.<\/p>\n<\/section>\n<section class=\"level3\" id=\"eingabevalidierung-und-typische-schwachstellen\">\n<h3>13.4 Eingabevalidierung und typische Schwachstellen<\/h3>\n<p>Ungültige Eingaben können Datenqualität oder Sicherheit gefährden.\n<strong>SQL Injection<\/strong> entsteht unter anderem, wenn Eingaben\nungeprüft in SQL-Befehle eingefügt werden. Schutz: parametrisierte\nDatenbankabfragen und minimale Rechte. <strong>Cross-Site Scripting\n(XSS)<\/strong> bedeutet, dass fremde Skripte im Browserkontext\nausgeführt werden; Gegenmaßnahmen sind kontextgerechte Ausgabecodierung,\nsichere Framework-Nutzung und ergänzende Schutzmechanismen.\n<strong>Broken Access Control<\/strong> tritt auf, wenn fremde Daten oder\nFunktionen trotz fehlender Berechtigung erreichbar sind. Die OWASP Top\n10:2025 nennt unter anderem mangelhafte Zugriffskontrolle,\nFehlkonfiguration, Lieferkettenprobleme, unsichere Kryptografie,\nInjection und Authentifizierungsfehler. [Q5]<\/p>\n<\/section>\n<section class=\"level3\" id=\"security-by-design-und-datenschutz-by-design\">\n<h3>13.5 Security by Design und Datenschutz by Design<\/h3>\n<p>Sicherheit sollte schon bei Anforderungen und Architektur\nberücksichtigt werden: Schutzbedarf bestimmen, Angriffsflächen\nidentifizieren, Rechte prüfen, Eingaben validieren, Geheimnisse\nschützen, sichere Voreinstellungen wählen, protokollieren und Tests\nplanen. <strong>Threat Modeling<\/strong> überlegt systematisch, welche\nAngreifer oder Fehlbedienungen welche Komponenten und Daten bedrohen.\nEine unabhängige Sicherheitsprüfung vor der Freigabe ist bei kritischen\nAnwendungen sinnvoll.<\/p>\n<\/section>\n<section class=\"level3\" id=\"backup-notfallpläne-und-risikobehandlung\">\n<h3>13.6 Backup, Notfallpläne und Risikobehandlung<\/h3>\n<p>Ein Datensicherungskonzept behandelt Sicherungsumfang, Häufigkeit,\nVerschlüsselung, Zugriff, getrennte Aufbewahrung, Aufbewahrungsdauer und\nRestore-Tests. Die bekannte <strong>3-2-1-Regel<\/strong> lautet als\nAusgangspunkt: drei Datenkopien, auf zwei unterschiedlichen Medien,\ndavon eine außer Haus beziehungsweise getrennt. Zusätzlich sind\nunveränderbare oder offline geschützte Sicherungen für bestimmte\nBedrohungslagen nützlich. Ein Backup wird erst durch erfolgreich\ngetestete Wiederherstellung betriebspraktisch glaubwürdig. [Q3]<\/p>\n<p>Risikobehandlung umfasst <strong>Vermeidung<\/strong> (riskante\nTätigkeit unterlassen), <strong>Minderung<\/strong> (Eintritt oder\nSchaden reduzieren), <strong>Übertragung<\/strong> (bestimmte finanzielle\nFolgen verlagern) und <strong>Akzeptanz<\/strong> (bewusstes Restrisiko).\nBei der Bewertung dokumentiere Wahrscheinlichkeit, Auswirkungen,\nMaßnahmen, verantwortliche Person und Restbewertung.<\/p>\n<blockquote>\n<p>MERKSATZ: Sicherheitsanforderungen sind ein Teil des gesamten\nLebenszyklus – sie können nicht erst unmittelbar vor dem Release\n„hinzugefügt“ werden.<\/p>\n<\/blockquote>\n<\/section>\n","questions":4},{"id":14,"title":"Datenschutz, Recht, Lizenzen, Nachhaltigkeit","lesson":"\n\n<section class=\"level3\" id=\"personenbezogene-daten-und-dsgvo\">\n<h3>14.1 Personenbezogene Daten und DSGVO<\/h3>\n<p><strong>Personenbezogene Daten<\/strong> sind Informationen, die sich\nauf identifizierte oder identifizierbare natürliche Personen beziehen,\netwa Mitarbeitername, Personalnummer oder zuordenbare\nNutzungsprotokolle. Die DSGVO verlangt unter anderem Rechtmäßigkeit,\nZweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung sowie\nIntegrität und Vertraulichkeit. Eine Rechtsgrundlage ist erforderlich;\neine Einwilligung ist nicht in jeder Unternehmenssituation die passende\noder notwendige Grundlage. Die konkrete Bewertung erfolgt anhand des\nVerarbeitungskontexts. [Q2]<\/p>\n<\/section>\n<section class=\"level3\" id=\"privacy-by-design-rollen-und-verträge\">\n<h3>14.2 Privacy by Design, Rollen und Verträge<\/h3>\n<p>Datenschutz durch Technikgestaltung bedeutet, notwendige\nSchutzmaßnahmen bei Planung und Entwicklung zu berücksichtigen.\nDatenschutzfreundliche Voreinstellungen minimieren Daten und Zugriffe.\nKläre Verantwortlichenrollen, Zugriffe, Löschfristen, Auskunftsprozesse\nund gegebenenfalls Auftragsverarbeitungsverträge. Eine\n<strong>Datenschutz-Folgenabschätzung<\/strong> kann bei voraussichtlich\nhohem Risiko erforderlich sein. Datenschutz und Informationssicherheit\nüberschneiden sich, sind aber nicht identisch.<\/p>\n<\/section>\n<section class=\"level3\" id=\"urheberrecht-und-softwarelizenzen\">\n<h3>14.3 Urheberrecht und Softwarelizenzen<\/h3>\n<p>Software ist grundsätzlich urheberrechtlich geschützt. Eine Lizenz\nbestimmt, unter welchen Bedingungen Software genutzt, verändert und\nweitergegeben werden darf. <strong>Proprietäre Lizenzmodelle<\/strong>\ngewähren bestimmte vertragliche Nutzungsrechte.\n<strong>Open-Source-Lizenzen<\/strong> können Nutzung und Quelloffenheit\nerlauben, haben aber unterschiedliche Pflichten (Hinweise, Lizenztexte,\nteilweise Offenlegung abgeleiteter Werke). Prüfe Abhängigkeiten, Rechte\nund Lizenzkompatibilität, besonders bei Weitergabe an Kunden. Diese\nÜbersicht ersetzt keine rechtliche Prüfung.<\/p>\n<\/section>\n<section class=\"level3\" id=\"verträge-abnahme-haftung-und-it-compliance\">\n<h3>14.4 Verträge, Abnahme, Haftung und IT-Compliance<\/h3>\n<p>Beachte Projektvertrag, Leistungsspezifikation, Rechte an\nErgebnissen, Geheimhaltung, Support, Wartung, Servicelevels und\nAbnahmekriterien. Die konkrete rechtliche Einordnung hängt vom Vertrag\nund Einzelfall ab. <strong>Compliance<\/strong> bedeutet die Einhaltung\neinschlägiger Vorgaben, Richtlinien und Verpflichtungen; dokumentierte\nFreigaben und Nachweise unterstützen die Nachvollziehbarkeit. Prüfe auch\nbetriebliche Regeln wie Berechtigungskonzepte und interne\nChange-Prozesse.<\/p>\n<\/section>\n<section class=\"level3\" id=\"barrierefreiheit-ethik-und-nachhaltiges-wirtschaften\">\n<h3>14.5 Barrierefreiheit, Ethik und nachhaltiges Wirtschaften<\/h3>\n<p>Gute Software berücksichtigt Menschen mit unterschiedlichen\nEinschränkungen, etwa Tastaturbedienung, ausreichende Kontraste,\nverständliche Fehlermeldungen und Unterstützung assistiver Technik.\nEthische Fragen betreffen Transparenz, faire Behandlung, Überwachung,\nFehlentscheidungen und unbeabsichtigte Wirkungen. Nachhaltigkeit kann\nunter anderem energieeffiziente Systeme, längere Hardware-Nutzung,\nweniger Datenübertragung und ressourcenschonenden Betrieb umfassen.\nWirtschaftlichkeit, Schutzanforderungen und Nachhaltigkeit sollten\ngemeinsam bewertet werden, nicht isoliert.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Prüfe bei einer neuen Mitarbeitersoftware nicht\nnur Funktionsumfang, sondern auch Rechtsgrundlage, Zugriff,\nAufbewahrung, Dokumentation, Betroffenenrechte und organisatorische\nVerantwortung.<\/p>\n<\/blockquote>\n<\/section>\n","questions":4},{"id":15,"title":"Projektunterstützung, Zeitplanung und Kalkulation","lesson":"\n\n<section class=\"level3\" id=\"projektziele-scope-und-stakeholder\">\n<h3>15.1 Projektziele, Scope und Stakeholder<\/h3>\n<p>Ein Projekt ist eine zeitlich begrenzte, zielgerichtete Aufgabe mit\nRessourcen und Unsicherheiten. Formuliere Ziele <strong>SMART<\/strong>:\nspezifisch, messbar, attraktiv/akzeptiert, realistisch und terminiert.\nBeispiel: „Bis 30. November sollen 90 % aller Wartungsaufträge digital\nerfasst werden, ohne kritische Zuordnungsfehler.“ Definiere\nProjektumfang, Abgrenzungen und Erfolgskriterien ausdrücklich. Ein\n<strong>Stakeholderregister<\/strong> hilft, Interessen,\nInformationsbedarf und Einfluss zu erfassen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"projektstrukturplan-meilensteine-und-abhängigkeiten\">\n<h3>15.2 Projektstrukturplan, Meilensteine und Abhängigkeiten<\/h3>\n<p>Ein <strong>Projektstrukturplan (PSP)<\/strong> zerlegt das\nGesamtvorhaben in Arbeitspakete. Ein <strong>Meilenstein<\/strong>\nmarkiert einen wesentlichen überprüfbaren Punkt, z. B. „Anforderungen\nfreigegeben“ oder „Abnahme bestanden“. Ein Zeitplan ordnet Arbeit,\nDauer, Abhängigkeiten und Ressourcen. Ein <strong>kritischer\nPfad<\/strong> besteht aus Vorgängen, deren Verzögerung ohne Puffer den\nEndtermin beeinflusst. <strong>Gantt-Diagramme<\/strong> zeigen Zeiträume\nund Überschneidungen; bei komplexen Änderungen ist zusätzlich ein\nAbhängigkeitsplan sinnvoll.<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufwand-dauer-und-kosten-unterscheiden\">\n<h3>15.3 Aufwand, Dauer und Kosten unterscheiden<\/h3>\n<p><strong>Aufwand<\/strong> ist Arbeitsmenge, etwa 40 Personenstunden.\n<strong>Dauer<\/strong> ist Kalenderzeit, etwa fünf Arbeitstage. Zwei\nPersonen halbieren die Dauer nicht automatisch, weil Einarbeitung,\nAbstimmung und Abhängigkeiten anfallen. Grobe Schätzmethoden sind\nExpertenurteil, Analogieschätzung, Drei-Punkt-Schätzung und Zerlegung in\nArbeitspakete. Eine einfache Drei-Punkt-PERT-Schätzung lautet\n<code>E = (optimistisch + 4 × wahrscheinlich + pessimistisch) / 6<\/code>;\nsie ist nur ein Näherungsmodell.<\/p>\n<p><strong>Projektkosten<\/strong> enthalten Arbeitszeit, Lizenzen,\nInfrastruktur, Schulungen, Betrieb, Wartung, Tests und Risikopuffer.\n<strong>TCO (Total Cost of Ownership)<\/strong> betrachtet die\nGesamtkosten über den Lebenszyklus, nicht nur Anschaffungskosten. Ein\nROI oder Break-even sollte nur mit transparenten Annahmen berechnet\nwerden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"ressourcen--und-kommunikationsplanung\">\n<h3>15.4 Ressourcen- und Kommunikationsplanung<\/h3>\n<p>Ein Ressourcenplan klärt benötigte Rollen, Verfügbarkeit, Kompetenzen\nund Engpässe. Ein <strong>RACI-Modell<\/strong> ordnet Responsible\n(ausführend), Accountable (endverantwortlich), Consulted (einzubeziehen)\nund Informed (zu informieren) zu. Für jede Aufgabe sollte die\nLetztverantwortung klar sein. Ein Kommunikationsplan legt fest, wer\nwelche Informationen wann und über welchen Kanal erhält. Ein kurzer\nStatusbericht nennt Fortschritt, nächste Schritte, Risiken,\nEntscheidungen und Unterstützungsbedarf.<\/p>\n<\/section>\n<section class=\"level3\" id=\"projektcontrolling-und-kennzahlen\">\n<h3>15.5 Projektcontrolling und Kennzahlen<\/h3>\n<p>Vergleiche <strong>Plan<\/strong> und <strong>Ist<\/strong> für\nTermine, Aufwand, Kosten und Qualität. Abweichungen sollten erklärt und\nmit Gegenmaßnahmen verbunden werden. Beispiel: „Migrationstest liegt\ndrei Tage zurück, weil keine produktionsnahe Testdatenbank verfügbar\nist; Maßnahme: Bereitstellung bis Mittwoch; Auswirkungen auf Go-live neu\nbewerten.“ Transparenz ist besser als ein formal grüner Status ohne\nbelastbare Nachweise.<\/p>\n<\/section>\n<section class=\"level3\" id=\"scrum-kanban-und-klassische-planung\">\n<h3>15.6 Scrum, Kanban und klassische Planung<\/h3>\n<p><strong>Scrum<\/strong> ist ein leichtgewichtiges Rahmenwerk für\nkomplexe Produktentwicklung. Verantwortlichkeiten: Product Owner\nmaximiert den Wert und verantwortet Product Backlog, Scrum Master\nunterstützt Scrum-Verständnis und -Wirksamkeit, Developers erstellen das\nSprint Backlog und das nutzbare Increment. Ereignisse: Sprint, Sprint\nPlanning, Daily Scrum, Sprint Review und Sprint Retrospective. Ein\nSprint dauert höchstens einen Monat. [Q6]<\/p>\n<p><strong>Product Backlog<\/strong> enthält geordnete Produktarbeiten,\n<strong>Sprint Backlog<\/strong> Sprintziel, ausgewählte Arbeiten und\nUmsetzungsplan, <strong>Increment<\/strong> ein überprüfbares nutzbares\nErgebnis. Die <strong>Definition of Done<\/strong> beschreibt\nübergreifende Qualitätsanforderungen. <strong>Sprint Review<\/strong>\nbetrachtet Produkt und Feedback, <strong>Retrospektive<\/strong>\nZusammenarbeit und Prozess. <strong>Kanban<\/strong> visualisiert\nArbeitsfluss und begrenzt parallele Arbeit (WIP-Limits); es lässt sich\nauch außerhalb von Scrum nutzen. Klassische Planung ist bei stabilen,\nfesten Vorgaben nützlich; hybride Modelle verbinden Ansätze je nach\nKontext.<\/p>\n<\/section>\n<section class=\"level3\" id=\"risiken-im-projekt-aktiv-führen\">\n<h3>15.7 Risiken im Projekt aktiv führen<\/h3>\n<p>Ein <strong>Risikoregister<\/strong> enthält Ereignis, Ursache,\nAuswirkung, Bewertung, Maßnahme, Eigentümer und Kontrolltermin.\nUnterscheide ein noch mögliches Risiko von einem bereits eingetretenen\nProblem. Eskaliere sachlich: „Backup-Restore ungeprüft, möglicher\nDatenverlust, Testtermin offen, Go-live gefährdet; Entscheidung\nerforderlich.“ Dokumentiere Annahmen und bewerte Restrisiken erneut,\nwenn sich Rahmenbedingungen verändern.<\/p>\n<blockquote>\n<p>MERKSATZ: Ein guter Projektstatus nennt nicht nur erledigte Aufgaben,\nsondern gibt eine belastbare Antwort auf die Fragen: Sind Ziel,\nQualität, Termin und Budget noch erreichbar – und was muss entschieden\nwerden?<\/p>\n<\/blockquote>\n<\/section>\n","questions":4},{"id":16,"title":"Softwareentwurf, Fachmodelle und Schnittstellen im Detail","lesson":"\n\n<section class=\"level3\" id=\"vom-geschäftsprozess-zur-systemfunktion\">\n<h3>16.1 Vom Geschäftsprozess zur Systemfunktion<\/h3>\n<p>Ein betrieblicher Prozess beschreibt zusammengehörige Tätigkeiten mit\nAuslöser, Beteiligten, Regeln und Ergebnis. Für die Wartungssoftware\nkönnte er lauten: Maschine meldet Störung → Mitarbeiter erfasst Meldung\n→ Vorgesetzter priorisiert → Auftrag wird zugewiesen → Techniker\ndokumentiert Maßnahme → Auftrag wird geschlossen. Identifiziere an jedem\nSchritt erforderliche Daten, Verantwortlichkeiten, Varianten und\nFehlerfälle. So wird aus einem mündlich beschriebenen Ablauf ein\nbelastbarer Lösungsentwurf.<\/p>\n<p>Wichtig ist die Unterscheidung von <strong>Ist-Prozess<\/strong> und\n<strong>Soll-Prozess<\/strong>. Der Ist-Prozess zeigt, wie heute\ngearbeitet wird; der Soll-Prozess beschreibt den künftigen Ablauf. Eine\nneue App sollte nicht automatisch einen unnötig komplizierten Altprozess\ndigital kopieren. Prüfe zuerst, ob Schritte entfallen oder\nstandardisiert werden können.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fachliches-und-technisches-datenmodell\">\n<h3>16.2 Fachliches und technisches Datenmodell<\/h3>\n<p>Ein fachliches Modell zeigt Geschäftsobjekte und ihre Beziehungen:\nMaschine (1) → (n) Wartungsauftrag, Mitarbeiter (1) → (n) erfasste\nAufträge. Ein technisches Datenmodell ergänzt konkrete Datentypen,\nSchlüssel, Nullbarkeit, Constraints und Indizes. Beispiel:\n<code>Wartungsauftrag.AuftragID<\/code> als nichtleerer Primärschlüssel;\n<code>MaschinenID<\/code> als Pflicht-Fremdschlüssel; <code>Status<\/code>\nmit definiertem Wertebereich. Für jedes Feld sollten Zweck, Format und\nValidierung klar sein.<\/p>\n<p><strong>ER-Diagramme<\/strong> (Entity Relationship) machen Entitäten,\nAttribute und Kardinalitäten sichtbar. Bei einer n:m-Beziehung, etwa\nMitarbeiter zu Schulung, legt man eine Zuordnungstabelle an. Bei\nhistorisierungsbedürftigen Daten (z. B. frühere Maschinenstandorte)\nreicht ein einzelnes überschriebenes Feld nicht immer; dann braucht man\nein Zeitmodell oder eine Historientabelle.<\/p>\n<\/section>\n<section class=\"level3\" id=\"entwurf-von-schnittstellen\">\n<h3>16.3 Entwurf von Schnittstellen<\/h3>\n<p>Definiere eine API anhand fachlicher Ressourcen. Beispiel:\n<code>GET /maschinen<\/code> listet Maschinen,\n<code>GET /maschinen/102<\/code> zeigt eine Maschine,\n<code>POST /wartungsauftraege<\/code> legt einen Auftrag an. Ein\nSchnittstellenvertrag beantwortet: Wer ruft auf? Welche Berechtigungen\ngelten? Welche Felder sind Pflicht? Wie werden ungültige Eingaben\ngemeldet? Welche Antwortzeiten und Versionsregeln gelten? Welche\nEreignisse werden protokolliert?<\/p>\n<p><strong>Schema-Validierung<\/strong> prüft Typen und Strukturen,\nbeispielsweise dass <code>maschinenId<\/code> eine Zahl ist.\n<strong>Fachliche Validierung<\/strong> prüft Regeln, beispielsweise dass\ndie referenzierte Maschine existiert und aktiv sein muss.\n<strong>Autorisierung<\/strong> prüft, ob der konkrete Benutzer den\nAuftrag anlegen darf. Diese drei Prüfungen erfüllen unterschiedliche\nZwecke und sollten nicht vermischt werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"api-versionierung-und-kompatibilität\">\n<h3>16.4 API-Versionierung und Kompatibilität<\/h3>\n<p>Eine Schnittstellenänderung ist <strong>rückwärtskompatibel<\/strong>,\nwenn bestehende berechtigte Clients unter den vereinbarten Bedingungen\nweiterhin funktionieren. Ein neues optionales Feld ist oft relativ\nunproblematisch; das Umbenennen eines Pflichtfelds kann bestehende\nClients brechen. Für Änderungen gibt es mehrere Strategien: additive\nErweiterungen, explizite API-Versionen, frühzeitige Deprecation-Hinweise\nund Übergangsfristen. Zur Absicherung nutzt man <strong>Contract\nTests<\/strong>, die Erwartungen zwischen Diensten überprüfen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"synchrone-und-ereignisgesteuerte-architektur\">\n<h3>16.5 Synchrone und ereignisgesteuerte Architektur<\/h3>\n<p>Synchron: Das Frontend ruft das Backend auf und wartet auf die\nAntwort. Das ist einfach nachzuvollziehen, aber ein langsamer\nBackend-Dienst verlängert die Antwortzeit. Ereignisgesteuert: Nach der\nAuftragserfassung wird ein Ereignis „WartungsauftragErstellt“\nveröffentlicht; ein anderer Dienst erzeugt später eine Benachrichtigung.\nDas entkoppelt Abläufe, führt aber zu zusätzlichen Fragen: Was passiert\nbei verspäteter Zustellung? Wie erkennt man doppelte Nachrichten? Wie\nwird ein Fehler nachträglich korrigiert?<\/p>\n<p>In verteilten Systemen gilt oft <strong>eventual\nconsistency<\/strong>: Nicht alle beteiligten Dienste besitzen jederzeit\ndenselben Datenstand. Das kann akzeptabel sein, wenn Anforderungen und\nNutzerführung darauf abgestimmt sind. Für eine verbindliche\nMaschinenzuordnung kann sofortige Konsistenz dagegen entscheidend\nsein.<\/p>\n<\/section>\n<section class=\"level3\" id=\"uml-in-vier-mini-beispielen\">\n<h3>16.6 UML in vier Mini-Beispielen<\/h3>\n<p><strong>Use Case:<\/strong> Akteur „Instandhalter“ führt\n„Wartungsauftrag erstellen“ aus. <strong>Aktivitätsablauf:<\/strong>\nLogin prüfen → Maschinen-ID eingeben → Existenz prüfen → Auftrag\nspeichern → Erfolg anzeigen; bei Fehler: Meldung anzeigen.\n<strong>Sequenz:<\/strong> Benutzer → Frontend → API → Geschäftslogik →\nDatenbank → Antwort. <strong>Komponentenmodell:<\/strong> Web-Frontend\nbenötigt Wartungs-API; Wartungsservice benötigt Datenzugriff. Zeichne\nzuerst die fachlich wesentlichen Elemente, nicht alle technischen\nEinzelheiten.<\/p>\n<\/section>\n<section class=\"level3\" id=\"architekturqualität-und-technische-schulden\">\n<h3>16.7 Architekturqualität und technische Schulden<\/h3>\n<p><strong>Technische Schulden<\/strong> sind zukünftige Mehrkosten durch\ngegenwärtige, oft bewusst eingegangene technische Vereinfachungen. Sie\nkönnen sinnvoll sein, wenn sie transparent und befristet sind, dürfen\naber nicht stillschweigend wichtige Sicherheits- oder\nWartbarkeitsanforderungen gefährden. Beispiele sind unklare\nDatenmodelle, fehlende automatische Tests, veraltete Abhängigkeiten oder\nundokumentierte Schnittstellen. Der Umgang erfolgt durch Sichtbarmachen,\nRisikobewertung und geplante Verbesserungen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"entscheidungsbeispiel-eigenentwicklung-oder-standardsoftware\">\n<h3>16.8 Entscheidungsbeispiel: Eigenentwicklung oder\nStandardsoftware?<\/h3>\n<p>Die Standardlösung deckt 80 % der Anforderungen ab, kostet aber\nlaufende Lizenzgebühren. Eine Eigenentwicklung bietet maximale\nAnpassbarkeit, braucht jedoch mehr Entwicklungs-, Sicherheits- und\nWartungsaufwand. Eine belastbare Empfehlung betrachtet: Muss-Funktionen,\nIntegrationsfähigkeit, Datenmigration, Lizenzvertrag,\nHerstellerstrategie, Total Cost of Ownership, Personalrisiko und\nlangfristige Änderbarkeit. Nur „Eigenentwicklung ist flexibler“ oder\n„Standardsoftware ist günstiger“ wäre als Entscheidung zu\noberflächlich.<\/p>\n<blockquote>\n<p>ÜBUNG: Formuliere drei Kriterien, anhand derer du für die\nWartungssoftware zwischen SaaS-Lösung und Eigenentwicklung wählen\nwürdest. Nenne zu jedem Kriterium eine mögliche negative Konsequenz.<\/p>\n<\/blockquote>\n<\/section>\n","questions":4},{"id":17,"title":"Performance, Verfügbarkeit und Betriebskonzepte","lesson":"\n\n<section class=\"level3\" id=\"antwortzeit-durchsatz-und-auslastung\">\n<h3>17.1 Antwortzeit, Durchsatz und Auslastung<\/h3>\n<p><strong>Antwortzeit (Latency)<\/strong> ist die Zeit bis zur Reaktion\neiner Anfrage, <strong>Durchsatz (Throughput)<\/strong> die Anzahl\nbearbeiteter Vorgänge pro Zeiteinheit. <strong>Auslastung<\/strong>\nbeschreibt beanspruchte Ressourcen, etwa CPU, Speicher oder\nDatenbankverbindungen. Eine schnelle Anwendung bei zehn gleichzeitigen\nNutzern kann bei 500 Nutzern zusammenbrechen. Lege daher realistische\nLastprofile fest, einschließlich Spitzenlast, Datenmenge und typischer\nSuchanfragen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"mittelwert-und-perzentil\">\n<h3>17.2 Mittelwert und Perzentil<\/h3>\n<p>Ein durchschnittlicher Seitenaufbau von zwei Sekunden klingt gut,\nkann aber verdecken, dass manche Benutzer zehn Sekunden warten.\n<strong>P95<\/strong> bedeutet, dass 95 % der gemessenen Antwortzeiten\nauf oder unter diesem Wert liegen (gemäß der gewählten\nBerechnungsmethode). Für die Nutzererfahrung sind Perzentile daher oft\naussagekräftiger als bloße Mittelwerte. Lege Messzeitraum, Messpunkt und\nStichprobe fest; ohne diese Angaben sind Performanceversprechen schwer\nüberprüfbar.<\/p>\n<\/section>\n<section class=\"level3\" id=\"skalierung-und-ausfallsicherheit\">\n<h3>17.3 Skalierung und Ausfallsicherheit<\/h3>\n<p><strong>Vertikale Skalierung<\/strong> erhöht Ressourcen einer\nInstanz, etwa mehr RAM. <strong>Horizontale Skalierung<\/strong> fügt\nweitere Instanzen hinzu. Horizontale Skalierung benötigt oft einen Load\nBalancer, geeignetes Session-Management und Zugriff auf gemeinsam\ngenutzte Daten. Ein <strong>Single Point of Failure<\/strong> ist eine\neinzelne Komponente, deren Ausfall den ganzen Dienst lahmlegt.\n<strong>Redundanz<\/strong> kann Ausfälle abfedern, erzeugt aber Kosten\nund Koordinationsbedarf.<\/p>\n<\/section>\n<section class=\"level3\" id=\"hochverfügbarkeit-ist-nicht-backup\">\n<h3>17.4 Hochverfügbarkeit ist nicht Backup<\/h3>\n<p><strong>Hochverfügbarkeit<\/strong> reduziert Unterbrechungen durch\nredundante Komponenten und Umschaltung. <strong>Backup<\/strong>\nermöglicht Wiederherstellung älterer Datenstände. Datenbankreplikation\nkann versehentliches Löschen oder beschädigte Daten sofort\nmitreplizieren. Daher sind unabhängige, geschützte Sicherungen mit\nWiederherstellungstests zusätzlich notwendig. Prüfe die geschäftlichen\nAnforderungen mit RTO, RPO, Verfügbarkeitsziel und Schutzbedarf, bevor\ndu eine kostspielige Architektur wählst.<\/p>\n<\/section>\n<section class=\"level3\" id=\"monitoring-logs-und-traces\">\n<h3>17.5 Monitoring, Logs und Traces<\/h3>\n<p>Metriken zeigen Trends, Logs zeigen Ereignisdetails und Traces\nverbinden Bearbeitungsschritte über Dienste hinweg. Beispiel:\n„API-Aufruf dauert 8 s“ → Trace zeigt 7 s Datenbankabfrage →\nQuery-Analyse findet fehlenden Index. Achte auf Datenschutz in\nProtokollen: Passwörter, Tokens und unnötige Personendaten gehören nicht\nin Logs. Ergänze Alarmregeln um Reaktionswege, damit Hinweise zu\nkonkreten Maßnahmen führen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"kapazitätsplanung\">\n<h3>17.6 Kapazitätsplanung<\/h3>\n<p>Ermittle Nutzerzahl, gleichzeitige Zugriffe, Datenwachstum,\nSpeicherbedarf, Spitzenlast und Antwortzeitziele. Ein Datenspeicher kann\nheute ausreichend und nach zwölf Monaten zu klein sein. Plane Puffer,\nüberwache tatsächliches Wachstum und überprüfe Annahmen regelmäßig.\nKosten und Umweltwirkung gehören zur Entscheidung: Überdimensionierte\nSysteme sind nicht automatisch sicherer oder wirtschaftlicher.<\/p>\n<\/section>\n","questions":4},{"id":18,"title":"Qualität von Anforderungen, Zusammenarbeit und Entscheidungen","lesson":"\n\n<section class=\"level3\" id=\"gute-anforderungen-kontrollieren\">\n<h3>18.1 Gute Anforderungen kontrollieren<\/h3>\n<p>Prüfe jede Anforderung auf <strong>Eindeutigkeit, Notwendigkeit,\nVerständlichkeit, Prüfbarkeit, Konsistenz und\nRückverfolgbarkeit<\/strong>. Beispiel: „Für jede offene Wartung muss ein\nVerantwortlicher angegeben sein“ ist klarer als „Die\nVerantwortlichkeiten sind gut geregelt“. Bei widersprüchlichen\nAnforderungen – etwa „jeder darf alle Aufträge bearbeiten“ versus „nur\ndie eigene Abteilung darf Aufträge ändern“ – muss eine Entscheidung mit\nden Beteiligten getroffen und dokumentiert werden.<\/p>\n<\/section>\n<section class=\"level3\" id=\"design-thinking-und-prototyping\">\n<h3>18.2 Design Thinking und Prototyping<\/h3>\n<p>Ein <strong>Prototyp<\/strong> macht Ideen früh sichtbar, bevor hohe\nEntwicklungskosten entstehen. Ein Papierentwurf kann ausreichen, um die\nrichtige Eingabereihenfolge zu klären. Ein klickbarer Prototyp testet\nNavigation und Verständlichkeit, simuliert aber nicht automatisch\nDatenkonsistenz, Sicherheit oder Performance. Bei der Bewertung sind\nechte Nutzeraufgaben hilfreicher als die Frage „Gefällt dir die\nOberfläche?“.<\/p>\n<\/section>\n<section class=\"level3\" id=\"usability-accessibility-und-human-factors\">\n<h3>18.3 Usability, Accessibility und Human Factors<\/h3>\n<p><strong>Usability<\/strong> ist die Gebrauchstauglichkeit für\nbestimmte Benutzer, Aufgaben und Kontexte. Ein Instandhalter mit\nHandschuhen und Tablet hat andere Bedingungen als eine Büromitarbeiterin\nam Desktop. Prüfe klare Beschriftungen, Fehlervermeidung, verständliche\nRückmeldungen, geringe Eingabeaufwände und nachvollziehbare Navigation.\n<strong>Accessibility/Barrierefreiheit<\/strong> geht darüber hinaus und\numfasst die Nutzbarkeit für Menschen mit Behinderungen. Bei der\nEinführung helfen Feldtests im realen Arbeitsumfeld.<\/p>\n<\/section>\n<section class=\"level3\" id=\"konflikte-moderation-und-kommunikation\">\n<h3>18.4 Konflikte, Moderation und Kommunikation<\/h3>\n<p>Kunden wünschen oft zusätzliche Funktionen, Entwickler warnen vor\nAufwand, Betriebsteams vor Risiken. Eine gute Moderation trennt\nPositionen von Bedürfnissen und macht Entscheidungsgrundlagen\ntransparent. Eine Entscheidungsnotiz enthält Sachverhalt, Optionen,\nKriterien, Entscheidung, Gründe und Konsequenzen. Eskalation ist kein\nScheitern; sie ist sinnvoll, wenn notwendige Befugnisse oder\nInformationen fehlen. Mache Verantwortlichkeiten sichtbar, statt über\nZuständigkeiten zu spekulieren.<\/p>\n<\/section>\n<section class=\"level3\" id=\"wirtschaftlichkeit-und-qualität-abwägen\">\n<h3>18.5 Wirtschaftlichkeit und Qualität abwägen<\/h3>\n<p>Ein kurzfristig billiger Ansatz kann über Jahre höhere Kosten\nerzeugen, etwa durch manuelle Administration oder schwer wartbare\nSoftware. Nutze TCO, Nutzen-/Aufwandsabschätzung und Risikoanalyse\ngemeinsam. Rechenbeispiel: Eine Funktion spart 10 Minuten pro Auftrag\nbei 1.000 Aufträgen im Monat; das sind rund 167 Arbeitsstunden\nmonatlich. Monetärer Nutzen hängt von realen Prozessänderungen und einem\nbelegbaren Stundensatz ab, nicht allein von der rechnerischen\nZeitersparnis.<\/p>\n<\/section>\n<section class=\"level3\" id=\"änderungen-verantwortungsvoll-steuern\">\n<h3>18.6 Änderungen verantwortungsvoll steuern<\/h3>\n<p><strong>Change Management<\/strong> sorgt dafür, dass Änderungen\ngeprüft, kommuniziert, freigegeben, umgesetzt und nachkontrolliert\nwerden. Ein Change kann geringfügig oder kritisch sein. Dazu gehören\nAuswirkungsanalyse, Verantwortliche, Wartungsfenster, Rückfallplan und\nDokumentation. Bei dringenden Sicherheitsupdates kann ein beschleunigter\nProzess nötig sein, aber nicht ein völlig unkontrollierter Ablauf.<\/p>\n<blockquote>\n<p>PRÜFUNGSPERSPEKTIVE: Benenne beim Vergleich von Optionen sowohl\nNutzen als auch Kosten, Einschränkungen und Risiken. Eine begründete\nAbwägung ist stärker als ein kategorisches „immer Cloud“ oder „immer\nMicroservices“.<\/p>\n<\/blockquote>\n<\/section>\n","questions":4},{"id":19,"title":"Übungen: Grundlagenwissen und kurze Fachfragen","lesson":"\n\n<p>Die Aufgaben sind selbst erstellt und an beruflichen\nEntscheidungssituationen orientiert. Sie sind <strong>keine\nOriginal-IHK-Prüfungsaufgaben<\/strong>. Notiere deine Antwort erst ohne\nHilfe; vergleiche sie danach mit dem Lösungsteil.<\/p>\n<section class=\"level3\" id=\"aufgabenblock-a-it--und-softwaregrundlagen\">\n<h3>Aufgabenblock A – IT- und Softwaregrundlagen<\/h3>\n<p><strong>A1.<\/strong> Nenne den Unterschied zwischen Betriebssystem\nund Anwendungssoftware. Nutze ein Beispiel aus einem Unternehmen.<\/p>\n<p><strong>A2.<\/strong> Erkläre die Begriffe Client, Server, IP-Adresse,\nPort und DNS in einem zusammenhängenden Satz oder kleinen Ablauf.<\/p>\n<p><strong>A3.<\/strong> Ein Mitarbeiter kann sich anmelden, darf aber\neine Admin-Seite nicht öffnen. Ist das primär Authentifizierung oder\nAutorisierung? Begründe.<\/p>\n<p><strong>A4.<\/strong> Die Antwort auf <code>GET /maschinen/123<\/code>\nlautet 404. Was bedeutet das typischerweise? Warum ist 500 nicht\ngleichbedeutend?<\/p>\n<p><strong>A5.<\/strong> Warum kann eine API die Kopplung zwischen\nFrontend und Datenbank reduzieren? Nenne zugleich einen Nachteil einer\nzusätzlichen API-Schicht.<\/p>\n<p><strong>A6.<\/strong> Erkläre anhand eines Beispiels den Unterschied\nzwischen einem Algorithmus und einer konkreten Programmiersprache.<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufgabenblock-b-datenbanken\">\n<h3>Aufgabenblock B – Datenbanken<\/h3>\n<p><strong>B1.<\/strong> Für <code>Maschine(MaschinenID, Name)<\/code> und\n<code>Wartungsauftrag(AuftragID, MaschinenID, Status)<\/code>: Markiere\nPrimär- und Fremdschlüssel und benenne die Beziehung.<\/p>\n<p><strong>B2.<\/strong> Die Spalte <code>Telefonnummern<\/code> enthält\n<code>0171..., 0151...<\/code>. Warum ist das in einer üblichen\nrelationalen Modellierung problematisch?<\/p>\n<p><strong>B3.<\/strong> Primärschlüssel\n<code>MitarbeiterID + ProjektID<\/code>; weitere Spalten\n<code>MitarbeiterName<\/code>, <code>ProjektName<\/code>,\n<code>Stunden<\/code>. Welche Spalten verletzen 2NF und warum?<\/p>\n<p><strong>B4.<\/strong> Tabelle\n<code>Mitarbeiter(MitarbeiterID, Name, AbteilungID, AbteilungsName)<\/code>.\nWelche Abhängigkeit ist problematisch und wie würdest du die Tabellen\naufteilen?<\/p>\n<p><strong>B5.<\/strong> Ein Wartungsauftrag verweist auf eine\nMaschinenID, die es nicht gibt. Welches Datenbankprinzip hilft\ndagegen?<\/p>\n<p><strong>B6.<\/strong> Eine Überweisung bucht zuerst 100 Euro ab, die\nanschließende Gutschrift scheitert. Welche ACID-Eigenschaft ist zentral?\nWas sollte mit der Buchung geschehen?<\/p>\n<p><strong>B7.<\/strong> Die Datenbank verhindert durch eine definierte\nRegel negative Lagerbestände. Welche ACID-Eigenschaft wird sichtbar?\nWelcher zusätzliche Mechanismus kann bei gleichzeitigen Buchungen\nrelevant sein?<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufgabenblock-c-analyse-und-architektur\">\n<h3>Aufgabenblock C – Analyse und Architektur<\/h3>\n<p><strong>C1.<\/strong> Verbessere „Die Software soll sehr schnell sein“\nzu einer überprüfbaren nichtfunktionalen Anforderung.<\/p>\n<p><strong>C2.<\/strong> Formuliere eine User Story für das schnelle\nAuffinden kritischer Maschinenstörungen und zwei Akzeptanzkriterien.<\/p>\n<p><strong>C3.<\/strong> Nenne drei Entscheidungskriterien beim Vergleich\nEigenentwicklung versus Standardsoftware.<\/p>\n<p><strong>C4.<\/strong> Eine Anwendung muss zwölf Monate alte\nWartungsaufträge nachvollziehbar anzeigen. Welche Auswirkungen hat das\nauf das Datenmodell?<\/p>\n<p><strong>C5.<\/strong> Ein großes Unternehmen erwägt Microservices.\nNenne zwei Vorteile und zwei Nachteile im Vergleich zu einer modularen\nmonolithischen Anwendung.<\/p>\n<p><strong>C6.<\/strong> Eine API soll durch Umbenennung eines\nPflichtfelds verändert werden. Welches Risiko entsteht und wie kannst du\nes begrenzen?<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufgabenblock-d-qualität-und-sicherheit\">\n<h3>Aufgabenblock D – Qualität und Sicherheit<\/h3>\n<p><strong>D1.<\/strong> Erkläre den Unterschied zwischen\nKomponententest, Integrationstest und Systemtest an einer\nWartungsanwendung.<\/p>\n<p><strong>D2.<\/strong> Ein fehlerhafter Wartungsauftrag wird nach\nKorrektur erneut geprüft. Welche Testart? Danach werden weitere\nFunktionen erneut geprüft: Welche Testart?<\/p>\n<p><strong>D3.<\/strong> Ist „Fehler tritt nur bei falschen Eingaben auf“\nein Grund, negative Tests wegzulassen? Begründe.<\/p>\n<p><strong>D4.<\/strong> Unterscheide Severity und Priority an einem\nselbst gewählten Beispiel.<\/p>\n<p><strong>D5.<\/strong> Was unterscheidet Hashing eines Passworts von\nseiner Verschlüsselung? Was schützt HTTPS?<\/p>\n<p><strong>D6.<\/strong> Ein Benutzer verändert eine URL-ID und sieht\nfremde Wartungsaufträge. Welches Sicherheitsproblem liegt vor und wo\nmuss es behoben werden?<\/p>\n<\/section>\n<section class=\"level3\" id=\"aufgabenblock-e-einführung-evaluation-und-projekt\">\n<h3>Aufgabenblock E – Einführung, Evaluation und Projekt<\/h3>\n<p><strong>E1.<\/strong> Version 2.0 ist gebaut und getestet, aber noch\nnicht bereitgestellt. Ist sie produktiv? Begründe.<\/p>\n<p><strong>E2.<\/strong> Für 500 Benutzer wird eine neue Version zuerst\n20 Benutzern zugeteilt. Welche Rollout-Strategie ist das und warum?<\/p>\n<p><strong>E3.<\/strong> Eine geänderte Datenbank ist mit der\nVorgängerversion ungetestet. Welche Konsequenz hat das für den\nRollback?<\/p>\n<p><strong>E4.<\/strong> Ein Unternehmen fordert RPO 30 Minuten und RTO\nvier Stunden. Warum reicht ein tägliches Backup in der Regel nicht?<\/p>\n<p><strong>E5.<\/strong> Das Projekt meldet „80 % erledigt“, aber drei\nkritische Risiken sind ungeklärt. Warum ist der Status möglicherweise\nirreführend?<\/p>\n<p><strong>E6.<\/strong> Wie unterscheiden sich Sprint Review und Sprint\nRetrospective? Wer verantwortet die Reihenfolge des Product\nBacklogs?<\/p>\n<\/section>\n","questions":4},{"id":20,"title":"Fallstudien für situationsbezogene Aufgaben","lesson":"\n\n<section class=\"level3\" id=\"fallstudie-1-einführung-der-wartungssoftware-40-minuten\">\n<h3>Fallstudie 1 – Einführung der Wartungssoftware (40 Minuten)<\/h3>\n<p><strong>Ausgangslage:<\/strong> Ein mittelständisches Unternehmen\nverwaltet 300 Maschinen bislang mit Tabellenblättern. Wartungsaufträge\nwerden per E-Mail zugewiesen. Doppelarbeit und falsche Zuordnungen sind\nhäufig. Die Geschäftsleitung möchte innerhalb von vier Monaten eine\nzentrale Webanwendung einführen. 150 Beschäftigte benötigen Zugriff. Ein\nTeil nutzt Tablets in der Fertigung. Die Software soll Maschinen,\nStandorte, Wartungsaufträge, Rollen und Historie verwalten. Der\nIT-Betrieb kann die Lösung selbst hosten; alternativ gibt es ein\nSaaS-Angebot. Für produktive Wartungsdaten sind maximal 30 Minuten\nDatenverlust und vier Stunden Unterbrechung zulässig.<\/p>\n<p><strong>Aufgabe 1 (Anforderungen):<\/strong> Formuliere vier\nfunktionale und drei nichtfunktionale Anforderungen. Definiere für zwei\ndavon überprüfbare Akzeptanzkriterien.<\/p>\n<p><strong>Aufgabe 2 (Architektur):<\/strong> Skizziere die logischen\nHauptkomponenten und begründe zwei Schnittstellen- beziehungsweise\nDatenmodellentscheidungen.<\/p>\n<p><strong>Aufgabe 3 (Projektsteuerung):<\/strong> Erstelle drei\nMeilensteine und ein wesentliches Projekt-/Technikrisiko mit\nGegenmaßnahme.<\/p>\n<p><strong>Aufgabe 4 (Betrieb):<\/strong> Leite zwei Maßnahmen aus den\nRPO-/RTO-Vorgaben ab und erläutere, wie du ihre Wirksamkeit\nnachweist.<\/p>\n<p><strong>Aufgabe 5 (Entscheidung):<\/strong> Bewerte SaaS gegen\nEigenbetrieb anhand mindestens vier Kriterien; entscheide begründet\nunter Angabe notwendiger Annahmen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fallstudie-2-kritischer-releasewechsel-35-minuten\">\n<h3>Fallstudie 2 – Kritischer Releasewechsel (35 Minuten)<\/h3>\n<p><strong>Ausgangslage:<\/strong> Version 1.9 läuft stabil. Version 2.0\nführt eine neue Wartungsstatus-Tabelle ein, ersetzt dabei aber ein altes\nFeld. Alle Komponententests sind bestanden. Zwei Integrationstests mit\nälteren API-Clients sind fehlgeschlagen. Eine vollständige\nDatenwiederherstellung wurde noch nicht geprobt. Morgen ist Go-live. Die\nProjektleitung verweist auf einen verbindlichen\nKommunikationstermin.<\/p>\n<p><strong>Aufgabe 1:<\/strong> Triff eine Go-/No-Go-Empfehlung und\nbegründe sie anhand Qualität, Betriebsfähigkeit, Datenintegrität und\nTerminrisiko.<\/p>\n<p><strong>Aufgabe 2:<\/strong> Beschreibe einen sicheren\nMigrationsablauf mit mindestens sechs Schritten.<\/p>\n<p><strong>Aufgabe 3:<\/strong> Stelle dar, wie Expand-and-Contract und\nAPI-Versionierung zur Entschärfung beitragen können.<\/p>\n<p><strong>Aufgabe 4:<\/strong> Nenne sinnvolle Retests, Regressionstests\nund Abnahmetests.<\/p>\n<p><strong>Aufgabe 5:<\/strong> Entwirf eine kurze Nachricht an die\nProjektleitung mit klarer Entscheidung, Maßnahmen, Verantwortlichen und\nWiedervorlage.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fallstudie-3-fehleranalyse-unter-zeitdruck-30-minuten\">\n<h3>Fallstudie 3 – Fehleranalyse unter Zeitdruck (30 Minuten)<\/h3>\n<p><strong>Ausgangslage:<\/strong> Nach einer Aktualisierung dauert die\nMaschinensuche bei hoher Last zehn Sekunden. Gleichzeitig gibt es\nBerichte über doppelte Wartungsaufträge nach wiederholtem Klicken auf\n„Speichern“. CPU-Last ist gering, Datenbankverbindungen sind häufig\nausgelastet. In den Logs finden sich Timeout-Meldungen. Der\nKundenservice meldet 50 Tickets, der nächste Schichtwechsel beginnt in\nzwei Stunden.<\/p>\n<p><strong>Aufgabe 1:<\/strong> Unterscheide Symptome, mögliche Ursachen\nund Risiken. Welche Informationen fehlen noch?<\/p>\n<p><strong>Aufgabe 2:<\/strong> Priorisiere sofortige Maßnahmen zur\nStabilisierung und die längerfristige Ursachenanalyse.<\/p>\n<p><strong>Aufgabe 3:<\/strong> Erkläre, welche Rolle Idempotenz,\nTimeout/Retry-Strategien, Datenbankindizes und Connection-Pooling\nspielen könnten.<\/p>\n<p><strong>Aufgabe 4:<\/strong> Entwirf drei messbare Kriterien für die\nÜberprüfung der Korrektur.<\/p>\n<p><strong>Aufgabe 5:<\/strong> Formuliere eine knappe, verständliche\nStatusmeldung an betroffene Nutzer.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fallstudie-4-datenschutz-und-rechtekonzept-30-minuten\">\n<h3>Fallstudie 4 – Datenschutz und Rechtekonzept (30 Minuten)<\/h3>\n<p><strong>Ausgangslage:<\/strong> Eine neue Auswertungsfunktion zeigt\nBearbeitungszeiten einzelner Mitarbeiter. Alle Instandhalter können die\nAuswertung aufrufen. Ein Kunde fordert zusätzlich, die vollständigen\nZugriffsdaten zwölf Jahre aufzubewahren. Für diesen Zeitraum und diese\nSichtbarkeit liegt keine dokumentierte Begründung vor. In einer\nTestumgebung liegen echte personenbezogene Daten ohne zusätzliche\nSchutzmaßnahmen.<\/p>\n<p><strong>Aufgabe 1:<\/strong> Identifiziere mindestens vier\nDatenschutz- und Sicherheitsfragen.<\/p>\n<p><strong>Aufgabe 2:<\/strong> Entwerfe ein grobes Rollen-/Rechtekonzept\nmit drei Rollen.<\/p>\n<p><strong>Aufgabe 3:<\/strong> Formuliere Maßnahmen zu Datenminimierung,\nTestdaten, Löschregeln und Protokollierung.<\/p>\n<p><strong>Aufgabe 4:<\/strong> Beschreibe, wer für die rechtliche\nPrüfung eingebunden werden muss und warum du nicht einfach die vom\nKunden geforderte Speicherfrist übernimmst.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fallstudie-5-projektrisiken-und-wirtschaftlichkeit-30-minuten\">\n<h3>Fallstudie 5 – Projektrisiken und Wirtschaftlichkeit (30\nMinuten)<\/h3>\n<p><strong>Ausgangslage:<\/strong> Der Projektplan sieht 120 Personentage\nEntwicklung vor. Zwei Fachkräfte stehen jeweils zu 60 % ihrer\nArbeitszeit zur Verfügung. Ein externer Dienstleister verlangt 18.000\nEuro für eine Schnittstelle. Eine Standardsoftware kostet 12.000 Euro\nEinmalaufwand plus 900 Euro monatlich, deckt aber eine Muss-Anforderung\nnoch nicht ab. Die Projektleitung möchte eine Entscheidung innerhalb\neiner Woche.<\/p>\n<p><strong>Aufgabe 1:<\/strong> Unterscheide Aufwand und Kalenderdauer;\nwarum sind 120 Personentage nicht automatisch 60 Tage\nProjektlaufzeit?<\/p>\n<p><strong>Aufgabe 2:<\/strong> Welche zusätzlichen Angaben benötigst du\nfür eine seriöse TCO-Bewertung?<\/p>\n<p><strong>Aufgabe 3:<\/strong> Wie bewertest du die fehlende\nMuss-Anforderung im SaaS-Angebot?<\/p>\n<p><strong>Aufgabe 4:<\/strong> Nenne drei Risiken sowie Gegenmaßnahmen\nund erstelle eine knappe Entscheidungsvorlage.<\/p>\n<\/section>\n","questions":4},{"id":21,"title":"Musterlösungen und Antwortbausteine","lesson":"\n\n<section class=\"level3\" id=\"lösungen-a-grundlagen\">\n<h3>Lösungen A – Grundlagen<\/h3>\n<p><strong>A1:<\/strong> Das Betriebssystem organisiert Hardware und\nzentrale Systemdienste (Beispiel Windows); die Wartungssoftware ist eine\nkonkrete Anwendung, die darauf beziehungsweise über Netzwerkdienste\nAufgaben erledigt.<\/p>\n<p><strong>A2:<\/strong> Der Client löst einen Servernamen mittels DNS in\neine IP-Adresse auf und spricht den passenden Dienst über einen Port an;\ndarauf folgen Anfrage und Antwort gemäß verwendetem Protokoll.<\/p>\n<p><strong>A3:<\/strong> Autorisierung, weil die Identität bereits\ngeprüft wurde und nun das Recht für eine Funktion fehlt.<\/p>\n<p><strong>A4:<\/strong> 404 bedeutet, dass die angefragte Ressource\nunter dieser Adresse nicht gefunden wurde; 500 bezeichnet dagegen einen\ninternen Serverfehler. Die konkrete Fehlerursache muss trotzdem durch\nLogs und Diagnosen ermittelt werden.<\/p>\n<p><strong>A5:<\/strong> Das Frontend kennt nur den vereinbarten\nAPI-Vertrag, nicht die interne Datenbankstruktur. Nachteil: zusätzliche\nKomponenten verursachen Latenz, Betriebsaufwand und neue\nFehlerstellen.<\/p>\n<p><strong>A6:<\/strong> Der Algorithmus lautet „Eingabe prüfen, bei\nüberfälliger Wartung warnen“; eine konkrete Sprache wie C# oder Java\nimplementiert diesen Ablauf als ausführbare Anweisungen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lösungen-b-datenbanken\">\n<h3>Lösungen B – Datenbanken<\/h3>\n<p><strong>B1:<\/strong> MaschinenID ist Primärschlüssel von Maschine;\nAuftragID Primärschlüssel von Wartungsauftrag; MaschinenID dort\nFremdschlüssel. Eine Maschine kann viele Aufträge besitzen: 1:n.<\/p>\n<p><strong>B2:<\/strong> Mehrere fachliche Einzelwerte in einem Feld\nerschweren Suche, Prüfung und Pflege und widersprechen der üblichen\natomaren Modellierung in 1NF. Besser eine eigene Tabelle mit\nMitarbeiterID und Telefonnummer.<\/p>\n<p><strong>B3:<\/strong> MitarbeiterName hängt nur von MitarbeiterID,\nProjektName nur von ProjektID ab; beide gehören in eigene\nStammdatentabellen. Stunden hängt vom gesamten zusammengesetzten\nSchlüssel ab und kann in der Verknüpfungstabelle verbleiben.<\/p>\n<p><strong>B4:<\/strong> AbteilungID bestimmt AbteilungsName. Trenne\n<code>Mitarbeiter(MitarbeiterID, Name, AbteilungID)<\/code> und\n<code>Abteilung(AbteilungID, AbteilungsName)<\/code>. So vermeidest du\ndie beschriebene transitive Abhängigkeit.<\/p>\n<p><strong>B5:<\/strong> Referenzielle Integrität durch einen passend\ndefinierten Fremdschlüssel verhindert normalerweise nicht vorhandene\nMaschinenverweise.<\/p>\n<p><strong>B6:<\/strong> Atomicity: Alle zusammengehörigen Buchungen\nmüssen entweder vollständig wirksam werden oder aus der noch nicht\nabgeschlossenen Transaktion zurückgesetzt werden.<\/p>\n<p><strong>B7:<\/strong> Consistency schützt die definierte Regel; bei\nparallelen Buchungen sind zusätzlich geeignetes Isolationsniveau,\nSperren oder atomare Aktualisierungen erforderlich.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lösungen-c-anforderungen-und-architektur\">\n<h3>Lösungen C – Anforderungen und Architektur<\/h3>\n<p><strong>C1:<\/strong> „Für 100 gleichzeitig angemeldete Benutzer und\n10.000 Maschineneinträge wird die Suchergebnisliste in mindestens 95 %\nder Aufrufe innerhalb von zwei Sekunden angezeigt“, ergänzt um\nfestgelegte Testumgebung und Messmethode.<\/p>\n<p><strong>C2:<\/strong> „Als Schichtleiter möchte ich kritische\nMaschinenstörungen gefiltert sehen, damit ich schnell reagieren kann.“\nKriterien: (a) Liste zeigt nur Status „kritisch“; (b) Maschinen-ID,\nStandort und Meldungszeitpunkt sind sichtbar.<\/p>\n<p><strong>C3:<\/strong> Funktionale Passung, Integrationsfähigkeit,\nDatenschutz und Datenspeicherung, langfristige Gesamtkosten,\nÄnderbarkeit, Anbieterabhängigkeit, verfügbare interne\nFachkompetenz.<\/p>\n<p><strong>C4:<\/strong> Es braucht eine langfristig nachvollziehbare\nSpeicherung, klare Fremdschlüssel, gegebenenfalls eine Historisierung\nvon Status-/Standortwechseln, geregelte Aufbewahrung und\nZugriffsschutz.<\/p>\n<p><strong>C5:<\/strong> Vorteile: Dienste separat skalierbar und\nunabhängig lieferbar. Nachteile: höhere Betriebs-/Monitoring-Komplexität\nund schwierigere Transaktionen/Netzwerkfehler; eine modulare\nmonolithische Lösung kann für kleine Teams angemessener sein.<\/p>\n<p><strong>C6:<\/strong> Bestehende Clients können fehlschlagen (Breaking\nChange). Besser optionales neues Feld, Übergangsphase,\nVersionsstrategie, Contract Tests und gezielte Kommunikation.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lösungen-d-qualität-und-sicherheit\">\n<h3>Lösungen D – Qualität und Sicherheit<\/h3>\n<p><strong>D1:<\/strong> Unit prüft Berechnung der Fälligkeit,\nIntegration prüft Auftragserfassung über API und Datenbank, Systemtest\nprüft durchgehenden Arbeitsablauf.<\/p>\n<p><strong>D2:<\/strong> Zuerst Retest, danach Regressionstest. Die\nbeiden Verfahren haben unterschiedliche Prüfziele.<\/p>\n<p><strong>D3:<\/strong> Nein. Ungültige Eingaben sind vorhersehbar und\nkönnen Funktions-, Sicherheits- und Datenintegritätsprobleme auslösen.\nErfolgreicher Negativtest = erwartete Ablehnung.<\/p>\n<p><strong>D4:<\/strong> Eine defekte selten genutzte Zusatzfunktion kann\nhohen Schweregrad, aber vor dem nächsten Release niedrige Priorität\nhaben. Bewerte zusätzlich Datenverlust und Sicherheitsgefahren.<\/p>\n<p><strong>D5:<\/strong> Hashing erzeugt eine Einwegprüfrepräsentation,\nVerschlüsselung ist mit Schlüssel reversibel. HTTPS schützt die\nÜbertragung zwischen beteiligten Endpunkten über TLS, nicht automatisch\njede Anwendungsschicht.<\/p>\n<p><strong>D6:<\/strong> Broken Access Control beziehungsweise\nIDOR-ähnliches Risiko: serverseitig prüfen, ob der konkrete Benutzer\ngenau diesen Wartungsauftrag sehen darf; nicht allein der sichtbaren\nOberfläche vertrauen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lösungen-e-einführung-und-projekte\">\n<h3>Lösungen E – Einführung und Projekte<\/h3>\n<p><strong>E1:<\/strong> Nein. Build/Test und Produktiv-Deployment sind\ngetrennte Schritte, eine Freigabe kann zusätzlich erforderlich sein.<\/p>\n<p><strong>E2:<\/strong> Canary-Deployment: geringe anfängliche\nReichweite, frühzeitige Erkennung von Problemen vor breitem Rollout.<\/p>\n<p><strong>E3:<\/strong> Der Rückweg ist ungeklärt; vor Freigabe\nKompatibilität und vollständiges Migrations-/Rückfallkonzept testen.<\/p>\n<p><strong>E4:<\/strong> Im ungünstigen Fall liegen fast 24 Stunden seit\ndem letzten Backup. RPO 30 Minuten ist damit nicht abgedeckt; RTO\nbeschreibt getrennt, wie schnell der Dienst wieder laufen muss.<\/p>\n<p><strong>E5:<\/strong> Ohne Bewertung der offenen Risiken sagt eine\nProzentzahl nichts Belastbares über Freigabefähigkeit aus. Nötig sind\nklare Kriterien, Risikostatus, Verantwortliche und konkrete\nMaßnahmen.<\/p>\n<p><strong>E6:<\/strong> Review prüft das Produktergebnis mit\nStakeholdern; Retrospektive verbessert Teamarbeit und Prozesse. Die\nProduct-Backlog-Verantwortung liegt beim Product Owner.<\/p>\n<\/section>\n<section class=\"level3\" id=\"musterlösung-zu-fallstudie-1-mögliche-gliederung\">\n<h3>Musterlösung zu Fallstudie 1 – mögliche Gliederung<\/h3>\n<p><strong>Anforderungen:<\/strong> Funktional: Maschinen\nanlegen/anzeigen, Wartungsaufträge zuordnen, Rollen verwalten, Historie\nanzeigen. Nichtfunktional: P95-Antwortzeit unter definierten\nLastbedingungen, abgesicherte Rollenrechte, RPO höchstens 30 Minuten und\nRTO höchstens vier Stunden. Akzeptanz: Ungültige MaschinenID wird\nzurückgewiesen; jeder Auftrag zeigt korrekte Maschinendaten.\nMessvorgaben sollten Datensätze und Lastprofil festlegen.<\/p>\n<p><strong>Architektur:<\/strong> Web-/Tablet-Frontend → geschützte API →\nBackend mit Validierung/Berechtigung → relationale Datenbank.\nAuthentifizierung über geeigneten Identitätsdienst. Fremdschlüssel für\nkorrekte Zuordnung, rollenbasierte Rechte und Audit-Logging für\nnachvollziehbare Änderungen. Ein Berichtsdienst kann die\nKernverarbeitung entlasten, wenn notwendig.<\/p>\n<p><strong>Meilensteine:<\/strong> Anforderungen freigegeben,\nIntegrations-/Abnahmetests bestanden, Pilotbetrieb erfolgreich. Risiko:\nMigration der bisherigen Tabellenblätter erzeugt Dubletten; Maßnahme:\nBereinigung, Validierungsregeln, Probelauf mit Stichproben und Abnahme\ndurch Fachseite.<\/p>\n<p><strong>Betrieb:<\/strong> Sicherung oder Replikationsstrategie auf\nRPO 30 Minuten auslegen; Wiederherstellungsprozess so testen, dass RTO\nvier Stunden erreichbar ist. Eine schriftliche Testprotokollierung hält\nStartzeit, Restore-Ende und verlorene Datenänderungen fest.<\/p>\n<p><strong>Make-or-Buy:<\/strong> SaaS mit schneller Einführung und\nHerstellerbetrieb, aber Abhängigkeit, Datenschutz-/Vertragsfragen und\nlaufende Kosten; Eigenbetrieb mit stärkerer Kontrolle, aber internem\nBetriebs- und Wartungsaufwand. Empfehlung erst nach nachvollziehbarer\nNutzwert- und TCO-Bewertung, nicht allein aus Vorliebe.<\/p>\n<\/section>\n<section class=\"level3\" id=\"musterlösung-zu-fallstudie-2-mögliche-gliederung\">\n<h3>Musterlösung zu Fallstudie 2 – mögliche Gliederung<\/h3>\n<p><strong>Entscheidung:<\/strong> Vorläufig No-Go. Zwei fehlgeschlagene\nIntegrationstests und ungeprüfter Restore sind wesentliche ungeklärte\nRisiken. Der Termindruck hebt Sicherheits- und Integritätsanforderungen\nnicht auf.<\/p>\n<p><strong>Ablauf:<\/strong> (1) Schema- und Client-Abhängigkeiten\ninventarisieren, (2) vollständige Sicherung und Wiederherstellung\nproben, (3) rückwärtskompatiblen Schemaentwurf festlegen, (4) Migration\nmit repräsentativen Daten testen, (5) alte/neue Clients und API-Contract\nTests prüfen, (6) Abnahmetests und Datenvalidierung, (7)\nFreigabegremium, (8) gestufter Rollout und Monitoring, (9)\ndokumentierter Rückfallplan.<\/p>\n<p><strong>Expand/Contract:<\/strong> Altes Statusfeld zunächst bestehen\nlassen, neue Tabelle beziehungsweise Schnittstelle ergänzen,\nÜbergangslogik und Abgleich einrichten, Clients umstellen, alte Struktur\nerst nach stabiler Übergangsphase entfernen. Dabei Doppelpflege und\nSynchronisation ausdrücklich prüfen.<\/p>\n<p><strong>Prüfung:<\/strong> Retest für konkret fehlerhafte Clients,\nRegression der bisherigen Kernprozesse, Integrations-/Migrationstests\nund Abnahme der kritischen Geschäftsabläufe.<\/p>\n<p><strong>Statusmeldung:<\/strong> „Release 2.0 heute nicht freigegeben.\nGründe: zwei inkompatible Schnittstellen und ungeprüfte\nWiederherstellung. Maßnahmen: API-Tests und Restore-Probe bis [Termin],\nfachliche Abnahme anschließend. Erneute Go-/No-Go-Entscheidung durch\n[Rolle].“<\/p>\n<\/section>\n<section class=\"level3\" id=\"musterlösung-zu-fallstudie-3-mögliche-gliederung\">\n<h3>Musterlösung zu Fallstudie 3 – mögliche Gliederung<\/h3>\n<p><strong>Diagnose:<\/strong> Symptome sind langsame Suche, doppelte\nAufträge und Timeouts. Ursachenhypothesen sind ineffiziente\nAbfragen/Indizes, blockierte Verbindungen, unklare Retry-Regeln oder\nfehlende Idempotenz. Es fehlen Zeitpunkte, betroffene Versionen,\nLastprofil, Datenbankmetriken und Reproduktionsschritte.<\/p>\n<p><strong>Sofortmaßnahmen:<\/strong> Störung kommunizieren, unnötige\nSchreibwiederholungen verhindern, wenn sicher möglich Rollback prüfen,\nMonitoring verstärken, kritische Funktionen stabilisieren. Danach\nUrsachenanalyse anhand Traces, Abfragen und Pool-Auslastung.\nDatenbereinigung muss nachvollziehbar und mit Fachseite abgestimmt\nerfolgen.<\/p>\n<p><strong>Technik:<\/strong> Ein Idempotency-Key kann doppelte\nAuftragsanlagen bei wiederholten Requests verhindern. Timeouts begrenzen\nblockierte Aufrufe, unkontrollierte Retries können Last erhöhen. Indizes\nkönnen Suche beschleunigen; Connection-Pooling begrenzt und verwaltet\nDatenbankverbindungen.<\/p>\n<p><strong>Kriterien:<\/strong> P95-Suchzeit unter zwei Sekunden bei\ndefiniertem Lastprofil, keine doppelten Aufträge bei wiederholtem\nSpeichern desselben Vorgangs, stabile Fehlerrate unter festgelegtem\nGrenzwert über einen definierten Zeitraum.<\/p>\n<p><strong>Statusmeldung:<\/strong> „Derzeit kommt es zu langsamen Suchen\nund vereinzelt doppelten Aufträgen. Bitte Speichern nicht mehrfach\nauslösen; wir prüfen bereits angelegte Aufträge gezielt. Das Team\narbeitet an der Stabilisierung und informiert über die nächsten\nSchritte.“<\/p>\n<\/section>\n<section class=\"level3\" id=\"musterlösung-zu-fallstudie-4-mögliche-gliederung\">\n<h3>Musterlösung zu Fallstudie 4 – mögliche Gliederung<\/h3>\n<p><strong>Risiken:<\/strong> unzureichende Zugriffsbeschränkung, unklare\nRechtsgrundlage für personenbezogene Leistungsauswertung, unbegründete\nlange Speicherfrist, ungeschützte Echtdaten in Test, fehlende\nTransparenz und mögliche Zweckänderung.<\/p>\n<p><strong>Rollen:<\/strong> Mitarbeiter sehen eigene Aufträge und nötige\nMaschinendaten; Schichtleitung sieht für ihre Aufgaben erforderliche\nAggregationen; Administrator verwaltet Berechtigungen, sieht aber nicht\nautomatisch sämtliche personenbezogenen Auswertungen. Rechte\nserverseitig prüfen, Zugriffe angemessen protokollieren.<\/p>\n<p><strong>Maßnahmen:<\/strong> Datenminimierung, erforderliche und\nbegründete Speicherfristen, synthetische/anonymisierte Testdaten,\nrestriktive Berechtigungen, verschlüsselte Übertragung, dokumentiertes\nLösch- und Berechtigungskonzept.<\/p>\n<p><strong>Einbindung:<\/strong> Verantwortliche Stelle,\nDatenschutzbeauftragte, IT-Sicherheit und gegebenenfalls weitere\nbetriebliche Interessenvertretung. Die Kundenvorgabe ersetzt keine\nPrüfung von Zweck, Rechtsgrundlage und Erforderlichkeit.<\/p>\n<\/section>\n<section class=\"level3\" id=\"musterlösung-zu-fallstudie-5-mögliche-gliederung\">\n<h3>Musterlösung zu Fallstudie 5 – mögliche Gliederung<\/h3>\n<p><strong>Aufwand/Dauer:<\/strong> Personentage sind Arbeitsmenge; bei\n60 % Kapazität stehen zwei Mitarbeitende gemeinsam nur 1,2\nVollzeitäquivalente bereit, nicht 2,0. Dazu kommen Urlaube,\nParallelaufgaben, Abstimmung und kritische Abhängigkeiten.<\/p>\n<p><strong>TCO-Informationen:<\/strong> Betrachtungszeitraum, interne\nStundensätze, Hosting, Lizenzen, Schulung, Wartung, Migration, Updates,\nSchnittstelle, Datenschutz-/Sicherheitsaufwand, Exit-Kosten und\nVertragsbedingungen. Bei 900 Euro monatlich fallen in 36 Monaten allein\n32.400 Euro laufende SaaS-Gebühren an; zusammen mit 12.000 Euro\nEinmalaufwand wären das 44.400 Euro ohne weitere Kosten.<\/p>\n<p><strong>Muss-Anforderung:<\/strong> Fehlende Must-Funktion ist ein\nFreigabehindernis, solange kein akzeptierter, dokumentierter Workaround\noder vertraglich verbindlicher Lieferplan besteht. Eine vermeintlich\nbillige Lösung ohne Kernfunktion kann wirtschaftlich schlecht sein.<\/p>\n<p><strong>Risiken:<\/strong> knappe Personalressourcen,\nHerstellerabhängigkeit, unvollständige Integration. Gegenmaßnahmen:\nPuffer und Ressourcenklärung, Vertragsprüfung mit Exit-Strategie, frühe\nSchnittstellen-Prototypen und technische Abnahmetests.<\/p>\n<\/section>\n","questions":4},{"id":22,"title":"Arbeitsvorlagen zum Ausfüllen","lesson":"\n\n<section class=\"level3\" id=\"vorlage-anforderung\">\n<h3>22.1 Vorlage: Anforderung<\/h3>\n<p><strong>Kennung:<\/strong> ____________\n<strong>Quelle/Stakeholder:<\/strong> _____________________<\/p>\n<p><strong>Beschreibung (Was?):<\/strong>\n__________________________________________________<\/p>\n<p><strong>Fachlicher Nutzen (Warum?):<\/strong>\n____________________________________________<\/p>\n<p><strong>Art:<\/strong> funktional / nichtfunktional /\nRandbedingung<\/p>\n<p><strong>Priorität:<\/strong> Must / Should / Could / Won’t<\/p>\n<p><strong>Akzeptanzkriterien:<\/strong>\n_____________________________________________________<\/p>\n<p><strong>Abhängigkeiten/Risiken:<\/strong>\n_________________________________________________<\/p>\n<p><strong>Freigabe/Datum:<\/strong>\n_________________________________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-testfall\">\n<h3>22.2 Vorlage: Testfall<\/h3>\n<p><strong>Test-ID und Name:<\/strong>\n_______________________________________________________<\/p>\n<p><strong>Anforderungsbezug:<\/strong>\n_____________________________________________________<\/p>\n<p><strong>Version und Umgebung:<\/strong>\n__________________________________________________<\/p>\n<p><strong>Voraussetzungen:<\/strong>\n________________________________________________________<\/p>\n<p><strong>Eingaben und Schritte:<\/strong>\n__________________________________________________<\/p>\n<p><strong>Soll-Ergebnis:<\/strong>\n__________________________________________________________<\/p>\n<p><strong>Ist-Ergebnis:<\/strong>\n___________________________________________________________<\/p>\n<p><strong>Bestanden / Nicht bestanden / Blockiert:<\/strong>\n_________________________________<\/p>\n<p><strong>Belege, Ticket und Tester:<\/strong>\n______________________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-fehlerbericht\">\n<h3>22.3 Vorlage: Fehlerbericht<\/h3>\n<p><strong>Ticket-ID:<\/strong> __________ <strong>Titel:<\/strong>\n________________________________________<\/p>\n<p><strong>Schweregrad:<\/strong> _________ <strong>Priorität:<\/strong>\n_________ <strong>Status:<\/strong> _______________<\/p>\n<p><strong>Version und Umgebung:<\/strong>\n__________________________________________________<\/p>\n<p><strong>Reproduktionsschritte:<\/strong>\n__________________________________________________<\/p>\n<p><strong>Soll:<\/strong>\n__________________________________________________________________<\/p>\n<p><strong>Ist:<\/strong>\n___________________________________________________________________<\/p>\n<p><strong>Auswirkung auf Benutzer und Prozess:<\/strong>\n___________________________________<\/p>\n<p><strong>Screenshot/Log (ohne Geheimnisse):<\/strong>\n______________________________________<\/p>\n<p><strong>Verantwortlich und nächster Schritt:<\/strong>\n___________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-risikoregister\">\n<h3>22.4 Vorlage: Risikoregister<\/h3>\n<p><strong>Risiko:<\/strong>\n_________________________________________________________________<\/p>\n<p><strong>Ursache und mögliches Ereignis:<\/strong>\n_________________________________________<\/p>\n<p><strong>Wahrscheinlichkeit 1–3:<\/strong> _____ <strong>Schadensausmaß\n1–3:<\/strong> _____ <strong>Wert:<\/strong> _____<\/p>\n<p><strong>Maßnahme:<\/strong> Vermeidung / Minderung / Übertragung /\nAkzeptanz<\/p>\n<p><strong>Verantwortung und Termin:<\/strong>\n_______________________________________________<\/p>\n<p><strong>Restrisiko nach Maßnahme:<\/strong>\n_______________________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-go-no-go-checkliste\">\n<h3>22.5 Vorlage: Go-/No-Go-Checkliste<\/h3>\n<p>[ ] Kritische Funktionen und Abnahmekriterien geprüft<br/>\n[ ] Offene schwerwiegende Fehler bewertet<br/>\n[ ] Datenbankmigration getestet, Datenvalidierung dokumentiert<br/>\n[ ] Backup und Wiederherstellung nachweislich getestet<br/>\n[ ] Rollback beziehungsweise Rückfalloption geprüft<br/>\n[ ] Berechtigungen und sicherheitsrelevante Aspekte geprüft<br/>\n[ ] Monitoring, Alarmierung und Support vorbereitet<br/>\n[ ] Anwender informiert und bei Bedarf geschult<br/>\n[ ] Risiken und Freigabeentscheidung dokumentiert<\/p>\n<p><strong>Empfehlung:<\/strong> GO / NO-GO<br/>\n<strong>Begründung:<\/strong>\n______________________________________________________________<\/p>\n<p><strong>Entscheidende Rolle/Datum:<\/strong>\n______________________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-projektstatusbericht\">\n<h3>22.6 Vorlage: Projektstatusbericht<\/h3>\n<p><strong>Projekt:<\/strong> ____________ <strong>Stand:<\/strong>\n______________ <strong>Berichtszeitraum:<\/strong> ________<\/p>\n<p><strong>Ziel und Meilenstein:<\/strong>\n___________________________________________________<\/p>\n<p><strong>Fortschritt und Nachweise:<\/strong>\n______________________________________________<\/p>\n<p><strong>Abweichung zu Plan (Termin/Budget/Qualität):<\/strong>\n_____________________________<\/p>\n<p><strong>Top-3-Risiken mit Eigentümer:<\/strong>\n___________________________________________<\/p>\n<p><strong>Nächste Schritte mit Terminen:<\/strong>\n__________________________________________<\/p>\n<p><strong>Entscheidungsbedarf der Leitung:<\/strong>\n________________________________________<\/p>\n<\/section>\n<section class=\"level3\" id=\"vorlage-architecture-decision-record-adr\">\n<h3>22.7 Vorlage: Architecture Decision Record (ADR)<\/h3>\n<p><strong>Entscheidungstitel:<\/strong>\n_____________________________________________________<\/p>\n<p><strong>Ausgangssituation und Qualitätsziele:<\/strong>\n___________________________________<\/p>\n<p><strong>Optionen:<\/strong>\n_______________________________________________________________<\/p>\n<p><strong>Bewertung nach Kosten, Risiken und Nutzen:<\/strong>\n______________________________<\/p>\n<p><strong>Entscheidung und Verantwortliche:<\/strong>\n______________________________________<\/p>\n<p><strong>Nachteile und langfristige Folgen:<\/strong>\n______________________________________<\/p>\n<p><strong>Datum/Review-Anlass:<\/strong>\n____________________________________________________<\/p>\n<\/section>\n","questions":4},{"id":23,"title":"Prüfungsvorbereitung: Schriftlich, Präsentation, Fachgespräch","lesson":"\n\n<section class=\"level3\" id=\"situationsaufgaben-strukturiert-bearbeiten\">\n<h3>23.1 Situationsaufgaben strukturiert bearbeiten<\/h3>\n<p>Lies den betrieblichen Fall zuerst vollständig, unterstreiche Ziele,\nEinschränkungen, Zahlen, Risiken und beteiligte Rollen. Markiere die\nOperatoren: „nennen“ verlangt knappe Aspekte, „erläutern“ Zusammenhang\nund Beispiele, „analysieren“ eine systematische Zerlegung, „bewerten“\nKriterien und Urteil, „begründen“ Argumente. Gliedere deine Antwort,\nbevor du losschreibst: Ausgangslage → Anforderungen → Optionen →\nEntscheidung → Maßnahmen → Prüf-/Kontrollkriterien.<\/p>\n<p>Mache Annahmen ausdrücklich sichtbar, zum Beispiel „Unter der\nAnnahme, dass Wartungsaufträge rechtlich aufbewahrt werden müssen,\nbevorzuge ich ein logisches Stilllegen der Maschine“. Vermeide\nunbedingte Aussagen ohne Belege. Nutze Fachbegriffe passend, aber\nerkläre sie, statt eine Kette unverbundener Schlagwörter zu\nschreiben.<\/p>\n<\/section>\n<section class=\"level3\" id=\"mit-zahlen-umgehen\">\n<h3>23.2 Mit Zahlen umgehen<\/h3>\n<p>Kennzahlen sind nur mit Einheiten sinnvoll. Prüfe in Aufgaben, ob\nStunden oder Personentage, Euro pro Monat oder Jahr, Prozent oder\nProzentpunkte gemeint sind. Für eine Risiko-Matrix reicht häufig das\nvereinbarte Punktesystem; bei kaufmännischen Berechnungen müssen\nAnnahmen und Rundung angegeben werden. Plausibilitätskontrolle: Eine\nBackup-Frequenz von 24 Stunden kann RPO 30 Minuten normalerweise nicht\nerfüllen, egal wie schnell der Restore ist.<\/p>\n<\/section>\n<section class=\"level3\" id=\"präsentation-vorbereiten\">\n<h3>23.3 Präsentation vorbereiten<\/h3>\n<p>Wähle ein Thema, das einen echten beruflichen Entscheidungsprozess\nzeigt und alle offiziellen Qualifikationsschwerpunkte sinnvoll\nberücksichtigt. Mögliche übergreifende Fallthemen: „Konzeption und\nsichere Einführung einer Wartungssoftware“, „Migration einer bestehenden\nAnwendung auf eine neue Datenbankarchitektur“ oder „Verbesserung der\nQualität und Rollout-Steuerung einer Auftragsplattform“. Kläre das Thema\nmit der zuständigen Stelle nach ihren Anforderungen; nach § 7 SEFPrV\nsind Thema und Inhalt genehmigungspflichtig. [Q1]<\/p>\n<p>Ein 15-Minuten-Aufbau kann lauten: 1 min Ausgangslage, 2 min\nAnforderungen/Ziele, 3 min Lösungsoptionen/Architektur, 3 min Umsetzung\nund Qualitätssicherung, 2 min Sicherheits-/Betriebsrisiken, 2 min\nEinführung/Evaluation und 2 min Schlussfolgerung. Das ist eine\nÜbungsstruktur, keine vorgeschriebene Gliederung. Verwende lesbare\nDiagramme und klare Entscheidungskriterien statt textlastiger\nFolien.<\/p>\n<\/section>\n<section class=\"level3\" id=\"fachgespräch-trainieren\">\n<h3>23.4 Fachgespräch trainieren<\/h3>\n<p>Übe Fragen nach dem „Warum“: Warum diese Datenbank? Was wäre die\nAlternative? Wie gehst du bei gescheitertem Restore vor? Welche\nNachweise reichen für eine Freigabe? Was ändert sich bei 500 statt 50\nNutzern? Wie reagierst du auf einen Datenschutzvorbehalt? Antworte\nzunächst auf den Kern, erläutere die Begründung und verweise auf einen\nüberprüfbaren Nachweis. Wenn Informationen fehlen, benenne sie und\nerkläre, wie du sie beschaffen würdest.<\/p>\n<\/section>\n<section class=\"level3\" id=\"lernwiederholung-mit-eigenkontrolle\">\n<h3>23.5 Lernwiederholung mit Eigenkontrolle<\/h3>\n<p>Teile deine Themen in vier Gruppen: (A) sicher erklären, (B) mit\nHilfestellung erklärbar, (C) oft verwechselt, (D) noch unbekannt.\nWiederhole bevorzugt C und D, aber teste A regelmäßig in gemischten\nFragen. Schreibe pro schwierigen Begriff eine eigene Ein-Satz-Definition\nund ein eigenes Beispiel. Verwende Fachtexte aus dem Heft als\nNachschlagewerk, aber beantworte Fallstudien zunächst ohne\nNachschauen.<\/p>\n<\/section>\n<section class=\"level3\" id=\"beispielhafter-acht-wochen-lernplan\">\n<h3>23.6 Beispielhafter Acht-Wochen-Lernplan<\/h3>\n<p><strong>Woche 1:<\/strong> IT-Basis, Client-Server, HTTP,\nSchnittstellen; eigene Erklärungen schreiben.<br/>\n<strong>Woche 2:<\/strong> Anforderungen, Lasten-/Pflichtenheft, User\nStories, Priorisierung; zwei testbare Spezifikationen erstellen.<br/>\n<strong>Woche 3:<\/strong> Architektur, UML, Datenmodelle und\nNormalisierung; Datenmodell zeichnen.<br/>\n<strong>Woche 4:<\/strong> Datenbank-ACID, Git, Build und CI/CD;\nMigrationsablauf bewerten.<br/>\n<strong>Woche 5:<\/strong> Testarten, Testfälle, Risikopriorisierung, Bug\nReports; vier eigene Testfälle schreiben.<br/>\n<strong>Woche 6:<\/strong> Datenschutz, Security, Backup, RTO/RPO,\nRollout und Abnahme; Go-/No-Go-Vorlage ausfüllen.<br/>\n<strong>Woche 7:<\/strong> Projekte, Scrum, Aufwand und Evaluation;\nFallstudien 1 bis 3 bearbeiten.<br/>\n<strong>Woche 8:<\/strong> Fallstudien 4 und 5, Musterantworten,\n15-Minuten-Präsentation und Fachgespräch üben.<\/p>\n<p>Diesen Plan kannst du je nach Schulung und Vorwissen verlängern. Er\nersetzt nicht den erforderlichen Gesamtlern- und Praxisumfang, sondern\nstrukturiert die Wiederholung.<\/p>\n<\/section>\n","questions":4},{"id":24,"title":"Fachbegriffe von A bis Z","lesson":"\n\n<p><strong>Abnahme:<\/strong> Formale oder fachliche Feststellung, ob\nvereinbarte Leistungs- beziehungsweise Qualitätskriterien erfüllt\nsind.<\/p>\n<p><strong>ACID:<\/strong> Vier Transaktionseigenschaften: Atomicity,\nConsistency, Isolation, Durability.<\/p>\n<p><strong>ADR (Architecture Decision Record):<\/strong> Kurzer Nachweis\neiner Architekturentscheidung mit Kontext, Optionen und Folgen.<\/p>\n<p><strong>Agil:<\/strong> Vorgehensweise mit kurzen Feedbackzyklen,\nAnpassbarkeit und kontinuierlichem Lernen.<\/p>\n<p><strong>Akzeptanzkriterium:<\/strong> Prüffähige Bedingung für die\nAnnahme einer einzelnen Anforderung.<\/p>\n<p><strong>Algorithmus:<\/strong> Eindeutige, endliche Beschreibung eines\nLösungsablaufs.<\/p>\n<p><strong>API:<\/strong> Festgelegte Schnittstelle, über die\nSoftwarekomponenten miteinander interagieren.<\/p>\n<p><strong>Artefakt:<\/strong> Entstandenes Arbeitsergebnis, z. B.\nInstallationspaket, Container-Image oder Dokumentation.<\/p>\n<p><strong>Authentifizierung:<\/strong> Prüfung der behaupteten\nIdentität.<\/p>\n<p><strong>Autorisierung:<\/strong> Prüfung von Berechtigungen auf\nAktionen und Daten.<\/p>\n<p><strong>Backup:<\/strong> Gesicherte Kopie beziehungsweise\nSicherungsstand zur späteren Wiederherstellung.<\/p>\n<p><strong>Backend:<\/strong> Serverseitige Dienste, Geschäftslogik und\nDatenzugriffsverarbeitung einer Anwendung.<\/p>\n<p><strong>Branch:<\/strong> Separater Entwicklungszweig in der\nVersionsverwaltung.<\/p>\n<p><strong>Build:<\/strong> Erstellung eines auslieferbaren\nSoftwareartefakts aus Projektdateien.<\/p>\n<p><strong>Bug:<\/strong> Beobachtete Fehlfunktion beziehungsweise\nAbweichung vom erwarteten Verhalten.<\/p>\n<p><strong>Canary-Deployment:<\/strong> Stufenweise Bereitstellung zuerst\nfür wenige Benutzer/Instanzen.<\/p>\n<p><strong>CI:<\/strong> Regelmäßiges Integrieren und automatisiertes\nPrüfen von Änderungen.<\/p>\n<p><strong>CD:<\/strong> Continuous Delivery oder Continuous Deployment,\nje nach Freigabeautomatisierung.<\/p>\n<p><strong>Client:<\/strong> Software/Gerät, das einen Dienst anfordert\noder nutzt.<\/p>\n<p><strong>Cloud:<\/strong> Bereitstellung von IT-Ressourcen als Dienst\nüber ein Netzwerk.<\/p>\n<p><strong>Commit:<\/strong> Gespeicherter Änderungsstand in einem\nVersionsverwaltungssystem.<\/p>\n<p><strong>Consistency:<\/strong> ACID-Eigenschaft, dass definierte\nIntegritätsregeln erhalten bleiben.<\/p>\n<p><strong>Container:<\/strong> Paketierte Anwendung mit Laufzeitumgebung\nauf gemeinsam genutztem Host-Kernel.<\/p>\n<p><strong>CRUD:<\/strong> Create, Read, Update und Delete als\ngrundlegende Datenoperationen.<\/p>\n<p><strong>Datenintegrität:<\/strong> Korrektheit, Vollständigkeit und\nUnversehrtheit von Daten nach definierten Regeln.<\/p>\n<p><strong>Datenmodell:<\/strong> Strukturierte Beschreibung von\nEntitäten, Attributen und Beziehungen.<\/p>\n<p><strong>Datenmigration:<\/strong> Veränderung oder Überführung von\nDaten und/oder Datenbankstruktur.<\/p>\n<p><strong>Datenschutz:<\/strong> Schutz natürlicher Personen bei der\nVerarbeitung personenbezogener Daten.<\/p>\n<p><strong>Datenbank:<\/strong> Organisierter Bestand strukturierter\nDaten mit Verwaltungssystem.<\/p>\n<p><strong>Deployment:<\/strong> Technisches Bereitstellen einer\nAnwendung in einer Zielumgebung.<\/p>\n<p><strong>DevOps:<\/strong> Zusammenarbeit und Praktiken, die\nEntwicklung und IT-Betrieb über den Lebenszyklus verbinden.<\/p>\n<p><strong>DNS:<\/strong> System zur Namensauflösung, z. B. Domainname zu\nIP-Adresse.<\/p>\n<p><strong>DoD:<\/strong> Definition of Done, gemeinsame\nQualitätsbeschreibung für ein fertiges Increment.<\/p>\n<p><strong>Durability:<\/strong> ACID-Eigenschaft dauerhafter bestätigter\nTransaktionen im unterstützten Fehlermodell.<\/p>\n<p><strong>Entkopplung:<\/strong> Verringerung unnötiger Abhängigkeiten\nzwischen Komponenten.<\/p>\n<p><strong>ER-Diagramm:<\/strong> Grafische Darstellung von Entitäten und\nBeziehungen im Datenmodell.<\/p>\n<p><strong>Evaluation:<\/strong> Systematische Bewertung von Ergebnis\noder Prozess anhand festgelegter Kriterien.<\/p>\n<p><strong>Eventual Consistency:<\/strong> Daten in verteilten\nKomponenten gleichen sich mit Verzögerung an.<\/p>\n<p><strong>Feature Flag:<\/strong> Schalter, mit dem Funktionen\nunabhängig vom Deployment aktiviert werden können.<\/p>\n<p><strong>Frontend:<\/strong> Benutzernahe Darstellung und Interaktion\neiner Anwendung.<\/p>\n<p><strong>Fremdschlüssel:<\/strong> Spalte oder Spaltenkombination, die\nauf einen referenzierten Schlüssel verweist.<\/p>\n<p><strong>Git:<\/strong> Verteiltes Versionsverwaltungssystem.<\/p>\n<p><strong>Go-/No-Go:<\/strong> Entscheidung, ob eine geplante\nProduktivsetzung unter den vorliegenden Bedingungen verantwortbar\nist.<\/p>\n<p><strong>HTTP:<\/strong> Protokoll für die Kommunikation zwischen\nHTTP-Clients und HTTP-Servern.<\/p>\n<p><strong>HTTPS:<\/strong> HTTP über eine durch TLS geschützte\nVerbindung.<\/p>\n<p><strong>Idempotenz:<\/strong> Eigenschaft einer Operation, dass\nWiederholung dieselbe beabsichtigte Wirkung wie eine einzelne Ausführung\nhat.<\/p>\n<p><strong>Incident:<\/strong> Aktuelle Störung oder Beeinträchtigung\neines IT-Dienstes.<\/p>\n<p><strong>Index:<\/strong> Datenbankstruktur, die bestimmte Abfragen\nbeschleunigen kann.<\/p>\n<p><strong>Integrationstest:<\/strong> Test des Zusammenspiels mehrerer\nKomponenten.<\/p>\n<p><strong>Isolation:<\/strong> ACID-Eigenschaft zur geregelten\nKonkurrenz gleichzeitiger Transaktionen.<\/p>\n<p><strong>JSON:<\/strong> Textformat zum Austausch strukturierter\nDaten.<\/p>\n<p><strong>KPI:<\/strong> Zentrale Kennzahl zur Messung eines\nfestgelegten Ziels.<\/p>\n<p><strong>Lastenheft:<\/strong> Übliche Beschreibung von Anforderungen\naus Auftraggebersicht.<\/p>\n<p><strong>Least Privilege:<\/strong> Vergabe nur unbedingt\nerforderlicher Zugriffsrechte.<\/p>\n<p><strong>Log:<\/strong> Zeitliche Aufzeichnung von Ereignissen eines\nSystems.<\/p>\n<p><strong>Merge:<\/strong> Zusammenführen verschiedener\nEntwicklungsstände.<\/p>\n<p><strong>Microservice:<\/strong> Eigenständig bereitstellbarer Dienst\neiner meist verteilten Architektur.<\/p>\n<p><strong>MoSCoW:<\/strong> Priorisierung nach Must, Should, Could und\nWon’t.<\/p>\n<p><strong>Monitoring:<\/strong> Kontinuierliche Beobachtung definierter\ntechnischer oder fachlicher Zustände.<\/p>\n<p><strong>Nichtfunktionale Anforderung:<\/strong> Vorgabe zur Qualität\noder Randbedingung statt zu einer einzelnen Funktion.<\/p>\n<p><strong>Normalisierung:<\/strong> Strukturierung relationaler Daten\ngegen problematische Abhängigkeiten/Redundanzen.<\/p>\n<p><strong>OAuth/OIDC:<\/strong> Standardfamilie für delegierte\nAutorisierung beziehungsweise darauf aufbauende Identitätsinformationen;\nBegriffe sind nicht austauschbar.<\/p>\n<p><strong>Patch:<\/strong> Zielgerichtete Fehler-/Sicherheitskorrektur\neiner Software.<\/p>\n<p><strong>Pflichtenheft:<\/strong> Übliche Konkretisierung der Umsetzung\naus Auftragnehmersicht.<\/p>\n<p><strong>Primärschlüssel:<\/strong> Eindeutige, nichtleere\nIdentifikation eines Datensatzes.<\/p>\n<p><strong>Product Backlog:<\/strong> Geordnete Liste der zur\nProduktverbesserung benötigten Arbeiten in Scrum.<\/p>\n<p><strong>Product Owner:<\/strong> Verantwortlichkeit für Produktwert\nund wirksames Product-Backlog-Management.<\/p>\n<p><strong>Prozess:<\/strong> Laufende Instanz eines Programms mit\neigenem Ausführungskontext.<\/p>\n<p><strong>Regressionstest:<\/strong> Prüfung, ob Änderungen zuvor\nfunktionierende Bereiche beeinträchtigen.<\/p>\n<p><strong>Release:<\/strong> Für Nutzer vorgesehene beziehungsweise\nfreigegebene Softwareversion.<\/p>\n<p><strong>Repository:<\/strong> Versionsverwalteter Projektbestand samt\nHistorie.<\/p>\n<p><strong>Request/Response:<\/strong> Anfrage eines Clients und\ndazugehörige Antwort eines Servers.<\/p>\n<p><strong>REST:<\/strong> Architekturstil zur ressourcenorientierten\nGestaltung verteilter Schnittstellen.<\/p>\n<p><strong>Retest:<\/strong> Erneutes Prüfen eines zuvor fehlerhaften\nFalls nach einer Korrektur.<\/p>\n<p><strong>Risiko:<\/strong> Bewertete Möglichkeit einer negativen\nAuswirkung eines unsicheren Ereignisses.<\/p>\n<p><strong>Rollback:<\/strong> Rückkehr zu einem früheren Zustand\nbeziehungsweise Release, wenn dies sicher möglich ist.<\/p>\n<p><strong>RPO:<\/strong> Maximal tolerierbarer Datenverlust gemessen als\nZeitspanne zum Wiederherstellungspunkt.<\/p>\n<p><strong>RTO:<\/strong> Vorgabe zur angestrebten maximalen Dauer der\nWiederherstellung nach Ausfall.<\/p>\n<p><strong>Scrum Master:<\/strong> Unterstützt das Scrum Team und die\nOrganisation bei Scrum-Verständnis und Wirksamkeit.<\/p>\n<p><strong>Severity:<\/strong> Technischer/fachlicher Schweregrad eines\nFehlers.<\/p>\n<p><strong>SLA:<\/strong> Vereinbarung definierter Serviceleistungen und\nLeistungsziele.<\/p>\n<p><strong>Sprint:<\/strong> Zeitbegrenzter Scrum-Zyklus von höchstens\neinem Monat.<\/p>\n<p><strong>Sprint Backlog:<\/strong> Sprintziel, ausgewählte\nProduct-Backlog-Einträge und Umsetzungsplan der Developers.<\/p>\n<p><strong>SQL:<\/strong> Sprache für Definition, Abfrage und Veränderung\nrelationaler Daten.<\/p>\n<p><strong>Stakeholder:<\/strong> Person oder Gruppe mit Interesse am\noder Einfluss auf ein Vorhaben.<\/p>\n<p><strong>Systemtest:<\/strong> Prüfung eines vollständigen integrierten\nSystems gegen Anforderungen.<\/p>\n<p><strong>TCO:<\/strong> Gesamtkosten eines Systems über einen\ndefinierten Lebenszyklus.<\/p>\n<p><strong>Testfall:<\/strong> Dokumentierter Prüfvorgang mit Eingaben,\nBedingungen und erwartetem Ergebnis.<\/p>\n<p><strong>Thread:<\/strong> Ausführungsstrang innerhalb eines\nProzesses.<\/p>\n<p><strong>TLS:<\/strong> Protokollfamilie zur Absicherung von\nNetzwerkverbindungen.<\/p>\n<p><strong>UML:<\/strong> Standardisierte Notationen zur Modellierung von\nSoftwaresystemen.<\/p>\n<p><strong>Unit-Test:<\/strong> Test einer einzelnen\nSoftwareeinheit/Komponente.<\/p>\n<p><strong>User Story:<\/strong> Kurze anwendungsorientierte Beschreibung\neines Bedarfs aus Nutzerperspektive.<\/p>\n<p><strong>Validierung:<\/strong> Prüfung, ob das entwickelte Ergebnis\nden tatsächlichen Nutzerbedarf erfüllt.<\/p>\n<p><strong>Verifikation:<\/strong> Prüfung, ob eine Lösung den\nspezifizierten Anforderungen entspricht.<\/p>\n<p><strong>Wartbarkeit:<\/strong> Eigenschaft, Software mit vertretbarem\nAufwand zu verstehen und zu verändern.<\/p>\n","questions":4},{"id":25,"title":"Offizielle Orientierung und Quellen","lesson":"\n\n<p>Dieses Lernheft ist eine eigenständig verfasste, didaktisch\nverdichtete Darstellung. Es orientiert sich an der\n<strong>Softwareentwicklung-Fortbildungsprüfungsverordnung vom 24.\nSeptember 2024 (SEFPrV)<\/strong>, gültig seit 1. November 2024. Die\nVerordnung ist maßgeblich, wenn sich Angaben zu Prüfungsorganisation und\nKompetenzinhalten unterscheiden. Stand der redaktionellen Prüfung: 9.\nOktober 2026. Manche Normen, Gesetze und Webempfehlungen ändern sich;\nprüfe sie bei einer realen Entscheidung in der jeweils gültigen\nFassung.<\/p>\n<p><strong>[Q1] SEFPrV – offizielle Verordnung, insbesondere §§ 1,\n4–9.<\/strong><br/>\nhttps://www.gesetze-im-internet.de/sefprv/BJNR1280E0024.html<\/p>\n<p><strong>[Q2] Datenschutz-Grundverordnung, insbesondere Art. 5, 6, 25,\n32 – EUR-Lex.<\/strong><br/>\nhttps://eur-lex.europa.eu/lega
